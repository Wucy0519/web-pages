：打国际长途电话", "id": "j0995"}, {"cat": "脑筋急转弯", "text": "什么东西使人哭笑不得?答：口罩61身份证掉了怎么力? 答案：捡起来", "id": "j0996"}, {"cat": "脑筋急转弯", "text": "监狱里关着两名犯人，一天晚上犯人全都逃跑了，可是第二天看守员打开牢门一看，里面还有一个犯人?答：逃跑的犯人名字叫“全都”", "id": "j0997"}, {"cat": "脑筋急转弯", "text": "小明的妈妈有三个儿子，大独生子叫大明，二儿子叫二明，三儿子叫什么?答：当然叫小明", "id": "j0998"}, {"cat": "脑筋急转弯", "text": "猫见了老鼠为什么拔腿就跑?答：跑去捉老鼠", "id": "j0999"}, {"cat": "脑筋急转弯", "text": "大象的左边耳朵象什么?答：右边耳朵", "id": "j1000"}, {"cat": "脑筋急转弯", "text": "针掉到大海怎么办?答：再买一颗", "id": "j1001"}, {"cat": "脑筋急转弯", "text": "有一个人走在沙滩上，回头却看不见自己的脚印，为什么?答：因为他倒着走", "id": "j1002"}, {"cat": "脑筋急转弯", "text": "一只候鸟从南方飞到北方要用一个小时，而从北方飞到南方则需二个半小时，为什么呢?答：两个半小时不就是一个小时吗", "id": "j1003"}, {"cat": "脑筋急转弯", "text": "为什么小白兔不嫁给斑马呢？答：因为兔妈妈说纹身不是好孩子", "id": "j1004"}, {"cat": "脑筋急转弯", "text": "猴子不喜欢什么线？答：平行线（因为没有相交\u003c香蕉\u003e）", "id": "j1005"}, {"cat": "脑筋急转弯", "text": "巧克力和西红柿打架，为什么是巧克力赢？答：因为巧克力棒嘛", "id": "j1006"}, {"cat": "脑筋急转弯", "text": "鲨鱼吃了绿豆会怎么样？答：变成了绿豆沙", "id": "j1007"}, {"cat": "脑筋急转弯", "text": "火柴烧着后进了医院，变成了什么？答：棉签", "id": "j1008"}, {"cat": "脑筋急转弯", "text": "一头猪说：\"加油啊\"，打一食品？答：朱古力", "id": "j1009"}, {"cat": "脑筋急转弯", "text": "土豆捅了包子致命一刀，怎样了？答：变成豆沙（杀）包了", "id": "j1010"}, {"cat": "脑筋急转弯", "text": "什么动物最爱贴在墙上？答：海豹（报）", "id": "j1011"}, {"cat": "脑筋急转弯", "text": "狐狸为什么经常会摔跤？答：因为狐狸很狡猾（脚滑）", "id": "j1012"}, {"cat": "脑筋急转弯", "text": "4个人在屋子里打麻将，警察来了为什么带走5个人？答：因为他们打的人叫\"麻将\"", "id": "j1013"}, {"cat": "脑筋急转弯", "text": "有一只公鹿，它走着走着，越走越快，最后怎么样？答：它变成了高速公路", "id": "j1014"}, {"cat": "脑筋急转弯", "text": "有一天绿豆从5楼跳下来，流了很多血，怎么样了？答：变成了红豆", "id": "j1015"}, {"cat": "脑筋急转弯", "text": "什么老鼠用两只脚走路？答：米老鼠", "id": "j1016"}, {"cat": "脑筋急转弯", "text": "什么样的人不能在加油站工作？答：油腔滑调（油枪滑掉）的人", "id": "j1017"}, {"cat": "脑筋急转弯", "text": "身穿着金色衣服的人？答：一名惊（金）人", "id": "j1018"}, {"cat": "脑筋急转弯", "text": "透明的剑是什么剑？答：看不见（剑）", "id": "j1019"}, {"cat": "脑筋急转弯", "text": "非洲食人族的酋长吃什么，答：吃人，那酋长要吃素呢？答：吃植物人", "id": "j1020"}, {"cat": "脑筋急转弯", "text": "小明和小华到海边比赛说笑话，说完笑话后，他们就死掉了，为什么？答：因为海啸（笑）了", "id": "j1021"}, {"cat": "脑筋急转弯", "text": "小黑，小白，小黄，小红四人搭飞机，请问是谁会晕机会吐？答：小白兔（吐）", "id": "j1022"}, {"cat": "脑筋急转弯", "text": "有一个胖子从高楼跳下，结果怎么样了？答：成了死胖子", "id": "j1023"}, {"cat": "脑筋急转弯", "text": "布和纸怕什么？答：不（布）怕一万，只（纸）怕万一", "id": "j1024"}, {"cat": "脑筋急转弯", "text": "哈里波特为什么会住在灯泡里？答：因为哈里波特是巫师（钨丝）", "id": "j1025"}, {"cat": "脑筋急转弯", "text": "什么麒麟最好吃？答：冰淇淋", "id": "j1026"}, {"cat": "脑筋急转弯", "text": "甲、乙、丙、丁、戊、己、庚、辛，那一个字最酷？答：丁（丁字裤）", "id": "j1027"}, {"cat": "脑筋急转弯", "text": "有一间屋子里，鸽子会藏在那里？答：我在屋顶藏着你的歌（鸽）", "id": "j1028"}, {"cat": "脑筋急转弯", "text": "有一个白痴坐飞机，把飞机上的马桶拆下来往外丢，猜为什么？答：因为他是白痴", "id": "j1029"}, {"cat": "脑筋急转弯", "text": "铅笔姓什么？答：萧，削（萧）铅笔", "id": "j1030"}, {"cat": "脑筋急转弯", "text": "一只小狗在沙漠中旅行，结果死了，他是怎么死的？答：他是憋死的，因为沙漠里没有电线杆尿尿", "id": "j1031"}, {"cat": "脑筋急转弯", "text": "一只小狗在沙漠中旅行，找到了电线杆，结果还是憋死了，为什么？答：点线杆上贴着\"此处不许小便\"", "id": "j1032"}, {"cat": "脑筋急转弯", "text": "一只小狗在沙漠中旅行，找到了电线杆，上面没贴任何东西，结果还是憋死了，为什么？答：很多小狗在排队，没等到", "id": "j1033"}, {"cat": "脑筋急转弯", "text": "一只小狗在沙漠中旅行，找到了电线杆，上面没贴任何东西，排队也排到了，结果还是憋死了，为什么？答：因为后面是两个漂亮狗MM，他不好意思", "id": "j1034"}, {"cat": "脑筋急转弯", "text": "从前有只馒头，吃了个肉丸，怎么样了？答：变包子了", "id": "j1035"}, {"cat": "脑筋急转弯", "text": "忘情水是谁给的？答：啊哈 （\"啊哈，给我一杯忘情水\"）", "id": "j1036"}, {"cat": "脑筋急转弯", "text": "有一只白猫和一只黑猫，白猫掉到水里去了，黑猫把它救了上来，白猫对黑猫说了句什么？答：喵", "id": "j1037"}, {"cat": "脑筋急转弯", "text": "一辆出租车在公路上正常行驶，并却没有违反任何交通规则，却被一个警察给拦了，为什么？答：因为警察要坐出租", "id": "j1038"}, {"cat": "脑筋急转弯", "text": "什么鸡没有翅膀？答：田鸡", "id": "j1039"}, {"cat": "脑筋急转弯", "text": "蜘蛛爱上了蝴蝶，蝴蝶却拒绝了它，为什么？答：我妈说了，整天在网上混的都不是好人", "id": "j1040"}, {"cat": "脑筋急转弯", "text": "熊猫深爱著小鹿，表达爱意时却遭到拒绝，为什么？答：小鹿胆怯地说：我妈说了，戴墨镜的都是不良少年", "id": "j1041"}, {"cat": "脑筋急转弯", "text": "上厕所（打一个香港女艺人的名字）？答：莫文蔚（理由：莫闻味）", "id": "j1042"}, {"cat": "脑筋急转弯", "text": "烤肉最不希望发生的事？答：肉跟你装熟", "id": "j1043"}, {"cat": "脑筋急转弯", "text": "为什么会有悲伤茱丽叶？答：因为有爱的罗密欧", "id": "j1044"}, {"cat": "脑筋急转弯", "text": "为什么天上会有星星？答：证明爱因斯坦的相对论天上有星星地下也有猩猩", "id": "j1045"}, {"cat": "脑筋急转弯", "text": "当跳到黄河也洗不清的时候，该如何澄清自己？答：跳到澄清湖里", "id": "j1046"}, {"cat": "脑筋急转弯", "text": "骑马的蒙古人，是怎么走路的？答：走马步", "id": "j1047"}, {"cat": "脑筋急转弯", "text": "为什么大多数的人都不喜欢过32岁的生日？答：没有人会在蛋糕上插上三长两短", "id": "j1048"}, {"cat": "脑筋急转弯", "text": "刚念幼儿园的皮皮才学英文一个月却能毫无困难地和外国人交谈，为什么？答：外国人用国语与他交谈", "id": "j1049"}, {"cat": "脑筋急转弯", "text": "拿破仑指挥作战时，高喊“冲啊！”为何所有士兵却是动也不动？答：拿破仑说的是中文士兵怎么听得懂", "id": "j1050"}, {"cat": "脑筋急转弯", "text": "小龙的爸爸看到小龙书包里塞满了钞票，却视若无睹，为什么？答：那是儿童玩具", "id": "j1051"}, {"cat": "脑筋急转弯", "text": "小燕站在路中央，一辆时速90公里的汽车急驰而过，她却未被撞死，为什么？答：小燕站在天桥上", "id": "j1052"}, {"cat": "脑筋急转弯", "text": "一只母猪带着10只小猪过河，背叼3只，过河后一算，还是10只小猪，为什么？答：母猪不会算数", "id": "j1053"}, {"cat": "脑筋急转弯", "text": "有一天，小英看到小明随即惊叫，小明见状，也跟着惊叫，为什么？答：因为他们正在玩游戏", "id": "j1054"}, {"cat": "脑筋急转弯", "text": "小王开医院，生意一直不是很如意，一天他的医院突然车水马龙排了一大堆人，为什么？答：因为他在医院门口贴了今日住院3折", "id": "j1055"}, {"cat": "脑筋急转弯", "text": "身高168公分的小华，有一天去看棒球赛回来却变成170公分，为什么？答：因为他被击中长出了一个两公分的包", "id": "j1056"}, {"cat": "脑筋急转弯", "text": "在赛车比赛中，有辆车撞上大树，车子完全撞烂，开车者却毫发无伤，为什么？答：那是遥控车比赛", "id": "j1057"}, {"cat": "脑筋急转弯", "text": "住在台湾乡下的老童，每早都有公鸡叫起床，现在到了美国儿子家，无论公鸡如何叫，老童都醒来，为什么？答：美国公鸡用英语发音", "id": "j1058"}, {"cat": "脑筋急转弯", "text": "歹徒抢劫MTV店，朝店主开了一枪，店主情急之下抽出一卷影带挡，居然平安无事，为什么？答：歹徒拿得是水枪", "id": "j1059"}, {"cat": "脑筋急转弯", "text": "政府在去年的中秋节提倡“不要让嫦娥笑我们脏”，今年却没有，为什么？答：因为嫦娥去年就笑死了", "id": "j1060"}, {"cat": "脑筋急转弯", "text": "当女朋友跟你要天上的星星时，你该怎么办？答：给他一拳再说他要不要月亮", "id": "j1061"}, {"cat": "脑筋急转弯", "text": "四月一日是属于谁的节日？答：你的", "id": "j1062"}, {"cat": "脑筋急转弯", "text": "为什么闪电总是比雷快？答：因为雷公说女士优先", "id": "j1063"}, {"cat": "脑筋急转弯", "text": "一个即将被枪决的犯人，他的最大愿望是什么？答：穿上防弹衣", "id": "j1064"}, {"cat": "脑筋急转弯", "text": "身为中国人，你知道为什么中秋节一定要吃月饼吗？答：你想吃太阳饼也行呀", "id": "j1065"}, {"cat": "脑筋急转弯", "text": "大头买了一双鞋子，从来没穿过，提着鞋子到处走，到底是为了什么？答：他说鞋子穿久会坏", "id": "j1067"}, {"cat": "脑筋急转弯", "text": "白冰冰与关公生的双胞胎叫什么名字？答：粉红派对", "id": "j1068"}, {"cat": "脑筋急转弯", "text": "什么时候是老二最爽的时候？答：当老大不在不能欺负老二时", "id": "j1069"}, {"cat": "脑筋急转弯", "text": "小陈有一天不小心撞到电线杆，为什么连手也会痛？答：因为小陈狠狠地揍了电线杆一顿", "id": "j1070"}, {"cat": "脑筋急转弯", "text": "著名歌手罗大佑有一天出现在热闹的西门町街头，为什么却没有半个人认出他来？答：因为他忘了带墨镜", "id": "j1071"}, {"cat": "脑筋急转弯", "text": "为什么爱斯基摩人是唯一住在北极的人呢？答：因为他们是爱死寂寞的人", "id": "j1072"}, {"cat": "脑筋急转弯", "text": "超人和女超人做完俯地挺身后，地上各有一个洞及二个洞，是怎么回事？答：超人用单手女超人用双手", "id": "j1073"}, {"cat": "脑筋急转弯", "text": "何时是离婚最好的日子？答：1月23日（自由日）", "id": "j1074"}, {"cat": "脑筋急转弯", "text": "日子过得不平顺时，应该怎么办？ 答案：拿\"飞利浦\"熨平１。 在哪个网站搜索到你的名字你会生气？答：搜狗网", "id": "j1076"}, {"cat": "脑筋急转弯", "text": "怎样才能避免买到坏鸡蛋？答：买鸭蛋", "id": "j1077"}, {"cat": "脑筋急转弯", "text": "初中，高中，大学，他们是什么关系？答：初中是大学的外婆，高中是大学的妈妈", "id": "j1078"}, {"cat": "脑筋急转弯", "text": "挂历上出现了三十二号，请问接下来该做什么呢？答：把三十二号撕了", "id": "j1079"}, {"cat": "脑筋急转弯", "text": "母亲节那天，你如果不想让母亲洗碗，又不想自己动手的话，你该怎么办？答：跟老妈说：“妈，明天再洗”", "id": "j1080"}, {"cat": "脑筋急转弯", "text": "在地狱的断头台看得到什么？（打一成语）？答：鬼头鬼脑", "id": "j1081"}, {"cat": "脑筋急转弯", "text": "有一个婴儿喝了牛奶之后，一星期重了十公斤，为什么？答：那是一头牛", "id": "j1082"}, {"cat": "脑筋急转弯", "text": "四只脚的红蟹和三只脚的黑蟹哪个跑得快？答：当然是黑蟹，红蟹已经熟了", "id": "j1083"}, {"cat": "脑筋急转弯", "text": "世界上最富有同情心的动漫人物是谁？答：机器猫", "id": "j1084"}, {"cat": "脑筋急转弯", "text": "好与坏的中间是什么？答：与", "id": "j1085"}, {"cat": "脑筋急转弯", "text": "当你对一件事忍无可忍时，你会怎么处理？答：赶快上厕所", "id": "j1086"}, {"cat": "脑筋急转弯", "text": "盲人夜行手提一盏灯，这是为什么？答：怕别人撞到他", "id": "j1087"}, {"cat": "脑筋急转弯", "text": "有什么办法能一夜变成百万富翁？答：做梦吧", "id": "j1088"}, {"cat": "脑筋急转弯", "text": "有什么病的人不用看医生和打针吃药？答：坏毛病", "id": "j1089"}, {"cat": "脑筋急转弯", "text": "一个人从万丈峡谷往下跳，为什么没摔疼？答：那个人已经摔死拉", "id": "j1090"}, {"cat": "脑筋急转弯", "text": "阿美在事业并没有什么成就，为什么也有女强人的外号？答：因为她常常强人所难", "id": "j1091"}, {"cat": "脑筋急转弯", "text": "什么动物永远都是富二代？答：金钱豹", "id": "j1092"}, {"cat": "脑筋急转弯", "text": "为什么陈胜发动农民起义的时候非要拉上吴广？答：因为陈胜一个人造反就是单反，玩单反毁一生", "id": "j1093"}, {"cat": "脑筋急转弯", "text": "一个女人能够能帮你干一半的活，你该怎么办？答：找两个女人", "id": "j1094"}, {"cat": "脑筋急转弯", "text": "什么东西一旦长了毛就成熟了呢？答：玉米", "id": "j1095"}, {"cat": "脑筋急转弯", "text": "一男一女智力大比拼，为什么男的总是输？答：因为难得（男的）糊涂", "id": "j1096"}, {"cat": "脑筋急转弯", "text": "什么人一眼望去就知道他浑身缺点？答：麻子", "id": "j1097"}, {"cat": "脑筋急转弯", "text": "人身上掉了什么东西捡不起来？答：屁", "id": "j1098"}, {"cat": "脑筋急转弯", "text": "闭上眼睛过后，就会发生什么事？答：看不见了", "id": "j1099"}, {"cat": "脑筋急转弯", "text": "老王已经年过半百为什么总爱围着女人转？答：老王是推销化妆品的", "id": "j1100"}, {"cat": "脑筋急转弯", "text": "小明在乡下，每早都有公鸡叫起床，到了美国之后无论公鸡怎么叫都不起床了，为什么？答：因为美国的公鸡用英语发音", "id": "j1101"}, {"cat": "脑筋急转弯", "text": "高考发榜了，为什么小明榜上无名却一点也不难过？答：因为小明还在念小学", "id": "j1102"}, {"cat": "脑筋急转弯", "text": "天气越来越冷，为什么小明不多加件衣服，反而要脱衣服？答：因为他准备要洗澡了", "id": "j1103"}, {"cat": "脑筋急转弯", "text": "为什么全世界的母鸡都是短腿？答：这样鸡蛋就不会摔破", "id": "j1104"}, {"cat": "脑筋急转弯", "text": "太阳爸爸和太阳妈妈生了个太阳儿子，我们应该说什么祝贺辞恭喜他们？答：生“日”快乐！", "id": "j1105"}, {"cat": "脑筋急转弯", "text": "什么话是世界通用的？答：电话", "id": "j1106"}, {"cat": "脑筋急转弯", "text": "为什么感冒的老虎喜欢吃熊猫？答：因为广告上说感冒就要吃白加黑", "id": "j1107"}, {"cat": "脑筋急转弯", "text": "谁出门不管渴不渴都会带水？答：拖泥，因为有拖泥带水", "id": "j1108"}, {"cat": "脑筋急转弯", "text": "说起来与你时刻相关，但是需要时却看不见也找不到的是什么？答：相关部门", "id": "j1109"}, {"cat": "脑筋急转弯", "text": "在篮球比赛中为什么给队友加油的方式是互拍屁股？答：这是在告诉队友一定（腚）行的", "id": "j1110"}, {"cat": "脑筋急转弯", "text": "为什么小明要让它的狗晒太阳？答：因为他想吃热狗", "id": "j1111"}, {"cat": "脑筋急转弯", "text": "什么东西左看像电灯，右看还像电灯，却不会亮？答：坏掉的电灯", "id": "j1112"}, {"cat": "脑筋急转弯", "text": "冰柜、空调、洗衣机比赛跑步，谁跑的最快？答：冰柜最快，因为兵贵神速", "id": "j1113"}, {"cat": "脑筋急转弯", "text": "什么蛋中看不中吃？答：脸蛋", "id": "j1114"}, {"cat": "脑筋急转弯", "text": "开学后的最大愿望是什么？答：放假", "id": "j1115"}, {"cat": "脑筋急转弯", "text": "老明有3个儿子大儿子叫大哥二儿子叫二哥（请问小儿子叫什么）？答：小明", "id": "j1116"}, {"cat": "脑筋急转弯", "text": "什么老虎不吃人？答：秋老虎", "id": "j1117"}, {"cat": "脑筋急转弯", "text": "世上最没用的东西是什么？答：工资条（看了生气，擦屁股太细）", "id": "j1118"}, {"cat": "脑筋急转弯", "text": "世界上有东京，南京，北京。却没有西京。为什么？答：因为西经（京）被唐僧取走了", "id": "j1119"}, {"cat": "脑筋急转弯", "text": "女人上小厕（打一电话用语）？答：免提", "id": "j1120"}, {"cat": "脑筋急转弯", "text": "最不听话的人是谁？答：聋子", "id": "j1121"}, {"cat": "脑筋急转弯", "text": "什么食品东、南、西、北都出产？答：瓜", "id": "j1122"}, {"cat": "脑筋急转弯", "text": "武士刀和日本人有什么关系？答：他们是剖腹之交", "id": "j1123"}, {"cat": "脑筋急转弯", "text": "什幺女人从来不洗头发？答：尼姑", "id": "j1124"}, {"cat": "脑筋急转弯", "text": "每天早上从东方升起，西方落下，猜一种五个字的东西？答：是是是太阳（有点儿口吃）", "id": "j1125"}, {"cat": "脑筋急转弯", "text": "什么东西往上升后永远都不会掉下来！答：年龄", "id": "j1126"}, {"cat": "脑筋急转弯", "text": "你知道最大的捐血中心由谁负责吗？答：蚊子", "id": "j1127"}, {"cat": "脑筋急转弯", "text": "人最怕屁股上有什么东西？答：一屁股的债", "id": "j1128"}, {"cat": "脑筋急转弯", "text": "为什么杀人要被判刑，杀蟑螂却不用？答：蟑螂没有辨护律师", "id": "j1129"}, {"cat": "脑筋急转弯", "text": "一个职业登山运动员什么山上不去？答：刀山", "id": "j1130"}, {"cat": "脑筋急转弯", "text": "小明有一天不小心撞到电线杆，为什么连手也会痛？答：因为小明狠狠地揍了电线杆一顿", "id": "j1131"}, {"cat": "脑筋急转弯", "text": "鸡鹅百米赛跑，鸡比鹅跑得快，为什么却后到终点站？答：鸡跑错了方向", "id": "j1132"}, {"cat": "脑筋急转弯", "text": "所虑者，乃其狡诈，每藏神机妙算（香烟用语）？答：焦油含量高", "id": "j1133"}, {"cat": "脑筋急转弯", "text": "一个男人到医院去检查，医生告诉他说你怀孕了。你说为什么？答：心怀鬼胎", "id": "j1134"}, {"cat": "脑筋急转弯", "text": "什么情况一山可容二虎？答：一公一母", "id": "j1135"}, {"cat": "脑筋急转弯", "text": "为什么”七上八下”七在八的上面？答：因为八在七的下面", "id": "j1136"}, {"cat": "脑筋急转弯", "text": "哪两个东西从来就没有当早餐吃？答：午餐和晚餐", "id": "j1137"}, {"cat": "脑筋急转弯", "text": "李白的老婆和女儿分别叫什么名字？答：赵香炉和紫烟（日照香炉生紫烟）", "id": "j1138"}, {"cat": "脑筋急转弯", "text": "两个女人与一千只鸭子所说的话有何相似性呢？答：无稽（鸡）之谈", "id": "j1139"}, {"cat": "脑筋急转弯", "text": "失而复得的东西是什么？答：二手货", "id": "j1140"}, {"cat": "脑筋急转弯", "text": "小明全班准备去参加一个比赛，但结果只有小明去了，请问他们参加的是什么比赛？答：放鸽子比赛", "id": "j1141"}, {"cat": "脑筋急转弯", "text": "质量最差、样式最难看、味道最难闻的是哪个品牌的电器？答：TCL（太差了，太丑了，太臭了）", "id": "j1142"}, {"cat": "脑筋急转弯", "text": "糖果是公的还是母的？答：母的，因为它会生蚂蚁", "id": "j1143"}, {"cat": "脑筋急转弯", "text": "谁最喜欢管别人的事？答：爱管闲事的人", "id": "j1144"}, {"cat": "脑筋急转弯", "text": "无花果 （打一花名）？答：梅花", "id": "j1145"}, {"cat": "脑筋急转弯", "text": "劲头不足 （打一字）？答：劣", "id": "j1146"}, {"cat": "脑筋急转弯", "text": "杀大象（打一古代职称）？答：宰相", "id": "j1147"}, {"cat": "脑筋急转弯", "text": "三千六百五十天 （打一歌名）？答：十年", "id": "j1148"}, {"cat": "脑筋急转弯", "text": "失恋喝多少酒都不会醉 （打一花卉名）？答：百合", "id": "j1149"}, {"cat": "脑筋急转弯", "text": "太上老君伸手 （打一植物）？答：仙人掌", "id": "j1150"}, {"cat": "脑筋急转弯", "text": "腻烦了一月 （打一字）？答：贰", "id": "j1151"}, {"cat": "脑筋急转弯", "text": "厕所里发大水 （打一成语）？答：奋勇向前", "id": "j1152"}, {"cat": "脑筋急转弯", "text": "妇科病 （打一字）？答：嫉", "id": "j1153"}, {"cat": "脑筋急转弯", "text": "瘸子靠着瞎子走 （打一成语）？答：取长补短", "id": "j1154"}, {"cat": "脑筋急转弯", "text": "疏于练功 （打一水浒传人名）？答：武松", "id": "j1155"}, {"cat": "脑筋急转弯", "text": "回 （打一成语）？答：表里如一", "id": "j1156"}, {"cat": "脑筋急转弯", "text": "有意为媒 （常言俗语四字）？答：存心作对", "id": "j1157"}, {"cat": "脑筋急转弯", "text": "出拳 （打一六字成语）？答：伸手不见五指", "id": "j1158"}, {"cat": "脑筋急转弯", "text": "不冷装冷 （打一教育用语）？答：寒假", "id": "j1159"}, {"cat": "脑筋急转弯", "text": "胡乱叠被子 （打一昆虫名字）？答：蝴蝶", "id": "j1160"}, {"cat": "脑筋急转弯", "text": "有一只羊在喝水，突然来了一只狼。 （打一水果名）？答：杨桃", "id": "j1161"}, {"cat": "脑筋急转弯", "text": "盲人遇到聋哑人（打一动物）？答：龙虾", "id": "j1162"}, {"cat": "脑筋急转弯", "text": "北京到南京 （打一城市名）？答：太原", "id": "j1163"}, {"cat": "脑筋急转弯", "text": "姐姐晕倒了 （打一个词语）？答：结婚", "id": "j1164"}, {"cat": "脑筋急转弯", "text": "妻子占理 （打一春秋人名）？答：夫差", "id": "j1165"}, {"cat": "脑筋急转弯", "text": "说话不粗鲁 （打一学科名称）？答：语文", "id": "j1166"}, {"cat": "脑筋急转弯", "text": "猪八戒洗澡 （打一食物）？答：猪下水", "id": "j1167"}, {"cat": "脑筋急转弯", "text": "哞哞叫的牛一下水游泳后就不叫了。 （打一成语）？答：有勇无谋", "id": "j1168"}, {"cat": "脑筋急转弯", "text": "耗子掉水缸 （打一两字词语）？答：时髦", "id": "j1169"}, {"cat": "脑筋急转弯", "text": "猪八戒照镜子 （打一俗语）？答：里外不是人", "id": "j1170"}, {"cat": "脑筋急转弯", "text": "拉肚子 （打一小说人名）？答：杜拉拉", "id": "j1171"}, {"cat": "脑筋急转弯", "text": "猪八戒背媳妇 （打一天气用语）？答：高压脊", "id": "j1172"}, {"cat": "脑筋急转弯", "text": "奇货可居 （打一国家名）？答：意大利", "id": "j1173"}, {"cat": "脑筋急转弯", "text": "独臂人打太阳伞 （打一成语）？答：一手遮天", "id": "j1174"}, {"cat": "脑筋急转弯", "text": "千金散尽还复来 （打一植物）？答：无穷花", "id": "j1175"}, {"cat": "脑筋急转弯", "text": "笑迎你到江边来 （打一省会名）？答：哈尔滨", "id": "j1176"}, {"cat": "脑筋急转弯", "text": "夏天穿棉袄 （打一省会城市）？答：武汉", "id": "j1177"}, {"cat": "脑筋急转弯", "text": "东晋覆灭 （打一北宋人名）？答：司马光", "id": "j1178"}, {"cat": "脑筋急转弯", "text": "新同学很少发言 （打一成语）？答：老生常谈", "id": "j1179"}, {"cat": "脑筋急转弯", "text": "哪国人一心想赚大钱 （打一国名）？答：孟买", "id": "j1180"}, {"cat": "脑筋急转弯", "text": "墙头上拉车 （打一国家名）？答：南斯拉夫", "id": "j1181"}, {"cat": "脑筋急转弯", "text": "勤劳除百病 （打一南宋人名）？答：辛弃疾", "id": "j1182"}, {"cat": "脑筋急转弯", "text": "婆婆不管公公 （打一成语）？答：公事公办", "id": "j1183"}, {"cat": "脑筋急转弯", "text": "刮胡子 （打一食品）？答：刀削面", "id": "j1184"}, {"cat": "谐音热梗", "text": "熊猫这辈子最大的愿望是什么？答：拍一张彩色照片。 它全身上下只有黑跟白。", "id": "j1185"}, {"cat": "谐音热梗", "text": "达芬奇密码的上面是什么？答：达芬奇账号。 登入画面上，密码那一格的上面就是账号。", "id": "j1186"}, {"cat": "谐音热梗", "text": "海为什么是蓝色的？答：因为鱼一直在吐泡泡：blue、blue、blue。 吐泡泡的声音听起来像英文的 blue（蓝色）。", "id": "j1187"}, {"cat": "谐音热梗", "text": "我问我家的狗：“2 减 2 等于多少？”答：它什么都没说。 什么都没说＝0，它答对了。", "id": "j1188"}, {"cat": "谐音热梗", "text": "有一个小偷偷了一本月历，法官判他多久？答：十二个月。 一本月历刚好十二个月，判得刚刚好。", "id": "j1189"}, {"cat": "谐音热梗", "text": "我怕迟到，把闹钟调快十分钟。结果呢？答：我还是迟到十分钟。 因为我知道它快了十分钟，所以又多睡了十分钟。", "id": "j1190"}, {"cat": "谐音热梗", "text": "医生叫我多运动，我做了什么？答：把遥控器放到电视旁边。 每次转台都要走过去，一天走好几趟。", "id": "j1191"}, {"cat": "谐音热梗", "text": "我买了一本《30 天变有钱》，30 天后谁变有钱了？答：作者。", "id": "j1192"}, {"cat": "谐音热梗", "text": "鱼为什么不打篮球？答：因为它很怕“网”。 篮框下面挂的就是网子，鱼一看到网就跑。", "id": "j1193"}, {"cat": "谐音热梗", "text": "时钟为什么常常被骂？答：因为它整天“说三道四”。 指针每天都会指到 3 跟 4。", "id": "j1194"}, {"cat": "谐音热梗", "text": "我把手机调成飞航模式，结果呢？答：它还是没有飞起来。", "id": "j1195"}, {"cat": "谐音热梗", "text": "8 为什么那么臭屁？答：因为它躺下来就是“无限大”。 8 横过来，就是数学的无限大符号 ∞。", "id": "j1196"}, {"cat": "谐音热梗", "text": "0 为什么那么有自信？答：因为不管跟谁相乘，对方都会变成它。", "id": "j1197"}, {"cat": "谐音热梗", "text": "我说我会穿越时空，朋友不信。我说：“我现在就从今天穿越到明天。”然后呢？答：我去睡觉了。 睡一觉起来，就真的到明天了。", "id": "j1198"}, {"cat": "谐音热梗", "text": "梯子为什么最会安慰人？答：因为它永远只说一句话：“一步一步来。”", "id": "j1199"}, {"cat": "谐音热梗", "text": "影子为什么最忠心？答：你走到哪，它就跟到哪——除非你走进没开灯的房间。 没有光就没有影子，所以它是“有条件的忠心”。", "id": "j1200"}, {"cat": "谐音热梗", "text": "白开水为什么都交不到朋友？答：因为它的个性太“淡”了。", "id": "j1201"}, {"cat": "谐音热梗", "text": "稻草人为什么可以得奖？答：因为他在自己的“田”地里表现最突出。 改自英文冷笑话 outstanding in his field：在自己的领域很杰出，也是站在田里很突出。", "id": "j1202"}, {"cat": "谐音热梗", "text": "考试前一天，我把课本压在枕头下面睡觉。结果呢？答：知识没有进到脑袋，脖子倒是落枕了。", "id": "j1203"}, {"cat": "谐音热梗", "text": "电脑为什么常常心情不好？答：因为它有 D 槽。 “D 槽”念快一点就是“低潮”。", "id": "j1204"}, {"cat": "谐音热梗", "text": "什么龙只会喷水、不会喷火？答：水龙头。 名字里有龙，但一辈子只负责出水。", "id": "j1205"}, {"cat": "谐音热梗", "text": "哪一种天气最会上台表演？答：台风。 “台风”跟“台风”同音——台风稳不稳，看台风就知道。", "id": "j1206"}, {"cat": "谐音热梗", "text": "哪一种天气最容易让人吵架？答：起雾。 雾一起来，大家就开始“雾（误）会”。", "id": "j1207"}, {"cat": "谐音热梗", "text": "哪一种天气最累？答：打雷。 每打一次都喊“雷（累）死了”。", "id": "j1208"}, {"cat": "谐音热梗", "text": "天空里谁最红？答：彩虹。 “虹”跟“红”同音，一出来大家都抢着拍。", "id": "j1209"}, {"cat": "谐音热梗", "text": "哪一种天气最用功？答：下雪。 一直在“雪（学）习”。", "id": "j1210"}, {"cat": "谐音热梗", "text": "家里哪一样东西最有耐心？答：灯。 “灯”跟“等”音近，不管你多晚回家，它都在“灯（等）”你。", "id": "j1211"}, {"cat": "谐音热梗", "text": "家里谁最闷？答：门。 整天被关着，当然很“门（闷）”。", "id": "j1212"}, {"cat": "谐音热梗", "text": "家里谁最爱管东管西？答：水管。 名字就叫“管”，厨房、浴室、阳台全都要管。", "id": "j1213"}, {"cat": "谐音热梗", "text": "哪一种家电最爱吹牛？答：吹风机。 一打开就开始“吹”，停都停不下来。", "id": "j1214"}, {"cat": "谐音热梗", "text": "哪一种家电最爱打人巴掌？答：电扇。 “扇”跟“搧”同音，整天都在“搧”。", "id": "j1215"}, {"cat": "谐音热梗", "text": "哪一双鞋做事最拖拖拉拉？答：拖鞋。 名字就叫“拖”，叫它帮忙，它一定说等一下。", "id": "j1216"}, {"cat": "谐音热梗", "text": "哪一种衣物最会套话？答：手套。 什么都想“套”一下。", "id": "j1217"}, {"cat": "谐音热梗", "text": "家里谁最常“被”骂？答：棉被。 每天早上都被骂“怎么又没折”，而且名字里本来就有“被”。", "id": "j1218"}, {"cat": "谐音热梗", "text": "哪一种餐具速度最快？答：筷子。 “筷”跟“快”同音。", "id": "j1219"}, {"cat": "谐音热梗", "text": "哪一种餐具最悲观？答：杯子。 “杯”跟“悲”同音，看什么都是“杯（悲）剧”。", "id": "j1220"}, {"cat": "谐音热梗", "text": "哪一种餐具成绩最差？答：叉子。 “叉”跟“差”同音，考卷上也全是叉叉。", "id": "j1221"}, {"cat": "谐音热梗", "text": "厨房里谁最常被冤枉？答：锅子。 出了什么事，都是它在“背黑锅”。", "id": "j1222"}, {"cat": "谐音热梗", "text": "文具里谁最常迟到？答：尺。 “尺”跟“迟”音近，钟声响完它才“尺（迟）”到。", "id": "j1223"}, {"cat": "谐音热梗", "text": "为什么很多人打麻将前不看书？答：因为怕“输”。 “书”跟“输”同音，所以过年也有人不买书。", "id": "j1224"}, {"cat": "谐音热梗", "text": "哪一种动物压力最大？答：鸭子。 “鸭力山大”——压力山大。", "id": "j1225"}, {"cat": "谐音热梗", "text": "哪一种动物最得意？答：羊。 整天都“羊羊（洋洋）得意”。", "id": "j1226"}, {"cat": "谐音热梗", "text": "哪一种动物最爱问问题？答：马。 每句话后面都要加一个“马（吗）”。", "id": "j1227"}, {"cat": "谐音热梗", "text": "哪一种动物最爱约人喝东西？答：河马。", "id": "j1228"}, {"cat": "谐音热梗", "text": "哪一种动物最会骗人？答：老虎。 “虎”跟“唬”同音，专门“唬”人。", "id": "j1229"}, {"cat": "谐音热梗", "text": "哪一种动物最爱爆料？答：豹。 “豹”跟“爆”同音。", "id": "j1230"}, {"cat": "谐音热梗", "text": "哪一种动物最小气？答：猫。 一“猫（毛）”不拔。", "id": "j1231"}, {"cat": "谐音热梗", "text": "哪一种动物最容易满足？答：狗。 吃两口就说“狗（够）了”。", "id": "j1232"}, {"cat": "谐音热梗", "text": "哪一种动物最有主见？答：猪。 很有“猪（主）”见。", "id": "j1233"}, {"cat": "谐音热梗", "text": "哪一种动物数学最好？答：老鼠。 最会“鼠（数）”数。", "id": "j1234"}, {"cat": "谐音热梗", "text": "哪一种动物最舍不得分开？答：蛇。 “蛇（舍）不得”。", "id": "j1235"}, {"cat": "谐音热梗", "text": "哪一种动物最恋家？答：乌龟。 出门再久，都想“回龟（归）”。", "id": "j1236"}, {"cat": "谐音热梗", "text": "一只鹅走进餐厅，第一句话说什么？答：“我好鹅！” “鹅”跟“饿”音近。", "id": "j1237"}, {"cat": "谐音热梗", "text": "动物园里谁最会教书？答：狮子。 它是大家的好老“狮（师）”。", "id": "j1238"}, {"cat": "谐音热梗", "text": "动物园里谁最红？答：猩猩。 它是大明“猩（星）”。", "id": "j1239"}, {"cat": "谐音热梗", "text": "哪一种熊最爱换衣服？答：浣熊。 “浣”跟“换”同音。", "id": "j1240"}, {"cat": "谐音热梗", "text": "哪一种熊的故事永远没有结局？答：无尾熊。 “无尾”——没有结尾。", "id": "j1241"}, {"cat": "谐音热梗", "text": "出门最不会忘东忘西的是谁？答：袋鼠。 什么都“袋（带）”在身上。", "id": "j1242"}, {"cat": "谐音热梗", "text": "斑马过马路，为什么从来不会被开罚单？答：因为它自己就是斑马线。", "id": "j1243"}, {"cat": "谐音热梗", "text": "哪一种鸟最会唱歌？答：鸽子。 “鸽”跟“歌”同音。", "id": "j1244"}, {"cat": "谐音热梗", "text": "哪一种鸟最常赢？答：老鹰。 “鹰”跟“赢”音近，比赛前大家都说“鹰（赢）定了”。", "id": "j1245"}, {"cat": "谐音热梗", "text": "哪一种昆虫最帅？答：蟋蟀。 “蟀”跟“帅”同音。", "id": "j1246"}, {"cat": "谐音热梗", "text": "哪一种昆虫最有礼貌，又最会听人说话？答：蜻蜓。 “蜻蜓”念起来就是“请听”。", "id": "j1247"}, {"cat": "谐音热梗", "text": "哪一种昆虫知识最渊博？答：蜘蛛。 “蜘”跟“知”同音，满腹“蜘（知）”识。", "id": "j1248"}, {"cat": "谐音热梗", "text": "哪一种昆虫最迷糊？答：蝴蝶。 “蝴”跟“糊”同音，整天“蝴（糊）里糊涂”。", "id": "j1249"}, {"cat": "谐音热梗", "text": "蚊子为什么都晚上才来找你？答：因为它想给你一个晚安“蚊（吻）”。", "id": "j1250"}, {"cat": "谐音热梗", "text": "哪一种昆虫最黏人？答：蝉。 “蝉”跟“缠”同音，一叫就缠你一整个夏天。", "id": "j1251"}, {"cat": "谐音热梗", "text": "哪一种动物最爱大惊小怪？答：青蛙。 动不动就“哇”一声。", "id": "j1252"}, {"cat": "谐音热梗", "text": "哪一种动物最有福气？答：蝙蝠。 “蝠”跟“福”同音，所以很多老房子的窗花都刻蝙蝠。", "id": "j1253"}, {"cat": "谐音热梗", "text": "哪一种海鲜最爱喝酒？答：干贝。 一举杯就喊“干贝（干杯）”！", "id": "j1254"}, {"cat": "谐音热梗", "text": "哪一种海鲜最犹豫不决？答：鱿鱼。 “鱿鱼”念起来就是“犹豫”。", "id": "j1255"}, {"cat": "谐音热梗", "text": "哪一种海鲜最容易紧张？答：章鱼。 “章”跟“张”同音——“紧章（张）”，八只脚一起发抖。", "id": "j1256"}, {"cat": "谐音热梗", "text": "哪一种鱼游得最慢？答：鳗鱼。 “鳗”跟“慢”音近。", "id": "j1257"}, {"cat": "谐音热梗", "text": "大海里谁最常受到惊吓？答：鲸鱼。 一天到晚都在“鲸（惊）”吓。", "id": "j1258"}, {"cat": "谐音热梗", "text": "哪一种海鲜最不爱讲话？答：墨鱼。 “墨”跟“默”同音，总是“墨（默）默”不语。", "id": "j1259"}, {"cat": "谐音热梗", "text": "哪一种鱼最有礼貌？答：鲤鱼。 “鲤”跟“礼”同音。", "id": "j1260"}, {"cat": "谐音热梗", "text": "哪一种海鲜最爱抱抱？答：鲍鱼。 “鲍”跟“抱”同音。", "id": "j1261"}, {"cat": "谐音热梗", "text": "哪一种鱼，曾经让很多人抢着跟它同名？答：鲑鱼。 2021 年有寿司连锁店推出“名字有鲑鱼就免费”，真的有人跑去改名，新闻叫它“鲑鱼之乱”。", "id": "j1262"}, {"cat": "谐音热梗", "text": "哪一种鱼最傻？答：鲨鱼。 “鲨”跟“傻”音近，“鲨（傻）鲨（傻）的”。", "id": "j1263"}, {"cat": "谐音热梗", "text": "螃蟹收到礼物，第一句话说什么？答：“蟹蟹！” “蟹蟹”＝“谢谢”。", "id": "j1264"}, {"cat": "谐音热梗", "text": "哪一种海鲜最怕听鬼故事？答：虾子。 一听就被“虾（吓）”到。", "id": "j1265"}, {"cat": "谐音热梗", "text": "哪一道菜最常迟到？答：鱼翅。 “翅”跟“迟”音近。", "id": "j1266"}, {"cat": "谐音热梗", "text": "哪一种鱼功课最好？答：鳕鱼。 “鳕”跟“学”音近，是鱼里面的“鳕（学）霸”。", "id": "j1267"}, {"cat": "谐音热梗", "text": "哪一种鱼最伟大？答：鲔鱼。 “鲔”跟“伟”同音。", "id": "j1268"}, {"cat": "谐音热梗", "text": "海里胆子最大的是谁？答：海胆。 名字里就有“胆”，而且全身是刺，谁都不怕。", "id": "j1269"}, {"cat": "谐音热梗", "text": "哪一种海鲜最常听不清楚？答：蛤蜊。", "id": "j1270"}, {"cat": "谐音热梗", "text": "哪一种海洋动物最爱囤货？答：海豚。 “豚”跟“囤”同音。", "id": "j1271"}, {"cat": "谐音热梗", "text": "哪一种海鲜最会偷东西？答：乌贼。 名字就有“贼”，偷完还喷墨汁跑掉。", "id": "j1272"}, {"cat": "谐音热梗", "text": "哪一种鱼最难搞？答：鲷鱼。 “鲷”跟“刁”同音，个性很“鲷（刁）”。", "id": "j1273"}, {"cat": "谐音热梗", "text": "哪一种鱼最爱跟人比较？答：比目鱼。 名字一开头就是“比”。", "id": "j1274"}, {"cat": "谐音热梗", "text": "哪一种鱼最爱碎碎念？答：鲶鱼。 “鲶”跟“念”音近。", "id": "j1275"}, {"cat": "谐音热梗", "text": "哪一种动物最常做噩梦？答：鳄鱼。 “鳄”跟“噩”同音。", "id": "j1276"}, {"cat": "谐音热梗", "text": "什么水果最烫？答：梨子。 “离子烫”——烫头发的那种。", "id": "j1277"}, {"cat": "谐音热梗", "text": "哪一种水果最励志？答：荔枝。 “荔枝”跟“励志”同音。", "id": "j1278"}, {"cat": "谐音热梗", "text": "哪一种水果最忙？答：芒果。 “芒”跟“忙”同音。", "id": "j1279"}, {"cat": "谐音热梗", "text": "哪一种水果最早起？答：枣子。 “枣”跟“早”同音。", "id": "j1280"}, {"cat": "谐音热梗", "text": "哪一种水果最幸运？答：杏。 “杏”跟“幸”同音。", "id": "j1281"}, {"cat": "谐音热梗", "text": "哪一种水果最会实现愿望？答：柿子。 吃了“柿柿（事事）如意”。", "id": "j1282"}, {"cat": "谐音热梗", "text": "平安夜为什么要送苹果？答：因为送的是“平”安。 “苹”跟“平”同音。", "id": "j1283"}, {"cat": "谐音热梗", "text": "哪一种水果最爱看热闹？答：西瓜。 有八卦的地方，就有一群人在“吃瓜”。", "id": "j1284"}, {"cat": "谐音热梗", "text": "哪一种水果最爱吃醋？答：柠檬。 看到别人好就开始“酸”，网络上叫“柠檬精”。", "id": "j1285"}, {"cat": "谐音热梗", "text": "哪一种食材数学最好？答：蒜头。 “蒜”跟“算”同音，最会“蒜（算）”。", "id": "j1286"}, {"cat": "谐音热梗", "text": "哪一种蔬菜最勤劳？答：芹菜。 “芹”跟“勤”同音，所以也有人说小孩吃芹菜会变勤劳。", "id": "j1287"}, {"cat": "谐音热梗", "text": "哪一种蔬菜最爱损人？答：竹笋。 “笋”跟“损”同音。", "id": "j1288"}, {"cat": "谐音热梗", "text": "为什么长辈都叫小孩多吃葱？答：因为吃了会变聪明。 “葱”跟“聪”同音。", "id": "j1289"}, {"cat": "谐音热梗", "text": "什么食物最爱面子？答：面。 “面”跟“面”同音，出门一定要顾“面（面）子”。", "id": "j1290"}, {"cat": "谐音热梗", "text": "哪一种食物追星最疯？答：粉丝。 冬粉也叫粉丝，跟追星的粉丝同名。", "id": "j1291"}, {"cat": "谐音热梗", "text": "哪一种食物最会付账？答：豆腐。 “腐”跟“付”音近，一直在“付”。", "id": "j1292"}, {"cat": "谐音热梗", "text": "哪一种早餐动作最慢？答：馒头。 “馒”跟“慢”音近。", "id": "j1293"}, {"cat": "谐音热梗", "text": "哪一种早餐最团结？答：饭团。 “团”跟“团”同音。", "id": "j1294"}, {"cat": "谐音热梗", "text": "哪一种小吃最爱排队？答：鸡排。 名字里就有“排”——夜市的鸡排摊也真的永远在排。", "id": "j1295"}, {"cat": "谐音热梗", "text": "哪一种饮料最爱查勤？答：茶。 “茶”跟“查”同音。", "id": "j1296"}, {"cat": "谐音热梗", "text": "哪一种饮料最快乐？答：可乐。 喝了就“可以快乐”。", "id": "j1297"}, {"cat": "谐音热梗", "text": "哪一种饮料脾气最差？答：汽水。 “汽”跟“气”同音，一打开就气噗噗地冒泡。", "id": "j1298"}, {"cat": "谐音热梗", "text": "哪一种点心最放松？答：松饼。", "id": "j1299"}, {"cat": "谐音热梗", "text": "花生为什么常常出事？答：因为它一直在“花生（发生）”。 台湾口音里“花”跟“发”常常分不清。", "id": "j1300"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最有钱？答：金门。 名字就叫“金”门。", "id": "j1301"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最会花钱？答：花莲。 一开口就是“花”。", "id": "j1302"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最会投篮？答：南投。 名字里就有“投”。", "id": "j1303"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最常中奖？答：台中。 名字里有“中”——对发票对中的“中”。", "id": "j1304"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最适合住？答：宜兰。 “宜”居城市。", "id": "j1305"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最会吹牛？答：澎湖。 台语说吹牛叫“膨风”，“澎”跟“膨”同音。", "id": "j1306"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最公平？答：屏东。 “屏”跟“平”同音。", "id": "j1307"}, {"cat": "谐音热梗", "text": "台湾哪一个县市运气最好？答：云林。 “云”跟“运”音近。", "id": "j1308"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最会画画？答：彰化。 “化”跟“画”同音，一出手就是一“彰（张）”画。", "id": "j1309"}, {"cat": "谐音热梗", "text": "台湾哪一个县市最会逃跑？答：桃园。 “桃”跟“逃”同音。", "id": "j1310"}, {"cat": "谐音热梗", "text": "台湾哪一个县市力气最大？答：苗栗。 “栗”跟“力”同音。", "id": "j1311"}, {"cat": "谐音热梗", "text": "台湾哪一个县市的考试最难？答：台南。 “南”跟“难”同音。", "id": "j1312"}, {"cat": "谐音热梗", "text": "台中哪一区最干净？答：清水。", "id": "j1313"}, {"cat": "谐音热梗", "text": "台湾哪一座岛以前最热？答：绿岛。 绿岛的旧名叫“火烧岛”。", "id": "j1314"}, {"cat": "谐音热梗", "text": "阳明山哪里最冷？答：冷水坑。 名字已经说了。", "id": "j1315"}, {"cat": "谐音热梗", "text": "台北捷运哪一站最年轻？答：永春站。 永远青春。", "id": "j1316"}, {"cat": "谐音热梗", "text": "台北捷运哪一站最讲义气？答：忠义站。", "id": "j1317"}, {"cat": "谐音热梗", "text": "台北捷运哪一站最安全？答：大安站。 大大的“安”全。", "id": "j1318"}, {"cat": "谐音热梗", "text": "哪一个国家的人最爱唱歌？答：新加坡。 Sing 加坡——sing 是英文的“唱歌”。", "id": "j1319"}, {"cat": "谐音热梗", "text": "哪一个国家的人笑点最低？答：哈萨克。 一开口就“哈”。", "id": "j1320"}, {"cat": "谐音热梗", "text": "哪一个国家最会做生意？答：丹麦。 “麦”跟“卖”同音，什么都能“麦（卖）”。", "id": "j1321"}, {"cat": "谐音热梗", "text": "哪一个国家永远在喊肚子饿？答：匈牙利。 匈牙利的英文 Hungary，听起来跟 hungry（饿）一模一样。", "id": "j1322"}, {"cat": "谐音热梗", "text": "感恩节的时候，美国人都在吃哪一个国家？答：土耳其。 土耳其的英文 Turkey，跟火鸡是同一个字。", "id": "j1323"}, {"cat": "谐音热梗", "text": "哪一个国家最辣？答：智利。 智利的英文 Chile，跟辣椒 chili 念起来一样。", "id": "j1324"}, {"cat": "谐音热梗", "text": "哪一个国家最油？答：希腊。 希腊的英文 Greece，跟油腻的 grease 念起来几乎一样。", "id": "j1325"}, {"cat": "谐音热梗", "text": "史上第一个去网咖的人是谁？答：郑成功。 因为他“开台”——在网咖开一台电脑也叫开台。", "id": "j1326"}, {"cat": "谐音热梗", "text": "老王姓什么？答：姓法。 法老王。", "id": "j1327"}, {"cat": "谐音热梗", "text": "考试前，学生最想拜哪一位音乐家？答：贝多芬。 “贝多芬”念起来像“背多分”——背越多、分数越高。", "id": "j1328"}, {"cat": "谐音热梗", "text": "月亮上谁最常喊肚子饿？答：嫦娥。 “嫦娥”念起来就是“常饿”。", "id": "j1329"}, {"cat": "谐音热梗", "text": "哪一位诗人最白目？答：李白。", "id": "j1330"}, {"cat": "谐音热梗", "text": "哪一位诗人肚子最大？答：杜甫。 “杜甫”跟“肚腹”音近。", "id": "j1331"}, {"cat": "谐音热梗", "text": "哪一位诗人最好租房子？答：白居易。 名字就说了：“居”住很容“易”。", "id": "j1332"}, {"cat": "谐音热梗", "text": "哪一位诗人最会赖床？答：孟浩然。 他写过“春眠不觉晓”——睡到天亮了都不知道。", "id": "j1333"}, {"cat": "谐音热梗", "text": "三国里谁最会备份档案？答：刘备。 “刘”跟“留”同音——“留”一个“备”份。", "id": "j1334"}, {"cat": "谐音热梗", "text": "西游记里谁最常说要戒宵夜？答：猪八戒。 名字里写着“八戒”——说了八次，还没戒成功。", "id": "j1335"}, {"cat": "谐音热梗", "text": "西游记里谁最会玩躲猫猫？答：唐三藏。 名字里有“藏”，而且一藏就是三个地方。", "id": "j1336"}, {"cat": "谐音热梗", "text": "西游记里谁最爱干净？答：沙悟净。 名字最后一个字就是“净”。", "id": "j1337"}, {"cat": "谐音热梗", "text": "哪一位将军跑最快？答：岳飞。 “岳”跟“越”同音——“越飞越快”。", "id": "j1338"}, {"cat": "谐音热梗", "text": "哪一位皇帝最会挑日子？答：武则天。 “则天”听起来像“择天”——择日子的择。", "id": "j1339"}, {"cat": "谐音热梗", "text": "哪一位画家最爱吃饭？答：梵高。 “梵高”念起来就是“饭谷”。", "id": "j1340"}, {"cat": "谐音热梗", "text": "哪一位音乐家最怕被搔痒？答：巴哈。 一碰就“哈哈哈”。", "id": "j1341"}, {"cat": "谐音热梗", "text": "哪一位音乐家每一餐都吃海鲜？答：海顿。 每一“顿”都吃“海”鲜。", "id": "j1342"}, {"cat": "谐音热梗", "text": "哪一位美国总统最会吃？答：华盛顿。 每一餐都“盛”一大“顿”。", "id": "j1343"}, {"cat": "谐音热梗", "text": "哪一位科学家最常顿悟？答：牛顿。 被苹果打到头，就“顿”悟了万有引力。", "id": "j1344"}, {"cat": "谐音热梗", "text": "哪一位将军最会捡东西？答：拿破仑。 名字一开头就是“拿破”的。", "id": "j1345"}, {"cat": "谐音热梗", "text": "水饺要去哪里领？答：当铺。 “当铺领”念快一点就是 dumpling（水饺）。", "id": "j1346"}, {"cat": "谐音热梗", "text": "高丽菜死掉以后变成什么？答：高利贷。 高丽 dead——高丽菜的英文谐音。", "id": "j1347"}, {"cat": "谐音热梗", "text": "鸭子为什么从来不用买东西？答：因为 duck 不必。 “duck 不必”＝“大可不必”。", "id": "j1348"}, {"cat": "谐音热梗", "text": "史上最失败的超级英雄是谁？答：蜘蛛人。 Spider-Man 念起来像“失败的 man”。", "id": "j1349"}, {"cat": "谐音热梗", "text": "6 为什么很怕 7？答：因为 7 8 9。 seven eight nine 听起来像 seven ate nine——7 把 9 吃掉了。", "id": "j1350"}, {"cat": "谐音热梗", "text": "猫咪跟兔子生了一只小动物，它最常说哪一句英文？答：Me too。 它叫“咪兔”——念起来就是 me too（我也是）。", "id": "j1351"}, {"cat": "谐音热梗", "text": "哪一种昆虫最爱逼人做事？答：蜜蜂。 蜜蜂的英文 bee，听起来就是“逼”。", "id": "j1352"}, {"cat": "谐音热梗", "text": "哪一种动物最麻烦？答：鱼。 鱼的英文 fish，念起来像“费事”。", "id": "j1353"}, {"cat": "谐音热梗", "text": "哪一种动物最冒失？答：老鼠。 老鼠的英文 mouse，听起来像“冒失”。", "id": "j1354"}, {"cat": "谐音热梗", "text": "哪一种鸟最会熬夜？答：猫头鹰。 猫头鹰的英文 owl，念起来就是“熬”——而且它真的晚上才出门。", "id": "j1355"}, {"cat": "谐音热梗", "text": "哪一种动物最常考试？答：牛。 牛的英文 cow，听起来就是“考”。", "id": "j1356"}, {"cat": "谐音热梗", "text": "哪一种鸡最凶？答：母鸡。 母鸡的英文 hen，听起来就是“狠”。", "id": "j1357"}, {"cat": "谐音热梗", "text": "哪一种饮料最会踢足球？答：茶。 茶的英文 tea＝踢。", "id": "j1358"}, {"cat": "谐音热梗", "text": "什么东西大家都说是自己的？答：水。 水的英文 water，听起来像“我的”。", "id": "j1359"}, {"cat": "谐音热梗", "text": "哪一个数字最有礼貌？答：3。 3Q——三 Q＝thank you。", "id": "j1360"}, {"cat": "谐音热梗", "text": "为什么常去庙里的人英文都很好？答：因为大家每天都在说“拜拜”。 拜拜＝bye-bye。", "id": "j1361"}, {"cat": "谐音热梗", "text": "哪一只狗最冷？答：冰狗。 “冰狗”念起来就是 Bingo。", "id": "j1362"}, {"cat": "谐音热梗", "text": "哪一本书读完一定不会哭？答：每一本。 book 念起来就是“不哭”。", "id": "j1363"}, {"cat": "谐音热梗", "text": "喝什么最舒服？答：汤。 汤的英文 soup，念起来像“舒服”。", "id": "j1364"}, {"cat": "谐音热梗", "text": "什么东西大家都爱死了？答：冰。 冰的英文 ice，听起来像“爱死”。", "id": "j1365"}, {"cat": "谐音热梗", "text": "哪一种鞋跑最快？答：每一种。 鞋子的英文 shoe，念起来就是“咻”！", "id": "j1366"}, {"cat": "谐音热梗", "text": "哪一种笔最常喷墨水？答：每一种。 笔的英文 pen，念起来就是“喷”。", "id": "j1367"}, {"cat": "谐音热梗", "text": "黑熊、灰熊、白熊，哪一只最厉害？答：灰熊。 “灰熊厉害”——台湾国语的“非常厉害”。", "id": "j1368"}, {"cat": "谐音热梗", "text": "哪一种动物最常突然冒出来？答：熊。 台湾人说“突然”会讲“熊熊”，它总是熊熊就出现了。", "id": "j1369"}, {"cat": "谐音热梗", "text": "开幕、开工为什么都要摆凤梨？答：因为凤梨的台语叫“旺来”。 摆了，生意就会旺起来。", "id": "j1370"}, {"cat": "谐音热梗", "text": "自助餐里哪一道菜最随便？答：青菜。 台语说“随便啦”，听起来就是“青菜啦”。", "id": "j1371"}, {"cat": "谐音热梗", "text": "什么颜色的话最不能相信？答：黑白讲。 台语“乌白讲”就是乱讲。", "id": "j1372"}, {"cat": "谐音热梗", "text": "哪一种额头最有钱？答：好额。 台语“好额”就是有钱。", "id": "j1373"}, {"cat": "谐音热梗", "text": "身体哪个部位最厉害？答：脚。 台语“足”是“非常”的意思——“足（脚）厉害”。", "id": "j1374"}, {"cat": "谐音热梗", "text": "哪一个数字最像狗？答：九。 台语“九”跟“狗”念起来一样。", "id": "j1375"}, {"cat": "谐音热梗", "text": "哪一张卡最好用？答：“卡好”。 台语“卡好”就是“比较好”。", "id": "j1376"}, {"cat": "谐音热梗", "text": "为什么说女生很“水”，她会很开心？答：因为台语的“水”就是漂亮。", "id": "j1377"}, {"cat": "谐音热梗", "text": "工地里哪一台机器最自恋？答：挖土机。 台语“挖”听起来就是“我”——整天都在讲我、我、我。", "id": "j1378"}, {"cat": "谐音热梗", "text": "哪一种动物最挑剔？答：乌龟。 台湾人说人很挑剔叫“龟毛”。", "id": "j1379"}, {"cat": "谐音热梗", "text": "哪一种动物最爱管闲事？答：鸡。 多管闲事叫“鸡婆”。", "id": "j1380"}, {"cat": "谐音热梗", "text": "哪一种动物最霸道？答：鸭子。 台语说人霸道、不讲理叫“鸭霸”。", "id": "j1381"}, {"cat": "谐音热梗", "text": "世界上哪一个地方最乱七八糟？答：乌鲁木齐。 台语说“乌鲁木齐”，就是乱七八糟、乱来。", "id": "j1382"}, {"cat": "谐音热梗", "text": "哪一种锥子最可爱？答：古锥。 台语“古锥”就是可爱。", "id": "j1383"}, {"cat": "谐音热梗", "text": "哪一种蒜最会选举？答：冻蒜。 台语“冻蒜”就是“当选”，选举造势一定会喊。", "id": "j1384"}, {"cat": "谐音热梗", "text": "台湾人见面，为什么第一句都问“呷饱未”？答：因为在台湾，吃饱了没比你好不好还重要。", "id": "j1385"}, {"cat": "谐音热梗", "text": "小明去吉野家吃饭，结果发生了什么事？答：吉野不在家。", "id": "j1386"}, {"cat": "谐音热梗", "text": "郝帅气、郝美丽、郝棒棒三个人去游泳，三个都掉进水里。郝帅气先把郝美丽救上岸，郝美丽问他什么？答：“啊不救郝棒棒？” 念快一点就是“啊不就好棒棒”。", "id": "j1387"}, {"cat": "谐音热梗", "text": "冬天，一只蜗牛慢慢爬上樱桃树。树上的鸟笑它：“现在又没有樱桃！”蜗牛怎么回？答：“等我爬上去，就有了。”", "id": "j1388"}, {"cat": "谐音热梗", "text": "老师问小明：“你今天为什么迟到？”答：“因为路边的牌子写：‘前有学校，请慢行。’”", "id": "j1389"}, {"cat": "谐音热梗", "text": "小明考了 0 分，回家怎么跟妈妈说？答：“老师说我是全班进步空间最大的。”", "id": "j1390"}, {"cat": "谐音热梗", "text": "小明在路上捡到 100 元，交给警察。警察问：“你怎么确定这不是你的？”答：“因为我的钱包从来没有出现过 100 元。”", "id": "j1391"}, {"cat": "谐音热梗", "text": "小明问老师：“人可以因为没做过的事被处罚吗？”老师说不行。小明说了什么？答：“太好了，我没写作业。”", "id": "j1392"}, {"cat": "谐音热梗", "text": "妈妈叫小明去看锅子里的水滚了没，小明回来说什么？答：“还没，它还在原地。” 水“滚”开的滚，跟滚来滚去是同一个字。", "id": "j1393"}, {"cat": "谐音热梗", "text": "爸爸问小明：“这次考第几名？”小明说：“第一名！”爸爸：“真的？”答：“倒数的。”", "id": "j1394"}, {"cat": "谐音热梗", "text": "老师问小明为什么上课睡觉，小明怎么回答？答：“因为老师讲得太好听了，像摇篮曲。”", "id": "j1395"}, {"cat": "谐音热梗", "text": "小明走进书店问：“有没有《如何变聪明》？”店员怎么回？答：“有，但你要先买《如何找到书架》。”", "id": "j1396"}, {"cat": "谐音热梗", "text": "医生对小明的爸爸说：“你要戒烟、戒酒、早睡早起。”爸爸问：“这样会活比较久吗？”答：“不一定，但你会觉得日子过得比较久。”", "id": "j1397"}, {"cat": "谐音热梗", "text": "小明问爸爸：“爸，我是不是很傻？”答：爸爸说：“傻孩子，你怎么会傻呢？”", "id": "j1398"}, {"cat": "谐音热梗", "text": "老师：“小明，请说出两个代名词。”小明：“谁？我吗？”答：老师：“答对了。” “谁”跟“我”都是代名词。", "id": "j1399"}, {"cat": "谐音热梗", "text": "小明交给美术老师一张全白的图，说画的是“牛在吃草”。老师问：“草呢？”答：“被牛吃光了。”老师：“那牛呢？”“吃完就走了。”", "id": "j1400"}, {"cat": "谐音热梗", "text": "小明跟爸爸说：“我今天帮你省了 15 元！我没搭公车，一路跟着公车跑回家。”爸爸怎么回？答：“那你怎么不跟着计程车跑？可以省 200。”", "id": "j1401"}, {"cat": "谐音热梗", "text": "作文题目是〈假如我是老板〉，全班都在写，只有小明翘着脚不动。老师问他为什么不写？答：“我在等我的秘书。”", "id": "j1402"}, {"cat": "谐音热梗", "text": "小明问动物园的保育员：“乌龟为什么可以活那么久？”保育员说：“因为它从来不赶时间。”？答：小明：“那我上学迟到，也是在养生。”", "id": "j1403"}, {"cat": "谐音热梗", "text": "我的钱包跟洋葱有什么共通点？答：一打开就想哭。", "id": "j1404"}, {"cat": "谐音热梗", "text": "老板说：“公司就是你的家。”我做了什么？答：隔天穿拖鞋来上班。", "id": "j1405"}, {"cat": "谐音热梗", "text": "公司里最准时的员工是谁？答：打卡机。", "id": "j1406"}, {"cat": "谐音热梗", "text": "健身房的会员卡，其实是什么？答：一张很贵的捐款收据。 缴了一整年，去了三次。", "id": "j1407"}, {"cat": "谐音热梗", "text": "年终奖金跟外星人有什么共通点？答：大家都听说过，没人真的见过。", "id": "j1408"}, {"cat": "谐音热梗", "text": "会议为什么可以开那么久？答：因为大家都在等别人先说“那就先这样”。", "id": "j1409"}, {"cat": "谐音热梗", "text": "上班族最怕收到哪一句话？答：“详如附件。”——然后没有附件。", "id": "j1410"}, {"cat": "谐音热梗", "text": "主管说：“这个很简单，五分钟就好。”结果呢？答：我花了三天，才弄懂他说的“这个”是哪个。", "id": "j1411"}, {"cat": "谐音热梗", "text": "周末我都在做什么？答：充电。 我躺在床上滑手机，手机在充电。", "id": "j1412"}, {"cat": "谐音热梗", "text": "我跟谁的感情最好？答：床。 每天早上都难分难舍。", "id": "j1413"}, {"cat": "谐音热梗", "text": "我的存款跟我的头发有什么共通点？答：一年比一年少。", "id": "j1414"}, {"cat": "谐音热梗", "text": "人生为什么像打电动？答：因为我已经玩了三十年，还在新手村。", "id": "j1415"}, {"cat": "谐音热梗", "text": "老师说明天考试可以翻书，我为什么还是考不好？答：因为我的课本是全新的——一次都没打开过。", "id": "j1416"}, {"cat": "谐音热梗", "text": "为什么我每次考试都考不好？答：我会的都没考，考的我都不会。", "id": "j1417"}, {"cat": "谐音热梗", "text": "月底的时候，我的钱包像什么？答：像我开会时的脑袋——一片空白。", "id": "j1418"}, {"cat": "谐音热梗", "text": "我的薪水为什么像 Wi-Fi？答：在公司看得到，一回家就不见了。", "id": "j1419"}, {"cat": "谐音热梗", "text": "老板问我：“你觉得五年后的自己在哪里？”答：“应该还在等你回这封信。”", "id": "j1420"}, {"cat": "谐音热梗", "text": "为什么我总是存不了钱？答：因为钱包有拉链，购物车没有。", "id": "j1421"}, {"cat": "短句冷笑话", "text": "为什么猴子不喜欢打字？因为它们习惯用手抓。", "id": "j1422"}, {"cat": "短句冷笑话", "text": "为什么狮子不当老师？因为它一吼就没人敢发问。", "id": "j1423"}, {"cat": "短句冷笑话", "text": "为什么老虎很孤单？因为大家都怕它。", "id": "j1424"}, {"cat": "短句冷笑话", "text": "为什么熊猫只吃竹子？因为它不会做菜。", "id": "j1425"}, {"cat": "短句冷笑话", "text": "为什么长颈鹿不当保全？因为它看得太远，看不到小偷。", "id": "j1426"}, {"cat": "短句冷笑话", "text": "为什么兔子跑得快？因为它怕被发现偷吃菜。", "id": "j1427"}, {"cat": "短句冷笑话", "text": "为什么乌龟走得慢？因为它怕错过风景。", "id": "j1428"}, {"cat": "短句冷笑话", "text": "为什么鸽子敢在人多的地方走？因为它知道没人会吃它。", "id": "j1429"}, {"cat": "短句冷笑话", "text": "为什么猪很聪明？因为它知道吃饱就好。", "id": "j1430"}, {"cat": "短句冷笑话", "text": "为什么狗摇尾巴？因为它不会说话。", "id": "j1431"}, {"cat": "短句冷笑话", "text": "为什么猫不理你？因为它正在忙着当自己。", "id": "j1432"}, {"cat": "短句冷笑话", "text": "为什么孔雀要开屏？因为它在应征模特儿。", "id": "j1433"}, {"cat": "短句冷笑话", "text": "为什么青蛙会跳？因为它不想被踩到。", "id": "j1434"}, {"cat": "短句冷笑话", "text": "为什么蛇没有脚？因为它把脚拿去换滑行的能力。", "id": "j1435"}, {"cat": "短句冷笑话", "text": "为什么鱼要一直游？因为它一停就会沉。", "id": "j1436"}, {"cat": "短句冷笑话", "text": "为什么鲸鱼会喷水？因为它在帮大海打气。", "id": "j1437"}, {"cat": "短句冷笑话", "text": "为什么螃蟹要横著走？因为它的方向感很差。", "id": "j1438"}, {"cat": "短句冷笑话", "text": "为什么斑马有条纹？因为它想低调。", "id": "j1439"}, {"cat": "短句冷笑话", "text": "为什么企鹅走路很整齐？因为它们在排队买票。", "id": "j1440"}, {"cat": "短句冷笑话", "text": "为什么北极熊是白的？因为它想融入雪景。", "id": "j1441"}, {"cat": "短句冷笑话", "text": "为什么松鼠要存食物？因为它看了理财书。", "id": "j1442"}, {"cat": "短句冷笑话", "text": "为什么大象耳朵大？因为它要听清楚大家在说什么。", "id": "j1443"}, {"cat": "短句冷笑话", "text": "为什么河马嘴巴大？因为它想一次吃饱。", "id": "j1444"}, {"cat": "短句冷笑话", "text": "为什么无尾熊爱抱树？因为它怕掉下去。", "id": "j1445"}, {"cat": "短句冷笑话", "text": "为什么树懒很慢？因为它追求慢活。", "id": "j1446"}, {"cat": "短句冷笑话", "text": "为什么变色龙会变色？因为它想低调一点。", "id": "j1447"}, {"cat": "短句冷笑话", "text": "为什么刺猬不敢抱人？因为它怕被误会攻击。", "id": "j1448"}, {"cat": "短句冷笑话", "text": "为什么浣熊爱洗手？因为它有洁癖。", "id": "j1449"}, {"cat": "短句冷笑话", "text": "为什么狐狸很聪明？因为它看了太多动物故事。", "id": "j1450"}, {"cat": "短句冷笑话", "text": "为什么狼要成群？因为它怕孤单。", "id": "j1451"}, {"cat": "短句冷笑话", "text": "为什么驴子很固执？因为它有自己的想法。", "id": "j1452"}, {"cat": "短句冷笑话", "text": "为什么马跑得快？因为它急着去下一站。", "id": "j1453"}, {"cat": "短句冷笑话", "text": "为什么牛反刍？因为它想回味。", "id": "j1454"}, {"cat": "短句冷笑话", "text": "为什么羊会咩咩叫？因为它在点名。", "id": "j1455"}, {"cat": "短句冷笑话", "text": "为什么公鸡早上叫？因为它在叫大家起床。", "id": "j1456"}, {"cat": "短句冷笑话", "text": "为什么母鸡孵蛋？因为它怕蛋冷。", "id": "j1457"}, {"cat": "短句冷笑话", "text": "为什么鸭子会游泳？因为它穿的是内建式的。", "id": "j1458"}, {"cat": "短句冷笑话", "text": "为什么鹅很凶？因为它在顾家。", "id": "j1459"}, {"cat": "短句冷笑话", "text": "为什么鸵鸟把头埋沙里？因为它在找东西。", "id": "j1460"}, {"cat": "短句冷笑话", "text": "为什么海豚爱跳？因为它心情好。", "id": "j1461"}, {"cat": "短句冷笑话", "text": "为什么章鱼有八只脚？因为它要多工处理。", "id": "j1462"}, {"cat": "短句冷笑话", "text": "为什么海星有五只脚？因为它想要平衡。", "id": "j1463"}, {"cat": "短句冷笑话", "text": "为什么水母没有脑？因为它随波逐流。", "id": "j1464"}, {"cat": "短句冷笑话", "text": "为什么虾子煮熟会变红？因为它太热了。", "id": "j1465"}, {"cat": "短句冷笑话", "text": "为什么鸟会飞走？因为它不想被留下。", "id": "j1466"}, {"cat": "短句冷笑话", "text": "为什么蜜蜂很勤劳？因为它怕被开除。", "id": "j1467"}, {"cat": "短句冷笑话", "text": "为什么蝴蝶要飞来飞去？因为它在找花上班。", "id": "j1468"}, {"cat": "短句冷笑话", "text": "为什么毛毛虫会变蝴蝶？因为它想换工作。", "id": "j1469"}, {"cat": "短句冷笑话", "text": "为什么蜘蛛要结网？因为它在开店。", "id": "j1470"}, {"cat": "短句冷笑话", "text": "为什么蝉一直叫？因为它在开演唱会。", "id": "j1471"}, {"cat": "短句冷笑话", "text": "为什么蚂蚁从不迟到？因为它们都排队走，没有人插队。", "id": "j1472"}, {"cat": "短句冷笑话", "text": "为什么飞得高？因为它不想听地上的八卦。", "id": "j1473"}, {"cat": "短句冷笑话", "text": "为什么不减肥？因为它怕瘦下来塞不进冰箱。", "id": "j1474"}, {"cat": "短句冷笑话", "text": "为什么不搭电梯？因为电梯门太小，冰箱门比较大。", "id": "j1475"}, {"cat": "短句冷笑话", "text": "为什么不玩捉迷藏？因为它藏哪里都被看到。", "id": "j1476"}, {"cat": "短句冷笑话", "text": "为什么不当小偷？因为它走路太大声。", "id": "j1477"}, {"cat": "短句冷笑话", "text": "为什么不游泳？因为它一下水，水位就上升。", "id": "j1478"}, {"cat": "短句冷笑话", "text": "为什么不跳舞？因为它跳完，地板就要换。", "id": "j1479"}, {"cat": "短句冷笑话", "text": "为什么不吃辣？因为它怕喷火，把森林烧了。", "id": "j1480"}, {"cat": "短句冷笑话", "text": "为什么不当保全？因为它坐着就挡住门口。", "id": "j1481"}, {"cat": "短句冷笑话", "text": "为什么不用手机？因为它的手指太粗，一直按错。", "id": "j1482"}, {"cat": "短句冷笑话", "text": "为什么不去旅行？因为它过不了海关，行李太大。", "id": "j1483"}, {"cat": "短句冷笑话", "text": "为什么不刷牙？因为它要的牙刷还没发明。", "id": "j1484"}, {"cat": "短句冷笑话", "text": "为什么不坐飞机？因为它是头等舱的价格也装不下。", "id": "j1485"}, {"cat": "短句冷笑话", "text": "为什么不搭公车？因为它上车，大家就下车。", "id": "j1486"}, {"cat": "短句冷笑话", "text": "为什么不当画家？因为它一笔就把整张纸画满。", "id": "j1487"}, {"cat": "短句冷笑话", "text": "为什么不打球？因为它一投就飞出场外。", "id": "j1488"}, {"cat": "短句冷笑话", "text": "为什么不唱KTV？因为它一开口，麦克风就坏了。", "id": "j1489"}, {"cat": "短句冷笑话", "text": "为什么不拍照？因为它的头塞不进镜头。", "id": "j1490"}, {"cat": "短句冷笑话", "text": "为什么不吵架？因为它们一吵，地就震。", "id": "j1491"}, {"cat": "短句冷笑话", "text": "为什么不排队？因为它站着就是一道墙。", "id": "j1492"}, {"cat": "短句冷笑话", "text": "为什么不当老师？因为黑板写不下它要说的话。", "id": "j1493"}, {"cat": "短句冷笑话", "text": "为什么不当医师？因为它的听诊器要特别订做。", "id": "j1494"}, {"cat": "短句冷笑话", "text": "为什么不当司机？因为它坐不进驾驶座。", "id": "j1495"}, {"cat": "短句冷笑话", "text": "为什么北极熊不吃企鹅？因为北极没有企鹅。", "id": "j1496"}, {"cat": "短句冷笑话", "text": "为什么企鹅不吃北极熊？因为企鹅打不过它。", "id": "j1497"}, {"cat": "短句冷笑话", "text": "为什么大象不能拉小提琴？因为它找不到那么大的琴盒。", "id": "j1498"}, {"cat": "短句冷笑话", "text": "为什么海洋里有很多鱼却不会堵车？因为它们都游得好好的。", "id": "j1499"}, {"cat": "短句冷笑话", "text": "为什么镜子从不说谎？因为它只会照着做。", "id": "j1500"}, {"cat": "短句冷笑话", "text": "为什么牛反刍？因为它想回味。", "id": "j1501"}, {"cat": "短句冷笑话", "text": "为什么鹅很凶？因为它在顾家。", "id": "j1502"}, {"cat": "短句冷笑话", "text": "有一只老鼠走在路上，遇到一只猫，它说：你别吃我，我很瘦。猫说：那就当开胃菜。", "id": "j1503"}, {"cat": "短句冷笑话", "text": "有一只老鼠问妈妈：我们为什么要被猫追？妈妈说：因为我们跑得比较快，它们想练身体。", "id": "j1504"}, {"cat": "短句冷笑话", "text": "有一只老鼠去应征，老板问它有什么专长，它说：我很会躲。老板说：那你被录取了，我找不到你。", "id": "j1505"}, {"cat": "短句冷笑话", "text": "有一只老鼠想变勇敢，它去挑战猫，结果它成功地把猫吓了一跳，因为它戴了老虎面具。", "id": "j1506"}, {"cat": "短句冷笑话", "text": "有一只老鼠存了很多米，它说我终于有钱了，结果隔天米缸被主人清空了。", "id": "j1507"}, {"cat": "短句冷笑话", "text": "有一只老鼠问另一只老鼠：你为什么这么瘦？它说：因为我住的这家有养猫。", "id": "j1508"}, {"cat": "短句冷笑话", "text": "有一只老鼠去看医生，医生说你要少吃起司，它说：那我要怎么活下去。", "id": "j1509"}, {"cat": "短句冷笑话", "text": "有一只老鼠在路上捡到一块起司，它高兴地带回家，结果那是捕鼠器的诱饵。", "id": "j1510"}, {"cat": "短句冷笑话", "text": "有一只老鼠对猫说：我们做朋友好不好？猫说：好啊，你先过来。", "id": "j1511"}, {"cat": "短句冷笑话", "text": "有一只老鼠爬上了餐桌，它看到满桌的菜，正开心时，主人说：今天的猫很饿。", "id": "j1512"}, {"cat": "短句冷笑话", "text": "有一只老鼠想出名，它去当实验鼠，结果它成了新闻的头条。", "id": "j1513"}, {"cat": "短句冷笑话", "text": "有一只老鼠很爱干净，它每天洗澡，结果它掉进了水桶。", "id": "j1514"}, {"cat": "短句冷笑话", "text": "有一只老鼠问爸爸：天上有几颗星星？爸爸说：你先担心地上有几只猫。", "id": "j1515"}, {"cat": "短句冷笑话", "text": "有一只老鼠学会了游泳，它说我终于不怕水了，结果它遇到了会游泳的猫。", "id": "j1516"}, {"cat": "短句冷笑话", "text": "有一只老鼠去旅行，它坐了飞机，结果它被当成行李托运。", "id": "j1517"}, {"cat": "短句冷笑话", "text": "有一只老鼠很会唱歌，它去参加选秀，评审说：你太小声了。", "id": "j1518"}, {"cat": "短句冷笑话", "text": "有一只老鼠想当厨师，它做了一道起司大餐，结果全被自己吃掉了。", "id": "j1519"}, {"cat": "短句冷笑话", "text": "有一只老鼠跑步很快，它去比赛，结果它跑赢了，因为猫在后面追。", "id": "j1520"}, {"cat": "短句冷笑话", "text": "有一只老鼠捡到一块钱，它说我要存起来，结果它买了一块起司。", "id": "j1521"}, {"cat": "短句冷笑话", "text": "有一只老鼠很怕黑，它买了一盏小灯，结果灯一开，猫就找到它了。", "id": "j1522"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很懒，它说我今天不搬东西，结果它被同伴排到最后面。", "id": "j1523"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁问另一只：你为什么这么壮？它说：因为我每天搬便当盒。", "id": "j1524"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁去搬一块饼干，搬不动，它说：这块饼干比我的梦想还大。", "id": "j1525"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁迷路了，它问路，结果它问的是另一只迷路的蚂蚁。", "id": "j1526"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很会算数，它说我们有三千只，结果它数了三次都不同。", "id": "j1527"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁想放假，它跟蚁后请假，蚁后说：你先搬完这一趟。", "id": "j1528"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁掉进了糖罐，它说这里太甜了，我不想回去了。", "id": "j1529"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很会唱歌，它开演唱会，全场只有蚁后一个观众。", "id": "j1530"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁去买东西，它买了一粒米，它说这是一周的粮食。", "id": "j1531"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很怕水，它遇到雨，它说：这是世界末日。", "id": "j1532"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很爱干净，它每天整理蚁窝，结果它把大家的路标搬走了。", "id": "j1533"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁想变大，它努力吃东西，结果它只变得更饿。", "id": "j1534"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁去面试，主管问：你能搬多少？它说：看我心情。", "id": "j1535"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁问妈妈：我们为什么这么小？妈妈说：这样才不会被发现。", "id": "j1536"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很勇敢，它去挑战蜘蛛，结果它成了蜘蛛的点心。", "id": "j1537"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很会画画，它用脚印画了一张图，结果被雨冲掉了。", "id": "j1538"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很会跑步，它参加马拉松，它跑完全程，花了三天。", "id": "j1539"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁想当国王，它宣布自己是国王，结果没有人理它，大家都在搬东西。", "id": "j1540"}, {"cat": "短句冷笑话", "text": "有一只蚂蚁很爱聊天，它边搬东西边讲话，结果它把东西搬错了地方。", "id": "j1541"}, {"cat": "短句冷笑话", "text": "有一只老鹰想学鸡叫，它叫了半天，结果鸡都笑了。", "id": "j1542"}, {"cat": "短句冷笑话", "text": "有一只老鹰去上课，老师问它的专长，它说：我从高处看事情。", "id": "j1543"}, {"cat": "短句冷笑话", "text": "有一只老鹰很怕高，它说：我这辈子只能当地上的观察家。", "id": "j1544"}, {"cat": "短句冷笑话", "text": "有一只老鹰去买眼镜，店员说你视力很好，它说：我只是想更帅。", "id": "j1545"}, {"cat": "短句冷笑话", "text": "有一只老鹰想当邮差，它送信很准，但它把信丢在人家头上。", "id": "j1546"}, {"cat": "短句冷笑话", "text": "有一只老鹰很爱面子，它抓错猎物掉到地上，它说：这是我送他的礼物。", "id": "j1547"}, {"cat": "短句冷笑话", "text": "有一只老鹰教小鹰飞，小鹰说我不敢，老鹰说：你再不飞，我就把你推下去。", "id": "j1548"}, {"cat": "短句冷笑话", "text": "有一只老鹰想当歌手，它一开口，全山的鸟都飞走了。", "id": "j1549"}, {"cat": "短句冷笑话", "text": "有一只老鹰很节省，它盘旋了一整天，就为了省一趟的力气。", "id": "j1550"}, {"cat": "短句冷笑话", "text": "有一只老鹰去旅行，它飞过大海，它说：风景很美，就是找不到厕所。", "id": "j1551"}, {"cat": "短句冷笑话", "text": "有一只老鹰很会算，它算好了风向，结果风没来。", "id": "j1552"}, {"cat": "短句冷笑话", "text": "有一只老鹰想减肥，它少吃了一只兔子，它说：今天有进步。", "id": "j1553"}, {"cat": "短句冷笑话", "text": "有一只老鹰很骄傲，它说天空是我的，结果遇到飞机。", "id": "j1554"}, {"cat": "短句冷笑话", "text": "有一只老鹰去当保全，它站在高处看，结果它什么都没看，因为它睡着了。", "id": "j1555"}, {"cat": "短句冷笑话", "text": "有一只老鹰问另一只：你为什么飞这么慢？它说：我在享受风景。", "id": "j1556"}, {"cat": "短句冷笑话", "text": "有一只老鹰很怕孤单，它一直盘旋，就为了等同伴。", "id": "j1557"}, {"cat": "短句冷笑话", "text": "有一只老鹰想学游泳，它跳进水里，它说：我还是回天上吧。", "id": "j1558"}, {"cat": "短句冷笑话", "text": "有一只老鹰很会看人，它说：那个人有钱，结果那是个卖伞的。", "id": "j1559"}, {"cat": "短句冷笑话", "text": "有一只老鹰想做网红，它拍了一支飞行影片，结果只有风按赞。", "id": "j1560"}, {"cat": "短句冷笑话", "text": "什么动物最不怕冷？答：北极熊，因为它住在冰箱隔壁。", "id": "j1561"}, {"cat": "短句冷笑话", "text": "什么鱼最会唱歌？答：“余音绕梁”的那条鱼。", "id": "j1562"}, {"cat": "短句冷笑话", "text": "什么东西越洗越脏？答：水，洗什么脏什么。", "id": "j1563"}, {"cat": "短句冷笑话", "text": "什么书最重？答：履历，因为它决定你的分量。", "id": "j1564"}, {"cat": "短句冷笑话", "text": "什么东西越分享越多？答：快乐。", "id": "j1565"}, {"cat": "短句冷笑话", "text": "什么东西你越用它越小？答：橡皮擦。", "id": "j1566"}, {"cat": "短句冷笑话", "text": "什么人最不怕丢脸？答：没有脸的人。", "id": "j1567"}, {"cat": "短句冷笑话", "text": "什么伞最贵？答：保护伞的交情。", "id": "j1568"}, {"cat": "短句冷笑话", "text": "什么车最慢？答：风车，因为它只站着不动。", "id": "j1569"}, {"cat": "短句冷笑话", "text": "什么船最怕翻？答：友谊的小船。", "id": "j1570"}, {"cat": "短句冷笑话", "text": "什么灯不会亮？答：警示灯，因为它只负责提醒。", "id": "j1571"}, {"cat": "短句冷笑话", "text": "什么门最好进？答：后门，可惜不合法。", "id": "j1572"}, {"cat": "短句冷笑话", "text": "什么水果最会唱歌？答：杨桃，因为它“样”样都好。", "id": "j1573"}, {"cat": "短句冷笑话", "text": "什么东西摔不坏？答：形象，摔一次就没了。", "id": "j1574"}, {"cat": "短句冷笑话", "text": "什么人永远不会老？答：照片里的人。", "id": "j1575"}, {"cat": "短句冷笑话", "text": "什么东西越薄越有存在感？答：脸皮。", "id": "j1576"}, {"cat": "短句冷笑话", "text": "什么动物最会省钱？答：松鼠，因为它都存起来。", "id": "j1577"}, {"cat": "短句冷笑话", "text": "什么动物起床最慢？答：蜗牛，因为它连睡觉都慢。", "id": "j1578"}, {"cat": "短句冷笑话", "text": "什么动物最守法？答：蚂蚁，因为它们排队很整齐。", "id": "j1579"}, {"cat": "短句冷笑话", "text": "什么狐狸最诚实？答：没有狐狸。", "id": "j1580"}, {"cat": "短句冷笑话", "text": "什么店永远不打烊？答：脸书上朋友开的店。", "id": "j1581"}, {"cat": "短句冷笑话", "text": "什么东西你越借越多？答：钱，借了要还利息。", "id": "j1582"}, {"cat": "短句冷笑话", "text": "什么药治百病？答：后悔药，可惜买不到。", "id": "j1583"}, {"cat": "短句冷笑话", "text": "什么人最忙？答：没时间回讯息的那个人。", "id": "j1584"}, {"cat": "短句冷笑话", "text": "什么事最难？答：早起。", "id": "j1585"}, {"cat": "短句冷笑话", "text": "什么事最简单？答：明天再说。", "id": "j1586"}, {"cat": "短句冷笑话", "text": "什么关系最稳？答：借了不还的关系。", "id": "j1587"}, {"cat": "短句冷笑话", "text": "什么人最会演？答：面试时的你。", "id": "j1588"}, {"cat": "短句冷笑话", "text": "什么东西看不到却最贵？答：时间。", "id": "j1589"}, {"cat": "短句冷笑话", "text": "什么东西你最想删掉？答：购物车的纪录。", "id": "j1590"}, {"cat": "短句冷笑话", "text": "什么东西你最不想打开？答：账单。", "id": "j1591"}, {"cat": "短句冷笑话", "text": "什么东西你最想收到？答：薪水通知。", "id": "j1592"}, {"cat": "短句冷笑话", "text": "什么东西你最爱看？答：别人出糗。", "id": "j1593"}, {"cat": "短句冷笑话", "text": "什么东西永远不够？答：睡。", "id": "j1594"}, {"cat": "短句冷笑话", "text": "什么东西永远不够用？答：钱。", "id": "j1595"}, {"cat": "短句冷笑话", "text": "什么东西永远不会腻？答：吃。", "id": "j1596"}, {"cat": "短句冷笑话", "text": "什么东西永远追不上？答：昨天。", "id": "j1597"}, {"cat": "短句冷笑话", "text": "什么东西永远回不去？答：青春。", "id": "j1598"}, {"cat": "短句冷笑话", "text": "什么东西永远买不到？答：早知道。", "id": "j1599"}, {"cat": "短句冷笑话", "text": "什么东西你越想越气？答：中午吃什么。", "id": "j1600"}, {"cat": "短句冷笑话", "text": "什么东西你越想越饿？答：宵夜。", "id": "j1601"}, {"cat": "短句冷笑话", "text": "什么东西你越看越想睡？答：课本。", "id": "j1602"}, {"cat": "短句冷笑话", "text": "什么东西你越省越多？答：废话，因为省话。", "id": "j1603"}, {"cat": "短句冷笑话", "text": "什么东西你越讲越少？答：秘密。", "id": "j1604"}, {"cat": "短句冷笑话", "text": "什么东西你越藏越明显？答：心虚。", "id": "j1605"}, {"cat": "短句冷笑话", "text": "什么东西你越解释越乱？答：感情。", "id": "j1606"}, {"cat": "短句冷笑话", "text": "什么东西你越用力越抓不住？答：沙子。", "id": "j1607"}, {"cat": "短句冷笑话", "text": "什么东西你越用力越没用？答：发脾气。", "id": "j1608"}, {"cat": "短句冷笑话", "text": "什么东西你越想证明越像假的？答：没有的东西。", "id": "j1609"}, {"cat": "短句冷笑话", "text": "什么颜色最重？答：蓝色，因为“压力好大”的蓝。", "id": "j1610"}, {"cat": "短句冷笑话", "text": "什么颜色最轻？答：白色，因为风一吹就飘。", "id": "j1611"}, {"cat": "短句冷笑话", "text": "什么数字最勤劳？答：八，因为它站得最直。", "id": "j1612"}, {"cat": "短句冷笑话", "text": "什么数字最爱睡？答：零，因为它躺着。", "id": "j1613"}, {"cat": "短句冷笑话", "text": "什么数字最孤单？答：一，因为它只站得住。", "id": "j1614"}, {"cat": "短句冷笑话", "text": "什么数字最团结？答：六和九，因为它们互相扶持。", "id": "j1615"}, {"cat": "短句冷笑话", "text": "什么数字最会转弯？答：七，因为它有个勾。", "id": "j1616"}, {"cat": "短句冷笑话", "text": "什么字最会跑？答：“追”，因为它一直在赶。", "id": "j1617"}, {"cat": "短句冷笑话", "text": "什么字最会呼吸？答：“气”，因为它有气的形状。", "id": "j1618"}, {"cat": "短句冷笑话", "text": "什么字最会哭？答：“泪”，因为它三点水。", "id": "j1619"}, {"cat": "短句冷笑话", "text": "什么字最会吃？答：“饱”，因为它吃饱了。", "id": "j1620"}, {"cat": "短句冷笑话", "text": "什么字最会装？答：“假”，因为它一看就假。", "id": "j1621"}, {"cat": "短句冷笑话", "text": "什么字最会算？答：“算”，因为它自己写着算。", "id": "j1622"}, {"cat": "短句冷笑话", "text": "什么字最会说谎？答：“骗”，因为它一看就在骗。", "id": "j1623"}, {"cat": "短句冷笑话", "text": "什么字最会省？答：“俭”，因为它把人都省掉了。", "id": "j1624"}, {"cat": "短句冷笑话", "text": "什么字最会跑？答：“逃”，因为它一溜烟。", "id": "j1625"}, {"cat": "短句冷笑话", "text": "什么字最会笑？答：“哈”，因为它笑出声。", "id": "j1626"}, {"cat": "短句冷笑话", "text": "什么字最会叫？答：“吼”，因为它一张口就是吼。", "id": "j1627"}, {"cat": "短句冷笑话", "text": "什么字最会挑？答：“嫌”，因为它挑三拣四。", "id": "j1628"}, {"cat": "短句冷笑话", "text": "什么字最会胖？答：“圆”，因为它一圈又一圈。", "id": "j1629"}, {"cat": "短句冷笑话", "text": "什么字最会瘦？答：“一”，因为它只有一横。", "id": "j1630"}, {"cat": "短句冷笑话", "text": "什么字最会爬？答：“蛇”，因为它身体是弯的。", "id": "j1631"}, {"cat": "短句冷笑话", "text": "什么字最会飞？答：“鸟”，因为它长了翅膀。", "id": "j1632"}, {"cat": "短句冷笑话", "text": "什么字最会游？答：“鱼”，因为它天生在水里。", "id": "j1633"}, {"cat": "短句冷笑话", "text": "什么字最会烧？答：“炎”，因为它有两把火。", "id": "j1634"}, {"cat": "短句冷笑话", "text": "什么字最会冻？答：“冰”，因为它两点水加冰。", "id": "j1635"}, {"cat": "短句冷笑话", "text": "什么字最会唱？答：“歌”，因为它自带歌词。", "id": "j1636"}, {"cat": "短句冷笑话", "text": "什么字最会睡？答：“眠”，因为它一看就想睡。", "id": "j1637"}, {"cat": "短句冷笑话", "text": "什么字最会累？答：“累”，因为它田里有丝。", "id": "j1638"}, {"cat": "短句冷笑话", "text": "什么字最会贵？答：“贵”，因为它中间有钱。", "id": "j1639"}, {"cat": "短句冷笑话", "text": "什么字最会穷？答：“穷”，因为它躲在洞穴里。", "id": "j1640"}, {"cat": "短句冷笑话", "text": "什么字最会躲？答：“藏”，因为它藏了一堆草。", "id": "j1641"}, {"cat": "短句冷笑话", "text": "什么字最会骗人？答：“诈”，因为它一看就在诈。", "id": "j1642"}, {"cat": "短句冷笑话", "text": "什么时候四减一等于五？答：在算错的时候。", "id": "j1643"}, {"cat": "短句冷笑话", "text": "什么时候一加一等于三？答：在生小孩的时候。", "id": "j1644"}, {"cat": "短句冷笑话", "text": "什么时候一加一等于一？答：在做梦的时候。", "id": "j1645"}, {"cat": "短句冷笑话", "text": "什么时候太阳会从西边出来？答：在你起太晚的时候。", "id": "j1646"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很聪明？答：在考完试对答案之前。", "id": "j1647"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很笨？答：在对完答案之后。", "id": "j1648"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得时间过得很快？答：在休假的时候。", "id": "j1649"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得时间过得很慢？答：在等下班的时候。", "id": "j1650"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得钱不够用？答：在月底的时候。", "id": "j1651"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得肚子很饿？答：在宵夜摊经过的时候。", "id": "j1652"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很勇敢？答：在网络上。", "id": "j1653"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很会说话？答：在打字的时候。", "id": "j1654"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很会唱歌？答：在洗澡的时候。", "id": "j1655"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己会飞？答：在梦里。", "id": "j1656"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己是天才？答：在看别人做错的时候。", "id": "j1657"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很努力？答：在发文的时候。", "id": "j1658"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很节省？答：在买打折品的时候。", "id": "j1659"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很健康？答：在还没去健检的时候。", "id": "j1660"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很年轻？答：在看到别人更老的时候。", "id": "j1661"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很有钱？答：在看更穷的人的时候。", "id": "j1662"}, {"cat": "短句冷笑话", "text": "什么时候你会觉得自己很幸福？答：在别人抱怨的时候。", "id": "j1663"}, {"cat": "生活段子", "text": "想睡的人睡不着，多半是因为睡不着想睡的人。", "id": "j1664"}, {"cat": "生活段子", "text": "通往瘦子的路上很孤独，还好沿途有很多饭馆。", "id": "j1665"}, {"cat": "生活段子", "text": "人丑就该多读书。等别人嘲笑你连丑字都不会写，你就可以底气十足地说：我知道。", "id": "j1666"}, {"cat": "生活段子", "text": "今天有个盲人走路撞到了我，我恶狠狠地瞪了他的狗一眼。", "id": "j1667"}, {"cat": "生活段子", "text": "戴上耳机发现左边没声音，检查了半天，原来是左耳聋了。", "id": "j1668"}, {"cat": "生活段子", "text": "做人要跟自己比。你羡慕别人又白又瘦又会唱歌，别人也在惊讶你居然那么能吃。", "id": "j1669"}, {"cat": "生活段子", "text": "过年去吃自助餐，进门先一起称体重，吃完再称，谁轻谁买单。", "id": "j1670"}, {"cat": "生活段子", "text": "等病好了我就去看医生。", "id": "j1671"}, {"cat": "生活段子", "text": "我要减肥，过完年开始。", "id": "j1672"}, {"cat": "生活段子", "text": "天天听人说李敏镐。弱弱问一句：这个和洛阳铲是同一种工具吗？", "id": "j1673"}, {"cat": "生活段子", "text": "你在我心里的形象，虽然没地瓜大，起码也是个土豆。", "id": "j1674"}, {"cat": "生活段子", "text": "出门前化妆超过两个小时，不叫化妆，叫易容。", "id": "j1675"}, {"cat": "生活段子", "text": "上班族颈椎病，常常是因为开会时一直低头玩手机。", "id": "j1676"}, {"cat": "生活段子", "text": "上厕所半天不出来，通常有四种可能：便秘、没带纸、有无线网、在思考人生。", "id": "j1677"}, {"cat": "生活段子", "text": "一白遮百丑，一胖毁所有。我知道已经很丑了，可你为什么还要让我失去所有？", "id": "j1678"}, {"cat": "生活段子", "text": "真正的兄弟，不管隔多远、换几次手机号，你要借钱的时候总能找到。", "id": "j1679"}, {"cat": "生活段子", "text": "如果网上聊得很好的朋友突然不理你了，先反思一下：是不是发自拍了。", "id": "j1680"}, {"cat": "生活段子", "text": "青年去麦当劳买饮料，执意只要第二杯，被店员请了出去。", "id": "j1681"}, {"cat": "生活段子", "text": "十岁男童掉进下水井，热心路人及时把井盖盖上，防止事故再发生。", "id": "j1682"}, {"cat": "生活段子", "text": "隔壁桌老夫妇几十年每次都打包一两个菜。原来恩爱了这么久，还是不会做饭。", "id": "j1683"}, {"cat": "生活段子", "text": "第一年他说她听，第二年她说他听，第三年他俩说，邻居听。", "id": "j1684"}, {"cat": "生活段子", "text": "老师问老鼠能活多少年。学生说：这要看猫的心思。", "id": "j1685"}, {"cat": "生活段子", "text": "袋鼠对狗说：我能把手机放进袋子里，你只能把手机挂在屁股上。", "id": "j1686"}, {"cat": "生活段子", "text": "猪八戒说：我改名叫赛潘安了，很多美女在等我。悟空说：你是不是上网了。", "id": "j1687"}, {"cat": "生活段子", "text": "女儿问妈妈：爸爸从前害羞吗？妈妈说：要是他不害羞，你现在至少大四岁。", "id": "j1688"}, {"cat": "生活段子", "text": "爸爸说该找个老婆了。儿子说：茫茫人海，我找谁的老婆呢？", "id": "j1689"}, {"cat": "生活段子", "text": "幼儿园开学，妈妈嘱咐不要丢爸爸妈妈的脸。儿子说：知道了，我又没拿着你们的脸去上学。", "id": "j1690"}, {"cat": "生活段子", "text": "晚自习飞进一只蝴蝶，男生抓住了。同桌一边抢一边喊：放开我的英台。", "id": "j1691"}, {"cat": "生活段子", "text": "寺庙售票处，我问有没有学生票。售票员说：佛祖面前众生平等，没有学生票。", "id": "j1692"}, {"cat": "生活段子", "text": "小李说有一个好消息和一个坏消息。小张选坏消息。小李说：好消息是假的。", "id": "j1693"}, {"cat": "生活段子", "text": "人身上有个器官可大可小，可厚可薄，兴奋时发红，无助时发软，还最容易被偷看。它是脸皮。", "id": "j1694"}, {"cat": "生活段子", "text": "儿子问：兔死狐悲怎么讲？爸爸说：兔子要是都死光了，狐狸就没吃的了，能不悲哀吗？", "id": "j1695"}, {"cat": "生活段子", "text": "小伙子放了个响屁，旁边的人连呸三声。他问：您怎么吃屁还吐核儿呢？", "id": "j1696"}, {"cat": "生活段子", "text": "妻子最讨厌丈夫把吃剩菜叫做打加时赛。", "id": "j1697"}, {"cat": "生活段子", "text": "驯狮员很瘦。别人问狮子为什么不吃他。他说：它们都在等我胖起来。", "id": "j1698"}, {"cat": "生活段子", "text": "邻居小孩来借唱机。主人问是不是要开晚会。小孩说：不是，我爸爸想好好睡一觉。", "id": "j1699"}, {"cat": "生活段子", "text": "甲问种萝卜还是白菜。乙说种白菜，因为我家的鸡不喜欢吃萝卜。", "id": "j1700"}, {"cat": "生活段子", "text": "女士问饲养员：那头河马是公的还是母的？饲养员说：除了另一头河马，没人会关心这个。", "id": "j1701"}, {"cat": "生活段子", "text": "军官问：漆黑的夜里有人从背后抱住你，你该说什么？新兵说：亲爱的，放开我。", "id": "j1702"}, {"cat": "生活段子", "text": "丈夫说，年轻人在月色下会失去理智，大概是真的。记得吗，我就是在月色下向你求婚的。", "id": "j1703"}, {"cat": "生活段子", "text": "同事紧张得一开口就说：刘先生你好，请问你贵姓？", "id": "j1704"}, {"cat": "生活段子", "text": "风很大，一排自行车倒了。有人边扶车边喊：谁的奔驰压了我的宝马？", "id": "j1705"}, {"cat": "生活段子", "text": "头像很牛吗？对方回了一个字：像。", "id": "j1706"}, {"cat": "生活段子", "text": "只要你敢死，我就敢埋。", "id": "j1707"}, {"cat": "生活段子", "text": "扶着墙进，扶着墙出，是吃自助餐的最高境界。", "id": "j1708"}, {"cat": "生活段子", "text": "不想吃天鹅肉的癞蛤蟆，不是好癞蛤蟆。吃了天鹅肉的癞蛤蟆，还是癞蛤蟆。", "id": "j1709"}, {"cat": "生活段子", "text": "老师让我们不要乱扔垃圾，不然我早就把你扔了。", "id": "j1710"}, {"cat": "生活段子", "text": "不怕神一样的对手，就怕屎一样的队友。", "id": "j1711"}, {"cat": "生活段子", "text": "法官问被告去过哪里。被告说整天在家，儿子可以证明。法官问儿子也整天在家吗。被告说：一个不满一岁的婴儿还能去哪？", "id": "j1712"}, {"cat": "生活段子", "text": "中国有个最凶残也最可怜的人，名叫活活。因为人们常说活活被气死，也常说活活把人气死。", "id": "j1713"}, {"cat": "生活段子", "text": "有个人叫真啰嗦，老婆叫要你管，儿子叫麻烦。儿子丢了，夫妻去报案。警察问爸爸名字，他说真啰嗦。问妈妈，她说要你管。警察火了：你们要干什么？夫妻说：找麻烦。", "id": "j1714"}, {"cat": "生活段子", "text": "蹦极落到一半发现绳子断了，只能喊两个字。有人喊奸商，有人喊妈呀。有个人喊：变身。", "id": "j1715"}, {"cat": "生活段子", "text": "美术老师问为什么交白卷。学生说我画了牛吃草。老师问草呢。学生说被牛吃了。老师问牛呢。学生说吃完就走了。", "id": "j1716"}, {"cat": "生活段子", "text": "推销员死缠着问主妇还缺什么。主妇说什么都有了。推销员拿出一块牌子：那这个家里总需要吧。上面写着：不准敲门推销。", "id": "j1717"}, {"cat": "生活段子", "text": "爸爸把儿子哄睡了。儿子喊要水，爸爸说再叫就揍你。过了五分钟儿子又喊。爸爸问又怎么了。儿子说：你过来揍我的时候，一定要带杯水。", "id": "j1718"}, {"cat": "生活段子", "text": "实习生做完小手术，出门看见家属，脱口说：我们已经尽力了。然后他就被处分了。", "id": "j1719"}, {"cat": "生活段子", "text": "开学自我介绍。男生说：我叫尤勇，来自北京，我爱下棋。下一个女生说：我叫夏琪，我喜欢游泳。", "id": "j1720"}, {"cat": "生活段子", "text": "有人介绍一位炒股炒成百万富翁的朋友。求秘诀时他说：其实也没什么，我原来是千万富翁。", "id": "j1721"}, {"cat": "生活段子", "text": "玻璃厂的爸爸下班打车，觉得冷，习惯性戴上手套。司机从后视镜里看见，脸都绿了。", "id": "j1722"}, {"cat": "生活段子", "text": "唐僧念紧箍咒叫悟空，空中传来：您呼叫的用户不在服务区，请稍后再试。", "id": "j1723"}, {"cat": "生活段子", "text": "对一个人说“其实”，停很久，再说“算了，没什么”。对方能纠结一夜。", "id": "j1724"}, {"cat": "生活段子", "text": "运动会接力，老师反复说交接棒一定要接稳。于是比赛的时候，他们接吻了。", "id": "j1725"}, {"cat": "生活段子", "text": "小师妹叫我去修电脑，我问要不要带套。她把电话挂了。我连“工具”两个字都没说完。", "id": "j1726"}, {"cat": "生活段子", "text": "上完厕所，对着马桶说：你给我吃屎吧你。然后猛冲水。", "id": "j1727"}, {"cat": "生活段子", "text": "老鼠被猫追进花店，抱起一束玫瑰抵抗。猫低下头说：死鬼，太突然了。", "id": "j1728"}, {"cat": "生活段子", "text": "专家要证明蜘蛛的听觉在脚上。先对蜘蛛大吼，蜘蛛跑了。再把脚全剪掉，再吼，蜘蛛不动了。于是论文发表了。", "id": "j1729"}, {"cat": "生活段子", "text": "死囚临斩哈哈大笑。监斩官问为什么。他说：专家没说错，每天笑一笑，可以延长寿命五秒。", "id": "j1730"}, {"cat": "生活段子", "text": "有钱才能叫宅，你那叫蜗居。有钱才能叫忧郁，你那叫抑郁。有钱才能叫单身，你那叫光棍。", "id": "j1731"}, {"cat": "生活段子", "text": "脱了袜子自己闻，叫日记。请朋友来闻，叫博客。挂在门口让路人闻，叫论坛。挂到广场上再去闻别人的，你已经在玩微博了。", "id": "j1732"}, {"cat": "生活段子", "text": "阿斗愁眉苦脸。赵云说作业我帮你写。阿斗说昨天就是你写的，把“我吃了一顿饭”写成“我吃了一吨饭”，同学都笑我是饭桶。", "id": "j1733"}, {"cat": "生活段子", "text": "父亲节，同居的男生给生气的爸爸发短信：父亲节快乐。爸爸回了两个字：同乐。", "id": "j1734"}, {"cat": "生活段子", "text": "同桌把网名改成“你爹临死前”，加了班主任。于是班主任天天收到：你爹临死前偷了您的菜。最猛的一条是：你爹临死前给您留言了。", "id": "j1735"}, {"cat": "生活段子", "text": "丈母娘试三个女婿。大女婿救了她，送奥拓。二女婿救了她，送夏利。三女婿不会游泳，她淹死了。第二天岳父送了三女婿一辆奔驰。", "id": "j1736"}, {"cat": "生活段子", "text": "和尚和屠夫是朋友，约好早上互相叫起床。和尚去念经，屠夫去杀猪。多年后屠夫上了天堂，和尚下了地狱。因为屠夫天天叫人起来念经，和尚天天叫人起来杀生。", "id": "j1737"}, {"cat": "生活段子", "text": "机场把老头托运的死狗弄丢了，怕担责，买了一只一样的活狗放进行李。老头打开一看狗活了，当场吓死了。", "id": "j1738"}]</script>

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}
function highlight(text, q) {
  const safe = esc(text);
  const query = q.trim();
  if (!query) return safe;
  const pattern = esc(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(pattern, "gi"), m => `<mark>${m}</mark>`);
}
function filtered() {
  const query = state.q.trim();
  return JOKES.filter(j => {
    if (state.cat !== "全部" && j.cat !== state.cat) return false;
    const mark = picks[j.id] || "";
    if (state.status === "未选" && mark) return false;
    if (state.status === "好笑" && mark !== "funny") return false;
    if (state.status === "不好笑" && mark !== "meh") return false;
    if (query && !j.text.includes(query) && !j.cat.includes(query)) return false;
    return true;
  });
}
function counts() {
  let funny = 0, meh = 0;
  for (const j of JOKES) {
    if (picks[j.id] === "funny") funny += 1;
    else if (picks[j.id] === "meh") meh += 1;
  }
  return { total: JOKES.length, funny, meh, left: JOKES.length - funny - meh };
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
function buildExport() {
  const list = JOKES.filter(j => picks[j.id] === "funny");
  const now = new Date();
  const stamp = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日 "
    + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const lines = [
    "好笑的冷笑话",
    "导出时间：" + stamp,
    "共 " + list.length + " 条",
    ""
  ];
  let last = "";
  list.forEach((j, i) => {
    if (j.cat !== last) {
      lines.push("【" + j.cat + "】");
      lines.push("");
      last = j.cat;
    }
    lines.push((i + 1) + ". " + j.text);
    lines.push("");
  });
  if (!list.length) lines.push("还没有标成好笑的笑话。");
  return { text: lines.join("\n"), count: list.length };
}
function downloadText(text) {
  const blob = new Blob(["\ufeff" + text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  const now = new Date();
  const name = "好笑的冷笑话-" + now.getFullYear()
    + String(now.getMonth() + 1).padStart(2, "0")
    + String(now.getDate()).padStart(2, "0") + ".txt";
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  return name;
}
async function exportFunny() {
  const { text, count } = buildExport();
  if (!count) {
    toast("还没有标成好笑的笑话");
    return;
  }
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: "好笑的冷笑话.txt",
        types: [{ description: "纯文本", accept: { "text/plain": [".txt"] } }]
      });
      const writable = await handle.createWritable();
      await writable.write("\ufeff" + text);
      await writable.close();
      toast("已保存 " + count + " 条");
      return;
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
  }
  const name = downloadText(text);
  toast("已导出 " + count + " 条：" + name);
}
async function copyFunny() {
  const { text, count } = buildExport();
  if (!count) {
    toast("还没有标成好笑的笑话");
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制 " + count + " 条，可粘贴到文本文件");
  } catch (e) {
    downloadText(text);
    toast("复制被浏览器拦住了，已改为下载");
  }
}
function mark(id, value) {
  const before = filtered();
  const pos = before.findIndex(j => j.id === id);
  const clearing = picks[id] === value;
  if (clearing) delete picks[id];
  else picks[id] = value;
  savePicks();
  if (state.mode === "one" && !clearing && pos >= 0) {
    const after = filtered();
    if (after.some(j => j.id === id)) {
      const still = after.findIndex(j => j.id === id);
      state.index = Math.min(still + 1, Math.max(after.length - 1, 0));
    } else {
      state.index = Math.min(pos, Math.max(after.length - 1, 0));
    }
  }
  render();
}
function renderChrome() {
  const c = counts();
  document.getElementById("stats").innerHTML = [
    ["共", c.total + " 条", ""],
    ["好笑", c.funny, "hot"],
    ["不好笑", c.meh, "cool"],
    ["未选", c.left, ""]
  ].map(([k, v, cls]) => `<span class="stat ${cls}">${k} <b>${v}</b></span>`).join("");
  const done = c.total ? ((c.funny + c.meh) / c.total) * 100 : 0;
  document.getElementById("bar").style.width = done + "%";
  document.querySelectorAll("[data-mode]").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.mode === state.mode);
  });
  document.querySelectorAll("#cats [data-cat]").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.cat === state.cat);
  });
  document.querySelectorAll("#statuses [data-status]").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.status === state.status);
  });
}
function render() {
  renderChrome();
  const list = filtered();
  if (state.index >= list.length) state.index = Math.max(list.length - 1, 0);
  if (!list.length) {
    main.innerHTML = `<div class="empty">这个筛选下面没有笑话。换个分类，或者把状态改成「全部」。</div>`;
    return;
  }
  if (state.mode === "one") {
    const j = list[state.index];
    const markName = picks[j.id] === "funny" ? "好笑" : picks[j.id] === "meh" ? "不好笑" : "未选";
    main.innerHTML = `
      <article class="one ${picks[j.id] || ""}">
        <p class="meta">${state.index + 1} / ${list.length}　${esc(j.cat)}　${markName}</p>
        <p class="joke">${highlight(j.text, state.q)}</p>
        <div class="actions">
          <button type="button" data-act="funny" data-id="${j.id}" class="${picks[j.id] === "funny" ? "on" : ""}">好笑</button>
          <button type="button" data-act="meh" data-id="${j.id}" class="${picks[j.id] === "meh" ? "on" : ""}">不好笑</button>
        </div>
        <div class="nav">
          <button type="button" data-nav="prev">上一条</button>
          <button type="button" data-nav="next">下一条</button>
          <button type="button" data-nav="unmarked">下一条未选</button>
        </div>
        <p class="hint">再点一次已选的按钮，可以取消。选完会自动跳到下一条。</p>
      </article>`;
    return;
  }
  const pageSize = 40;
  const pages = Math.max(1, Math.ceil(list.length / pageSize));
  if (state.page >= pages) state.page = pages - 1;
  if (state.page < 0) state.page = 0;
  const slice = list.slice(state.page * pageSize, (state.page + 1) * pageSize);
  main.innerHTML = `<div class="nav" style="margin:0 0 12px">
      <button type="button" data-nav="page-prev">上一页</button>
      <button type="button" data-nav="page-next">下一页</button>
      <span class="hint" style="margin:0">列表第 ${state.page + 1} / ${pages} 页，本筛 ${list.length} 条</span>
    </div><div class="grid">${slice.map(j => {
    const stamp = picks[j.id] === "funny" ? "好笑" : picks[j.id] === "meh" ? "不好笑" : "";
    return `<article class="card ${picks[j.id] || ""}" data-id="${j.id}">
      <div class="card-top"><span class="num">${j.id.slice(1)}</span><span class="cat-tag">${esc(j.cat)}</span><span class="stamp">${stamp}</span></div>
      <p class="joke">${highlight(j.text, state.q)}</p>
      <div class="actions">
        <button type="button" data-act="funny" class="${picks[j.id] === "funny" ? "on" : ""}">好笑</button>
        <button type="button" data-act="meh" class="${picks[j.id] === "meh" ? "on" : ""}">不好笑</button>
      </div>
    </article>`;
  }).join("")}</div>`;
}

document.getElementById("cats").innerHTML = CATS.map(cat => {
  const n = cat === "全部" ? JOKES.length : JOKES.filter(j => j.cat === cat).length;
  return `<button class="chip" type="button" data-cat="${esc(cat)}">${esc(cat)} ${n}</button>`;
}).join("");
document.getElementById("statuses").innerHTML = STATUSES.map(s =>
  `<button class="chip" type="button" data-status="${s}">${s}</button>`
).join("");

document.body.addEventListener("click", e => {
  const el = e.target && e.target.nodeType === 1 ? e.target : (e.target && e.target.parentElement);
  if (!el || !el.closest) return;
  const modeBtn = el.closest("[data-mode]");
  if (modeBtn) {
    state.mode = modeBtn.dataset.mode;
    localStorage.setItem(MODE_KEY, state.mode);
    state.index = 0;
    state.page = 0;
    render();
    return;
  }
  const catBtn = el.closest("[data-cat]");
  if (catBtn) {
    state.cat = catBtn.dataset.cat;
    state.index = 0;
    state.page = 0;
    render();
    return;
  }
  const statusBtn = el.closest("[data-status]");
  if (statusBtn) {
    state.status = statusBtn.dataset.status;
    state.index = 0;
    state.page = 0;
    render();
    return;
  }
  const nav = el.closest("[data-nav]");
  if (nav) {
    const list = filtered();
    if (nav.dataset.nav === "page-prev") { state.page = Math.max(0, state.page - 1); render(); return; }
    if (nav.dataset.nav === "page-next") { state.page += 1; render(); return; }
    if (nav.dataset.nav === "prev") state.index = Math.max(0, state.index - 1);
    if (nav.dataset.nav === "next") state.index = Math.min(list.length - 1, state.index + 1);
    if (nav.dataset.nav === "unmarked") {
      const start = state.index + 1;
      let found = list.findIndex((j, i) => i >= start && !picks[j.id]);
      if (found < 0) found = list.findIndex(j => !picks[j.id]);
      if (found >= 0) state.index = found;
      else toast("这一筛里都选过了");
    }
    render();
    return;
  }
  const act = el.closest("[data-act]");
  if (act) {
    const card = el.closest("[data-id]");
    const id = (card && card.dataset.id) || act.dataset.id;
    if (id) mark(id, act.dataset.act);
  }
});

qInput.addEventListener("input", () => {
  state.q = qInput.value;
  state.index = 0;
  state.page = 0;
  render();
});
document.getElementById("export").addEventListener("click", exportFunny);
document.getElementById("copy").addEventListener("click", copyFunny);
document.getElementById("clear").addEventListener("click", () => {
  const c = counts();
  if (!c.funny && !c.meh) {
    toast("现在还没有选择");
    return;
  }
  if (!confirm("清空全部好笑和不好笑的标记？导出过的 txt 不会被删。")) return;
  picks = {};
  savePicks();
  render();
  toast("已清空选择");
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea") || state.mode !== "one") return;
  const list = filtered();
  if (!list.length) return;
  const j = list[state.index];
  if (!j) return;
  if (e.key === "ArrowRight") { e.preventDefault(); mark(j.id, "funny"); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); mark(j.id, "meh"); }
  else if (e.key === "ArrowUp") { e.preventDefault(); state.index = Math.max(0, state.index - 1); render(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); state.index = Math.min(list.length - 1, state.index + 1); render(); }
});
render();
</script>
</body>
</html>
