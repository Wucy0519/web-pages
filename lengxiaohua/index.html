<html lang="zh-CN">

<title>冷笑话大全</title>
<style>

    background: #fff7f2;
  }
  h1 {
    margin: 0;

  .bar { height: 6px; background: #efe4d4; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }

  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  footer p { margin: 6px 0; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: #f6efe4;
    padding: 10px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;

    align-items: center;
    text-decoration: none;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 8px 14px;
    color: var(--ink);
  }

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 720px) {
    header.top { position: static; }
    h1 { font-size: 28px; }
    .joke { font-size: 22px; }
    .seal { width: 58px; height: 58px; font-size: 26px; }
    .toolbar button.primary, .toolbar button.ghost { flex: 1 1 auto; }
  }
</style>
</head>

    <p>选择保存在当前浏览器的本地存储里。换一台电脑、换一个浏览器，或者清除这个页面的网站数据，标记会消失。想留下结果，用「导出好笑的 TXT」。</p>
    <p>逐条筛选时，键盘左方向是不好笑，右方向是好笑，上一条用上方向，下一条用下方向。</p>
  </footer>

<script id="data" type="application/json">[{"cat": "珍藏", "text": "小明准备创业，哪个亲戚的观点必须听？答：姑的idea。", "id": "z0001"}, {"cat": "珍藏", "text": "小恐龙看电影被妈妈打了一顿，为什么？因为恐龙妈妈发现小恐龙在看成龙电影。", "id": "z0002"}, {"cat": "珍藏", "text": "光头被车撞了会怎么样？答：毫发无损。", "id": "z0003"}, {"cat": "珍藏", "text": "一个人准备放一个很响的屁，他的屁股会说什么？答：你要是这么响，我也没办法。", "id": "z0004"}, {"cat": "珍藏", "text": "女娲补天要多少钱？答：不甜不要钱。", "id": "z0005"}, {"cat": "珍藏", "text": "你知道商鞅在临死前说了什么吗？答：这也太扯了。", "id": "z0006"}, {"cat": "珍藏", "text": "王警官说“还有气儿”，然后拿起了尸体旁的可乐。", "id": "z0007"}, {"cat": "珍藏", "text": "老头哭，是因为老头乐坏了。", "id": "z0008"}, {"cat": "珍藏", "text": "我们在哪天可以吃月饼？答：哪天都可以吃。", "id": "z0009"}, {"cat": "珍藏", "text": "李白和杜甫被称为李杜，那小李杜是谁？答：小时候的李白和杜甫。", "id": "z0010"}, {"cat": "珍藏", "text": "小鸟在打雷的时候为什么不飞？答：因为要捂耳朵。", "id": "z0011"}, {"cat": "珍藏", "text": "为什么电动车没电了会跑得更快？答：变成动车了。", "id": "z0012"}, {"cat": "珍藏", "text": "为什么大雁要往南飞？答：因为用脚走的话太慢了。", "id": "z0013"}, {"cat": "珍藏", "text": "高学历的黑人也会称为什么？答：内阁大学士。", "id": "z0014"}, {"cat": "珍藏", "text": "为什么晴天会让人心情变好？答：因为人在无雨的时候会笑。", "id": "z0015"}, {"cat": "珍藏", "text": "千里马常有，而商鞅不常有。", "id": "z0016"}, {"cat": "珍藏", "text": "历史上被诛九族的最后一顿晚餐，也叫做族光晚餐。", "id": "z0017"}, {"cat": "珍藏", "text": "为什么麻将三缺一，小明不来？答：因为小明是0。", "id": "z0018"}, {"cat": "珍藏", "text": "一根面条问另一根：你冷吗？另一根说：冷。第一根说：那我抱抱你。然后它们粘在一起，变成了面疙瘩。", "id": "z0019"}, {"cat": "珍藏", "text": "一个番茄过马路，被车撞了。临死前说：我……不是番茄。司机问：那你是谁？答：我是西红柿。", "id": "z0020"}, {"cat": "珍藏", "text": "世界上的猪都死光了，打一歌名。答：至少还有你。", "id": "z0021"}, {"cat": "珍藏", "text": "什么动物最喜欢给人送红包？答：蚊子。", "id": "z0022"}, {"cat": "珍藏", "text": "一根牙签看到刺猬走过去，会说什么？答：公交车停一下。", "id": "z0023"}, {"cat": "珍藏", "text": "我奶经常打谁？答：我奶常扇赵子龙。", "id": "z0024"}, {"cat": "珍藏", "text": "古代上厕所没事找谁？答：皇上，因为皇上有纸。", "id": "z0025"}, {"cat": "珍藏", "text": "一棵树对啄木鸟说：别啄了，我没病。啄木鸟说：没病？那走两步。", "id": "z0026"}, {"cat": "珍藏", "text": "古时有一小国，因战事频频导致国库不支。皇帝慌忙叫来朝中一个大臣，命其将自己家产充公，以做军费。大臣不愿却也不敢抗命，只怯怯问了一句：朝中大臣那么多，为何是我？皇帝走到他的面前，拍拍他的肩膀说：因为爱卿，不会轻易悲伤。", "id": "z0027"}, {"cat": "珍藏", "text": "一个人落枕会变成什么？答：一个入。", "id": "z0028"}, {"cat": "珍藏", "text": "直男为什么不能出门？答：因为会把自己遛弯。", "id": "z0029"}, {"cat": "珍藏", "text": "失败乃成功之母。你转我200，你就是成功支付。", "id": "z0030"}, {"cat": "珍藏", "text": "在下雪，为什么小明说下雨了？答：因为小明是近视，没看到彐。", "id": "z0031"}, {"cat": "珍藏", "text": "遇到打雷的时候要假死，为什么？答：因为假死特避雷。", "id": "z0032"}, {"cat": "珍藏", "text": "小明看到妈妈倒立会说什么？答：WOW。", "id": "z0033"}, {"cat": "珍藏", "text": "成都很多的1都是0装的，为什么？答：因为 cos(0) = 1。", "id": "z0034"}, {"cat": "珍藏", "text": "驴讲了个笑话，小动物们都被逗笑了，只有猫没笑，为什么？答：因为哈基咪难被驴逗。", "id": "z0035"}, {"cat": "珍藏", "text": "怎么才能让纸飞机飞得最久？答：跪着飞，因为跪飞最久。", "id": "z0036"}, {"cat": "珍藏", "text": "小明出车祸没了左半身，医生对家属说了一句话，被揍了。那句话是：all right。", "id": "z0037"}, {"cat": "珍藏", "text": "兵马俑和兵马俑调情会说什么？答：你这个小陶器。", "id": "z0038"}, {"cat": "珍藏", "text": "美国队长尿急变成啥？答：姜国队长。", "id": "z0039"}, {"cat": "珍藏", "text": "从前有一个妖精，所到之处都会被他洗劫一空。这个妖精叫啥？答：洗洁精。", "id": "z0040"}, {"cat": "珍藏", "text": "食人族抓到一个打工人，为啥又把他放了？答：因为打工人太苦了。", "id": "z0041"}, {"cat": "珍藏", "text": "真假大象怎么区分？答：把他们放进水里，因为真象会浮出水面。", "id": "z0042"}, {"cat": "经典叙事", "text": "从前有个人钓鱼，钓到一只鱿鱼。鱿鱼求他：你放了我吧，别把我烤来吃。那个人说：好，那我来考你几个问题。鱿鱼开心地说：你考吧你考吧。然后这人就把鱿鱼烤了。", "id": "j0001"}, {"cat": "经典叙事", "text": "我曾经得过精神分裂症，不过现在我们已经康复了。", "id": "j0002"}, {"cat": "经典叙事", "text": "一个留学生在美国考驾照。前方路标提示左转，他不太确定，问考官：turn left? 考官说：right. 于是他右转，挂了。", "id": "j0003"}, {"cat": "经典叙事", "text": "有一天绿豆从五楼跳下来，流了很多血，变成了红豆；一直流脓，又变成了黄豆；伤口结了疤，最后成了黑豆。", "id": "j0004"}, {"cat": "经典叙事", "text": "小明理了头发，第二天同学们笑他：你的头型好像风筝。小明觉得委屈，跑到外面哭。哭着哭着，他就飞起来了。", "id": "j0005"}, {"cat": "经典叙事", "text": "有个人长得像洋葱，走着走着就哭了。", "id": "j0006"}, {"cat": "经典叙事", "text": "小企鹅问奶奶：我是不是一只企鹅？奶奶说：当然是。它又问爸爸：我是不是一只企鹅？爸爸说：是啊，怎么了？小企鹅说：可是我怎么觉得那么冷呢？", "id": "j0007"}, {"cat": "经典叙事", "text": "有一对玉米相爱了，决定结婚。结婚那天，一个玉米找不到另一个，就问身旁的爆米花：你看到我们家玉米了吗？爆米花说：亲爱的，人家穿婚纱了嘛。", "id": "j0008"}, {"cat": "经典叙事", "text": "音乐课上，老师弹了一首贝多芬。小明问小华：你懂音乐吗？小华说懂。小明问：那你知道老师在弹什么吗？小华说：钢琴。", "id": "j0009"}, {"cat": "经典叙事", "text": "问：有两个人掉进陷阱，死的人叫死人，活人叫什么？答：叫救命。", "id": "j0010"}, {"cat": "经典叙事", "text": "问：布和纸怕什么？答：布怕一万，纸怕万一。因为不怕一万，只怕万一。", "id": "j0011"}, {"cat": "经典叙事", "text": "有个婆婆坐车，坐到中途不认识路了，用棍子戳司机的屁股问：这是哪？司机说：这是我的屁股。", "id": "j0012"}, {"cat": "经典叙事", "text": "一个鸡蛋去茶馆喝茶，变成了茶叶蛋；去松花江游泳，变成了松花蛋；跑到山东，变成了卤蛋；无家可归，变成了野鸡蛋；在路上摔了一跤，变成了导弹；跑进别人院子，变成了原子弹；跑到青藏高原，变成了氢弹；生病了，变成了坏蛋；嫁人了，变成了混蛋；跑进花丛，变成了花旦；骑着马、拿着刀，原来它是刀马旦。", "id": "j0013"}, {"cat": "经典叙事", "text": "主持人问：猫会不会爬树？老鹰抢答：会。主持人说：举例。老鹰含泪说：那年我睡熟了，猫爬上了树，后来就有了猫头鹰。", "id": "j0014"}, {"cat": "经典叙事", "text": "两只屎壳郎讨论彩票。甲说：我中了大奖，就把周围的厕所都买下来，每天吃个够。乙说：你太俗了。我要是中了，就包一个活人，每天吃新鲜的。", "id": "j0015"}, {"cat": "经典叙事", "text": "问：为什么鸡要过马路？答：为了到马路对面去。", "id": "j0016"}, {"cat": "经典叙事", "text": "甲：那个人在干什么？乙：他在发抖。甲：他为什么发抖？乙：他冷啊。甲：哦，原来发抖就不会冷了。", "id": "j0017"}, {"cat": "经典叙事", "text": "香蕉先生和女朋友约会，天气太热，香蕉先生把衣服脱掉了。然后他的女朋友就摔倒了。", "id": "j0018"}, {"cat": "经典叙事", "text": "一根香肠被关在冰箱里，觉得很冷，看见旁边还有一根，安慰它说：看你都冻成这样了，全身都是冰。那根说：对不起，我是冰棒。", "id": "j0019"}, {"cat": "经典叙事", "text": "一颗棉花糖打了很久的球，说：好累啊，我觉得整个人都软下来了。", "id": "j0020"}, {"cat": "经典叙事", "text": "解说员：这位跳水运动员的动作难度很大，他做了一个转体三周、前空翻三周半，再接后空翻一个月。", "id": "j0021"}, {"cat": "经典叙事", "text": "一位路人迷路了，问教授：请问我怎样才能到大学去？教授说：只有努力读书，才可以上大学。", "id": "j0022"}, {"cat": "经典叙事", "text": "局长和科长一起坐电梯。局长放了个屁，对科长说：你放屁了。科长说：不是我放的。不久科长被免职。局长在会上说：屁大的事你都担待不起，要你何用？", "id": "j0023"}, {"cat": "经典叙事", "text": "小姐说：现在生意不好做。老大问：为什么？小姐说：禽流感。", "id": "j0024"}, {"cat": "经典叙事", "text": "一个女学生遇到劫匪，发抖说：我刚毕业，工作都没找到，真的没有钱。劫匪听完痛哭：妹子，我也是这个学校的。你拿好学生证，前面抢劫的还是校友，我们绝不抢自己人。", "id": "j0025"}, {"cat": "经典叙事", "text": "一个盲人乞丐戴着墨镜在街上要钱。醉汉扔了一百块。走出去一回头，看见这个“盲人”正对着太阳分辨钞票真假。醉汉把钱夺回来：你敢骗我？乞丐委屈地说：大哥，我是替朋友看一会儿，他是瞎子，去上厕所了。其实我是哑巴。醉汉说：哦，是这样。把钱又扔下，摇摇晃晃走了。", "id": "j0026"}, {"cat": "经典叙事", "text": "甲：你怎么学会抽烟了？乙：我从亚当夏娃偷吃禁果的时候就会了。丙问：那他们为什么会偷吃禁果？丙自己答：因为亚当没有烟。", "id": "j0027"}, {"cat": "经典叙事", "text": "分手的时候，她给了我一个吻。那感觉，就好像人民日报一样真实。", "id": "j0028"}, {"cat": "经典叙事", "text": "师姐电脑屏幕上有一条滚动得特别快的字。我问：这是歌词吗？师姐说是。我问：怎么快得都看不清？师姐说：周杰伦的。", "id": "j0029"}, {"cat": "经典叙事", "text": "妻子说：我真是瞎了眼、踩到狗屎，才会嫁给你。丈夫说：我才是瞎了眼、踩到狗屎，才会娶你。狗屎说：我好倒霉，躺在那里被你们俩都踩到。", "id": "j0030"}, {"cat": "经典叙事", "text": "高考化学题：A 和 B 可以互相转化，B 在沸水里变成 C，C 在空气中氧化成 D，D 有臭鸡蛋的气味。问 A、B、C、D 是什么。有人答：A 是鸡，B 是生鸡蛋，C 是熟鸡蛋，D 当然是臭鸡蛋。", "id": "j0031"}, {"cat": "经典叙事", "text": "问：橡皮、老虎皮、狮子皮，哪一个最不好？答：橡皮。因为橡皮擦。", "id": "j0032"}, {"cat": "经典叙事", "text": "问：三个头、一只脚的是什么？答：三个头、一只脚的怪物。", "id": "j0033"}, {"cat": "经典叙事", "text": "蚂蚁去沙漠，沙子上没有脚印，只留下一条线。因为它是骑车去的。它回家也没通知任何人，可家里人知道它回来了，因为看见它的车停在楼下。", "id": "j0034"}, {"cat": "经典叙事", "text": "警察看见女嫌疑人手上有字，追问是不是男朋友的名字，是不是叫小良，有没有一起做什么。她抬起头说：这是恨。", "id": "j0035"}, {"cat": "经典叙事", "text": "小美和男友开车，车快没油了，帽子又被风刮跑。男友说：我去捡帽子，你帮我加油。他刚跑出去，就听见小美在后面喊：加油！加油！", "id": "j0036"}, {"cat": "经典叙事", "text": "一只猩猩经过树林，不小心踩到长臂猿的粪便，好心帮它清理，还帮它分辨。后来它们在一起了。别人问怎么认识的，猩猩说：是猿粪。", "id": "j0037"}, {"cat": "经典叙事", "text": "有一个胖子从高楼跳下去，结果变成了死胖子。", "id": "j0038"}, {"cat": "经典叙事", "text": "有一只鸭子叫小黄。过马路时被车撞了一下，大叫一声呱，从此变成了小黄瓜。", "id": "j0039"}, {"cat": "经典叙事", "text": "企鹅家离北极熊家特别远，走过去要二十年。它走到一半发现没锁门，又花十年走回去锁门，再花二十年走到。敲开门，北极熊说：还是去你家玩吧。", "id": "j0040"}, {"cat": "经典叙事", "text": "小白兔蹦蹦跳跳到面包房，问：老板，有没有一百个小面包？老板说没有。第二天又问，还是没有。第三天老板高兴地说：今天有一百个了。小白兔掏出钱：太好了，我买两个。", "id": "j0041"}, {"cat": "经典叙事", "text": "小明问：一只鲨鱼吃下了一颗绿豆，变成了什么？答案是绿豆沙。", "id": "j0042"}, {"cat": "经典叙事", "text": "老师问：怎么减少白色污染？同学说：把饭盒做成蓝色。", "id": "j0043"}, {"cat": "经典叙事", "text": "一个人肠胃不好，对医生说：我吃什么拉什么，吃西瓜拉西瓜，吃黄瓜拉黄瓜。医生想了想说：我看你只有吃屎了。", "id": "j0044"}, {"cat": "经典叙事", "text": "飞机上，空姐问小女孩：飞机飞这么高，为什么撞不到星星？小女孩说：因为星星会闪啊。", "id": "j0045"}, {"cat": "经典叙事", "text": "企鹅把身上的毛一根根拔下来，对北极熊说：好冷哦。北极熊听了，也把毛一根根拔下来，说：果然很冷。", "id": "j0046"}, {"cat": "经典叙事", "text": "问：食人族酋长吃什么？答：吃人。问：酋长病了，医生让他吃素，他吃什么？答：吃植物人。", "id": "j0047"}, {"cat": "经典叙事", "text": "冰箱里两根香肠冻了很久。一根抖了一下：哇，好冷。另一根很惊奇：咦，你是香肠，怎么会说话？", "id": "j0048"}, {"cat": "经典叙事", "text": "有一只公鹿越跑越快，跑到最后，变成了高速公鹿。", "id": "j0049"}, {"cat": "经典叙事", "text": "老师带小朋友上山采果子，说采完一起洗、一起吃。小华在洗苹果，小美在洗番茄。老师问阿明洗什么。阿明说：我在洗布鞋，因为我踩到大便了。", "id": "j0050"}, {"cat": "经典叙事", "text": "老师点小明回答问题，小明站着不说话。老师说：你到底知不知道？好歹吱一声。小明说：吱。", "id": "j0051"}, {"cat": "经典叙事", "text": "问：怎么把饮料变成大杯？答：念大悲咒。", "id": "j0052"}, {"cat": "经典叙事", "text": "小明问：今天几度啊？小华说：零下三度。小明说：难怪这么冷。", "id": "j0053"}, {"cat": "经典叙事", "text": "一只鸟每天飞过玉米地。有一天玉米地着火，玉米全变成了爆米花。小鸟飞过去，以为下雪，就冷死了。", "id": "j0054"}, {"cat": "经典叙事", "text": "北极熊觉得雪地刺眼，闭着眼睛爬来爬去找墨镜，手脚都蹭脏了。戴上墨镜照镜子，它才发现：原来我是一只熊猫。", "id": "j0055"}, {"cat": "经典叙事", "text": "自然课老师问：人死后身体为什么是冷的？一个同学说：因为心静自然凉。", "id": "j0056"}, {"cat": "经典叙事", "text": "小明在一次车祸里失去一条腿，又一次失去一条腿，再一次又失去一条腿。其实小明是一条狗。", "id": "j0057"}, {"cat": "经典叙事", "text": "A、B、C 三个人在路上闲逛。A 说：好无聊，我好想去打 B。C 看了 A 一眼，把 B 拖进巷子里打了一顿。", "id": "j0058"}, {"cat": "经典叙事", "text": "三只小兔拉便便。第一只是长条，第二只是圆球，第三只居然是三角形。它说：我用手捏的。", "id": "j0059"}, {"cat": "经典叙事", "text": "小强问爸爸：我是不是傻孩子？爸爸说：傻孩子，你怎么会是傻孩子呢？", "id": "j0061"}, {"cat": "经典叙事", "text": "隔壁的狗咬了小明，小明拿竹子要打它。狗主人说：打狗也要看主人，没听过吗？小明说：好，我会一边看着你，一边打你家的狗。", "id": "j0062"}, {"cat": "经典叙事", "text": "虫虫问小花：你用我的铅笔了吗？小花说：没有，我没用。虫虫说：你真没用？小花说：我真没用。虫虫叹了口气：你是第十七个承认自己没用的人了。", "id": "j0063"}, {"cat": "经典叙事", "text": "问：蚂蚁从喜马拉雅山上摔下来，是怎么死的？答：饿死的。因为它太轻，飘下来要很久。", "id": "j0064"}, {"cat": "经典叙事", "text": "问：为什么小狗越变越小？答：因为它越走越远。", "id": "j0065"}, {"cat": "经典叙事", "text": "从前有一只马，跑着跑着掉进海里，变成了海马。它的朋友掉进河里，变成了河马。第三只白马到了城里，被车碾出一条条黑纹，变成了斑马。第四只进了工厂，被改造成铁马。最后这些马都被做成了沙其马，世界上一匹马都不剩。看完的人说：马的，真冷。于是有人把它编成一课，叫马赛课。", "id": "j0066"}, {"cat": "经典叙事", "text": "小明欠钱，对方说：明天不还就剁两根手指，后天再剁四根，第三天再剁。小明问：是不是就不用还了？对方说：不，到时候你就变成小叮当了。", "id": "j0067"}, {"cat": "经典叙事", "text": "一个人向上帝许愿，要像猫一样有九条命。后来他躺在铁轨上想试一试，还是死了。因为那列火车有十节车厢。", "id": "j0068"}, {"cat": "经典叙事", "text": "猎人骑着马找了一天猎物。天黑了，马突然说：你都不让我休息，想累死我啊？猎人吓得滚下马，拉着猎狗就跑。跑到树下，狗拍着胸口说：吓死我了，马居然会说话。猎人当场被吓死了。", "id": "j0069"}, {"cat": "经典叙事", "text": "问：狼、老虎和狮子，谁玩游戏一定被淘汰？答：狼。因为桃太郎。", "id": "j0070"}, {"cat": "经典叙事", "text": "A 捡到一面镜子，照了照说：里面这个人好面熟。B 接过镜子：我啊，我你都不认识了？", "id": "j0071"}, {"cat": "经典叙事", "text": "番茄 A 和番茄 B 逛街。B 问了好几次去哪，A 都不说话。最后 A 转过头：我们不是番茄来的吗？为什么我们会说话呢？", "id": "j0072"}, {"cat": "经典叙事", "text": "白猫掉进水里，黑猫把它救上来。白猫说了一句话。那句话是：喵。", "id": "j0073"}, {"cat": "经典叙事", "text": "A 问：你知道我昨天晚上在网吧干什么吗？B 问：在干吗？A 说：上网呗。", "id": "j0074"}, {"cat": "经典叙事", "text": "两只苍蝇去吃饭。小的问：大哥，为什么我们每天都要吃屎？大的说：吃饭的时候不要说这么恶心的东西。", "id": "j0075"}, {"cat": "经典叙事", "text": "草船里，鲁肃担心借不到箭，又觉得船里越来越热。诸葛亮说没什么不对。鲁肃说：我担心敌人射的是火箭。诸葛亮问：子敬，你会游泳吗？我不会。", "id": "j0076"}, {"cat": "经典叙事", "text": "医院外面修了一百道墙，两个病人夜里往外翻。翻到第三十道，问累不累，说不累。翻到第六十道，还说不累。翻到第九十九道，一个人说累了。另一个说：那好，我们翻回去吧。", "id": "j0077"}, {"cat": "经典叙事", "text": "小骆驼问：我们为什么有驼峰？爸爸说：沙漠里没水，驼峰能存水。小骆驼问：为什么毛这么长？爸爸说：用来挡风沙。小骆驼问：为什么蹄子这么厚？爸爸说：沙地里才站得稳。小骆驼问：那我们在动物园里干什么呢？", "id": "j0078"}, {"cat": "经典叙事", "text": "母鸡在孵蛋，有个蛋从它身后钻出来说：你干吗？母鸡问它怎么出来了。蛋说：你放屁好臭。", "id": "j0079"}, {"cat": "经典叙事", "text": "有个人名叫杜子藤。老师点名：杜子藤呢？同学说：他肚子疼。", "id": "j0080"}, {"cat": "经典叙事", "text": "女朋友约我去她家看电影。到了以后，她用签字笔在墙上写了“电影”两个字，我们就坐在马桶上看了起来。", "id": "j0081"}, {"cat": "经典叙事", "text": "清晨，长官问晨练的小兵：你冷吗？小兵说：不冷。长官恼了：那你颤什么？小兵说：冻的。", "id": "j0082"}, {"cat": "经典叙事", "text": "一只癞蛤蟆茶不思饭不想，连蚊子都不吃了。年纪最大的癞蛤蟆说：抓只天鹅来，保管好。因为癞蛤蟆想吃天鹅肉呀。", "id": "j0083"}, {"cat": "经典叙事", "text": "五岁的儿子问我手里是什么，我说是手机。他问为什么叫手机。我随口唱：左手一只鸡，右手一只鸭。儿子更迷惑了：那为什么不叫手鸭？", "id": "j0084"}, {"cat": "经典叙事", "text": "我和朋友走到岔路口，用歌送别：我送你离开，千里之外。于是千里之外就走了。", "id": "j0085"}, {"cat": "经典叙事", "text": "家里的狗生了两只小狗。因为爱人是记者，我们叫它们狗仔队。正要亲一下，我突然大喊：狗仔队！对方吓了一跳：在哪？我明明让他们回去了。", "id": "j0086"}, {"cat": "经典叙事", "text": "一个人几次想不开都被亲友拦住。后来亲友收到短信：不必找我了，我在去往死海的路上，我喜欢大海，决定在那儿结束。", "id": "j0088"}, {"cat": "经典叙事", "text": "嫦娥正在吃饭，外面突然一闪。她跑出去看，回来吐了口气：杨利伟。", "id": "j0089"}, {"cat": "经典叙事", "text": "阿巨和菲菲都耳背。菲菲问：你去散步？阿巨说：不是啊，我去散步。菲菲说：哦，我以为你去散步呢。", "id": "j0090"}, {"cat": "经典叙事", "text": "两人约好走楼梯回家，家在五十层。到十楼，问累不累，说不累。到三十楼，还说不累。到四十九楼，终于点头说累了。另一个说：那好，我们走回去坐电梯。", "id": "j0091"}, {"cat": "经典叙事", "text": "妈妈问书看完了吗。孩子说：我看完了。第二天考砸了，妈妈问为什么看了还考这么差。孩子说：我那天说的是，我看，完了。", "id": "j0092"}, {"cat": "经典叙事", "text": "有人质疑农夫山泉有点虫。发布会上说：我们不生产水，我们只是大自然的搬运工。大自然当然有虫。大自然如果没有虫，还是大自然吗？", "id": "j0093"}, {"cat": "经典叙事", "text": "儿子睡觉前总让妈妈讲故事，听着听着就睡着。这天妈妈不在，爸爸答应来讲。儿子闭眼等了好几分钟，睁眼一看，爸爸已经在旁边睡着了。", "id": "j0094"}, {"cat": "经典叙事", "text": "朋友问：你老公年薪多少？答：八百万。朋友羡慕坏了，又问：这是基本工资吗？做什么的？答：做梦的。", "id": "j0095"}, {"cat": "经典叙事", "text": "拿着鱼竿鱼钩，在江河湖海里钓鱼，叫钓鱼玩法。不拿鱼竿鱼钩，在人海里钓鱼，叫钓鱼执法。", "id": "j0096"}, {"cat": "经典叙事", "text": "妹妹说：左眼珠要睡觉，右眼珠偏不睡，怎么办？哥哥说：把心灵的窗户全关上就行了。", "id": "j0097"}, {"cat": "经典叙事", "text": "新闻说百分之七十的男人希望有婚外恋。丈夫忙对妻子说：我一定是那百分之三十。新闻接着说：剩下百分之三十，已经有了。", "id": "j0098"}, {"cat": "经典叙事", "text": "阿巨哭啊哭，把自己哭进水里。菲菲却没事。因为菲菲会飞。", "id": "j0099"}, {"cat": "经典叙事", "text": "李妈妈忌讳“死”字。我给她倒茶，喝完问：还喝吗？她说喝。来回好几杯，她实在胀得受不了。我说：早就不该喝了。她气呼呼地说：我要活。", "id": "j0100"}, {"cat": "经典叙事", "text": "金妹和喜之两姐妹一直没找到归宿。有一天她们遇见了今麦郎和喜之郎，于是各自结婚了。", "id": "j0101"}, {"cat": "经典叙事", "text": "问：农夫山泉为什么有点甜？答：因为有点虫。", "id": "j0102"}, {"cat": "经典叙事", "text": "人家才高八斗，你是身高八斗，中山装八个兜，忐忑能唱到高八度，唱完还浑身发抖。", "id": "j0103"}, {"cat": "经典叙事", "text": "鹰抓起兔子，刚要飞，兔子说：我可什么都看见了。鹰松开爪子，把兔子放了。", "id": "j0104"}, {"cat": "经典叙事", "text": "丈夫早上说家里有鬼：昨晚去厕所，一开门灯自己亮了，还有一股寒气。妻子一巴掌打过来：你又尿冰箱里了。", "id": "j0105"}, {"cat": "经典叙事", "text": "英语考试发下试卷，一个同学举手：老师，名字写在哪？", "id": "j0106"}, {"cat": "经典叙事", "text": "小强去动物园看猴子。猴子喊：二师弟，好久不见。小强说：你认错人了。猴子说：还装，自己照照镜子。", "id": "j0107"}, {"cat": "经典叙事", "text": "老鼠嘲笑猫的时候，身旁一定有一个洞。你捅马蜂窝的时候，身上也得准备很多很多洞。", "id": "j0108"}, {"cat": "经典叙事", "text": "卖火柴的小女孩为什么有火柴还会冻死？因为她卖的是火柴，不是柴火。", "id": "j0109"}, {"cat": "经典叙事", "text": "一只蚊子在你脸上叮了一口，嘴巴拔不出来，后悔莫及。它把这件事告诉了所有蚊子，于是大家都知道你脸皮太厚了。", "id": "j0110"}, {"cat": "经典叙事", "text": "这么热的天，别人都热坏了，你却没有。因为你收到了一条冷笑话。", "id": "j0111"}, {"cat": "经典叙事", "text": "一个番茄掉进汤里，于是有了番茄汤。鸡蛋想去救它，也掉了进去，于是有了番茄蛋花汤。", "id": "j0112"}, {"cat": "经典叙事", "text": "爸爸每次都说：你路上小心。妈妈答：你放七十八颗心。爸爸说：那还二十二颗让我悬着啊。", "id": "j0113"}, {"cat": "经典叙事", "text": "网上抽奖抽到一袋大米，全家等着下锅。快递到了，一签收傻眼了：五百克。", "id": "j0114"}, {"cat": "经典叙事", "text": "问：简单点，爱是什么？两个字。有人答：不知。另一个说：爱是你我。问的人不信。他说：歌里唱的，爱是你我。", "id": "j0115"}, {"cat": "经典叙事", "text": "阿巨和菲菲玩捉迷藏。过了一会儿，菲菲问藏好了吗。阿巨说好了。菲菲就回家了。", "id": "j0116"}, {"cat": "经典叙事", "text": "有个人帽子脏了从来不洗，只是反过来继续戴。因为张冠李戴。", "id": "j0117"}, {"cat": "经典叙事", "text": "职员说这么晚去取钱害怕遇到色狼。老板说：你拿手电筒。职员问这有什么用。老板说：遇到了，你照一下自己的脸。", "id": "j0118"}, {"cat": "经典叙事", "text": "小红帽独自走在郊外，天黑前往家赶，还是遇见了大灰狼。结果呢？小红帽被大灰狼吃了。", "id": "j0119"}, {"cat": "经典叙事", "text": "一个书生手无缚鸡之力。有人问他最珍惜什么，他说是四支箭。大家不懂。他说：光阴似箭。", "id": "j0120"}, {"cat": "经典叙事", "text": "女朋友打电话：快看，外面有流星雨，你看到了吗？我一看，马上说：看到了，看到了。你呢？", "id": "j0121"}, {"cat": "经典叙事", "text": "石头渴了，找苹果打架，接了一杯苹果汁。后来饿了，找鸡蛋打架，把鸡蛋踢进河里，又喝上了鸡蛋汤。", "id": "j0122"}, {"cat": "经典叙事", "text": "我问爸爸：我是最聪明的孩子吗？爸爸说：傻瓜，你当然是最聪明的孩子。", "id": "j0123"}, {"cat": "经典叙事", "text": "妈妈敷着面膜，听见门铃，对三岁的儿子说：妈妈现在不能见人，你去开门。儿子对来人说：我妈妈正在做不能见人的事，你等一会儿。", "id": "j0124"}, {"cat": "经典叙事", "text": "玫瑰笑话月季太招摇，上不了台面。月季说：就你含蓄，把香都包起来装刺猬，上了台面也不过是带刺的。", "id": "j0125"}, {"cat": "经典叙事", "text": "儿子要去游泳，我说我不会。儿子问小明爸爸怎么会。我说他老吃鱼。儿子说：可您总吃鸡，那会下蛋不？", "id": "j0126"}, {"cat": "经典叙事", "text": "每次跟姥姥说电脑能视频，姥姥都说：自己脑子能记住模样，电脑还能真看见，是比人脑厉害。", "id": "j0127"}, {"cat": "经典叙事", "text": "为了给孩子一点英语环境，我让英语不好的老公学英文歌。一周后他自信地说学了。接着响起的是：A B C D E F G。", "id": "j0128"}, {"cat": "经典叙事", "text": "儿子看完《变形金刚》问：三个臭皮匠抵一个诸葛亮，我没见他三头六臂，是不是也会变形？", "id": "j0129"}, {"cat": "经典叙事", "text": "我看见老公和别的女人吃饭，晚上问他：女人最爱吃男人的什么？老公坏笑：豆腐。", "id": "j0130"}, {"cat": "经典叙事", "text": "一块石头找啊找，找到另一块石头。它们一起再找，又找到一块。于是小磊出现了。", "id": "j0131"}, {"cat": "经典叙事", "text": "阴间评选最可爱的鬼，吊死鬼得了冠军。因为他死了还不忘吐舌头。", "id": "j0132"}, {"cat": "经典叙事", "text": "龟兔赛跑里，乌龟先搭了一只蜗牛。超过睡觉的兔子以后，又让一只被晒晕的蚂蚁爬上壳。蜗牛说：抓好了，速度不慢，别被甩出去。", "id": "j0133"}, {"cat": "经典叙事", "text": "机动车说：我力气大，能帮人办事，所以大家喜欢我。玩具车说：那又怎样？你还不是被人骑、被人坐。我就不同了，大家都得让我坐、让我骑。", "id": "j0134"}, {"cat": "经典叙事", "text": "大家为什么爱讲冷笑话？不是因为热，也不是因为无聊。因为没有冷哭话。", "id": "j0135"}, {"cat": "经典叙事", "text": "曾以为这辈子心里只有你一个，直到昨天遇见了你那位有钱的二大爷。唉，原谅我。", "id": "j0136"}, {"cat": "经典叙事", "text": "开会时大家互相问候是哪个部门。一个说教育部门，一个说公安部门。最后一个说：我们，那个，有关部门的。全场安静了：原来真有这个部门。", "id": "j0137"}, {"cat": "经典叙事", "text": "植物大战僵尸，谁赢了？植物赢了，因为它讲了个冷笑话，僵尸冷死了。再打一次，僵尸赢了，因为它学会讲冷笑话了。", "id": "j0138"}, {"cat": "经典叙事", "text": "阿刀和阿朱在一个房间里。第二天阿朱死了。因为猪被刀杀了。", "id": "j0139"}, {"cat": "经典叙事", "text": "一根冰棒闷在冰箱里，跟同伴说要出去晒晒太阳。到了外面它喊热，开始脱衣服，脱着脱着就变成水了。", "id": "j0140"}, {"cat": "经典叙事", "text": "蚊香为什么能让蚊子不咬人？因为蚊香蚊香，蚊子闻着香，就睡着了。", "id": "j0141"}, {"cat": "经典叙事", "text": "老公看见老婆把头发染成金色，说甘蔗头变成玉米棒了。第二天老婆烫了卷发，老公说：玉米炒成爆米花了。", "id": "j0142"}, {"cat": "经典叙事", "text": "阿巨咳嗽，药都没用，上了一下止咳网就好了。", "id": "j0143"}, {"cat": "经典叙事", "text": "问：爬山看日出，看到太阳的时候多，还是看到月亮的时候多？答：看到太阳的时候多一点。因为上山容易，下山难。", "id": "j0144"}, {"cat": "经典叙事", "text": "阿巨欠弟弟的钱还不出，把家里的猪给了弟弟，然后自己变成女的了。因为还猪哥哥。", "id": "j0145"}, {"cat": "经典叙事", "text": "唐僧问悟空筋斗云有多快。悟空说：跟现在的动车差不多，坐上，嗖，到西天了。", "id": "j0146"}, {"cat": "经典叙事", "text": "天气热到买不到生鸡蛋。凉席睡一晚变成电热毯，汽车不用点火自己着了，路上跟陌生人相视一笑，熟了。麻将刚码好，桌子太烫，糊了。", "id": "j0147"}, {"cat": "经典叙事", "text": "猫和老鹰私奔，有了猫头鹰。蜘蛛和大虾私奔，有了蜘蛛侠。", "id": "j0148"}, {"cat": "经典叙事", "text": "丈夫回家晚了，编了好几个理由。妻子说：别编了，我知道你去坐动车了。丈夫说：我没坐，我没坐。妻子说：没坐动车，你怎么也出轨了？", "id": "j0149"}, {"cat": "经典叙事", "text": "老师让小明用“黄河”造句。小明说：黄河很黄。老师说不行，改一改。小明把头一扭：凭什么，我又没钱让它漂白。", "id": "j0150"}, {"cat": "经典叙事", "text": "老婆问：我是不是很漂亮？老公说：漂亮，非常漂亮，就是比凤姐差了一点点。", "id": "j0151"}, {"cat": "经典叙事", "text": "一个人很羡慕从前可以有三妻四妾。新婚夜他说出这个理想。新娘说：我改名叫三妻。咱们努力，不到一年生个女儿，起名四妾。你的愿望就实现了。", "id": "j0152"}, {"cat": "经典叙事", "text": "情人节发了五个字：情人节快乐。对方生气，说一点诚意都没有。回复是：因为我发的是短信啊。", "id": "j0153"}, {"cat": "经典叙事", "text": "自己在家做丰胸练习，最好的办法是什么？宽容一点就行。因为有容乃大。", "id": "j0154"}, {"cat": "经典叙事", "text": "怎样才能让煮熟的鸭子不飞走？给它插上一只翅膀。因为插翅难飞。", "id": "j0155"}, {"cat": "经典叙事", "text": "两个人相爱很多年，一直不能在一起。有一天地震了，他们终于在一起了。他们是天花板和地板。", "id": "j0156"}, {"cat": "经典叙事", "text": "孔子的弟子里，子贡、子路、子游，有一个不是人。是子路。因为指鹿为马。", "id": "j0157"}, {"cat": "经典叙事", "text": "两颗球喜欢粘在一起，变成了葫芦。又来了很多球一起粘，变成了糖葫芦。", "id": "j0158"}, {"cat": "经典叙事", "text": "老师说：觉得自己很蠢的请站起来。大家都不动。几分钟后我站起来。老师问为什么。我说：不是我蠢，是不忍心你一个人站着。", "id": "j0159"}, {"cat": "经典叙事", "text": "有个人姓米，别人叫他小米，他不乐意，非让人叫大米。叫着叫着，他就被老鼠吃了。", "id": "j0160"}, {"cat": "经典叙事", "text": "吃臭豆腐，一个说闻着臭、吃着香。另一个说：闻着的确臭，吃着更臭。", "id": "j0161"}, {"cat": "经典叙事", "text": "音乐课上老师吹了一曲《苏武牧羊》，问：你懂音乐吗？学生说懂。老师问：我吹的是什么？学生说：笛子。", "id": "j0162"}, {"cat": "经典叙事", "text": "逛书市看见一套《高尔基小说选》，很喜欢其中的《童年》，就问：这本是单卖的吗？售货员说：对不起，这是前苏联的。", "id": "j0163"}, {"cat": "经典叙事", "text": "人都说兔子尾巴长不了。兔子不服：再短，也没有姑娘们的裙子短。", "id": "j0164"}, {"cat": "经典叙事", "text": "一只大象忽然觉得自己不像大象，也不像二象、三象、四象，最后变成了四不像。", "id": "j0165"}, {"cat": "经典叙事", "text": "一个同学上课就睡。睡醒后看着黑板自言自语：咱数学老师真牛，语文也能教这么好。旁边的人说：现在是语文老师。数学课已经上完了。", "id": "j0166"}, {"cat": "经典叙事", "text": "英语考场上有人抄得正欢。监考老师说：you, out. 他没反应，继续抄。老师又说了一遍，还是没反应。老师说：你，出去。他委屈地说：老师，您早说中文不就好了，我听不懂英语。", "id": "j0167"}, {"cat": "经典叙事", "text": "吃完饭，小张问：你去餐厅了吗？对方说去了。小张说：我怎么没看见你？对方说：我看见你了，可能是我刚才隐身，忘了上线。", "id": "j0168"}, {"cat": "经典叙事", "text": "刚理完发，在宿舍楼下听见同学喊：喂，帅啦。正得意，二楼女生探出头：谁捡了裤头？拿出来看看是不是我丢的。", "id": "j0169"}, {"cat": "经典叙事", "text": "我正在改作业，学生说外面有个阿姨找您。我随口问：男的女的？", "id": "j0170"}, {"cat": "经典叙事", "text": "狸猫追不上老鼠，去问狐狸。狐狸说：老鼠不走直线。你是不是看见瞎猫撞死耗子，自己也跑直线了？", "id": "j0171"}, {"cat": "经典叙事", "text": "一个同学常泡网吧。微机课上他忽然大喊：网管。第二天在网吧里，他又举手叫：老师。", "id": "j0172"}, {"cat": "经典叙事", "text": "四岁的阿明看哥哥跳机械舞，拍手喊好棒。跳到慢动作时，他着急地问：大哥哥，你们卡屏了吗？我爸爸说卡屏了重启一下就好。", "id": "j0173"}, {"cat": "谐音热梗", "text": "白娘子放了个屁。许仙说：原来你还是条响尾蛇。", "id": "j0174"}, {"cat": "谐音热梗", "text": "两个 i 人谈恋爱，为什么会有一个 e 人暴富？因为 i 的平方等于负一。", "id": "j0175"}, {"cat": "谐音热梗", "text": "一个白气球把黑气球整爆了。黑气球该怎么办？告白气球。", "id": "j0176"}, {"cat": "谐音热梗", "text": "一块姜被切成四块，变成了什么？姜姜姜姜。", "id": "j0177"}, {"cat": "谐音热梗", "text": "橙子在路上碰见香菇，然后就死了。因为菌要橙死，橙不得不死。不过它也可以不死：身上抹一层果酱，酱在外，而菌令有所不受。", "id": "j0178"}, {"cat": "谐音热梗", "text": "假如生活欺骗了你，建议你吃披萨。因为披萨有六片、八片，没有欺骗。", "id": "j0179"}, {"cat": "谐音热梗", "text": "打雷的时候为什么要装死？因为假死避雷。", "id": "j0180"}, {"cat": "谐音热梗", "text": "蒜家三个儿子：大蒜、中蒜、小蒜。谁最先谈恋爱？中蒜。因为后来，我总算学会了如何去爱。", "id": "j0181"}, {"cat": "谐音热梗", "text": "苏轼很喜欢吃牛肉，还写了一篇文章纪念。篇名是《吃 beef》。", "id": "j0182"}, {"cat": "谐音热梗", "text": "你的字真好看。像不像正楷？还像 Angelababy 呢。", "id": "j0183"}, {"cat": "谐音热梗", "text": "我有一份令人惊叹的工作。什么工作？挖藕。", "id": "j0184"}, {"cat": "谐音热梗", "text": "教练说：要拐弯了，向左打死。学员问：那郭碧婷怎么办？", "id": "j0185"}, {"cat": "谐音热梗", "text": "路易十六不能用来开玩笑。因为开玩笑总要有个头。", "id": "j0186"}, {"cat": "谐音热梗", "text": "我肚子疼。对方说：是例假，横扫饥饿，做回自己。", "id": "j0187"}, {"cat": "谐音热梗", "text": "李白不太会拒绝人，不说 no，净 yes。静夜思？", "id": "j0188"}, {"cat": "谐音热梗", "text": "好人和坏人一起坐车，谁先下车？坏人。因为好人坐到底。", "id": "j0189"}, {"cat": "谐音热梗", "text": "哪里的人不需要用电？缅甸人。", "id": "j0190"}, {"cat": "谐音热梗", "text": "哪个地方的电话打不通？宁波。", "id": "j0191"}, {"cat": "谐音热梗", "text": "老虎感冒了，为什么要吃掉熊猫？因为感冒要吃白加黑。", "id": "j0192"}, {"cat": "谐音热梗", "text": "e 人做事为什么更有担当？因为 e 人做事 e 人当。", "id": "j0193"}, {"cat": "谐音热梗", "text": "猩猩最怕什么？平行线。因为平行线永不相交。", "id": "j0194"}, {"cat": "谐音热梗", "text": "平行线最受不了什么水果？香蕉。", "id": "j0195"}, {"cat": "谐音热梗", "text": "为什么鹿只有公的、没有母的？因为只有公路，没有母路。", "id": "j0196"}, {"cat": "谐音热梗", "text": "我是女的，这个饮料我不能喝。因为它难喝。", "id": "j0197"}, {"cat": "谐音热梗", "text": "有一个人叫小明。小明没听见。", "id": "j0198"}, {"cat": "谐音热梗", "text": "e 人和 i 人为什么分手没分成？因为 i 不释手。", "id": "j0199"}, {"cat": "谐音热梗", "text": "吸血鬼喜欢吃辣吗？不喜欢。他们喜欢 blood。", "id": "j0200"}, {"cat": "谐音热梗", "text": "三角形去烧烤摊点了五串腰子，等了半天没上，于是变成了等腰三角形。", "id": "j0201"}, {"cat": "谐音热梗", "text": "一个不识字的盲人，走着走着就识字了。因为他走到了十字路口。", "id": "j0202"}, {"cat": "谐音热梗", "text": "为什么不要向 i 人求助？因为 i 莫能助。", "id": "j0203"}, {"cat": "谐音热梗", "text": "美杜莎把一位将军的妻子石化了。将军怒道：敢石化贱内。美杜莎说：恨别鸟惊心。", "id": "j0204"}, {"cat": "谐音热梗", "text": "甲乙丙丁一起去坐车，为什么丁上不去？因为坐的是卡丁车。", "id": "j0205"}, {"cat": "谐音热梗", "text": "小动物们聚餐，大象为什么生气？因为聚餐的地方是气象局。", "id": "j0206"}, {"cat": "谐音热梗", "text": "给你讲个滑稽的故事：一只鸡从坡上滑了下来。然后呢？讲完了。滑鸡。", "id": "j0207"}, {"cat": "谐音热梗", "text": "下雨的时候鸭子为什么不避雨？因为 duck 不避。", "id": "j0208"}, {"cat": "谐音热梗", "text": "姓铁的为什么没有头发？因为老铁没毛病。", "id": "j0209"}, {"cat": "谐音热梗", "text": "better 和 good 都要上厕所，谁先去？better。因为 better 是比较级。", "id": "j0210"}, {"cat": "谐音热梗", "text": "富士山在哪？在负十二和负十四之间。", "id": "j0211"}, {"cat": "谐音热梗", "text": "孩子想弹贝斯，可贝斯太重。怎么办？过年的时候弹。因为每逢佳节倍思亲。", "id": "j0212"}, {"cat": "谐音热梗", "text": "水一百度会开，人一百度会怎样？会死。人一百度，起码癌症起步。", "id": "j0213"}, {"cat": "谐音热梗", "text": "行人说：我包丢了。警察说：包在我身上。行人说：给我。", "id": "j0214"}, {"cat": "谐音热梗", "text": "那年夏天我捉住一只蝉，以为捉住了整个夏天。蝉说：不爱，请别揪蝉。", "id": "j0215"}, {"cat": "谐音热梗", "text": "一只公鸡到了上学年龄，却没能入学。因为它交不出免冠照。", "id": "j0216"}, {"cat": "谐音热梗", "text": "有人念：今亡亦死，举大计亦死，死国可乎？另一个人答：死国矣。旁边的人说：别给我说日语。", "id": "j0217"}, {"cat": "谐音热梗", "text": "海底什么生物最好笑？海鳗。因为海鳗搞笑。", "id": "j0218"}, {"cat": "谐音热梗", "text": "星星有多重？十六克。因为星巴克。", "id": "j0219"}, {"cat": "谐音热梗", "text": "诗人的死因为什么都很一致？因为诗写过多。", "id": "j0220"}, {"cat": "谐音热梗", "text": "e 人为什么比较乖？因为 e 无反顾。", "id": "j0221"}, {"cat": "谐音热梗", "text": "i 人为什么身体比较好？因为免疫力强。", "id": "j0222"}, {"cat": "谐音热梗", "text": "儿子说：我以后想娶越南人。爸爸说：我把你养这么大，你竟然想取悦男人？儿子说：是娶个越南人。爸爸问：那你会越南文吗？儿子说：只要我不洗澡，就会越来越难闻。", "id": "j0223"}, {"cat": "谐音热梗", "text": "广东为什么只有夏天和冬天？因为春秋在战国。", "id": "j0224"}, {"cat": "谐音热梗", "text": "煎蛋要向荷包蛋表白，该唱什么？这是一首煎蛋的小情歌。", "id": "j0225"}, {"cat": "谐音热梗", "text": "凉了的热水为什么叫白开水？因为凉了就白开了。", "id": "j0226"}, {"cat": "谐音热梗", "text": "e 人为什么一内卷就变矮？因为 e 人做事 e 人 down。", "id": "j0227"}, {"cat": "谐音热梗", "text": "许仙给白娘子买了顶帽子，白娘子不敢戴。因为那是压蛇帽。", "id": "j0228"}, {"cat": "谐音热梗", "text": "约 e 人出来玩，为什么要给出场费？因为见 e 四千。", "id": "j0229"}, {"cat": "谐音热梗", "text": "你为什么放屁这么响？因为我穿了喇叭裤。", "id": "j0230"}, {"cat": "谐音热梗", "text": "迪迦是哪里的？东北的。因为我迪迦在东北。", "id": "j0231"}, {"cat": "谐音热梗", "text": "你看偶像练习生吗？不像。", "id": "j0232"}, {"cat": "谐音热梗", "text": "村民说：那妖精来无影去无踪，每次都把村子洗劫一空。悟空说：哦，原来是洗劫精。", "id": "j0233"}, {"cat": "谐音热梗", "text": "蚂蚁问：我们为什么这么累还要搬东西？另一只说：因为我们是蚁方。", "id": "j0234"}, {"cat": "谐音热梗", "text": "别人内卷怎么办？读书。因为读书破万卷。", "id": "j0235"}, {"cat": "谐音热梗", "text": "保尔·柯察金为什么过不了安检门？因为他有钢铁般的意志。", "id": "j0236"}, {"cat": "谐音热梗", "text": "小鹅问：为什么我要叫爸爸阿玛？鹅妈妈说：因为我是你的鹅娘。", "id": "j0237"}, {"cat": "谐音热梗", "text": "什么是规定？乌龟的屁股。", "id": "j0238"}, {"cat": "谐音热梗", "text": "皮卡丘站起来会变成什么？皮卡兵。", "id": "j0239"}, {"cat": "谐音热梗", "text": "九十度的水为什么不能喝？因为九十度是直角，会卡嗓子。", "id": "j0240"}, {"cat": "谐音热梗", "text": "三十万和十年脑血栓选哪个？选十年脑血栓。这样我就有三十年脑血栓了。", "id": "j0241"}, {"cat": "谐音热梗", "text": "一只鸟在天上朝猎人拉了一泡，猎人却放它走了。因为它投降了。", "id": "j0242"}, {"cat": "谐音热梗", "text": "动物园里最安静的动物是什么？大猩猩。因为大猩猩悄咪咪。", "id": "j0243"}, {"cat": "谐音热梗", "text": "老师问：东汉末年分三国，哪三国？学生说：烽火、连天、不休。", "id": "j0244"}, {"cat": "谐音热梗", "text": "大禹治水三过家门而不入，他的妻子在家唱歌。唱的是：那些年错过的大禹。", "id": "j0245"}, {"cat": "谐音热梗", "text": "栓 Q 的反义词是什么？放 P。", "id": "j0246"}, {"cat": "谐音热梗", "text": "什么水果最容易走丢？榴莲。因为流连忘返。", "id": "j0247"}, {"cat": "谐音热梗", "text": "一个把头发染成各种颜色的少年走了，他父亲说：今天我要白发人送红橙黄绿青蓝紫发人了。", "id": "j0248"}, {"cat": "谐音热梗", "text": "长沙发生了什么？生了短沙发。", "id": "j0249"}, {"cat": "谐音热梗", "text": "下雨了，学校为什么不能开运动会？因为种子选手发芽了。", "id": "j0250"}, {"cat": "谐音热梗", "text": "二十六个字母里，哪个最容易做错事？M。因为 I'm sorry。", "id": "j0251"}, {"cat": "谐音热梗", "text": "小明是一只蛾子，可它从来不飞。因为它怕掉粉。", "id": "j0252"}, {"cat": "谐音热梗", "text": "淄博有烧烤，云南有泼水节，深圳有什么？深圳不怕影子斜。", "id": "j0253"}, {"cat": "谐音热梗", "text": "为什么自古红颜多薄命？因为丑的没人在乎。", "id": "j0254"}, {"cat": "谐音热梗", "text": "爸爸为什么总是那么辛苦？因为爹爹不休。", "id": "j0255"}, {"cat": "谐音热梗", "text": "米线六块，过桥米线十二块。为什么贵六块？老板说：过桥费六块。", "id": "j0256"}, {"cat": "谐音热梗", "text": "冷笑话为什么要中午看？因为早晚会被冷死。", "id": "j0257"}, {"cat": "谐音热梗", "text": "世界杯的队伍里，为什么常常觉得差了点什么？因为美中不足。", "id": "j0258"}, {"cat": "谐音热梗", "text": "舅舅为什么不好当？因为舅舅八十一难。", "id": "j0259"}, {"cat": "谐音热梗", "text": "电动车没电了，为什么跑得更快？因为变成动车了。", "id": "j0260"}, {"cat": "谐音热梗", "text": "狗会汪汪，猫会喵喵，鸡会什么？机会是留给有准备的人。", "id": "j0261"}, {"cat": "谐音热梗", "text": "一山不容二虎，二山呢？二三得六。", "id": "j0262"}, {"cat": "谐音热梗", "text": "小明倒果汁，为什么被暗杀？因为他汁倒得太多了。", "id": "j0263"}, {"cat": "谐音热梗", "text": "小明走着走着脚酸了。因为他踩到柠檬了。", "id": "j0264"}, {"cat": "谐音热梗", "text": "绵羊剪了毛就睡不着。因为它失绵了。", "id": "j0265"}, {"cat": "谐音热梗", "text": "哪个数字最懒，哪个最勤快？一最懒，二最勤快。因为一不做，二不休。", "id": "j0266"}, {"cat": "谐音热梗", "text": "什么东西到了秋天会不见？蚯蚓。", "id": "j0267"}, {"cat": "谐音热梗", "text": "你知道李白吗？知道。一个星期就是一个礼拜。", "id": "j0268"}, {"cat": "谐音热梗", "text": "男人相亲要带什么？蚊香。因为蚊香识女人。", "id": "j0269"}, {"cat": "谐音热梗", "text": "孙悟空逃不出如来的手掌心，却可能逃出耶稣的手掌心。因为耶稣被钉在十字架上，手里有个洞。", "id": "j0270"}, {"cat": "谐音热梗", "text": "有一只羊停止呼吸，大家说它没氧了。", "id": "j0271"}, {"cat": "谐音热梗", "text": "鸭子走进店里，店员问要不要加辣。鸭子说：不用，我是小鸭。", "id": "j0272"}, {"cat": "谐音热梗", "text": "一只熊剪了指甲，从此变成了能。", "id": "j0273"}, {"cat": "谐音热梗", "text": "一只狼跑到北极，掉进冰海，变成了槟榔。", "id": "j0274"}, {"cat": "谐音热梗", "text": "一条鱼撞到墙上，说：好痛哦，鱼头。", "id": "j0275"}, {"cat": "谐音热梗", "text": "一只蜜蜂迷路了，一直问：蜂向在哪里？", "id": "j0276"}, {"cat": "谐音热梗", "text": "螃蟹散步回来，朋友问：今天蟹逅了谁？", "id": "j0277"}, {"cat": "谐音热梗", "text": "一只有名的马很会唱歌，大家叫它麦克风马。", "id": "j0278"}, {"cat": "谐音热梗", "text": "一只鸡爱迟到，每次都说：鸡会来的。", "id": "j0279"}, {"cat": "谐音热梗", "text": "一颗星星很会整理资料，因为它擅长星档。", "id": "j0280"}, {"cat": "谐音热梗", "text": "一朵花很爱说话，大家叫它话朵。", "id": "j0281"}, {"cat": "谐音热梗", "text": "一棵树很会算数，因为它懂得树字。", "id": "j0282"}, {"cat": "谐音热梗", "text": "一块石头很有耐心，因为它凡事都石在必行。", "id": "j0283"}, {"cat": "谐音热梗", "text": "一杯水很受欢迎，因为大家都想和水聊。", "id": "j0284"}, {"cat": "谐音热梗", "text": "一片海很会等，因为它总说海有时间。", "id": "j0285"}, {"cat": "谐音热梗", "text": "一座山很爱聊天，因为它每天都在山谈。", "id": "j0286"}, {"cat": "谐音热梗", "text": "一本书走进餐厅，说：请给我一份目录。", "id": "j0287"}, {"cat": "谐音热梗", "text": "一支笔去旅行，回来写了很多笔记。", "id": "j0288"}, {"cat": "谐音热梗", "text": "一张纸去唱歌，大家说它的声音很有纸感。", "id": "j0289"}, {"cat": "谐音热梗", "text": "一个杯子失恋了，因为对方说彼此不太杯配。", "id": "j0290"}, {"cat": "谐音热梗", "text": "一扇门很会拒绝，因为它总说门都没有。", "id": "j0291"}, {"cat": "谐音热梗", "text": "一盏灯很乐观，因为它总能看到亮点。", "id": "j0292"}, {"cat": "谐音热梗", "text": "一颗电池很累，因为它一直被要求保持正能量。", "id": "j0293"}, {"cat": "谐音热梗", "text": "一台电梯很有上进心，因为它每天都想更上一层楼。", "id": "j0294"}, {"cat": "谐音热梗", "text": "一把雨伞很低调，因为它总在雨天默默撑场。", "id": "j0295"}, {"cat": "谐音热梗", "text": "一双鞋想环游世界，因为它想走出自己的路。", "id": "j0296"}, {"cat": "谐音热梗", "text": "一顶帽子去开会，因为大家需要一个头绪。", "id": "j0297"}, {"cat": "谐音热梗", "text": "一张桌子很有立场，因为它四条腿都站得稳。", "id": "j0298"}, {"cat": "谐音热梗", "text": "一把椅子不想争，因为它只想坐享其成。", "id": "j0299"}, {"cat": "脑筋急转弯", "text": "什么东西越洗越脏？水。", "id": "j0300"}, {"cat": "脑筋急转弯", "text": "什么布剪不断？瀑布。", "id": "j0301"}, {"cat": "脑筋急转弯", "text": "什么书不必翻开看？秘书。", "id": "j0302"}, {"cat": "脑筋急转弯", "text": "什么蛋不能煎？脸蛋。", "id": "j0303"}, {"cat": "脑筋急转弯", "text": "什么瓜不能吃？傻瓜。", "id": "j0304"}, {"cat": "脑筋急转弯", "text": "什么米不能煮？厘米。", "id": "j0305"}, {"cat": "脑筋急转弯", "text": "什么河没有水？银河。", "id": "j0306"}, {"cat": "脑筋急转弯", "text": "什么山没有石头？江山。", "id": "j0307"}, {"cat": "脑筋急转弯", "text": "什么花不能浇水？烟花。", "id": "j0308"}, {"cat": "脑筋急转弯", "text": "什么车没有轮子？风车。", "id": "j0309"}, {"cat": "脑筋急转弯", "text": "什么路不能走？电路。", "id": "j0310"}, {"cat": "脑筋急转弯", "text": "什么球踢不得？眼球。", "id": "j0311"}, {"cat": "脑筋急转弯", "text": "什么帽不能戴？螺丝帽。", "id": "j0312"}, {"cat": "脑筋急转弯", "text": "什么锁没有孔？心锁。", "id": "j0313"}, {"cat": "脑筋急转弯", "text": "什么鸡没有羽毛？田鸡。还有飞机。", "id": "j0314"}, {"cat": "脑筋急转弯", "text": "什么牛不吃草？蜗牛。", "id": "j0315"}, {"cat": "脑筋急转弯", "text": "什么马不会跑？木马。", "id": "j0316"}, {"cat": "脑筋急转弯", "text": "什么狗不会叫？热狗。", "id": "j0317"}, {"cat": "脑筋急转弯", "text": "什么猫不捉老鼠？熊猫。", "id": "j0318"}, {"cat": "脑筋急转弯", "text": "什么鱼不能吃？木鱼。", "id": "j0319"}, {"cat": "脑筋急转弯", "text": "什么虎不吃人？壁虎。", "id": "j0320"}, {"cat": "脑筋急转弯", "text": "什么狼不吃羊？色狼。", "id": "j0321"}, {"cat": "脑筋急转弯", "text": "什么象没有鼻子？抽象。", "id": "j0322"}, {"cat": "脑筋急转弯", "text": "什么鸟不会飞，也不是因为受伤？鸵鸟。", "id": "j0323"}, {"cat": "脑筋急转弯", "text": "什么门永远关不上？球门。", "id": "j0324"}, {"cat": "脑筋急转弯", "text": "什么茶不能喝？检查。", "id": "j0325"}, {"cat": "脑筋急转弯", "text": "什么酒不能喝？碘酒。", "id": "j0326"}, {"cat": "脑筋急转弯", "text": "什么烟不能抽？烟花。", "id": "j0327"}, {"cat": "脑筋急转弯", "text": "什么饼不能吃？铁饼。", "id": "j0328"}, {"cat": "脑筋急转弯", "text": "什么面不能下锅？情面。", "id": "j0329"}, {"cat": "脑筋急转弯", "text": "什么网网不住鱼？互联网。", "id": "j0330"}, {"cat": "脑筋急转弯", "text": "什么针不能缝衣服？时针。", "id": "j0331"}, {"cat": "脑筋急转弯", "text": "什么线拉不断？光线。", "id": "j0332"}, {"cat": "脑筋急转弯", "text": "什么炮放不响？马后炮。", "id": "j0333"}, {"cat": "脑筋急转弯", "text": "什么船最好别上？贼船。", "id": "j0334"}, {"cat": "脑筋急转弯", "text": "什么海没有水？脑海。", "id": "j0335"}, {"cat": "脑筋急转弯", "text": "什么池没有水？电池。", "id": "j0336"}, {"cat": "脑筋急转弯", "text": "什么床不能睡？河床。", "id": "j0337"}, {"cat": "脑筋急转弯", "text": "什么包不能提？承包。", "id": "j0338"}, {"cat": "脑筋急转弯", "text": "什么带不能系？宽带。", "id": "j0339"}, {"cat": "脑筋急转弯", "text": "哪个月有二十八天？每个月都有。", "id": "j0340"}, {"cat": "脑筋急转弯", "text": "冰字怎样最快变成水？去掉两点。", "id": "j0341"}, {"cat": "脑筋急转弯", "text": "三个金是鑫，三个水是淼，三个人是众，三个鬼叫什么？叫救命。", "id": "j0342"}, {"cat": "脑筋急转弯", "text": "小明的爸爸有三个儿子，大儿子叫大毛，二儿子叫二毛，三儿子叫什么？小明。", "id": "j0343"}, {"cat": "脑筋急转弯", "text": "什么字大家都会念错？错字。", "id": "j0344"}, {"cat": "脑筋急转弯", "text": "青蛙为什么能跳得比树高？因为树不会跳。", "id": "j0345"}, {"cat": "脑筋急转弯", "text": "什么东西天气越热，爬得越高？温度计。", "id": "j0346"}, {"cat": "脑筋急转弯", "text": "哪颗牙长出来最晚？假牙。", "id": "j0347"}, {"cat": "脑筋急转弯", "text": "什么动物最适合贴在墙上？海豹。", "id": "j0348"}, {"cat": "脑筋急转弯", "text": "企鹅的肚子为什么是白的？因为手太短，洗不到背。", "id": "j0349"}, {"cat": "脑筋急转弯", "text": "把大象装进冰箱要几步？三步：打开冰箱，放进大象，关上冰箱。长颈鹿呢？先把大象拿出来。", "id": "j0350"}, {"cat": "脑筋急转弯", "text": "两个爸爸和两个儿子去打猎，只打到三只鸟，为什么每人还能分到一只？因为是爷爷、爸爸和儿子，一共三个人。", "id": "j0351"}, {"cat": "脑筋急转弯", "text": "什么东西有头没有脖子？砖头。", "id": "j0352"}, {"cat": "脑筋急转弯", "text": "什么东西有脚却不会走路？桌子。", "id": "j0353"}, {"cat": "脑筋急转弯", "text": "什么东西有嘴却不说话？茶壶。", "id": "j0354"}, {"cat": "脑筋急转弯", "text": "什么东西牙齿很多，却不咬人？梳子。", "id": "j0355"}, {"cat": "脑筋急转弯", "text": "什么东西有眼睛却看不见？针。", "id": "j0356"}, {"cat": "脑筋急转弯", "text": "什么东西有耳朵却听不见？杯子。", "id": "j0357"}, {"cat": "脑筋急转弯", "text": "什么东西整天在走，却不离开墙？时钟。", "id": "j0358"}, {"cat": "脑筋急转弯", "text": "什么东西越热越爱往外跑？汗。", "id": "j0359"}, {"cat": "脑筋急转弯", "text": "什么东西打破了，大家反而高兴？纪录。", "id": "j0360"}, {"cat": "脑筋急转弯", "text": "什么东西比细菌还小？细菌的儿子。", "id": "j0361"}, {"cat": "脑筋急转弯", "text": "什么东西比地厚？脸皮。", "id": "j0362"}, {"cat": "脑筋急转弯", "text": "一个人掉进海里，头发却没湿。因为他是秃子。", "id": "j0363"}, {"cat": "脑筋急转弯", "text": "什么人一年只上一天班？圣诞老人。", "id": "j0364"}, {"cat": "脑筋急转弯", "text": "为什么超人总穿紧身衣？因为救人要紧。", "id": "j0365"}, {"cat": "脑筋急转弯", "text": "哪一种动物最容易滑倒？狐狸。因为脚滑。", "id": "j0366"}, {"cat": "脑筋急转弯", "text": "什么水果最忙？芒果。因为它一直很忙。", "id": "j0367"}, {"cat": "脑筋急转弯", "text": "什么水果最会敲门？西瓜。因为它一来就喊：西瓜西瓜，我来啦。", "id": "j0368"}, {"cat": "脑筋急转弯", "text": "哪个月份的名字最短？二月。因为只有两个字。", "id": "j0369"}, {"cat": "脑筋急转弯", "text": "什么人最怕晒太阳？雪人。", "id": "j0370"}, {"cat": "脑筋急转弯", "text": "什么人每天站在路边，还不觉得累？红绿灯里的小绿人。", "id": "j0371"}, {"cat": "短句冷笑话", "text": "老师问：雪化了变成什么？小明说：春天。", "id": "j0372"}, {"cat": "短句冷笑话", "text": "老师让用“果然”造句。小明说：我先吃果，然后吃然。", "id": "j0373"}, {"cat": "短句冷笑话", "text": "老师问作业呢。小明说被狗吃了。老师问狗呢。小明说：它写完自己的就出去玩了。", "id": "j0374"}, {"cat": "短句冷笑话", "text": "小华在学校是第一名，可从来没拿过奖状。因为那是从后面数的第一名。", "id": "j0375"}, {"cat": "短句冷笑话", "text": "蜘蛛为什么没什么朋友？因为它整天忙着网恋。", "id": "j0376"}, {"cat": "短句冷笑话", "text": "蜜蜂为什么嗡嗡叫？因为它不会说话。", "id": "j0377"}, {"cat": "短句冷笑话", "text": "鱼为什么住在水里？因为陆地上有猫。", "id": "j0378"}, {"cat": "短句冷笑话", "text": "蜗牛为什么把房子背在身上？因为它怕出门的时候房子被偷。", "id": "j0379"}, {"cat": "短句冷笑话", "text": "早起的鸟儿有虫吃，早起的虫儿被鸟吃。", "id": "j0380"}, {"cat": "短句冷笑话", "text": "为什么程序员分不清万圣节和圣诞节？因为 Oct 31 等于 Dec 25。", "id": "j0381"}, {"cat": "短句冷笑话", "text": "一条 SQL 走进酒吧，看见两张桌子，问：我可以 JOIN 你们吗？", "id": "j0382"}, {"cat": "短句冷笑话", "text": "测试员走进酒吧，点了一杯啤酒，点了零杯啤酒，点了负一杯啤酒，又点了一只猫。酒吧着火了。", "id": "j0383"}, {"cat": "短句冷笑话", "text": "电脑为什么觉得冷？因为它开了很多窗口。", "id": "j0384"}, {"cat": "短句冷笑话", "text": "键盘为什么很安静？因为大家都让它少键多怪。", "id": "j0385"}, {"cat": "短句冷笑话", "text": "鼠标为什么很忙？因为它整天被人点来点去。", "id": "j0386"}, {"cat": "短句冷笑话", "text": "手机为什么容易累？因为每天都有很多来电。", "id": "j0387"}, {"cat": "短句冷笑话", "text": "打印机为什么心情不好？因为它一直被要求出纸。", "id": "j0388"}, {"cat": "短句冷笑话", "text": "复印机为什么很会模仿？因为看见什么就复制什么。", "id": "j0389"}, {"cat": "短句冷笑话", "text": "老板为什么爱站在窗边？因为他想看看业绩有没有起色。", "id": "j0390"}, {"cat": "短句冷笑话", "text": "员工为什么喜欢星期五？因为星期五离星期一比较远。", "id": "j0391"}, {"cat": "短句冷笑话", "text": "会议室为什么很累？因为每天都有很多人在里面讲重点。", "id": "j0392"}, {"cat": "短句冷笑话", "text": "咖啡为什么不请假？因为它每天都得提神来上班。", "id": "j0393"}, {"cat": "短句冷笑话", "text": "铅笔为什么总有想法？因为它经常冒出新的一笔。", "id": "j0394"}, {"cat": "短句冷笑话", "text": "橡皮为什么很忙？因为它一直在替别人收拾错误。", "id": "j0395"}, {"cat": "短句冷笑话", "text": "尺子为什么公平？因为每一厘米都一样长。", "id": "j0396"}, {"cat": "短句冷笑话", "text": "课本为什么难过？因为学生总想赶快翻过它。", "id": "j0397"}, {"cat": "短句冷笑话", "text": "数学老师为什么冷静？因为他做什么都先算清楚。", "id": "j0398"}, {"cat": "短句冷笑话", "text": "历史老师为什么记性好？因为他一直记得以前的事。", "id": "j0399"}, {"cat": "短句冷笑话", "text": "地理老师为什么不怕迷路？因为他随时都在看地图。", "id": "j0400"}, {"cat": "短句冷笑话", "text": "音乐老师为什么容易被找到？因为他很有声望。", "id": "j0401"}, {"cat": "短句冷笑话", "text": "美术老师为什么不着急？因为他做什么都慢慢画。", "id": "j0402"}, {"cat": "短句冷笑话", "text": "体育老师为什么走得快？因为他一直在赶进度。", "id": "j0403"}, {"cat": "短句冷笑话", "text": "冰箱为什么可靠？因为它遇到事情总能保持冷静。", "id": "j0404"}, {"cat": "短句冷笑话", "text": "冷气为什么有礼貌？因为它常问大家够不够凉。", "id": "j0405"}, {"cat": "短句冷笑话", "text": "电风扇为什么忙？因为它每天都在转换风向，也像在转换心情。", "id": "j0406"}, {"cat": "短句冷笑话", "text": "沙发为什么受欢迎？因为它很会让人坐下来谈。", "id": "j0407"}, {"cat": "短句冷笑话", "text": "床为什么最会留人？因为它每天都说：再躺一下。", "id": "j0408"}, {"cat": "短句冷笑话", "text": "闹钟为什么朋友少？因为它专挑别人睡觉的时候大叫。", "id": "j0409"}, {"cat": "短句冷笑话", "text": "雨伞为什么容易失恋？因为天一晴，大家就不理它了。", "id": "j0410"}, {"cat": "短句冷笑话", "text": "鞋子为什么感情好？因为它们总是成双成对。", "id": "j0411"}, {"cat": "短句冷笑话", "text": "袜子为什么经常只剩一只？因为另一只想独立生活。", "id": "j0412"}, {"cat": "短句冷笑话", "text": "镜子为什么诚实？因为它看见什么就照出什么。", "id": "j0413"}, {"cat": "短句冷笑话", "text": "月亮为什么晚上才上班？因为白天已经有太阳值班。", "id": "j0414"}, {"cat": "短句冷笑话", "text": "星星为什么不坐电梯？因为它们已经在很高的地方。", "id": "j0415"}, {"cat": "短句冷笑话", "text": "云为什么没有固定地址？因为它每天都在飘。", "id": "j0416"}, {"cat": "短句冷笑话", "text": "影子为什么忠心？因为有光的时候，它总跟着你。", "id": "j0417"}, {"cat": "短句冷笑话", "text": "星期日为什么过得特别快？因为星期一在后面追。", "id": "j0418"}, {"cat": "短句冷笑话", "text": "照片为什么不说话？因为它只负责把画面留下。", "id": "j0419"}, {"cat": "短句冷笑话", "text": "什么水果最老实？芭乐。因为它吧啦吧啦全说了。", "id": "j0420"}, {"cat": "短句冷笑话", "text": "什么水果最爱鼓掌？橘子。因为它常说：橘掌。", "id": "j0421"}, {"cat": "短句冷笑话", "text": "哪种饮料最会打招呼？汽水。因为一开瓶就先冒出气。", "id": "j0422"}, {"cat": "短句冷笑话", "text": "什么茶最有力气？奶茶。因为它可以拿起来。", "id": "j0423"}, {"cat": "短句冷笑话", "text": "什么咖啡最会聊天？拿铁。因为它总是从“那天”说起。", "id": "j0424"}, {"cat": "短句冷笑话", "text": "哪种面最主动？拉面。因为一见面就想把距离拉近。", "id": "j0425"}, {"cat": "短句冷笑话", "text": "什么面最想见人？见面。", "id": "j0426"}, {"cat": "短句冷笑话", "text": "哪种饼最守时？月饼。因为它每年固定时间出现。", "id": "j0427"}, {"cat": "短句冷笑话", "text": "什么饭最有耐心？稀饭。因为它愿意慢慢熬。", "id": "j0428"}, {"cat": "短句冷笑话", "text": "哪种蛋最危险？炸弹。", "id": "j0429"}, {"cat": "短句冷笑话", "text": "什么蛋最爱抱怨？笨蛋。因为它老说自己又忘了。", "id": "j0430"}, {"cat": "短句冷笑话", "text": "哪种菜最常被点名？香菜。因为大家总问：香菜来了吗？", "id": "j0431"}, {"cat": "短句冷笑话", "text": "什么鱼最会写字？墨鱼。因为它随身带墨。", "id": "j0432"}, {"cat": "短句冷笑话", "text": "哪种鱼最爱加班？金枪鱼。因为它的事情一直未完成。", "id": "j0433"}, {"cat": "短句冷笑话", "text": "什么虾最会道歉？对不起虾。因为它说的是虾歉。", "id": "j0434"}, {"cat": "短句冷笑话", "text": "哪种动物最爱贴标签？豹子。因为它很会标。", "id": "j0435"}, {"cat": "短句冷笑话", "text": "什么鸟最爱打电话？喂喂鸟。因为它一开口就是喂。", "id": "j0436"}, {"cat": "短句冷笑话", "text": "什么猫最会做生意？招财猫。因为它每天都在招手。", "id": "j0437"}, {"cat": "短句冷笑话", "text": "哪种牛最容易迟到？蜗牛。", "id": "j0438"}, {"cat": "短句冷笑话", "text": "哪种熊最能装？收纳熊。因为它什么都想装起来。", "id": "j0439"}, {"cat": "短句冷笑话", "text": "孔融为什么把梨让给别人？因为那些梨太酸，他想留给哥哥。", "id": "j0440"}, {"cat": "短句冷笑话", "text": "失败是成功之母。成功他爹，一直没出现。", "id": "j0441"}, {"cat": "短句冷笑话", "text": "我不是懒，我是进入了节能模式。", "id": "j0442"}, {"cat": "短句冷笑话", "text": "钱包和心情有个共同点：经常都是空的。", "id": "j0443"}, {"cat": "脑筋急转弯", "text": "美养了一头凶猛的狼犬，为什么它却从不咬胖子？答：他只吃瘦肉", "id": "j0444"}, {"cat": "脑筋急转弯", "text": "老张有很厉害的胃病，可他每周有五天总往牙科跑，这是为什么？答：老张是牙科医生", "id": "j0445"}, {"cat": "脑筋急转弯", "text": "日子过得不平顺时，应该怎么办？答：拿飞利浦熨平", "id": "j0446"}, {"cat": "脑筋急转弯", "text": "报纸上登的消息不一定百分之百是真的，但什么消息绝对假不了？答：报纸上的年、月、日", "id": "j0447"}, {"cat": "脑筋急转弯", "text": "一只羊碰到一头老虎，非但不怕，而且还把那头老虎给吃了，这是怎么回事？答：那是只纸考虎", "id": "j0448"}, {"cat": "脑筋急转弯", "text": "小小的一根棍，把他拿出来，放到嘴里面，越啄越红，越啄越短。是什么？答：吸烟", "id": "j0449"}, {"cat": "脑筋急转弯", "text": "买一双高级女皮鞋要214元5角6分钱，请问买一只要多少钱？答：一只不卖", "id": "j0450"}, {"cat": "脑筋急转弯", "text": "公共厕所（猜一外国首都）？答：伦敦（轮蹲）", "id": "j0451"}, {"cat": "脑筋急转弯", "text": "地震的时候什么地方最安全？答：飞机上", "id": "j0452"}, {"cat": "脑筋急转弯", "text": "三更半夜回家才发现忘记带钥匙，家里又没有其他人在，这时你最大的愿望是什么？答：门忘锁了", "id": "j0453"}, {"cat": "脑筋急转弯", "text": "有一种活动能够准确无误地告诉你：美人不是天生长出来的，而是七嘴八舌说出来的，这是什么活动？答：选美", "id": "j0454"}, {"cat": "脑筋急转弯", "text": "小李喝酒，撞伤了脸，回家怕太太知道会责备，去洗手间对着镜子贴上创口贴，可第二天还是被太太骂了一顿，为什么？答：创口贴贴在镜子上了", "id": "j0455"}, {"cat": "脑筋急转弯", "text": "美人鱼最怕遇到谁？答：加菲猫", "id": "j0456"}, {"cat": "脑筋急转弯", "text": "战场上，子弹最密集的地方在哪里？答：在弹药运输车上", "id": "j0457"}, {"cat": "脑筋急转弯", "text": "日月潭的中间是什么？答：是月字", "id": "j0458"}, {"cat": "脑筋急转弯", "text": "娇娇的爸爸在一次难度很大的考试中非常从容，为什么？答：他是监考老师", "id": "j0459"}, {"cat": "脑筋急转弯", "text": "某人向枪靶射击了五发子弹，共得一百分，他射中了哪里？答：只中一发正好一百", "id": "j0460"}, {"cat": "脑筋急转弯", "text": "如果你在尼斯湖划船时，水怪突然在附近冒了出来，而你却忘了带相机，这时该怎么办？答：别担心别的游客会拍下你最后的镜头", "id": "j0461"}, {"cat": "脑筋急转弯", "text": "每个怀孕的女人都常常会去想象孩子未来的长相，为什么只有阿美例外？答：她到现在还没有想起来他爸爸长得什么样", "id": "j0462"}, {"cat": "脑筋急转弯", "text": "肥太太体重惊人，她丈夫要她减肥，可是有一天，她去称体重，指针指向了零，可他丈夫还是要她减肥，为什么？答：指针都转了一圈后再指向零，当然要减了", "id": "j0463"}, {"cat": "脑筋急转弯", "text": "小明每天写信给他的女朋友，共寄了七封，但他的女朋友珍妮，每天却只收到一封信，为什么？答：有七个女朋友", "id": "j0464"}, {"cat": "脑筋急转弯", "text": "一种饮料，由恶意和谎言加上微量事实配制而成的，能有效地削弱领导的洞察力，是什么？答：小报告", "id": "j0465"}, {"cat": "脑筋急转弯", "text": "阿火在营光日的考试全部答对，为什么却没得到满分？答：因为考的是是非题", "id": "j0466"}, {"cat": "脑筋急转弯", "text": "老张是一位出色的小说家，为什么有一次他连续写了一个月，连一篇小说的题目都没写出来？答：写的是散文", "id": "j0467"}, {"cat": "脑筋急转弯", "text": "某歌星每次上台演出，总是戴着一只手套， 这为什么？答：他总想露一手", "id": "j0468"}, {"cat": "脑筋急转弯", "text": "超市里面最值钱的东西是什么？答：收银机", "id": "j0469"}, {"cat": "脑筋急转弯", "text": "盲人都是怎么吃桔子的？答：瞎掰", "id": "j0470"}, {"cat": "脑筋急转弯", "text": "为什么结婚的人都要先拍结婚照？答：一拍卖即合", "id": "j0471"}, {"cat": "脑筋急转弯", "text": "海水为什么是咸的？答：鱼流的泪太多了", "id": "j0472"}, {"cat": "脑筋急转弯", "text": "狗的儿子跟龙的儿子，有几点差异？答：一点（犬子太子）", "id": "j0473"}, {"cat": "脑筋急转弯", "text": "蛋要怎么买，才不会买到里面已经孵出了小鸡的蛋？答：买鸭蛋", "id": "j0474"}, {"cat": "脑筋急转弯", "text": "阿弟竟成功的用面线上吊自杀成功，为什么？答：摔死的", "id": "j0475"}, {"cat": "脑筋急转弯", "text": "青蛙为什么能跳得比树高？答：树不会跳", "id": "j0476"}, {"cat": "脑筋急转弯", "text": "爸爸丢了一样东西，为什么妈妈还特别高兴？答：他丢掉了坏习惯", "id": "j0477"}, {"cat": "脑筋急转弯", "text": "哪一个字永远写不好？答：“坏”字", "id": "j0478"}, {"cat": "脑筋急转弯", "text": "跳伞时，怎样才能分的出老兵和新兵？答：新兵的屁股上有鞋印", "id": "j0479"}, {"cat": "脑筋急转弯", "text": "胖姐阿英站上人体秤时，为何指针却只指着5？答：指针已转过一圈了", "id": "j0480"}, {"cat": "脑筋急转弯", "text": "老李带婴儿去喝酒，居然还让婴儿喝了三大杯啤酒，旁边的人为什么都不劝阻或责骂？答：婴儿是那个人的外号", "id": "j0481"}, {"cat": "脑筋急转弯", "text": "进浴室洗澡时，要先脱衣服还是裤子？答：先关门比较好", "id": "j0482"}, {"cat": "脑筋急转弯", "text": "哪家人最多？答：国家", "id": "j0483"}, {"cat": "脑筋急转弯", "text": "爸爸要小明背论语，他一分钟就背了整本书，难道小明是天才吗？答：不因为他只背了论语", "id": "j0484"}, {"cat": "脑筋急转弯", "text": "兔子比什么可以绝对赢乌龟？答：仰卧起做", "id": "j0485"}, {"cat": "脑筋急转弯", "text": "黑人吃黑的东西叫什么？答：黑吃黑", "id": "j0486"}, {"cat": "脑筋急转弯", "text": "小明的小猫从来不捉老鼠，这是为什么？答：因为这是玩具猫", "id": "j0487"}, {"cat": "脑筋急转弯", "text": "为什么警察要系白皮带？答：不系皮带裤子会掉下来", "id": "j0488"}, {"cat": "脑筋急转弯", "text": "小庄终于考上台大，有天晚上在校园里，他竟然看到了一个死去多年的高中同学，为什么？答：那是解剖台上的尸体", "id": "j0489"}, {"cat": "脑筋急转弯", "text": "兵强马壮的城市是哪里？答：武昌", "id": "j0490"}, {"cat": "脑筋急转弯", "text": "你看不到房间里唯一的苹果。为什么？答：苹果放在头上", "id": "j0491"}, {"cat": "脑筋急转弯", "text": "嫦娥为什么喜欢住在月球上？答：嫦蛾爱吃兔肉", "id": "j0492"}, {"cat": "脑筋急转弯", "text": "比眼大的东西是什么？答：眼皮", "id": "j0493"}, {"cat": "脑筋急转弯", "text": "一个人在什么情况下，才处于真正的任人宰割的地步？答：手术台上", "id": "j0494"}, {"cat": "脑筋急转弯", "text": "怎样才能使人有心跳的感觉？答：活着", "id": "j0495"}, {"cat": "脑筋急转弯", "text": "为什么说当作曲家不需要多大的智慧？答：因为他只需要认识7个字就行了", "id": "j0496"}, {"cat": "脑筋急转弯", "text": "导演招收演员，考题是《黑夜归来》。该怎样做才能很容易被录取呢？答：很简单做个拉灯的动作", "id": "j0497"}, {"cat": "脑筋急转弯", "text": "戒烟为什么要戒两次呢？答：戒了右手还是戒左手", "id": "j0498"}, {"cat": "脑筋急转弯", "text": "给一们耳聋的残疾人安装一部铃一响就发光的电话机，但这电话机仍然对他毫无用外，为什么？答：耳聋能听到电话吗？", "id": "j0499"}, {"cat": "脑筋急转弯", "text": "伍子胥过昭关，为何在一夜之间头发全变白了？答：他忘了带染发剂", "id": "j0500"}, {"cat": "脑筋急转弯", "text": "5比0大，0比2大，而2又比5大。你知道是怎么回事吗？答：这是在玩“剪刀、石头、布”的游戏，握成拳头是0，剪刀状是二，摊开手就是5了", "id": "j0501"}, {"cat": "脑筋急转弯", "text": "三个人一起下田，但其中一个人却老站在那里不动手，为什么？答：那是个稻草人", "id": "j0502"}, {"cat": "脑筋急转弯", "text": "浪费掉人的一生的三分之一时间的会是什么东西？答：床", "id": "j0503"}, {"cat": "脑筋急转弯", "text": "你怎么区分东南西北？答：很简单，加顿号", "id": "j0504"}, {"cat": "脑筋急转弯", "text": "教堂向祖父办告解之前，都要先做那件事？答：犯罪", "id": "j0505"}, {"cat": "脑筋急转弯", "text": "皮黑肉儿白，肚里墨样黑， 从不偷东西，硬说它是贼。答：乌贼", "id": "j0506"}, {"cat": "脑筋急转弯", "text": "如何分辨狗肉店和猪肉店的不同？答：狗肉店门前会挂羊肉", "id": "j0507"}, {"cat": "脑筋急转弯", "text": "医生问病人：“感冒吗？”病人摇摇头。“肚子疼？”病人摇头“神经病？”病人摇头。究竟他是来看什么病的？答：是来看不停摇头的毛病", "id": "j0508"}, {"cat": "脑筋急转弯", "text": "别人家中作客，讲什么话容易惹人厌？答：长途电话", "id": "j0509"}, {"cat": "脑筋急转弯", "text": "在罗马数字中，零该怎么写？答：罗马数字没有零", "id": "j0510"}, {"cat": "脑筋急转弯", "text": "时钟什么时候不会走？答：时钟本来就不会走", "id": "j0511"}, {"cat": "脑筋急转弯", "text": "除了动物园和非洲可以看到长颈鹿外，还有哪些地方看得到？答：考场", "id": "j0512"}, {"cat": "脑筋急转弯", "text": "两对父子去买帽子，为什么只买了三顶？答：三代人", "id": "j0513"}, {"cat": "脑筋急转弯", "text": "为什么婴儿一出生就大哭？答：因为他看到护士阿姨太漂亮。自己又太小……", "id": "j0514"}, {"cat": "脑筋急转弯", "text": "为什么青蛙可以跳得比树高？（？答：树不会跳）", "id": "j0515"}, {"cat": "脑筋急转弯", "text": "拿鸡蛋撞石头鸡蛋为何不烂？（？答：拿着鸡蛋撞石头当然不会烂）", "id": "j0516"}, {"cat": "脑筋急转弯", "text": "小明去参加讲笑话比赛，一路上小明一直用冰块敷嘴巴，为什么？答：怕笑话到时候不新鲜", "id": "j0517"}, {"cat": "脑筋急转弯", "text": "小红与妈妈都在同一个班里上课，这是为什么？答：妈妈是小红的班主任", "id": "j0518"}, {"cat": "脑筋急转弯", "text": "有一个人在大雨倾盆的旷野中奔跑了十分钟，头发和衣服都没有湿，为什么？答：那是一个裸体的秃头男人", "id": "j0519"}, {"cat": "脑筋急转弯", "text": "美丽的公主结婚以后就不挂蚊帐了，为什么？答：她嫁给了青蛙王子", "id": "j0520"}, {"cat": "脑筋急转弯", "text": "公共汽车上，两个人正在热烈的交谈，可围观的人却一句话也听不到，这是因为什么？答：这是一对聋哑人", "id": "j0521"}, {"cat": "脑筋急转弯", "text": "小白加小白等于什么？答：小白兔（TWO）", "id": "j0522"}, {"cat": "脑筋急转弯", "text": "人身上的什么东西不怕冷？答：鼻涕", "id": "j0523"}, {"cat": "脑筋急转弯", "text": "一架空调器从楼掉下来会变成啥器？（？答：凶器）", "id": "j0524"}, {"cat": "脑筋急转弯", "text": "小明正在吹电扇，为什么还是满头大汗？答：他在吹电扇，电扇没吹他", "id": "j0525"}, {"cat": "脑筋急转弯", "text": "小明带100元去买一件75元的衬衫，但老板却只找了5块钱给他，为什么？答：小明就只给了老板80元钱", "id": "j0526"}, {"cat": "脑筋急转弯", "text": "一个人上了手术台是什么心情？答：任人宰割", "id": "j0527"}, {"cat": "脑筋急转弯", "text": "当今社会，个体户大都靠什么吃饭？答：嘴巴", "id": "j0528"}, {"cat": "脑筋急转弯", "text": "请仔细想一想，你所见到的最大影子是什么？答：地球的影子，即每天的晚上", "id": "j0529"}, {"cat": "脑筋急转弯", "text": "闭着眼睛也看得见的是什么？答：梦", "id": "j0530"}, {"cat": "脑筋急转弯", "text": "有半瓶酒，瓶口用软木塞塞住，在不敲碎瓶子，不准拔去木塞，不准在塞子上钻孔的情况下，怎样喝到瓶子里的酒？答：把塞子推到瓶子里去", "id": "j0531"}, {"cat": "脑筋急转弯", "text": "什么床不能睡？答：牙床", "id": "j0532"}, {"cat": "脑筋急转弯", "text": "一个人想在一夜里变成百万富翁，他该怎么办？答：做梦吧！", "id": "j0533"}, {"cat": "脑筋急转弯", "text": "富商陈氏书房之中，虽然墙上有三个弹孔，但他的身上却没有外伤，你猜是怎么死的？答：嘲笑枪法太差笑死了", "id": "j0534"}, {"cat": "脑筋急转弯", "text": "左眼跳财，右眼跳灾，如果左右眼皮一起跳呢？答：破财消灾", "id": "j0535"}, {"cat": "脑筋急转弯", "text": "电和闪电有什么不同？答：一个花钱，一个不花钱", "id": "j0536"}, {"cat": "脑筋急转弯", "text": "明明是个近视眼，也是个出名的馋小子，在他面前放一堆书，书后放一个苹果，你说他会先看什么？（？答：什么都看不见）", "id": "j0537"}, {"cat": "脑筋急转弯", "text": "阿强和阿燕裸体死在一间密室中、现场只留下一滩水和一些碎玻璃，请推测他们的死因？答：阿强和阿燕是金鱼", "id": "j0538"}, {"cat": "脑筋急转弯", "text": "黑人和白人生下的婴儿，牙齿是什么颜色？答：婴儿没有牙", "id": "j0539"}, {"cat": "脑筋急转弯", "text": "天上有十个太阳，为什么后翼只射下九个？答：他不想摸黑回家", "id": "j0540"}, {"cat": "脑筋急转弯", "text": "你能否用三跟筷子搭起一个比三大比四小的数？答：搭成圆周率“∏”", "id": "j0541"}, {"cat": "脑筋急转弯", "text": "作家的最好写作方式是什么？答：从左向右写", "id": "j0542"}, {"cat": "脑筋急转弯", "text": "服装仪容检查时，明明有理头发，为什么教官不信？答：秀才遇到兵，“有理”说不清", "id": "j0543"}, {"cat": "脑筋急转弯", "text": "什么东西有五个头，但人不觉的它怪呢？答：手，脚", "id": "j0544"}, {"cat": "脑筋急转弯", "text": "有一只羊，一年吃了草地上一半的草，问它把草全部吃光，需要多少年？答：永远吃不完，因为草每年都在长！", "id": "j0545"}, {"cat": "脑筋急转弯", "text": "小李昨天在客户面前骂总经理是笨蛋，结果小李被开除了，为什么？答：因为小李泄露了公司的最高机密", "id": "j0546"}, {"cat": "脑筋急转弯", "text": "贝多芬给了我们什么样的启示？答：背了就会多分", "id": "j0547"}, {"cat": "脑筋急转弯", "text": "有种船从来没下过水，为什么还是船？答：宇航飞船", "id": "j0548"}, {"cat": "脑筋急转弯", "text": "我有九个苹果，却必须分给十三个小朋友，我该怎么办？答：榨成果汁", "id": "j0549"}, {"cat": "脑筋急转弯", "text": "黑人为什么喜欢吃白色巧克力？答：怕把自己的手咬到", "id": "j0550"}, {"cat": "脑筋急转弯", "text": "老詹养了一只狗，并且从来不帮狗洗澡，为什么狗不会生跳蚤呢？答：因为狗只会生小狗", "id": "j0551"}, {"cat": "脑筋急转弯", "text": "什么东西可以尽情吃，不用花钱买？答：空气", "id": "j0552"}, {"cat": "脑筋急转弯", "text": "老王很有钱，可别人说他是个奴隶，为什么？答：老王是个守财驭", "id": "j0553"}, {"cat": "脑筋急转弯", "text": "小明新买的袜子就有一个洞，他却不去找售货员换，你知道为什么吗？答：袜口", "id": "j0554"}, {"cat": "脑筋急转弯", "text": "为什么飞机飞再高都不会撞到星星呢？答：星星会闪", "id": "j0555"}, {"cat": "脑筋急转弯", "text": "小明有很厉害的胃病，可他每天总往牙科跑，这是为什么？答：小明是牙科医生", "id": "j0556"}, {"cat": "脑筋急转弯", "text": "从来没见过的爷爷他是什么爷爷？答：老天爷", "id": "j0557"}, {"cat": "脑筋急转弯", "text": "有一个人一年才上一天班又不怕被解雇他是谁？（？答：圣诞老人）", "id": "j0558"}, {"cat": "脑筋急转弯", "text": "何种动物最接近于人类？答：寄生在人身体上的寄生虫", "id": "j0559"}, {"cat": "脑筋急转弯", "text": "什么是附中？答：胎死腹中（附中）", "id": "j0560"}, {"cat": "脑筋急转弯", "text": "偷什么东西不犯法？答：偷笑", "id": "j0561"}, {"cat": "脑筋急转弯", "text": "不管长得多像的双胞胎，都会有人分得出来，这人是谁？答：他们自己", "id": "j0562"}, {"cat": "脑筋急转弯", "text": "小张的肚子明明已经胀得受不了了，为什么他还要不停地猛喝水？答：他掉到河里去了", "id": "j0563"}, {"cat": "脑筋急转弯", "text": "什么帽不能戴？答：螺帽", "id": "j0564"}, {"cat": "脑筋急转弯", "text": "一只蚂蚁从几百万米高的山峰落下来会怎么死？答：饿死", "id": "j0565"}, {"cat": "脑筋急转弯", "text": "老明有三个儿子大儿子叫大哥二儿子叫二哥，请问小儿子叫什么？答：小明", "id": "j0566"}, {"cat": "脑筋急转弯", "text": "明总是喜欢把家里的闹钟整坏，妈妈为什么总是让不会修理钟表的爸爸代为修理？答：修理小明", "id": "j0567"}, {"cat": "脑筋急转弯", "text": "哭和笑有什么共同之处？答：都是10笔画", "id": "j0568"}, {"cat": "脑筋急转弯", "text": "小花站起来同饭桌一样高，两年之后，反而能在桌子下活动自如，为什么？答：小花是一条狗", "id": "j0569"}, {"cat": "脑筋急转弯", "text": "小华说他能在1秒钟之内把房间和房间里的玩具都变没了，这可能吗？答：把眼睛闭上", "id": "j0570"}, {"cat": "脑筋急转弯", "text": "八岁的小萱萱在百货公司和妈妈走散了，你猜他到服务台说了些什么话，竟引起大家哈哈大笑？答：我妈妈迷路了赶快帮我找回来", "id": "j0571"}, {"cat": "脑筋急转弯", "text": "酱油和醋打架，旁观者会帮谁？答：会帮醋，因为他们都是来打酱油的", "id": "j0572"}, {"cat": "脑筋急转弯", "text": "什么车最长？答：塞车", "id": "j0573"}, {"cat": "脑筋急转弯", "text": "沙沙声称自己是辨别母鸡年龄的专家，其绝招是用牙齿，为什么？答：把鸡亲口吃了来辨别母鸡的老嫩", "id": "j0574"}, {"cat": "脑筋急转弯", "text": "在一次考试中，两个学生交了一模一样的考卷，但老师认为他们肯定没有作弊，这是为什么？答：他们交的是白卷", "id": "j0575"}, {"cat": "脑筋急转弯", "text": "牙医靠什么吃饭？（？答：嘴巴）", "id": "j0576"}, {"cat": "脑筋急转弯", "text": "一个小姑娘再打排球，她发了一个球，可无论谁都接不着，为什么？答：球没发出去或出界了", "id": "j0577"}, {"cat": "脑筋急转弯", "text": "一场大雨，忙着耕种的农人纷纷走避，却仍有一人不走，为什么？答：它是稻草人", "id": "j0578"}, {"cat": "脑筋急转弯", "text": "一个盒子有几个边？答：两个，里边和外边", "id": "j0579"}, {"cat": "脑筋急转弯", "text": "善有善报，恶有恶报是什么意思？答：什么报纸都没有", "id": "j0580"}, {"cat": "脑筋急转弯", "text": "有一段100米长的铁轨上面每隔1公分放一条横木，请问共有几条横木？答：0，因为钢轨上不放横木", "id": "j0581"}, {"cat": "脑筋急转弯", "text": "牛顿因掉落苹果发现引力；如你在椰树下等被椰子打中会发现什么？答：会发现这种行为很愚蠢", "id": "j0582"}, {"cat": "脑筋急转弯", "text": "如果说儿童是国家未来的栋梁，那么儿童肚子里的蛔虫是什么？答：当然栋梁的蛀虫了", "id": "j0583"}, {"cat": "脑筋急转弯", "text": "什么情况下3+1=5？答：算错的时候", "id": "j0584"}, {"cat": "脑筋急转弯", "text": "小王走路从来脚不沾地，这是为什么？答：因为穿着鞋子", "id": "j0585"}, {"cat": "脑筋急转弯", "text": "什么东西肥得快，瘦得更快？答：气球", "id": "j0586"}, {"cat": "脑筋急转弯", "text": "世界上什么蛋不能吃，煮不熟，却打得破？答：考试得的零蛋", "id": "j0587"}, {"cat": "脑筋急转弯", "text": "为什幺女人穿高跟鞋后，就代表她想要结婚了？答：因为穿上高跟鞋，别人追就跑得慢啊", "id": "j0588"}, {"cat": "脑筋急转弯", "text": "王大头一直喊着：快点，我上课要迟到了。可是他为什么没行动？答：他在做梦", "id": "j0589"}, {"cat": "脑筋急转弯", "text": "什么东西放在火中不会燃，放在水中不会沉？答：冰块", "id": "j0590"}, {"cat": "脑筋急转弯", "text": "什么鬼大家都喜欢？答：机灵鬼", "id": "j0591"}, {"cat": "脑筋急转弯", "text": "什么样的食物最让人倒胃口？答：吃了大半个苹果里边藏着半条虫子", "id": "j0592"}, {"cat": "脑筋急转弯", "text": "在一个夜黑风高的夜晚，小明遇见一个鬼，那个鬼落荒而逃，为什么？答：胆小鬼", "id": "j0593"}, {"cat": "脑筋急转弯", "text": "爱吃零食的小王体重最重时有50公斤，但最轻时只有3公斤，为什么？答：他刚出生的体重", "id": "j0594"}, {"cat": "脑筋急转弯", "text": "什么样的轮子只转不走？（？答：风车的轮子）", "id": "j0595"}, {"cat": "脑筋急转弯", "text": "一名警察见了小偷拔腿就跑，为什么？答：想快点抓住小偷", "id": "j0596"}, {"cat": "脑筋急转弯", "text": "什么时候最好还是要高高举起你的双手好些？答：当有人用枪指着你的头的时候", "id": "j0597"}, {"cat": "脑筋急转弯", "text": "毛毛从20楼跳下去，为什么没有事？答：往里跳", "id": "j0598"}, {"cat": "脑筋急转弯", "text": "一辆火车由基隆到高雄全程需要6个小时才可到达，如今行使了3个小时，火车现在应该在什么地方？答：在铁轨上", "id": "j0599"}, {"cat": "脑筋急转弯", "text": "两个小朋友都买了一样的鞋，为什么他们穿的鞋还是不一样？答：买的新鞋还没穿", "id": "j0600"}, {"cat": "脑筋急转弯", "text": "什么东西嘴里没有舌头？答：茶壶嘴", "id": "j0601"}, {"cat": "脑筋急转弯", "text": "什么贵重的东西最容易不翼而飞？（？答：人造卫星）", "id": "j0602"}, {"cat": "脑筋急转弯", "text": "为什么大家都喜欢坐着看电影？答：因为站着看脚会酸", "id": "j0603"}, {"cat": "脑筋急转弯", "text": "什么鱼最聪明？答：鲸（精）鱼", "id": "j0604"}, {"cat": "脑筋急转弯", "text": "台北车站前面是忠孝西路，请问左右两边是什么路？答：柏油路马路", "id": "j0605"}, {"cat": "脑筋急转弯", "text": "火车由北京到上海需要６小时，行使３小时后，火车该在什么地方？答：在车轨上", "id": "j0606"}, {"cat": "脑筋急转弯", "text": "两瓶花中，一瓶是鲜花，一瓶是纸花，请说出哪一瓶是鲜花？答：有蝴蝶在上面飞的花是鲜花", "id": "j0607"}, {"cat": "脑筋急转弯", "text": "人小脾气可不小，尾巴动动脑袋翘，牙齿咬得吱吱响，火星点点头上冒。 （打一物）？答：打火机", "id": "j0608"}, {"cat": "脑筋急转弯", "text": "放大镜不能放大的东西是什么？答：角度", "id": "j0609"}, {"cat": "脑筋急转弯", "text": "山姆是一个守法公民，可是他开车总是闯红灯，原因何在？答：他是色盲", "id": "j0610"}, {"cat": "脑筋急转弯", "text": "麦克杰克逊为什么要去做漂白手术？答：怕遭到不白之冤", "id": "j0611"}, {"cat": "脑筋急转弯", "text": "什么地方开口说话要付钱？答：打电话", "id": "j0612"}, {"cat": "脑筋急转弯", "text": "伊凡吹嘘自己写的小说可以得诺贝尔奖，他写的什么小说？答：幻想小说", "id": "j0613"}, {"cat": "脑筋急转弯", "text": "早晨醒来，每个人都会去做的第一件事是什么？（？答：睁眼）", "id": "j0614"}, {"cat": "脑筋急转弯", "text": "两个人住在一个胡同里，只隔几步路，他们同在一个工厂上班，但每天出门上班，却总一个向左，一个向右，为什么？（？答：他们住对门）", "id": "j0615"}, {"cat": "脑筋急转弯", "text": "冰变成水最快的方法是什么？（？答：去掉冰字哪二点）", "id": "j0616"}, {"cat": "脑筋急转弯", "text": "“水蛇”“蟒蛇”“青竹蛇”哪一个比较长？答：“青竹蛇”最长，因为它有三个字", "id": "j0617"}, {"cat": "脑筋急转弯", "text": "什么动物天天熬夜？答：熊猫，你没它眼圈总是黑的！", "id": "j0618"}, {"cat": "脑筋急转弯", "text": "上次汤姆过生日是七岁，下次他过生日是九岁，这是怎么回事？答：今天他是过八岁生日", "id": "j0619"}, {"cat": "脑筋急转弯", "text": "什么门永远关不上？（？答：足球门）", "id": "j0620"}, {"cat": "脑筋急转弯", "text": "喜剧和悲剧有什么联系？答：喜剧没有人看就成了悲剧", "id": "j0621"}, {"cat": "脑筋急转弯", "text": "有种船从来没下过水，为什么还是船？答：宇宙飞船", "id": "j0622"}, {"cat": "脑筋急转弯", "text": "考试时应注意什么？答：监考老师", "id": "j0623"}, {"cat": "脑筋急转弯", "text": "大明的英语非常好，可是有些老外却听不懂，为什么？答：老外不懂英语", "id": "j0624"}, {"cat": "脑筋急转弯", "text": "打什么东西，不必花力气？答：打瞌睡", "id": "j0625"}, {"cat": "脑筋急转弯", "text": "蝎子和螃蟹玩猜拳，为什么它们玩了两天，还是分不出胜负呢？答：两个都出剪刀", "id": "j0626"}, {"cat": "脑筋急转弯", "text": "一个人，一只船，一只狗，一只兔子，一棵白菜，着个人要把着三样东西，运到河那边，先送那两个？答：先送狗和白菜", "id": "j0627"}, {"cat": "脑筋急转弯", "text": "你能做我能做大家都能做，一个人能做两个人不能一起做。这是做什么？（？答：做梦）", "id": "j0628"}, {"cat": "脑筋急转弯", "text": "长得像竹不是竹，周身有节不太粗，不是紫来就是绿，只吃生来不能熟。答：甘蔗", "id": "j0629"}, {"cat": "脑筋急转弯", "text": "考试做判断题，小花掷骰子决定答案，但题目有20题，为什么他却扔了40次？答：他要验证一遍", "id": "j0630"}, {"cat": "脑筋急转弯", "text": "阿明给蚊子咬了一大一小的包，请问较大的包，是公蚊子咬的，还是母蚊子咬的？（？答：公蚊是不咬人的）", "id": "j0631"}, {"cat": "脑筋急转弯", "text": "什么时候做的事别人看不到？答：梦里做事", "id": "j0632"}, {"cat": "脑筋急转弯", "text": "一个人被老虎穷追不舍，突然前面有一条大河，他不会游泳，但他却过去了，为什么？答：昏过去了", "id": "j0633"}, {"cat": "脑筋急转弯", "text": "小张被关在一间并没有上锁的房间里，可是他使出吃奶的力气也不能把门拉开，这是怎么回事？答：推开门就行", "id": "j0634"}, {"cat": "脑筋急转弯", "text": "什么样的山和海可以移动？答：人山人海", "id": "j0635"}, {"cat": "脑筋急转弯", "text": "哪种动物最没有方向感？答：麋鹿（迷路）", "id": "j0636"}, {"cat": "脑筋急转弯", "text": "弗兰克林在雷雨中放风筝时说了什么？答：什么也没有说当时他被电麻了", "id": "j0637"}, {"cat": "脑筋急转弯", "text": "什么东西在倒立之后会增加一半？（？答：数目字6）", "id": "j0638"}, {"cat": "脑筋急转弯", "text": "为什么燕子冬天要飞向南方过冬？答：因为走得太慢", "id": "j0639"}, {"cat": "脑筋急转弯", "text": "一只凶猛的饿猫，看到老鼠，为何拔腿就跑？（？答：跑去追老鼠）", "id": "j0640"}, {"cat": "脑筋急转弯", "text": "有一个人，他是你父母生的，但他却不是你的兄弟姐妹，他是谁？答：你自己", "id": "j0641"}, {"cat": "脑筋急转弯", "text": "在一次监察严密的考试中，有两个学生交了一模一样的考卷。主考官发现后，却并没有认为他们作弊，这是什么原因？（？答：二张考卷交得都是白卷）", "id": "j0642"}, {"cat": "脑筋急转弯", "text": "有一天小董上完物理课后，突然想效法牛顿，就到苹果树下，这时也刚好掉下一颗苹果，砸到小董的头，你猜小董怎么说？答：这个苹果是熟的", "id": "j0643"}, {"cat": "脑筋急转弯", "text": "废除早自习会造成什么影响？答：让学生和家长可以多赖床半小时", "id": "j0644"}, {"cat": "脑筋急转弯", "text": "一个人在沙滩上行走，回头为什么看不见自己的脚印？（？答：倒着走）", "id": "j0645"}, {"cat": "脑筋急转弯", "text": "整天整天在大街上逛悠并且特爱“管闲事”的家伙是谁？答：交通警", "id": "j0646"}, {"cat": "脑筋急转弯", "text": "什么船从来不下水？答：宇宙飞船", "id": "j0647"}, {"cat": "脑筋急转弯", "text": "一列火车从北京到天津要用一个小时，现在从北京发出了半个小时，请问现在火车在什么地方？答：铁轨上", "id": "j0648"}, {"cat": "脑筋急转弯", "text": "既认识自然又能随便改造自然的人是谁？答：画家", "id": "j0649"}, {"cat": "脑筋急转弯", "text": "谁是世界上最有恒心的画家？答：爱化妆的女人", "id": "j0650"}, {"cat": "脑筋急转弯", "text": "什么情况下5大于O，O大于2，2大于5？答：石头，剪刀，布", "id": "j0651"}, {"cat": "脑筋急转弯", "text": "一个瞎子射击一个帽子，怎么样一枪就中？答：把帽子挂在枪口上", "id": "j0652"}, {"cat": "脑筋急转弯", "text": "走夜路犯了烟瘾，有烟无火时该怎么办？答：看看有没有鬼火可以点", "id": "j0653"}, {"cat": "脑筋急转弯", "text": "小杰最爱吹牛，但是为什么他说大家都说他讲话很实在？答：那是他自己说的", "id": "j0654"}, {"cat": "脑筋急转弯", "text": "青蛙为什么能比树跳得高？答：因为他站在树上跳", "id": "j0655"}, {"cat": "脑筋急转弯", "text": "张大妈整天说个不停，可有一个月她说话最少，那是哪个月？答：二月份", "id": "j0656"}, {"cat": "脑筋急转弯", "text": "人在不饥渴时也需要的是什么水？答：薪水", "id": "j0657"}, {"cat": "脑筋急转弯", "text": "能够使我们的眼睛通过一堵墙的是什么？答：窗户", "id": "j0658"}, {"cat": "脑筋急转弯", "text": "后脑勺受伤的人怎样睡觉？答：闭着眼睛睡觉", "id": "j0659"}, {"cat": "脑筋急转弯", "text": "开什么车最省油？答：开夜车", "id": "j0660"}, {"cat": "脑筋急转弯", "text": "前面有一片草地———猜一植物？答：梅花（没花）", "id": "j0661"}, {"cat": "脑筋急转弯", "text": "小华请李明依签名，李明依却这样都不肯答，为什么？答：小华请他签在身份证的配偶栏里", "id": "j0662"}, {"cat": "脑筋急转弯", "text": "一架高空飞行的客机在航行中，小王突然打开门冲出去，为什么他没摔死？答：他是从飞机的厕所冲", "id": "j0663"}, {"cat": "脑筋急转弯", "text": "路边电线杆上蹲着一只猴子，司机小李看到就立刻停下车来，请问为什么？答：他把猴屁股当红灯了", "id": "j0664"}, {"cat": "脑筋急转弯", "text": "铁放到外面要生锈，那金子呢？答：会被偷走", "id": "j0665"}, {"cat": "脑筋急转弯", "text": "小朋友在游泳池游泳，游了一阵，大勇数了数，发觉少了一个，忙向老师报告，老师却说没有少，是什么原因呢？答：大勇忘了数上自己", "id": "j0666"}, {"cat": "脑筋急转弯", "text": "在一次考试中，两个学生交了一模一样的考卷，但教师认为他们肯定没有作弊，这是为什么？答：他们交的是白卷", "id": "j0667"}, {"cat": "脑筋急转弯", "text": "什么事你明明没有做，但却要受罚？答：家庭作业", "id": "j0668"}, {"cat": "脑筋急转弯", "text": "有一样东西，你只能用左手拿它，右手却拿不到，这是什么东西？答：右手", "id": "j0669"}, {"cat": "脑筋急转弯", "text": "用什么可以解开所有的谜？（？答：迷底）", "id": "j0670"}, {"cat": "脑筋急转弯", "text": "为什么买一头牛只要一万元，而买三头牛却要五万元？答：三头牛当然比一头牛贵", "id": "j0671"}, {"cat": "脑筋急转弯", "text": "什么动物天天熬夜？答：蚊子", "id": "j0672"}, {"cat": "脑筋急转弯", "text": "猜猜什么东西，可以洗，不能晒，可以吃，不能吞？答：麻将", "id": "j0673"}, {"cat": "脑筋急转弯", "text": "为什么人们要到市场上去？（？答：因为市场不能来）", "id": "j0674"}, {"cat": "脑筋急转弯", "text": "犯人最乐意选择的死法是什么？答：老死", "id": "j0675"}, {"cat": "脑筋急转弯", "text": "什么话可以世界通用？答：电话", "id": "j0676"}, {"cat": "脑筋急转弯", "text": "树上有100只鸟，用什么方法才能把它们全部抓住？答：用照相机", "id": "j0677"}, {"cat": "脑筋急转弯", "text": "什么东西人们都不喜欢吃？答：当然是亏了", "id": "j0678"}, {"cat": "脑筋急转弯", "text": "兔子的眼睛为什么是红的？答：因为他跑输了乌龟哭红的", "id": "j0679"}, {"cat": "脑筋急转弯", "text": "什么报只印一份？答：电报", "id": "j0680"}, {"cat": "脑筋急转弯", "text": "脸上长什么无药可救？答：胡子", "id": "j0681"}, {"cat": "脑筋急转弯", "text": "保洁阿姨是什么人？答：女人", "id": "j0682"}, {"cat": "脑筋急转弯", "text": "风的孩子叫什么？答：水起 （风生水起", "id": "j0683"}, {"cat": "脑筋急转弯", "text": "一个人去网吧，碰上一个同学带着两个朋友，各带着4个小孩，小孩个带着2个朋友，问多少人去网吧？答：一个人，其它人没说去", "id": "j0684"}, {"cat": "脑筋急转弯", "text": "在一间房子里，有油灯，暖炉及壁炉此刻，想要将三个器具点燃，可是你仅有一根火柴请问首先应当点哪一样？答：火柴", "id": "j0685"}, {"cat": "脑筋急转弯", "text": "一把11厘米长的尺子，可否只刻3个整数刻度，即可用于量出1到11厘米之间的任何整数厘米长的物品长度？如果可以，问应刻哪几个刻度？答：可以。刻度可位于2，7，8处", "id": "j0686"}, {"cat": "脑筋急转弯", "text": "小明知道试卷的答案，为什么还频频看同学的？答：因为小明是个小老师", "id": "j0687"}, {"cat": "脑筋急转弯", "text": "一个人掉到河里，还挣扎了几下，它从河里爬上来，衣服全湿了，头发却没湿，为什么？答：因为他是光头", "id": "j0688"}, {"cat": "脑筋急转弯", "text": "冶金学——打一本书（小说）名？答：《钢铁是怎样炼成的》", "id": "j0689"}, {"cat": "脑筋急转弯", "text": "为什么爷爷送给小明一份生日礼物，小明却一脚把礼物踢开？答：礼物是足球", "id": "j0690"}, {"cat": "脑筋急转弯", "text": "小王坐着对小李说：“我坐的这个地方，你永远也不可能坐的到。”你知道小王坐在哪里吗？答：小王坐在小李肩上", "id": "j0691"}, {"cat": "脑筋急转弯", "text": "小红和妈妈去买熟鸡蛋，为什么别人不卖给她？答：因为那鸡蛋是生的", "id": "j0692"}, {"cat": "脑筋急转弯", "text": "麦可杰克森的儿子是幸福的，为什么？答：他可以把他爸爸的鼻子拿下来玩", "id": "j0693"}, {"cat": "脑筋急转弯", "text": "强尼每天晚上做梦都梦到猫要吃他，他又不是老鼠，为什么？答：他白天在迪尼斯扮演米老鼠", "id": "j0694"}, {"cat": "脑筋急转弯", "text": "1234567890哪个数字最勤劳，哪个数字最懒惰？答：1懒惰；2勤劳。（1不做2不休）", "id": "j0695"}, {"cat": "脑筋急转弯", "text": "气候突然转冷，一只鸵鸟决定南迁，请问它头向南，尾朝北，而爪子该朝向哪一方呢？答：鸵鸟不会飞", "id": "j0696"}, {"cat": "脑筋急转弯", "text": "小王开着空出租车出门，为什么一路上都没有人向他招手搭车？答：他走的是高速公路", "id": "j0697"}, {"cat": "脑筋急转弯", "text": "猫见了老鼠为什么拔腿就跑？答：去捉老鼠了", "id": "j0698"}, {"cat": "脑筋急转弯", "text": "债权和债务的最大区别是什么？答：一个容易记住一个最不容易记住", "id": "j0699"}, {"cat": "脑筋急转弯", "text": "猩猩最讨厌什么线？答：平行线。平行线没有相交（香蕉）", "id": "j0700"}, {"cat": "脑筋急转弯", "text": "什么东西只能加，不能减？答：年龄", "id": "j0701"}, {"cat": "脑筋急转弯", "text": "语言天才和计算机专家结婚，将来生下的儿子长大后会成为什么人？答：大人", "id": "j0702"}, {"cat": "脑筋急转弯", "text": "人死后，为什么会变得冰凉？答：心静自然凉", "id": "j0703"}, {"cat": "脑筋急转弯", "text": "有一种东西，买的人明白，卖的人也明白，仅有用的人不明白，是什么东西？答：棺材", "id": "j0704"}, {"cat": "脑筋急转弯", "text": "农夫养１０头牛，只有１９只角，为什么？答：有一头是犀牛", "id": "j0705"}, {"cat": "脑筋急转弯", "text": "铁放到外面要生锈，那金子呢？答：会被人偷走", "id": "j0706"}, {"cat": "脑筋急转弯", "text": "老虎的弟弟是谁？答：猫", "id": "j0707"}, {"cat": "脑筋急转弯", "text": "胖胖是个颇有名气的跳水运动员，可是有一天，他站在跳台上，却不敢往下跳。这是为什么？答：下头没有水", "id": "j0708"}, {"cat": "脑筋急转弯", "text": "一只老虎被一根85米长的绳子捆着，它前方100米处有一堆草，老虎怎么样才能吃到草？答：老虎不吃草", "id": "j0709"}, {"cat": "脑筋急转弯", "text": "一只饿猫从一只胖老鼠身旁走过，为什么那只饥饿的老猫竟无动于衷继续走它的路，连看都没看这只老鼠？答：瞎猫遇到死耗子", "id": "j0710"}, {"cat": "脑筋急转弯", "text": "为什么太阳天天都比人起的早？答：人比太阳睡的晚", "id": "j0711"}, {"cat": "脑筋急转弯", "text": "小咪昨晚花了整整一个晚上在历史课本上，可第二天妈妈还是骂她不用功，为什么？答：她用历史课本当枕头睡", "id": "j0712"}, {"cat": "脑筋急转弯", "text": "你知道一个人的小腿应该有多长？答：应该长到碰着地面", "id": "j0713"}, {"cat": "脑筋急转弯", "text": "三个人分五个苹果，怎样分最公平？答：榨成果汁最公平", "id": "j0714"}, {"cat": "脑筋急转弯", "text": "新兵阿国：“报告班长！我的豆浆里有一只苍蝇。”为什么班长却若无其事的告诉他放心喝，没有问题的？答：因为馒头里的蜘蛛会把苍蝇", "id": "j0715"}, {"cat": "脑筋急转弯", "text": "爸爸什么时候像个孩子？答：在爷爷面前", "id": "j0716"}, {"cat": "脑筋急转弯", "text": "兰兰经过某市时，正巧那里发生了大地震，为什么兰兰却安然无恙呢？答：她坐飞机路过", "id": "j0717"}, {"cat": "脑筋急转弯", "text": "世界上除了火车啥车最长？（？答：塞车）", "id": "j0718"}, {"cat": "脑筋急转弯", "text": "大眼镜蛇王，是一种非常凶猛的毒蛇，但无论如何激怒它，它都不咬人，为什么？答：因为它在一个没有人的密林里", "id": "j0719"}, {"cat": "脑筋急转弯", "text": "一个不会游泳的人掉进了水里却没有淹死，为什么？（？答：穿着救生衣）", "id": "j0720"}, {"cat": "脑筋急转弯", "text": "什么数字最听话呢？答：100（百依百顺）", "id": "j0721"}, {"cat": "脑筋急转弯", "text": "有一样东西不管你喜欢与否，它却每年一定要增加一点，这是什么东西？答：年龄", "id": "j0722"}, {"cat": "脑筋急转弯", "text": "为什么母鸡都是短腿？答：站着下蛋时，离地高容易打破蛋", "id": "j0723"}, {"cat": "脑筋急转弯", "text": "邻居老李家的屋顶为什么有时漏雨，有时不漏雨？答：因为雨天漏雨，晴天不漏雨", "id": "j0724"}, {"cat": "脑筋急转弯", "text": "三个金“鑫”，三个水叫“淼”，三个人叫“众”，那么三个鬼应当叫什么。答：救命", "id": "j0725"}, {"cat": "脑筋急转弯", "text": "为什么老师从小就叮咛我们要珍惜四支箭？答：光阴似箭（四箭）", "id": "j0726"}, {"cat": "脑筋急转弯", "text": "小小的妈妈在洗衣服，但洗了半天，她的衣服还是脏的，为什么？答：因为她是洗的别人的衣服", "id": "j0727"}, {"cat": "脑筋急转弯", "text": "猴子每分钟能掰一个玉米，在果园里，一只猴子5分钟能掰几个玉米？（？答：没掰到一个）", "id": "j0728"}, {"cat": "脑筋急转弯", "text": "一张方桌据掉一个角，还有几个角？答：个角", "id": "j0729"}, {"cat": "脑筋急转弯", "text": "有一艘船限载50人，船上已有49人后，再加上一个孕妇上了船，结果船沉入海中，为什么？[？答：潜水厅", "id": "j0730"}, {"cat": "脑筋急转弯", "text": "胖妞生病时，最怕别人来探病时说什么？（？答：多保重身体）", "id": "j0731"}, {"cat": "脑筋急转弯", "text": "什么东西越洗越脏？答：水", "id": "j0732"}, {"cat": "脑筋急转弯", "text": "艳阳高照，为什么只有小可全身湿淋淋的？答：因为他正在游泳呀", "id": "j0733"}, {"cat": "脑筋急转弯", "text": "有一块天然的黑色的大理石，在九月七号这一天，把它扔到钱塘江里会有什么现象发生？（？答：沉到江底）", "id": "j0734"}, {"cat": "脑筋急转弯", "text": "什么东西要藏起来暗地里用，用完之后再暗地里交给别人？答：底片", "id": "j0735"}, {"cat": "脑筋急转弯", "text": "三个人要过公路，当时没有任何车辆通过，但走到一边人行道上的只有两个人，请问另一个人哪里去了呢？答：在公路的另一边", "id": "j0736"}, {"cat": "脑筋急转弯", "text": "像糖不是糖，不能用口尝，帮你改错字，纸上来回忙。答：橡皮", "id": "j0737"}, {"cat": "脑筋急转弯", "text": "专爱打听别人事的人是谁？答：记者", "id": "j0738"}, {"cat": "脑筋急转弯", "text": "如果恐龙没有绝迹，世界将会变成什么样子？答：再也没有稀罕他的存在", "id": "j0739"}, {"cat": "脑筋急转弯", "text": "小明的肚子明明已经胀得受不了了，为什么他还要不停地猛喝水？答：他掉进河里了", "id": "j0740"}, {"cat": "脑筋急转弯", "text": "一间牢房中关了两名犯人，其中一个因偷窃，要关一年，另一个是强盗杀人犯，却只关两个星期，为什么？（？答：因为杀人犯要拉去填命）", "id": "j0741"}, {"cat": "脑筋急转弯", "text": "小明拿了一百元去买一个七十五元的东西，但老板却只找了五元给他，为什么？答：他只给了80元", "id": "j0742"}, {"cat": "脑筋急转弯", "text": "布和纸怕什么？答：布怕一万，纸怕万一。（不怕一万，只怕万一）", "id": "j0743"}, {"cat": "脑筋急转弯", "text": "为什么夏天才有台风？答：因为他要冬眠", "id": "j0744"}, {"cat": "脑筋急转弯", "text": "有爷俩，娘俩和兄妹俩，只有6个烧饼，但却每人分得了两个，这是为什么？答：他们只有三个人：母亲，儿子，舅舅", "id": "j0745"}, {"cat": "脑筋急转弯", "text": "你的爸爸的妹妹的堂弟的表哥的爸爸与你叔叔的儿子的嫂子是什么关系？（？答：亲戚关系）", "id": "j0746"}, {"cat": "脑筋急转弯", "text": "一只狗总也不洗澡，为什么不生虱子？答：狗当然生不出虱子来", "id": "j0747"}, {"cat": "脑筋急转弯", "text": "伴奏。打一成语？答：助人为乐", "id": "j0748"}, {"cat": "脑筋急转弯", "text": "什么东西能加不能减？答：年龄", "id": "j0749"}, {"cat": "脑筋急转弯", "text": "小毛喜欢运动，有一天他在摄氏38高温大太阳下做很激烈的运动，为什么也居然不会流汗？答：他在水里游泳", "id": "j0750"}, {"cat": "脑筋急转弯", "text": "两只狗赛跑，甲狗跑得快，乙狗跑得慢，跑到终点时，哪只狗出汗多？（？答：狗不会出汗）", "id": "j0751"}, {"cat": "脑筋急转弯", "text": "什么事能够在那里不仅仅能够练就一身钢筋铁骨，并且能成就一双不惧“风雨”的眼睛？答：洗澡", "id": "j0752"}, {"cat": "脑筋急转弯", "text": "家家说他能轻而易举跨过一棵大树，他是怎么跨过的呢？答：一棵伐倒的树", "id": "j0753"}, {"cat": "脑筋急转弯", "text": "什么鸭子用两只脚走路？答：所有的鸭子都是用两只脚走路", "id": "j0754"}, {"cat": "脑筋急转弯", "text": "小王是一名优秀士兵，一天他在站岗值勤时，明明看到有敌人悄悄向他摸过来，为什么他却睁一只眼闭一只眼？答：因为他正在瞄准", "id": "j0755"}, {"cat": "脑筋急转弯", "text": "要想使梦成为现实，我们干的第一件事会是什么？（？答：醒来）", "id": "j0756"}, {"cat": "脑筋急转弯", "text": "有一个人被从几千米的高空掉下来的东西砸在头上，却没有受伤，为什么？答：砸下来的是雪花", "id": "j0757"}, {"cat": "脑筋急转弯", "text": "巧克力和西红柿打架，巧克力赢了。为什么呢？答：因为巧克力棒", "id": "j0758"}, {"cat": "脑筋急转弯", "text": "用什么可以解开所有的谜？答：谜底", "id": "j0759"}, {"cat": "脑筋急转弯", "text": "离婚的最关键因素是什么？答：结婚", "id": "j0760"}, {"cat": "脑筋急转弯", "text": "毛毛虫回到家，对爸爸说了一句话，爸爸即场晕倒，毛毛虫说了什么话？答：毛毛虫说：“我要买鞋。”", "id": "j0761"}, {"cat": "脑筋急转弯", "text": "别人跟阿丹说她的衣服怎么没衣扣，她却不在乎，为什么？答：有拉链的", "id": "j0762"}, {"cat": "脑筋急转弯", "text": "我们脚下踩的是什么？答：鞋袜", "id": "j0763"}, {"cat": "脑筋急转弯", "text": "一百个男人无法抬起的物体，却有一女子可单手举起，此物体究竟为何？答：一颗鸡蛋（仅仅一个鸡蛋，100个人没法抬）", "id": "j0764"}, {"cat": "脑筋急转弯", "text": "什么时候一加五等于十？答：算盘运算", "id": "j0765"}, {"cat": "脑筋急转弯", "text": "牛小时侯叫“犊”那兔子、乌龟小时侯应如何称呼？答：兔崽子龟儿子", "id": "j0766"}, {"cat": "脑筋急转弯", "text": "死前放屁又叫什么？答：绝响", "id": "j0767"}, {"cat": "脑筋急转弯", "text": "书店里买不到什么书？答：遗书", "id": "j0768"}, {"cat": "脑筋急转弯", "text": "阿研的口袋里共有10个硬币，漏掉了10个硬币，口袋里还有什么？答：一个破洞", "id": "j0769"}, {"cat": "脑筋急转弯", "text": "小偷最怕碰到是哪个机关？答：公安机关", "id": "j0770"}, {"cat": "脑筋急转弯", "text": "有一个人舔冰棒，为什么越舔冰棒越大支？答：因为他在南极舔", "id": "j0771"}, {"cat": "脑筋急转弯", "text": "三个苹果吃掉一个，为什么还是剩下三个？答：两个在外面一个在里面", "id": "j0772"}, {"cat": "脑筋急转弯", "text": "好心的约翰去世了，天使要带他上天堂，为什么他坚决不肯去？答：他有恐高症", "id": "j0773"}, {"cat": "脑筋急转弯", "text": "能不晕车的最好办法是什么？答：步行", "id": "j0774"}, {"cat": "脑筋急转弯", "text": "哪项比赛是往后跑的？（？答：拔河）", "id": "j0775"}, {"cat": "脑筋急转弯", "text": "你知道不可救药的成语是如何产生的吗？答：当药店发生火灾时只能先救人再救药", "id": "j0776"}, {"cat": "脑筋急转弯", "text": "什么虎会吓人但并不吃人？答：壁虎", "id": "j0777"}, {"cat": "脑筋急转弯", "text": "冬瓜、黄瓜、西瓜、南瓜都能吃，什么瓜不能吃？答：傻瓜", "id": "j0778"}, {"cat": "脑筋急转弯", "text": "拿鸡蛋扔石头，为什么鸡蛋没破？答：左手拿蛋右手扔石头，鸡蛋怎么会破？", "id": "j0779"}, {"cat": "脑筋急转弯", "text": "有十支蜡烛，你吹灭了三支，还剩几支？答：还剩十支！！（别给愣住了）", "id": "j0780"}, {"cat": "脑筋急转弯", "text": "有一座大大厦发生火灾，陈先生逃到顶楼后，想跳过距离只有1米的隔壁楼顶，结果却摔死了，为什么？答：因为高度相差太远", "id": "j0781"}, {"cat": "脑筋急转弯", "text": "小赵买一张奖票，中了一等奖，去领奖却不给？答：还没到领奖的日期", "id": "j0782"}, {"cat": "脑筋急转弯", "text": "有爷俩，娘俩和兄妹俩，只有6个烧饼，但却每人分得了两个，这是为什么？答：儿子、母亲、舅舅", "id": "j0783"}, {"cat": "脑筋急转弯", "text": "世界脖子最短的长颈鹿生长在什么地方？答：考场里", "id": "j0784"}, {"cat": "脑筋急转弯", "text": "小呆骑在大牛身上，为什么大牛不吃草？答：因为大牛是人", "id": "j0785"}, {"cat": "脑筋急转弯", "text": "什么比乌鸦更令人讨厌？答：乌鸦嘴", "id": "j0786"}, {"cat": "脑筋急转弯", "text": "一个公公精神好，从早到晚不睡觉，身体虽小力气大，千人万人推不倒，这是什么东西？答：不倒翁", "id": "j0787"}, {"cat": "脑筋急转弯", "text": "什么时候太阳会打从西边升起？答：从镜子里", "id": "j0788"}, {"cat": "脑筋急转弯", "text": "在一间房子里，有油灯，暖炉及壁炉、现在，想要将三个器具点燃，可是你只有一根火柴、请问首先应该点哪一样？（？答：火柴）", "id": "j0789"}, {"cat": "脑筋急转弯", "text": "夜夜看落花（打一礼貌用语）。答：多谢", "id": "j0790"}, {"cat": "脑筋急转弯", "text": "男人在一起喝酒，为什么非划拳不可？答：敬酒不吃吃罚酒", "id": "j0791"}, {"cat": "脑筋急转弯", "text": "一个离过五十次婚的女人，应该怎么形容她？（？答：前公尽弃）", "id": "j0792"}, {"cat": "脑筋急转弯", "text": "拖什么东西最轻松？答：拖鞋", "id": "j0793"}, {"cat": "脑筋急转弯", "text": "七分熟的牛肉遇到八分熟的牛肉，为什么他们不打招呼？答：因为它们不熟", "id": "j0794"}, {"cat": "脑筋急转弯", "text": "世上什么东西比天更高？（？答：心比天高）", "id": "j0795"}, {"cat": "脑筋急转弯", "text": "今天下午到旺角看电影，到了旺角，半个人也看不见，为什么？答：人很多，但没有“半”个人", "id": "j0796"}, {"cat": "脑筋急转弯", "text": "经理想写封信给太太，于是口述由女秘书代笔。写好之后，经理却发现漏了最后一句：“我爱你。”为什么？答：女秘书以为是对她说的", "id": "j0797"}, {"cat": "脑筋急转弯", "text": "蜗牛从上海到北京只用了一分钟，为什么？答：地图上", "id": "j0798"}, {"cat": "脑筋急转弯", "text": "山坡上有一群羊，来了一群羊。一共有几群羊？答：还是一群呀！", "id": "j0799"}, {"cat": "脑筋急转弯", "text": "鸡蛋输了不服气，又去打~又输了~{打一种食品}？答：鸡蛋面", "id": "j0800"}, {"cat": "脑筋急转弯", "text": "班长告诉菜鸟，当拉开手榴弹的保险之后，口中先数五秒再投掷出去，菜鸟一切都按班长指示动作，但仍被炸死了，为什么？答：因为菜鸟有口吃", "id": "j0801"}, {"cat": "脑筋急转弯", "text": "鱼与熊掌要如何才可兼得？答：养一只会抓鱼的熊", "id": "j0802"}, {"cat": "脑筋急转弯", "text": "吸血鬼抓住了一个人，并不马上吃他，那只吸血鬼要干什么？答：先看看那个人的血型再说", "id": "j0803"}, {"cat": "脑筋急转弯", "text": "为什么DrJ做完下俯卧撑后，地上多了个凹洞？答：因为他单手做俯卧撑", "id": "j0804"}, {"cat": "脑筋急转弯", "text": "为什么一架纸飞机，造价一亿台币？答：那是用一张一亿台币的纸票折的", "id": "j0805"}, {"cat": "脑筋急转弯", "text": "小明吃麻辣面，加了胡椒又加辣椒，你猜他还会加什么东西？答：鼻涕和眼泪", "id": "j0806"}, {"cat": "脑筋急转弯", "text": "为什幺女人穿高跟鞋后，就代表她快结婚了？答：因为穿高跟鞋慢很容易被男人追上", "id": "j0807"}, {"cat": "脑筋急转弯", "text": "你能否用3跟筷子搭起一个比3大比4小的数？答：搭成圆周率“∏”", "id": "j0808"}, {"cat": "脑筋急转弯", "text": "老王擦桌子，擦了半天，仍觉得脏，为什么？答：因为老王的老花镜是脏的", "id": "j0809"}, {"cat": "脑筋急转弯", "text": "什么样的官不能发号施令，还得老向别人陪笑？答：新朗官", "id": "j0810"}, {"cat": "脑筋急转弯", "text": "鸡蛋里面挑“骨头”表示故意找人麻烦，那鸡蛋里面挑“石头”又代表什么意思？答：小鸡得了肾结石必须挑石头了", "id": "j0811"}, {"cat": "脑筋急转弯", "text": "今天我吃了：3个猪；3个牛；5个羊；7个大鱼，可不一会儿肚子又饿了！这可不可能呢？答：因为吃得是动物饼干", "id": "j0812"}, {"cat": "脑筋急转弯", "text": "停电的时候，我们点着蜡烛为什么能看电视？答：看不了电视节目，但可以看着电视机", "id": "j0813"}, {"cat": "脑筋急转弯", "text": "楚楚的生日在三月三十日，请问是哪年的三月三十日？（？答：每年的三月三十日）", "id": "j0814"}, {"cat": "脑筋急转弯", "text": "电和闪电最大的区别是什么？答：一个收费、一个不收费", "id": "j0815"}, {"cat": "脑筋急转弯", "text": "一头牛面向北，然后向后转，再向东转，这时牛的尾巴是朝东还是朝西？答：朝地", "id": "j0816"}, {"cat": "脑筋急转弯", "text": "为什么小王写了一个字，人人都说他写了错字？答：他本身就写了个错字", "id": "j0817"}, {"cat": "脑筋急转弯", "text": "什么东西天气越热，它爬的越高？（？答：漫度计）", "id": "j0818"}, {"cat": "脑筋急转弯", "text": "曹孟德赤壁惨败。（打二歌星）？答：孙悦、刘欢", "id": "j0819"}, {"cat": "脑筋急转弯", "text": "什么东西往上升永远掉不下来？答：年龄", "id": "j0820"}, {"cat": "脑筋急转弯", "text": "画一个圆圈，这个圆圈画在哪里我们永远也跳不出去？答：画在自己身上", "id": "j0821"}, {"cat": "脑筋急转弯", "text": "有一种地方专门教坏人，但没有一个警察敢对它采取行动加以扫荡。这是什么地方。（？答：看守所）", "id": "j0822"}, {"cat": "脑筋急转弯", "text": "张三问李四5次同一样的问题，李四回答了五个不同答案，而且每个都是对的，那么张三问的是什么呢？答：张三问的是时间", "id": "j0823"}, {"cat": "脑筋急转弯", "text": "为什么帽子脏了要翻面再戴？答：张冠李戴（脏冠里戴）", "id": "j0824"}, {"cat": "脑筋急转弯", "text": "点一横长，一撇飘南洋，南洋有个人，只有一寸长。（打一字）？答：府", "id": "j0825"}, {"cat": "脑筋急转弯", "text": "字典放在地上为何没人能跨过去？答：字典放在墙角上", "id": "j0826"}, {"cat": "脑筋急转弯", "text": "胖妞生病了，最怕别人来探病时说什么？答：多多保重", "id": "j0827"}, {"cat": "脑筋急转弯", "text": "“先天”是父母所遗传的体质，那“后天”是什么？答：后天是明天的明天", "id": "j0828"}, {"cat": "脑筋急转弯", "text": "有种动物，大小像只猫，长相又像虎，这是什么动物？（？答：小老虎） 7", "id": "j0829"}, {"cat": "脑筋急转弯", "text": "哪一种竹子不长在土里？答：爆竹", "id": "j0830"}, {"cat": "脑筋急转弯", "text": "有一根棍子，要它变短，但不能锯断、折断或削短，该怎么办？答：找一个长的与它比，就短了", "id": "j0831"}, {"cat": "脑筋急转弯", "text": "什么样的路不能走？（？答：电路）", "id": "j0832"}, {"cat": "脑筋急转弯", "text": "卖火柴的小女孩如果投胎转世来到现代，最有可能变成什么？答：兼售打火机的槟榔西施", "id": "j0833"}, {"cat": "脑筋急转弯", "text": "如何才能把你的左手完全放在你穿在身上的右裤袋里，而同时把你的右手完全放在你穿在身上的左裤袋里？答：反穿裤子", "id": "j0834"}, {"cat": "脑筋急转弯", "text": "驯狗场选中一狗？答：猫", "id": "j0835"}, {"cat": "脑筋急转弯", "text": "有半瓶酒，瓶口用软木塞塞住，不准敲碎瓶子，不准拔去木塞，不准在塞子上钻孔，怎样喝到瓶子里的酒？答：把木塞推进瓶里", "id": "j0836"}, {"cat": "脑筋急转弯", "text": "世界上什么没有标价？答：情意", "id": "j0837"}, {"cat": "脑筋急转弯", "text": "请龟兔赛跑，请猪来当裁判，请问龟兔谁会赢？答：不能说！说的人是猪…", "id": "j0838"}, {"cat": "脑筋急转弯", "text": "一种东西，东方人的短，西方人的长，结婚后女的就可以用男的这东西，和尚有但是不用它（？答：人的，姓）", "id": "j0839"}, {"cat": "脑筋急转弯", "text": "什么人在刀刃上生活？答：滑冰运动员", "id": "j0840"}, {"cat": "脑筋急转弯", "text": "在没有停电、跳电情况下，为什么陈先生按了开关，电灯却没有亮？答：他按的电视开关", "id": "j0841"}, {"cat": "脑筋急转弯", "text": "一颗心值多少钱？答：1亿。因为一心一意嘛！", "id": "j0842"}, {"cat": "脑筋急转弯", "text": "研研十四岁生日的晚上，庆祝宴上点了十五支蜡烛。那是为什么？答：那晚停电，有一只是照明蜡烛", "id": "j0843"}, {"cat": "脑筋急转弯", "text": "医生手术为何带口罩？答：怕人认出来", "id": "j0844"}, {"cat": "脑筋急转弯", "text": "金太太一向心直口快，可什么事竟让她突然变得吞吞吐吐了呢?答：金太太在吃甘蔗的时候吞吞吐吐", "id": "j0845"}, {"cat": "脑筋急转弯", "text": "把24个人按5人排列，排城6行，该怎样排?答：排成正六边形即可", "id": "j0846"}, {"cat": "脑筋急转弯", "text": "网要什么时候可以提水?答：当水变成冰时，用网当然可以提", "id": "j0847"}, {"cat": "脑筋急转弯", "text": "全世界死亡率最高的地方在哪里?答：在床上", "id": "j0848"}, {"cat": "脑筋急转弯", "text": "一个离过五十次婚的女人，应该怎么形容她?答：前功，尽弃", "id": "j0849"}, {"cat": "脑筋急转弯", "text": "三个孩子吃三个饼要用3分钟，九十个孩子九十个饼要用多少时间?答：也是三分钟，九十个孩子同时吃", "id": "j0850"}, {"cat": "脑筋急转弯", "text": "地球上什么东西每天要走的距离最远?答：地球", "id": "j0851"}, {"cat": "脑筋急转弯", "text": "中国人最早的姓氏是什么?答：姓“善“", "id": "j0852"}, {"cat": "脑筋急转弯", "text": "在什么时候1+2不等于3?答：算错了的时候", "id": "j0853"}, {"cat": "脑筋急转弯", "text": "小明家住在五楼，可是电梯坏了，他自己也没有走楼梯，他却上了五楼回到家里，这可能吗?答：妈妈背着他上的楼", "id": "j0854"}, {"cat": "脑筋急转弯", "text": "两个人分五个苹果，怎么分最公平?答：榨成果汁", "id": "j0855"}, {"cat": "脑筋急转弯", "text": "小张开车，不小心撞上电线杆发生车祸，_到达时车上有个死人，小张说这与他无关，_也相信了，为什么?答：小张开灵车", "id": "j0856"}, {"cat": "脑筋急转弯", "text": "动物园中，大象鼻子最长，鼻子第二长的是什么?答：小象", "id": "j0857"}, {"cat": "脑筋急转弯", "text": "什么动物你打死了它，却流了你的血?答：蚊子", "id": "j0858"}, {"cat": "脑筋急转弯", "text": "松下为什么没索尼强?答：panasonic (怕了索尼哥)", "id": "j0859"}, {"cat": "脑筋急转弯", "text": "A和C谁比较高呢?答：C比较高 (因为ABCD A比C低)", "id": "j0860"}, {"cat": "脑筋急转弯", "text": "茉莉花、太阳花、玫瑰花哪一朵花最没力?答：茉莉花 (好一朵没力[美丽]的茉莉花)", "id": "j0861"}, {"cat": "脑筋急转弯", "text": "橡皮、老虎皮、狮子皮哪一个最不好?答：橡皮(橡皮差)", "id": "j0862"}, {"cat": "脑筋急转弯", "text": "麒麟飞到北极会变成什么?答：冰淇淋 原因：冰淇淋(冰麒麟)", "id": "j0863"}, {"cat": "脑筋急转弯", "text": "四个人在屋子里打麻将，_来了，却带走了5个人，为什么?答：因为他们打的人叫“麻将”", "id": "j0864"}, {"cat": "脑筋急转弯", "text": "为什么飞机飞这么高都不会撞到星星呢?答：因为星星会“闪”", "id": "j0865"}, {"cat": "脑筋急转弯", "text": "有一个胖子，从高楼跳下，结果变成了什么?答：死胖子", "id": "j0866"}, {"cat": "脑筋急转弯", "text": "怎样使麻雀安静下来?答：压它一下原因：鸦雀无声(压雀无声)", "id": "j0867"}, {"cat": "脑筋急转弯", "text": "巧克力和西红柿打架，巧克力赢了，谜语笑话及答案。为什么呢?答：因为巧克力棒", "id": "j0868"}, {"cat": "脑筋急转弯", "text": "有两个人掉到陷阱里了，死的人叫死人，活人叫什么?答：叫救命啦", "id": "j0869"}, {"cat": "脑筋急转弯", "text": "有一只鲨鱼吃下了一颗绿豆，结果它变成了什么?答：绿豆沙(绿豆鲨)", "id": "j0870"}, {"cat": "脑筋急转弯", "text": "丹丹是小狗的名字还是小老虎的名字?答：小老虎(虎视眈眈)", "id": "j0871"}, {"cat": "脑筋急转弯", "text": "鸡的妈妈是谁?答：纸 直升机(纸生鸡)", "id": "j0872"}, {"cat": "脑筋急转弯", "text": "狼、老虎和狮子谁玩游戏一定会被淘汰?答：狼 (桃太郎)", "id": "j0873"}, {"cat": "脑筋急转弯", "text": "红豆家的小孩是谁?答：南国 (红豆生南国)", "id": "j0874"}, {"cat": "脑筋急转弯", "text": "芹菜的屎是什么颜色的?答：黄色 (秦始皇)", "id": "j0875"}, {"cat": "脑筋急转弯", "text": "有位妈妈生了连体婴，姐姐叫玛丽，那幺妹妹叫做什么?答：梦露 (玛利莲梦露)", "id": "j0876"}, {"cat": "脑筋急转弯", "text": "为什么多啦A梦一辈子都生活在黑暗中?答：因为他伸手不见五指", "id": "j0877"}, {"cat": "脑筋急转弯", "text": "谁想起妈妈的话就会哭?答：爷爷 (夜夜想起妈妈的话呀，闪闪的泪光，鲁冰花)", "id": "j0878"}, {"cat": "脑筋急转弯", "text": "小白很像他哥哥，为什么?答：真相大白", "id": "j0879"}, {"cat": "脑筋急转弯", "text": "天的孩子叫什么?答：我材 (天生我材)", "id": "j0880"}, {"cat": "脑筋急转弯", "text": "猪圈里的猪出第3次来了，怎么办?{猜一个明星}？答：仔仔", "id": "j0881"}, {"cat": "脑筋急转弯", "text": "什么牌子化妆品容易感冒?答：雅倩(ARCHE[阿嚏])", "id": "j0882"}, {"cat": "脑筋急转弯", "text": "什么剑是透明的?答：看不见", "id": "j0883"}, {"cat": "脑筋急转弯", "text": "为什么你看不到上帝的老二?答：天机不可泄露", "id": "j0884"}, {"cat": "脑筋急转弯", "text": "小白兔为什么要和嫦娥奔月?答：因为嫦娥是萝卜腿", "id": "j0885"}, {"cat": "脑筋急转弯", "text": "为什么篮球板上要抹两勺盐?答：一言难尽", "id": "j0886"}, {"cat": "脑筋急转弯", "text": "哪个牌子的电器最难看?答：TCL(太丑了)", "id": "j0887"}, {"cat": "脑筋急转弯", "text": "乌龟在它的龟壳里盖了间房子，然后钻了进去，谜语笑话《谜语笑话及答案》。{猜个保健品}？答：盖中盖", "id": "j0888"}, {"cat": "脑筋急转弯", "text": "乌龟把房子拆了，又盖了间房子，然后钻了进去。{猜个保健品}？答：新盖中盖", "id": "j0889"}, {"cat": "脑筋急转弯", "text": "乌龟又把房子拆了，又盖了间房子，然后钻了进去。{猜个保健品}？答：巨能钙", "id": "j0890"}, {"cat": "脑筋急转弯", "text": "小狗和小兔去老师那里背书，为什么老师让小狗先背?答：狗(旺旺仙贝)", "id": "j0891"}, {"cat": "脑筋急转弯", "text": "哪一首歌的第一句就出现了3个人?答：我不是黄蓉(我，布什，黄蓉)", "id": "j0892"}, {"cat": "脑筋急转弯", "text": "吃葡萄不吐什么?答：葡萄牙", "id": "j0893"}, {"cat": "脑筋急转弯", "text": "哪个门派的教徒不会撒谎啊?答：全真教", "id": "j0894"}, {"cat": "脑筋急转弯", "text": "哪个牌子的电器最难闻?答：TCL(太臭了)", "id": "j0895"}, {"cat": "脑筋急转弯", "text": "谁最喜欢伸出援手?答：多啦A梦", "id": "j0896"}, {"cat": "脑筋急转弯", "text": "在哪里藏着你的鸽子?答：屋顶(在屋顶唱着你的歌)", "id": "j0897"}, {"cat": "脑筋急转弯", "text": "为什么森林里总派狮子去联系事情?答：失去联络", "id": "j0898"}, {"cat": "脑筋急转弯", "text": "一个包子和土豆打架，结果土豆把包子打死了。{猜一食物}？答：豆沙包", "id": "j0899"}, {"cat": "脑筋急转弯", "text": "海是谁的?答：菠萝(波罗的海)", "id": "j0900"}, {"cat": "脑筋急转弯", "text": "一只公鸡和一只母鸡(猜三个字)？答：两只鸡", "id": "j0901"}, {"cat": "脑筋急转弯", "text": "一只公鸡和一只母鸡(猜五个字)？答：还是两只鸡", "id": "j0902"}, {"cat": "脑筋急转弯", "text": "一只公鸡和一只母鸡(猜七个字)？答：笨蛋，还是两只鸡", "id": "j0903"}, {"cat": "脑筋急转弯", "text": "有一颗豆，摔倒了，只有你才能鼓励他，请问为什么?答：朱古力豆", "id": "j0904"}, {"cat": "脑筋急转弯", "text": "哪位历史人物最欠扁?答：苏武。原因：苏武牧羊北海边(被海扁)", "id": "j0905"}, {"cat": "脑筋急转弯", "text": "什么鱼最白痴?答：鲨(傻)鱼", "id": "j0906"}, {"cat": "脑筋急转弯", "text": "汽车会飞。 {猜一种饮料}？答：咖啡 (CAR，飞)", "id": "j0907"}, {"cat": "脑筋急转弯", "text": "如何让饮料变大杯?答：念大悲咒", "id": "j0908"}, {"cat": "脑筋急转弯", "text": "白色的马叫白马，黑色的马叫黑马，黑白相间的马叫斑马，那么黑色白色红色相间的马叫什么马?答：害羞的斑马", "id": "j0909"}, {"cat": "脑筋急转弯", "text": "历史上哪个人跑的最快?答：曹操(说曹操曹操到)", "id": "j0910"}, {"cat": "脑筋急转弯", "text": "请问唐朝时有谁戴眼镜?答：李白(床前明月光，咦!是地上霜)", "id": "j0911"}, {"cat": "脑筋急转弯", "text": "有一种地方专门教坏人，但没有一个_敢对它采取行动加以扫荡。这是什么地方?答：看守所", "id": "j0912"}, {"cat": "脑筋急转弯", "text": "哪一种死法是一般死囚所欢迎的?答：老死", "id": "j0913"}, {"cat": "脑筋急转弯", "text": "一个阴森的夜晚，眼前站着长发披肩，身穿白衣脸色苍白的一个女孩，用手去摸她，却摸不着，为什么?答：隔着窗户", "id": "j0914"}, {"cat": "脑筋急转弯", "text": "黑人为什么喜欢吃白色巧克力?答：怕咬到自己的手指", "id": "j0915"}, {"cat": "脑筋急转弯", "text": "什么水要按计划发放?答：薪水", "id": "j0916"}, {"cat": "脑筋急转弯", "text": "制造日期与有效日期是同一天的产品是什么?答：当天的报纸", "id": "j0917"}, {"cat": "脑筋急转弯", "text": "谁天天去看病?答：医生", "id": "j0918"}, {"cat": "脑筋急转弯", "text": "为什么人们要到市场上去?答：因为市场不会来", "id": "j0919"}, {"cat": "脑筋急转弯", "text": "香港最出名的是什么?答：香港脚", "id": "j0920"}, {"cat": "脑筋急转弯", "text": "出门看天色，进门看脸色，女鬼来敲门时要看什么?答：看谁最色", "id": "j0921"}, {"cat": "脑筋急转弯", "text": "一个人在回家的路上碰到只狮子，请问他会变成什么?答：十堆狮子大便", "id": "j0922"}, {"cat": "脑筋急转弯", "text": "人为什么喜欢往上爬?答：因为人是猴子变的", "id": "j0923"}, {"cat": "脑筋急转弯", "text": "大象的长鼻子是怎么长成的?答：出生时就有", "id": "j0924"}, {"cat": "脑筋急转弯", "text": "最多能承受个人，现在已经坐了个人了，又来了一个人，但是却沉了，为什么?答：因为那是潜水艇", "id": "j0925"}, {"cat": "脑筋急转弯", "text": "桌子上有一个蜡烛和一个煤油灯，请问先点哪一个?答：火柴", "id": "j0926"}, {"cat": "脑筋急转弯", "text": "动物园的大象死了，为什么管理员哭得死去活来?答：因为他想到挖这么大的坑，可能会累死", "id": "j0927"}, {"cat": "脑筋急转弯", "text": "为什么现在的猴子越来越少了?答：都变成人了", "id": "j0928"}, {"cat": "脑筋急转弯", "text": "小明整天说个不停，为什么今天一句话不说了?答：因为他嗓子哑了", "id": "j0929"}, {"cat": "脑筋急转弯", "text": "为什么新买的袜子有两个洞?答：要不然怎么穿", "id": "j0930"}, {"cat": "脑筋急转弯", "text": "小东上课睡觉，老师却不说他，为什么?答：老师没看见", "id": "j0931"}, {"cat": "脑筋急转弯", "text": "为什么一匹大青马掉进饭碗里淹死了?答：一只蛐蛐的昵称", "id": "j0932"}, {"cat": "脑筋急转弯", "text": "王先生在打太极拳时金鸣独立，站多久看上去都那么轻松，为什么?答：因为他在照片里", "id": "j0933"}, {"cat": "脑筋急转弯", "text": "小波比的一举一动都离不开绳子,为什么?(？答：小波比是木偶,(这都不懂))", "id": "j0934"}, {"cat": "脑筋急转弯", "text": "一溜(提示：注意谐音)三棵树，要拴10匹马，只能拴单不能拴双?(？答：请问怎样栓)", "id": "j0935"}, {"cat": "脑筋急转弯", "text": "三个金鑫，三个水叫淼，三个人叫众，那么三个鬼应该叫什么?(？答：叫救命)", "id": "j0936"}, {"cat": "脑筋急转弯", "text": "什么东西比乌鸦更讨厌?(？答：乌鸦嘴)", "id": "j0937"}, {"cat": "脑筋急转弯", "text": "孔子是我国最伟大的什么家?(？答：老人家)", "id": "j0938"}, {"cat": "脑筋急转弯", "text": "睡美人最怕的是什么?(？答：失眠)", "id": "j0939"}, {"cat": "脑筋急转弯", "text": "小明对小华说：我可以坐在一个你永远也坐不到的地方!他坐在哪里?(？答：小华的身上)", "id": "j0940"}, {"cat": "脑筋急转弯", "text": "哪儿的海不产鱼?(？答：辞海)", "id": "j0941"}, {"cat": "脑筋急转弯", "text": "迄今为止，你所见到的最大的影子是什么?(？答：黑夜，哪是地球的影子)", "id": "j0942"}, {"cat": "脑筋急转弯", "text": "纸上写着某一份命令，但是，看懂此文字的人，却绝对不能宣读命令。那么，纸上写的是什么呢?(？答：级上写着，不要念出此文)", "id": "j0943"}, {"cat": "脑筋急转弯", "text": "蓝色的刀和蓝色的枪，猜一成语。答：刀枪不入(刀枪Blue)", "id": "j0944"}, {"cat": "脑筋急转弯", "text": "司机进入汽车后，第一步要做什么?答：坐下", "id": "j0945"}, {"cat": "脑筋急转弯", "text": "孔子与孟子有何不同?答：孔子的子在左边。孟子的子在上边", "id": "j0946"}, {"cat": "脑筋急转弯", "text": "借什么可以不还?答：借光", "id": "j0947"}, {"cat": "脑筋急转弯", "text": "进动物园看到的第一个动物是什么?答：售票员", "id": "j0948"}, {"cat": "脑筋急转弯", "text": "什么东西倒立后会增加一半?答：6", "id": "j0949"}, {"cat": "脑筋急转弯", "text": "一个离过五十次婚的女人，应该怎么形容她?(一个成语)？答：前“公”尽弃", "id": "j0950"}, {"cat": "脑筋急转弯", "text": "在什么时候1+2不等于3?答：在算错的情况下", "id": "j0951"}, {"cat": "脑筋急转弯", "text": "熊猫怎样才能照彩色照片?答：伸出舌头就可以了", "id": "j0952"}, {"cat": "脑筋急转弯", "text": "米的妈妈是谁?答：花(花生米)", "id": "j0953"}, {"cat": "脑筋急转弯", "text": "南方什么地方最冷?答：南极1冬瓜、黄瓜、西瓜、南瓜都能吃，什么瓜不能吃?答案：傻瓜", "id": "j0954"}, {"cat": "脑筋急转弯", "text": "盆里有6只馒头，6个小朋友每人分到1只，但盆里还留着1只，为什么?答：最后一个小朋友把盆子一起拿走了", "id": "j0955"}, {"cat": "脑筋急转弯", "text": "你能以最快速度，把冰变成水吗?答：把“冰”字去掉两点，就成了“水”", "id": "j0956"}, {"cat": "脑筋急转弯", "text": "冬天，宝宝怕冷，到了屋里也不肯脱帽。可是他见了一个人乖乖地脱下帽，那人是谁?答：理发师", "id": "j0957"}, {"cat": "脑筋急转弯", "text": "老王一天要刮四五十次脸，脸上却仍有胡子。这是什么原因?答：老王是个理发师", "id": "j0958"}, {"cat": "脑筋急转弯", "text": "有一个字，人人见了都会念错。这是什么字?答：这是“错”字", "id": "j0959"}, {"cat": "脑筋急转弯", "text": "小华在家里，和谁长得最像?答：镜中的小华", "id": "j0960"}, {"cat": "脑筋急转弯", "text": "鸡蛋壳有什么用处?答：用来包蛋清和蛋黄", "id": "j0961"}, {"cat": "脑筋急转弯", "text": "不必花力气打的东西是什么?答：打哈欠", "id": "j0962"}, {"cat": "脑筋急转弯", "text": "你能做，我能做，大家都做;一个人能做，两个人不能一起做。这是做什么?答：做梦", "id": "j0963"}, {"cat": "脑筋急转弯", "text": "什么事每人每天都必须认真的做?答：睡觉", "id": "j0964"}, {"cat": "脑筋急转弯", "text": "小明从不念书却得了模范生,为什么？答：小明是聋哑学生", "id": "j0965"}, {"cat": "脑筋急转弯", "text": "什么车子寸步难行?答：风车", "id": "j0966"}, {"cat": "脑筋急转弯", "text": "哪一个月有二十八天?答：每个月都有28天", "id": "j0967"}, {"cat": "脑筋急转弯", "text": "你知道上课睡觉有什么不好吗?答：不如床上舒服嘛", "id": "j0968"}, {"cat": "脑筋急转弯", "text": "什么酒不能喝?答：碘酒", "id": "j0969"}, {"cat": "脑筋急转弯", "text": "什么蛋打不烂，煮不熟，更不能吃?答：考试得的零蛋\"0\"", "id": "j0970"}, {"cat": "脑筋急转弯", "text": "火车由北京到上海需要6小时,行使3小时后,火车该在什么地方?答：在车轨上", "id": "j0971"}, {"cat": "脑筋急转弯", "text": "什么路最窄?答：冤家路窄", "id": "j0972"}, {"cat": "脑筋急转弯", "text": "什么东西不能吃?答：“东西”方向", "id": "j0973"}, {"cat": "脑筋急转弯", "text": "一个人从飞机上掉下来，为什么没摔死呢?答：飞机停在地上", "id": "j0974"}, {"cat": "脑筋急转弯", "text": "一年四季都盛开的花是什么花?答：塑料花", "id": "j0975"}, {"cat": "脑筋急转弯", "text": "什么英文字母最多人喜欢听?答：CD", "id": "j0976"}, {"cat": "脑筋急转弯", "text": "小明知道试卷的答案,为什么还频频看同学的?答：小明是老师", "id": "j0977"}, {"cat": "脑筋急转弯", "text": "用铁锤锤鸡蛋为什么锤不破?答：铁锤当然不会破了31拳击冠军很容易被谁击倒? 答案：瞌睡虫", "id": "j0978"}, {"cat": "脑筋急转弯", "text": "什么事天不知地知，你不知我知?答：鞋底破了", "id": "j0979"}, {"cat": "脑筋急转弯", "text": "一个人在沙滩上行走，但在他的身后却没有发现脚印，为什么?答：他在倒着走", "id": "j0980"}, {"cat": "脑筋急转弯", "text": "一位卡车司机撞倒一个骑摩托车的人，卡车司机受重伤，摩托车骑士却没事，为什么?答：卡车司机当时没开车", "id": "j0981"}, {"cat": "脑筋急转弯", "text": "早晨醒来，每个人都要做的第一件事是什么?答：睁开眼睛", "id": "j0982"}, {"cat": "脑筋急转弯", "text": "你能用蓝笔写出红字来吗?答：写个“红”字有何难", "id": "j0983"}, {"cat": "脑筋急转弯", "text": "汽车在右转弯时,哪只轮胎不转?答：备用胎", "id": "j0984"}, {"cat": "脑筋急转弯", "text": "孔子与孟子有什么区别?答：孔子的子在左边，孟子的子在上边", "id": "j0985"}, {"cat": "脑筋急转弯", "text": "为什么小王从初一到初三就学了一篇课文?答：初一到初三，两天学一课，算不错了!", "id": "j0986"}, {"cat": "脑筋急转弯", "text": "一个人空肚子最多能吃几个鸡蛋?答：一个。因为吃了一个后就不是空肚子了", "id": "j0987"}, {"cat": "脑筋急转弯", "text": "当哥伦布一只脚迈上新大陆后，紧接着做什么?答：迈上另一只脚", "id": "j0988"}, {"cat": "脑筋急转弯", "text": "世界上最小的岛是什么?答：马路上的安全岛", "id": "j0989"}, {"cat": "脑筋急转弯", "text": "把一只鸡和一只鹅同时放在冰箱里，为什么鸡死了鹅没死?答：企鹅嘛", "id": "j0990"}, {"cat": "脑筋急转弯", "text": "四个人在一间小屋里打麻将(没有其他人在看着)，这时_来了，四个人都跑了，可是_到了屋里又抓到一个人，为什么?答：四个人在屋里打一个叫“麻将”的人，_抓到的是他", "id": "j0991"}, {"cat": "脑筋急转弯", "text": "万兽大王是谁?答：动物园园长", "id": "j0992"}, {"cat": "脑筋急转弯", "text": "能否用树叶遮住天空?答：只要用树叶盖住眼睛", "id": "j0993"}, {"cat": "脑筋急转弯", "text": "为什么黑人喜欢吃白色巧克力?wenwen？答：害怕咬到自己的手", "id": "j0994"}, {"cat": "脑筋急转弯", "text": "口吃的人最吃亏的是?答
