<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<title>华容道</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%238f2d28'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23f0e2cf' stroke-width='2'/%3E%3Ctext x='32' y='38' text-anchor='middle' font-size='16' fill='%23f0e2cf' font-family='serif'%3E%E6%9B%B9%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --c: 76px;
    --ink: #0c0b0a;
    --paper: #f3e6cf;
    --muted: #b7a38c;
    --gold: #e4c48a;
    --gold-dim: rgba(228, 196, 138, .28);
    --cinnabar: #8f2d28;
    --frame: 14px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    color: var(--paper);
    font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "PMingLiU", "Songti TC", serif;
    background: #090807;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; appearance: none; -webkit-appearance: none; }
  button:disabled { cursor: default; opacity: .32; }
  button:focus { outline: none; }
  button:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }

  .sky {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background:
      radial-gradient(ellipse 42% 32% at 76% 14%, rgba(232, 206, 160, .16), transparent 62%),
      radial-gradient(ellipse 70% 46% at 50% 112%, rgba(92, 28, 18, .28), transparent 58%),
      linear-gradient(180deg, #161310 0%, #0d0c0a 46%, #070605 100%);
  }
  .moon {
    position: absolute; right: 11vw; top: 8vh; width: 92px; height: 92px; border-radius: 50%;
    background:
      radial-gradient(circle at 38% 38%, #fff8ea 0 18%, #f0e2c4 42%, #c9b48a 72%, rgba(201, 180, 138, 0) 73%);
    box-shadow: 0 0 40px 16px rgba(240, 220, 180, .18), 0 0 120px 40px rgba(240, 210, 160, .08);
    transform: translate3d(var(--px, 0), var(--py, 0), 0);
    opacity: .9;
  }
  .moon::after {
    content: ""; position: absolute; inset: 18% 8% auto auto; width: 34%; height: 34%; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, transparent 40%, rgba(180, 150, 100, .25) 41% 70%, transparent 71%);
  }
  .fog {
    position: absolute; left: -10%; width: 70%; height: 28vh; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(243, 230, 207, .08), transparent 68%);
    filter: blur(8px);
    animation: drift 28s ease-in-out infinite alternate;
  }
  .fog.f1 { top: 18%; }
  .fog.f2 { top: 48%; left: 30%; animation-duration: 36s; opacity: .7; }
  .mount { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; display: block;
    transform: translate3d(calc(var(--px, 0px) * .35), 0, 0); }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(8vw); } }

  .inscription {
    position: fixed; left: max(18px, 3vw); top: 18vh; z-index: 1; margin: 0;
    writing-mode: vertical-rl; letter-spacing: .55em; font-size: 15px; color: rgba(228, 196, 138, .45);
    pointer-events: none;
  }

  #fx { position: fixed; inset: 0; z-index: 3; width: 100%; height: 100%; pointer-events: none; }

  body::before {
    content: ""; position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: .05;
    mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(255,255,255,.55) .45px, transparent .55px);
    background-size: 3px 3px;
  }

  .column {
    position: relative; z-index: 2;
    width: min(460px, 100%);
    margin: 0 auto;
    padding:
      max(18px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(22px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .eyebrow {
    margin: 0 0 6px; font-size: 12px; letter-spacing: .34em; color: var(--muted);
  }
  h1 {
    margin: 0;
    font-size: clamp(46px, 12vw, 68px);
    font-weight: 600;
    line-height: .92;
    letter-spacing: .22em;
    text-indent: .22em;
    background: linear-gradient(180deg, #fff6e4 8%, #e4c48a 42%, #9a7040 88%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.55));
  }
  #mute {
    width: 42px; height: 42px; border-radius: 50%; position: relative;
    border: 1px solid var(--gold-dim); background: rgba(255,255,255,.03); color: var(--gold);
    display: grid; place-items: center; flex: none;
  }
  #mute.muted { color: var(--muted); }
  #mute.muted::after {
    content: ""; position: absolute; width: 1.5px; height: 18px; background: currentColor; transform: rotate(42deg);
  }

  .chapter { margin: 14px 0 0; font-size: 15px; letter-spacing: .18em; }
  .line { margin: 6px 0 0; color: var(--muted); font-size: 14px; letter-spacing: .08em; min-height: 1.4em; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 12px; }
  .stat {
    text-align: center; padding: 8px 4px 9px; border-radius: 14px;
    border: 1px solid var(--gold-dim);
    background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(0,0,0,.22));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  }
  .stat b {
    display: block; font-size: 24px; font-weight: 600; letter-spacing: .04em;
    font-variant-numeric: tabular-nums; line-height: 1.15;
  }
  .stat b.tick { animation: tick .32s cubic-bezier(.2,.8,.2,1); }
  .stat span { display: block; margin-top: 2px; font-size: 11px; letter-spacing: .28em; color: var(--muted); }
  @keyframes tick { from { transform: translateY(-35%); opacity: .15; } to { transform: none; opacity: 1; } }

  .stage { padding: 2px 0 calc(var(--c) * 1.08); display: grid; place-items: center; }

  .shell {
    position: relative;
    width: calc(var(--c) * 4 + var(--frame) * 2);
    height: calc(var(--c) * 5 + var(--frame) * 2);
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(255, 226, 186, .16), transparent 22px),
      linear-gradient(165deg, #5a3b26 0%, #2a1a12 18%, #140e0b 62%, #0c0908 100%);
    box-shadow:
      inset 0 0 0 1px rgba(228, 196, 138, .38),
      inset 0 0 0 3px #120c09,
      0 22px 50px rgba(0,0,0,.55),
      0 2px 0 rgba(255, 220, 180, .08);
    animation: float 7.5s ease-in-out infinite;
  }
  body.dragging .shell { animation-play-state: paused; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .corner {
    position: absolute; width: 14px; height: 14px; z-index: 5; pointer-events: none;
    border: 1.5px solid rgba(228, 196, 138, .75);
  }
  .corner.tl { top: 7px; left: 7px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 7px; right: 7px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 7px; left: 7px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 7px; right: 7px; border-left: 0; border-top: 0; }

  .felt {
    position: absolute; z-index: 4;
    left: var(--frame); top: var(--frame);
    width: calc(var(--c) * 4); height: calc(var(--c) * 5);
    border-radius: 6px;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(120, 64, 36, .28), transparent 46%),
      linear-gradient(180deg, #2c1d14, #120e0b 80%);
    box-shadow: inset 0 10px 22px rgba(0,0,0,.48), inset 0 0 0 1px rgba(228, 196, 138, .08);
    touch-action: none;
    overflow: visible;
  }
  .grid {
    position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background-image:
      linear-gradient(to right, rgba(228, 196, 138, .09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(228, 196, 138, .09) 1px, transparent 1px);
    background-size: var(--c) var(--c);
  }
  .marks, .pieces { position: absolute; inset: 0; }

  .mark, .preview {
    position: absolute; left: 0; top: 0; border-radius: calc(var(--c) * .11);
    transform: translate3d(calc(var(--x) * var(--c)), calc(var(--y) * var(--c)), 0);
    width: calc(var(--w) * var(--c)); height: calc(var(--h) * var(--c));
    background: rgba(228, 196, 138, .08);
    box-shadow: inset 0 0 0 1.5px rgba(228, 196, 138, .55);
    animation: markin .28s ease both;
  }
  .mark { cursor: pointer; }
  .mark.hint {
    background: rgba(228, 196, 138, .16);
    animation: hintpulse 1.4s ease-in-out infinite;
  }
  .preview { pointer-events: none; opacity: .85; }
  @keyframes markin { from { opacity: 0; } to { opacity: 1; } }
  @keyframes hintpulse {
    0%, 100% { box-shadow: inset 0 0 0 1.5px rgba(228, 196, 138, .45); }
    50% { box-shadow: inset 0 0 0 2px rgba(255, 228, 180, .95), 0 0 18px rgba(228, 196, 138, .35); }
  }

  .coach {
    position: absolute; left: calc(var(--c) * 1); top: calc(var(--c) * 2);
    width: calc(var(--c) * 2); height: calc(var(--c) * 2);
    border-radius: calc(var(--c) * .12);
    background: rgba(180, 52, 42, .22);
    box-shadow: inset 0 0 0 1.5px rgba(240, 180, 140, .45);
    pointer-events: none;
    animation: coach 1.9s ease-in-out infinite;
  }
  @keyframes coach {
    0%, 18% { transform: translateY(0); opacity: .2; }
    68% { transform: translateY(var(--c)); opacity: .7; }
    100% { transform: translateY(var(--c)); opacity: 0; }
  }

  .piece {
    position: absolute; left: 0; top: 0; margin: 0; border: 0; padding: calc(var(--c) * .046);
    width: calc(var(--w) * var(--c)); height: calc(var(--h) * var(--c));
    background: none; transform-origin: 0 0; touch-action: none; cursor: grab;
    -webkit-user-select: none;
    transition: opacity .4s ease;
  }
  .piece:active { cursor: grabbing; }
  .piece .shadow {
    position: absolute; left: 14%; right: 14%; bottom: 8%; height: 14%;
    background: rgba(0,0,0,.55); filter: blur(5px); border-radius: 50%; pointer-events: none;
    opacity: calc(.25 + var(--lift, 0) * .4);
    transform: translateY(calc(var(--lift, 0) * 16px)) scaleX(calc(1 + var(--lift, 0) * .18));
  }
  .piece .side {
    position: absolute;
    left: calc(var(--c) * .046); right: calc(var(--c) * .046);
    top: calc(var(--c) * .07); bottom: calc(var(--c) * .03);
    border-radius: calc(var(--c) * .11);
    background: linear-gradient(#3a2218, #0a0706);
    transform: translateY(4px);
    pointer-events: none;
  }
  .piece .body {
    position: relative; z-index: 1; height: 100%; border-radius: calc(var(--c) * .11);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -8px 14px rgba(0,0,0,.28),
      0 8px 14px rgba(0,0,0,.28);
    overflow: hidden;
  }
  .piece .body::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at var(--mx, 30%) var(--my, 18%), rgba(255,244,226,.5), transparent 38%);
    mix-blend-mode: soft-light;
  }
  .piece.on .body { box-shadow:
      inset 0 0 0 1.5px rgba(255, 236, 200, .85),
      inset 0 1px 0 rgba(255,255,255,.3),
      inset 0 -8px 14px rgba(0,0,0,.28),
      0 8px 14px rgba(0,0,0,.28); }
  .piece strong { font-weight: 600; position: relative; letter-spacing: .14em; text-indent: .14em;
    text-shadow: 0 1px 0 rgba(255,255,255,.2), 0 -1px 0 rgba(0,0,0,.45); }
  .piece em { font-style: normal; position: relative; letter-spacing: .32em; text-indent: .32em; opacity: .72;
    font-size: calc(var(--c) * .15); }
  .t-C strong { font-size: calc(var(--c) * .4); }
  .t-H strong { font-size: calc(var(--c) * .34); }
  .t-V strong { writing-mode: vertical-rl; font-size: calc(var(--c) * .36); letter-spacing: .2em; text-indent: 0; }
  .t-S strong { font-size: calc(var(--c) * .4); letter-spacing: 0; text-indent: 0; }
  .seal {
    position: absolute; right: 7%; bottom: 7%;
    width: calc(var(--c) * .38); height: calc(var(--c) * .38);
    border: 1px solid rgba(248, 231, 200, .72); border-radius: 50%;
    display: grid; place-items: center; font-size: calc(var(--c) * .18); font-weight: 500;
    transform: rotate(-12deg); opacity: .88;
  }

  .p-cao .body { color: #f8e7c8; background:
    radial-gradient(120% 90% at var(--mx, 30%) var(--my, 16%), rgba(255,214,184,.42), transparent 42%),
    linear-gradient(165deg, #c14b3e 0%, #8a2a24 46%, #4e1412 100%); }
  .p-guan .body { color: #e7f6ee; background:
    radial-gradient(120% 90% at var(--mx, 30%) var(--my, 16%), rgba(210,255,230,.34), transparent 42%),
    linear-gradient(165deg, #2f6d58, #173e34 55%, #0e2620); }
  .p-zhang .body { color: #f3d7cc; background:
    radial-gradient(120% 80% at var(--mx, 30%) var(--my, 16%), rgba(255,190,170,.25), transparent 42%),
    linear-gradient(165deg, #3c342f, #1a1614 58%, #0e0c0b);
    box-shadow: inset 0 0 0 1px rgba(168, 64, 48, .55), inset 0 1px 0 rgba(255,255,255,.2), inset 0 -8px 14px rgba(0,0,0,.3), 0 8px 14px rgba(0,0,0,.28); }
  .p-zhao .body { color: #e7eef4; background:
    radial-gradient(120% 90% at var(--mx, 30%) var(--my, 16%), rgba(220,232,255,.38), transparent 42%),
    linear-gradient(165deg, #3e5364, #1c2832 55%, #12181c); }
  .p-ma .body { color: #f8e6cc; background:
    radial-gradient(120% 90% at var(--mx, 30%) var(--my, 16%), rgba(255,220,170,.36), transparent 42%),
    linear-gradient(165deg, #8a5a32, #4a2e18 58%, #2a1a0e); }
  .p-huang .body { color: #f8efd4; background:
    radial-gradient(120% 90% at var(--mx, 30%) var(--my, 16%), rgba(255,230,170,.32), transparent 42%),
    linear-gradient(165deg, #8d7340, #4e3d1e 55%, #2c220f); }
  .p-s1 .body, .p-s2 .body, .p-s3 .body, .p-s4 .body { color: #f6efe4; background:
    radial-gradient(120% 90% at var(--mx, 30%) var(--my, 16%), rgba(255,255,255,.26), transparent 42%),
    linear-gradient(165deg, #6e5e4e, #3e342c 60%, #2a231c); }

  .ghost {
    position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3;
    padding: calc(var(--c) * .046);
    border-radius: calc(var(--c) * .11);
    opacity: .42;
    box-shadow: inset 0 0 0 1.5px rgba(255, 228, 180, .8), 0 0 18px rgba(228, 196, 138, .25);
    background: rgba(228, 196, 138, .14);
  }

  .gate {
    position: absolute; z-index: 3;
    top: calc(var(--frame) + var(--c) * 5 - 1px);
    left: calc(var(--frame) + var(--c));
    width: calc(var(--c) * 2);
    height: calc(var(--c) * .9);
    border-radius: 0 0 16px 16px;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(255, 214, 150, calc(.18 + var(--heat, 0) * .45)), rgba(20, 10, 8, .2) 72%),
      linear-gradient(180deg, #24140f, #0a0706);
    box-shadow: inset 0 0 0 1px rgba(228, 196, 138, .32), inset 0 10px 18px rgba(255, 200, 120, calc(.12 + var(--heat, 0) * .35));
  }
  .gate .breath {
    position: absolute; left: -10%; right: -10%; top: -30%; height: 90%;
    background: radial-gradient(ellipse at 50% 0%, rgba(255, 214, 150, .85), transparent 68%);
    opacity: calc(.28 + var(--heat, 0) * .7);
    animation: breath 2.8s ease-in-out infinite;
    pointer-events: none;
  }
  .gate span {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    letter-spacing: .42em; text-indent: .42em; font-size: 12px; color: rgba(243, 230, 207, .72);
  }
  @keyframes breath { 0%, 100% { transform: scaleX(.86); opacity: .55; } 50% { transform: scaleX(1); opacity: 1; } }
  .gate.open .breath { animation-duration: 1.1s; }

  .ripple {
    position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    border: 1.5px solid rgba(228, 196, 138, .7); pointer-events: none;
    animation: ripple .55s ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(7); opacity: 0; } }

  .controls { position: relative; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 2px; }
  .ctrl {
    height: 42px; border-radius: 999px; letter-spacing: .2em; text-indent: .2em;
    border: 1px solid var(--gold-dim); background: rgba(255,255,255,.03);
  }
  .ctrl.wait { animation: hintpulse 1s ease-in-out infinite; }
  @media (hover: hover) {
    .ctrl:not(:disabled):hover { background: rgba(228, 196, 138, .1); border-color: rgba(228, 196, 138, .55); }
  }
  .ctrl:not(:disabled):active { transform: translateY(1px); }

  .levels {
    display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding: 2px 2px 10px;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .levels::-webkit-scrollbar { display: none; }
  .lv {
    scroll-snap-align: start; flex: 0 0 112px; text-align: left; border-radius: 14px; padding: 8px 8px 9px;
    border: 1px solid rgba(228, 196, 138, .16); background: rgba(255,255,255,.03); position: relative;
  }
  .lv.on { border-color: rgba(228, 196, 138, .72); background: rgba(228, 196, 138, .08); }
  .lv strong { display: block; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
  .lv em { display: block; margin-top: 2px; font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .lv.cleared::after {
    content: ""; position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--cinnabar); box-shadow: 0 0 0 3px rgba(143, 45, 40, .25);
  }
  .lv.perfect::after { background: var(--gold); box-shadow: 0 0 0 3px rgba(228, 196, 138, .2); }
  .mini { display: grid; grid-template-columns: repeat(4, 8px); grid-auto-rows: 8px; gap: 2px; margin-bottom: 7px; }
  .mini i { display: block; border-radius: 1px; background: transparent; }
  .mini i.C { background: #8f2d28; }
  .mini i.H { background: #1f6a56; }
  .mini i.V { background: #8d6232; }
  .mini i.S { background: #b5a48e; }

  .fine { margin: 2px 0 0; text-align: center; color: rgba(183, 163, 140, .8); font-size: 12px; letter-spacing: .06em; }

  .overlay {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  }
  .overlay.show { pointer-events: auto; background: linear-gradient(180deg, transparent 0 58%, rgba(0,0,0,.55) 100%); }
  .stamp {
    position: relative; width: 74px; height: 74px; margin: 0 auto 2px;
    border: 3px solid rgba(176, 42, 36, .92); border-radius: 50%; color: #b02a24;
    display: grid; place-items: center; font-size: 38px; letter-spacing: 0; text-indent: 0;
    background: rgba(40, 12, 10, .35); opacity: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(176, 42, 36, .4);
    transform: rotate(-8deg) scale(1.35);
  }
  .overlay.stamped .stamp { animation: stamp .62s cubic-bezier(.16, .9, .24, 1) forwards; }
  @keyframes stamp {
    0% { opacity: 0; transform: rotate(-14deg) scale(1.65); filter: blur(8px); }
    58% { opacity: 1; transform: rotate(-6deg) scale(.94); filter: blur(0); }
    100% { opacity: 1; transform: rotate(-8deg) scale(1); filter: blur(0); }
  }
  .sheet {
    width: min(460px, 100%);
    padding: 22px 20px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(28, 18, 14, .94), rgba(12, 9, 8, .96));
    border-top: 1px solid rgba(228, 196, 138, .28);
    box-shadow: 0 -20px 60px rgba(0,0,0,.45);
    transform: translateY(110%);
    transition: transform .7s cubic-bezier(.16, 1, .3, 1);
    text-align: center;
  }
  .overlay.sheet-in .sheet { transform: translateY(0); }
  .sheet .kicker { margin: 0; letter-spacing: .42em; text-indent: .42em; color: var(--gold); font-size: 12px; }
  .sheet h2 { margin: 8px 0 0; font-size: 32px; font-weight: 600; letter-spacing: .2em; text-indent: .2em; }
  .sheet .result { margin: 10px 0 0; font-size: 16px; letter-spacing: .08em; }
  .sheet .sub { margin: 6px 0 0; color: var(--muted); min-height: 1.3em; }
  .sheet .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .sheet button { height: 44px; border-radius: 999px; letter-spacing: .18em; text-indent: .18em; }
  #again { border: 1px solid var(--gold-dim); background: transparent; }
  #next { border: 0; background: linear-gradient(180deg, #a33b34, #7a241f); color: #fff6ea; }

  @media (max-width: 1080px) { .inscription { display: none; } }
  @media (max-width: 680px) {
    .moon { display: none; }
    h1 { font-size: 42px; }
  }

function fits(occ, x, y, w, h, ox, oy) {

  for (let yy = 0; yy < h; yy++) {
    for (let xx = 0; xx < w; xx++) {
      const cx = x + xx, cy = y + yy;
      const ch = occ[cy * W + cx];
      if (ch === '.') continue;
      if (cx >= ox && cx < ox + w && cy >= oy && cy < oy + h) continue;

}

    const q = [i];
    const vis = new Set([i]);
    for (let qi = 0; qi < q.length; qi++) {
      const cur = q[qi];
      const cx = cur % W, cy = (cur / W) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
        if (!fits(occ, nx, ny, w, h, ox, oy)) continue;

    const path = pathFromMap(map, p.tx, p.ty, info.mark.x, info.mark.y);
    commitPath(p, path);
    return;
  }
  if (!info.dragging) {
    if (info.piece) {
      if (selected === info.piece) clearSelect();
      else selectPiece(info.piece);
    }
    return;
  }
  endDrag(info.piece);
}
function endDrag(p) {
  p.stretchX = p.stretchY = 0;
  const dist = Math.hypot(p.x - p.tx, p.y - p.ty);
  let tx = p.tx, ty = p.ty;
  if (dist >= 0.2 && p.reach) {
    let bestD = Infinity;
    p.reach.forEach((_, idx) => {
      const x = idx % W, y = (idx / W) | 0;
      const d = (x - p.x) ** 2 + (y - p.y) ** 2;
      if (d < bestD) { bestD = d; tx = x; ty = y; }
    });
  }
  if (tx === p.tx && ty === p.ty) {
    p.mode = 'idle';
    p.armSound = dist > 0.08;
    showMarks(p);
    return;
  }
  const path = pathFromMap(p.reach, p.tx, p.ty, tx, ty);
  commitPath(p, path);
}

function farthest(p, dx, dy) {
  const blocked = blockedSet(p);
  let x = p.tx, y = p.ty;
  while (canPlace(p, x + dx, y + dy, p.tx, p.ty, blocked)) { x += dx; y += dy; }
  return { x, y };
}
function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'z') { undo(); return; }
  if (k === 'r') { resetLevel(); return; }
  if (k === 'h') { askHint(); return; }
  if (k === 'm') { toggleMute(); return; }
  if (k === 'escape') { stopDemo(); clearSelect(); renderHud(); return; }
  if (won || busy() || e.repeat) return;
  const arrow = { arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0] }[k];
  if (!arrow || !selected) return;
  e.preventDefault();
  AudioBus.ensure();
  const dest = farthest(selected, arrow[0], arrow[1]);
  if (dest.x === selected.tx && dest.y === selected.ty) {
    selected.shake = 1;
    return;
  }
  const map = reachMap(selected);
  commitPath(selected, pathFromMap(map, selected.tx, selected.ty, dest.x, dest.y));
}

const DUST = { cao: '#e7b089', guan: '#b7e6d2', zhang: '#e0b8aa', zhao: '#d5e2ee', ma: '#f0d0a8', huang: '#f0e0b4', s1: '#e6d7c4', s2: '#e6d7c4', s3: '#e6d7c4', s4: '#e6d7c4' };
const motes = [];
function pushMote(m) { if (motes.length < 240) motes.push(m); }
function burstPiece(p, n) {
  if (REDUCE) return;
  const r = p.el.getBoundingClientRect();
  const color = DUST[p.id] || '#e4c48a';
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 18 + Math.random() * 50;
    pushMote({
      x: r.left + r.width * (0.2 + Math.random() * 0.6),
      y: r.top + r.height * (0.55 + Math.random() * 0.3),
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 16,
      life: 0.45 + Math.random() * 0.25, age: 0,
      r: 1.1 + Math.random() * 1.6, color, g: 40, kind: 'dust'
    });
  }
}
function spawnDrag(p, x, y) {
  pushMote({
    x: x + (Math.random() - 0.5) * 8,
    y: y + (Math.random() - 0.5) * 8,
    vx: (Math.random() - 0.5) * 16,
    vy: 8 + Math.random() * 16,
    life: 0.32, age: 0, r: 1 + Math.random(),
    color: DUST[p.id] || '#e4c48a', g: 20, kind: 'dust'
  });
}
function spawnRipple(p) {
  const d = document.createElement('div');
  d.className = 'ripple';
  d.style.left = ((p.tx + p.w / 2) * cell) + 'px';
  d.style.top = ((p.ty + p.h / 2) * cell) + 'px';
  felt.appendChild(d);
  d.addEventListener('animationend', () => d.remove());
}
function burstWin() {
  if (REDUCE) return;
  const r = gate.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + 8;
  for (let i = 0; i < 46; i++) {
    const a = -Math.PI * (0.15 + Math.random() * 0.7);
    const s = 40 + Math.random() * 160;
    pushMote({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.9 + Math.random() * 0.6, age: 0,
      r: 1.4 + Math.random() * 2.2, color: i % 3 ? '#f0d7a4' : '#fff4e0',
      g: 30, kind: 'dust'
    });
  }
  for (let i = 0; i < 14; i++) {
    pushMote({
      x: x + (Math.random() - 0.5) * 40,
      y: y,
      vx: (Math.random() - 0.5) * 70,
      vy: -20 - Math.random() * 80,
      life: 2.4 + Math.random(), age: 0,
      r: 4 + Math.random() * 3, color: i % 2 ? '#c45048' : '#f3d2c6',
      g: 18, kind: 'petal', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 3
    });
  }
  const shock = document.createElement('div');
  shock.className = 'ripple';
  shock.style.left = (cell + cell) + 'px';
  shock.style.top = (cell * 5) + 'px';
  shock.style.borderColor = 'rgba(255,220,170,.85)';
  felt.appendChild(shock);
  shock.addEventListener('animationend', () => shock.remove());
}
function spawnEmber() {
  if (REDUCE || motes.length > 80 || document.hidden) return;
  pushMote({
    x: Math.random() * innerWidth,
    y: innerHeight * (0.45 + Math.random() * 0.5),
    vx: (Math.random() - 0.5) * 8,
    vy: -8 - Math.random() * 14,
    life: 4 + Math.random() * 4, age: 0,
    r: 1 + Math.random() * 1.4,
    color: Math.random() > 0.7 ? '#f0c48a' : '#c4865a',
    g: -2, kind: 'ember'
  });
}

function paintPiece(p) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const snap = (v) => Math.round(v * dpr) / dpr;
  const x = snap((p.x + p.stretchX) * cell);
  const y = snap((p.y + p.stretchY) * cell - p.lift * 12);
  p.el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${p.rot.toFixed(2)}deg) scaleY(${p.squash.toFixed(3)})`;
  p.el.style.setProperty('--lift', p.lift.toFixed(3));
  p.el.style.zIndex = p.mode === 'drag' || p.lift > 0.25 ? '6' : (selected === p ? '4' : '1');
}
function frame(now) {
  const dt = Math.min(0.032, (now - (frame.then || now)) / 1000 || 0.016);
  frame.then = now;
  for (const p of pieces) {
    if (p.mode === 'hold') {
      p.holdT -= dt;
      if (p.holdT <= 0) {
        p.mode = 'idle';
        p.el.style.opacity = '1';
      }
    } else if (p.mode === 'glide') {
      const g = p.glide;
      g.t += dt;
      const u = clamp(g.t / g.dur, 0, 1);
      const e = g.ease === 'in' ? easeIn(u) : g.ease === 'out' ? 1 - Math.pow(1 - u, 3) : easeInOut(u);
      const pos = pointAlong(g.pts, e);
      const prev = p.x;
      p.x = pos.x;
      p.y = pos.y;
      p.rot = clamp((p.x - prev) / Math.max(dt, 0.008) * 0.12, -1.6, 1.6);
      if (u >= 1) {
        if (g.exit) {
          p.exited = true;
          p.x = 1; p.y = 3.58;
          p.vx = p.vy = 0;
          p.mode = 'idle'; p.glide = null; p.settled = true; p.rot = 0;
        } else finishMove(p);
      }
    } else if (p.mode === 'drag') {
      p.rot += (clamp(p.stretchX * -4, -1.4, 1.4) - p.rot) * Math.min(1, dt * 14);
    } else if (p.exited) {
      p.rot += (0 - p.rot) * Math.min(1, dt * 8);
    } else {
      const k = 230, c = 26;
      p.vx += ((p.tx - p.x) * k - p.vx * c) * dt;
      p.vy += ((p.ty - p.y) * k - p.vy * c) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += (0 - p.rot) * Math.min(1, dt * 10);
      p.stretchX += (0 - p.stretchX) * Math.min(1, dt * 16);
      p.stretchY += (0 - p.stretchY) * Math.min(1, dt * 16);
      if (!p.settled && Math.abs(p.tx - p.x) < 0.004 && Math.abs(p.ty - p.y) < 0.004 && Math.abs(p.vx) < 0.05 && Math.abs(p.vy) < 0.05) {
        finishMove(p);
      }
    }
    const liftTo = p.mode === 'drag' ? 1 : p.mode === 'glide' ? 0.28 : 0;
    p.lift += (liftTo - p.lift) * Math.min(1, dt * 16);
    p.squash += (1 - p.squash) * Math.min(1, dt * 14);
    if (p.shake > 0) {
      p.shake = Math.max(0, p.shake - dt * 1.8);
      p.rot = Math.sin(p.shake * 36) * p.shake * 1.5;
    }
    paintPiece(p);
  }
  if (ghost) {
    ghost.t += dt;
    const u = clamp(ghost.t / ghost.dur, 0, 1);
    const pos = pointAlong(ghost.pts, easeInOut(u));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const snap = (v) => Math.round(v * dpr) / dpr;
    ghost.el.style.transform = `translate3d(${snap(pos.x * cell)}px, ${snap(pos.y * cell)}px, 0)`;
    ghost.el.style.opacity = String(0.45 * (1 - Math.max(0, u - 0.82) / 0.18));
    if (u >= 1) clearGhost();
  }
  const cao = caoPiece();
  if (cao) {
    const heat = won ? 1 : clamp((cao.y - 1.4) / 2.4, 0, 1);
    gate.style.setProperty('--heat', heat.toFixed(3));
  }
  const sec = Math.floor(elapsed() / 1000);
  if (sec !== shownSecond && playStarted) {
    shownSecond = sec;
    $('time').textContent = fmt(elapsed());
  }
  if (Math.random() < 0.08) spawnEmber();
  stepMotes(dt);
  requestAnimationFrame(frame);
}
function stepMotes(dt) {
  ctx2.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i];
    m.age += dt;
    if (m.age >= m.life) { motes.splice(i, 1); continue; }
    m.vy += (m.g || 0) * dt;
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    const a = 1 - m.age / m.life;
    ctx2.save();
    ctx2.globalAlpha = Math.max(0, a) * (m.kind === 'ember' ? 0.75 : 0.9);
    ctx2.translate(m.x, m.y);
    if (m.kind === 'petal') {
      m.rot += m.vr * dt;
      ctx2.rotate(m.rot);
      ctx2.fillStyle = m.color;
      ctx2.beginPath();
      ctx2.ellipse(0, 0, m.r, m.r * 0.55, 0, 0, Math.PI * 2);
      ctx2.fill();
    } else {
      ctx2.fillStyle = m.color;
      ctx2.beginPath();
      ctx2.arc(0, 0, m.r, 0, Math.PI * 2);
      ctx2.fill();
    }
    ctx2.restore();
  }
}

function toggleMute() {
  save.mute = !save.mute;
  AudioBus.ensure();
  AudioBus.mute(!!save.mute);
  $('mute').classList.toggle('muted', !!save.mute);
  $('mute').setAttribute('aria-pressed', save.mute ? 'true' : 'false');
  $('mute').setAttribute('aria-label', save.mute ? '打开声音' : '关闭声音');
  persist();
}

function boot() {
  renderLevels();
  layout();
  if (save.mute) {
    $('mute').classList.add('muted');
    $('mute').setAttribute('aria-pressed', 'true');
    $('mute').setAttribute('aria-label', '打开声音');
  }
  const start = Number.isInteger(save.level) ? save.level : 0;
  loadLevel(clamp(start, 0, LEVELS.length - 1));
  felt.addEventListener('pointerdown', onDown, { passive: false });
  felt.addEventListener('pointermove', onMove);
  felt.addEventListener('pointerup', onUp);
  felt.addEventListener('pointercancel', onUp);
  felt.addEventListener('contextmenu', (e) => e.preventDefault());
  $('undo').addEventListener('click', () => { AudioBus.ensure(); undo(); });
  $('reset').addEventListener('click', () => { AudioBus.ensure(); resetLevel(); });
  $('hint').addEventListener('click', askHint);
  $('demo').addEventListener('click', startDemo);
  $('mute').addEventListener('click', toggleMute);
  $('again').addEventListener('click', () => { AudioBus.ensure(); resetLevel(); });
  $('next').addEventListener('click', () => { AudioBus.ensure(); loadLevel(levelIndex + 1); });
  addEventListener('keydown', onKey);
  addEventListener('resize', layout);
  addEventListener('pointermove', (e) => {
    const nx = (e.clientX / innerWidth) * 2 - 1;
    const ny = (e.clientY / innerHeight) * 2 - 1;
    document.body.style.setProperty('--px', (nx * -14) + 'px');
    document.body.style.setProperty('--py', (ny * -10) + 'px');
    if (e.target.closest && e.target.closest('.piece')) return;
    for (const p of pieces) {
      const r = p.el.getBoundingClientRect();
      if (!r.width) continue;
      p.el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
      p.el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
    }
  });
  requestAnimationFrame(frame);
}
boot();
</script>
