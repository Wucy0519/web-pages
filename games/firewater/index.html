function burst(x, y, n, color, opt) {
  opt = opt || {};
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU;
    const sp = (opt.sp || 80) * (0.35 + Math.random());
    parts.push({
      x, y,
      vx: Math.cos(a) * sp + (opt.vx || 0),
      vy: Math.sin(a) * sp + (opt.vy || 0),
      g: opt.g != null ? opt.g : 420,
      life: opt.life || (0.4 + Math.random() * 0.5),
      max: opt.life || 0.9,
      size: opt.size || (1.6 + Math.random() * 2.4),
      color, kind: opt.kind || "dot",
      add: opt.add !== false,
      rot: Math.random() * TAU,
      spin: (Math.random() - 0.5) * 8,
      drag: opt.drag || 0
    });
  }
}

    if (g.got) continue;
    const owner = players.find(p => p.kind === g.kind && p.alive && !p.entering);
    if (!owner) continue;
    const px = owner.x + owner.w / 2, py = owner.y + owner.h * 0.42;
    const dx = px - g.x, dy = py - (g.y + Math.sin(time * 2.4 + g.ph) * 5);

    if (Math.abs(p.x + p.w / 2 - (d.x + d.w / 2)) < 32 && Math.abs(p.y + p.h - (d.y + d.h)) < 14) {

      vx: (Math.random() - 0.5) * 20, vy: -20 - Math.random() * 30,
      g: -10, life: 0.6, max: 0.6, size: 2, color: "#ffe2a8", add: true, kind: "dot"

  }

  updateLiquids(dt);
  updateParts(dt);
  updateCamera(dt);
  if (level.theme !== "sanctum" && level.theme !== "dusk" && Math.random() < dt * 0.08) {
    SFX.tone(1200 + Math.random() * 700, 0.07, "sine", 0.012);
  }
}

function buildForest(themeName) {

    const w = Math.floor(cssW * factor);

  g.addColorStop(1, `rgba(120,200,255,${0.15 + k * 0.6})`);

  ctx.lineWidth = 2;

  ctx.moveTo(ax, ay);
  const mx = (ax + bx) / 2, my = (ay + by) / 2 - 16 - k * 10;
  ctx.quadraticCurveTo(mx, my, bx, by);
  ctx.stroke();
  const u = (time * 0.7) % 1;
  const px = lerp(ax, bx, u) + Math.sin(u * Math.PI) * 0;
  const py = lerp(ay, by, u) - Math.sin(u * Math.PI) * 18;
  ctx.fillStyle = "#fff6dd";
  ctx.beginPath(); ctx.arc(px, py, 2.4 + k * 2, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawParts(space) {
  for (const p of parts) {
    if ((p.space || "world") !== space) continue;
    const a = clamp(p.life / (p.max || 0.5), 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    if (p.add) ctx.globalCompositeOperation = "lighter";
    if (p.kind === "ring") {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (1 - a) * (p.size || 10) * 4 + 4, 0, TAU);
      ctx.stroke();
    } else if (p.kind === "leaf" || p.kind === "shard") {
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot || 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, TAU);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.4, p.size * (0.6 + a * 0.5)), 0, TAU);
      ctx.fill();

    ctx.restore();
  }

function drawFlies() {

  for (const g of level.gems) if (!g.got) lights.push([g.x, g.y, 54, g.kind === "fire" ? glows.fire : glows.ice, 0.7]);

function drawCover() {

  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let y = 0; y <= cssH; y += 12) ctx.lineTo(mid * c + wav(y, 1), y);

  ctx.closePath();
  const gi = ctx.createLinearGradient(cssW, 0, mid, cssH);
  gi.addColorStop(0, "#7ecbff"); gi.addColorStop(1, "#1a4e9a");
  ctx.fillStyle = gi; ctx.fill();

  for (const leaf of frontLeaves) {
    if (mode === "play") {
      leaf.y += leaf.sp * dt * 40;
      leaf.rot += leaf.rs * dt;
      if (leaf.y > 1.08) { leaf.y = -0.06; leaf.x = Math.random(); }
    }
  }
  updateTrans(dt);
  if (mode === "play" && level) updatePlay(dt);
  else updateFancy(dt);
  if (mode !== "play") {
    /* fancy already advanced title leaves when mode isn't play via updateFancy;
       play mode advances them above. avoid double when title: updateFancy also moves them.
       Double-moving on title is ok-ish but fast. Guard: */
  }
  render();
  prev = Object.assign({}, keys);
}
// Title leaves are advanced in updateFancy. Don't also advance them before updateFancy.
// The block above advances during play only — good. But updateFancy ALSO advances them
// whenever mode isn't play. During play we advance in frame() and updateFancy isn't called.
// During title, only updateFancy advances them. Correct.
// Remove the duplicate risk: frame() advances when mode===play, updateFancy when not.
// Good as written.

window.addEventListener("resize", resize);
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  SFX.unlock();
  if (e.code === "KeyM") { SFX.muted = !SFX.muted; if (SFX.master) SFX.master.gain.value = SFX.muted ? 0 : 0.22; }
  else if (e.code === "KeyR" && mode === "play" && !trans) boot(index);
  else if (mode === "title" || mode === "end") startRun();
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
function wipeKeys() { for (const k of Object.keys(keys)) delete keys[k]; }
window.addEventListener("blur", wipeKeys);
document.addEventListener("visibilitychange", () => { if (document.hidden) wipeKeys(); });
canvas.addEventListener("pointerdown", e => {
  const r = canvas.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = hudButtons.find(b => x >= b.x && y >= b.y && x <= b.x + b.w && y <= b.y + b.h);
  SFX.unlock();
  if (hit && hit.id === "mute") { SFX.muted = !SFX.muted; if (SFX.master) SFX.master.gain.value = SFX.muted ? 0 : 0.22; return; }
  if (hit && hit.id === "restart" && mode === "play") { boot(index); return; }
  if (mode === "title" || mode === "end") startRun();
});
canvas.addEventListener("contextmenu", e => e.preventDefault());

const touch = document.getElementById("touch");
if (matchMedia("(pointer: coarse)").matches) touch.classList.add("on");
window.addEventListener("touchstart", () => touch.classList.add("on"), { passive: true });
document.querySelectorAll("#touch i").forEach(el => {
  const k = el.dataset.k;
  el.addEventListener("pointerdown", e => {
    el.setPointerCapture(e.pointerId);
    keys[k] = true; el.classList.add("on");
    SFX.unlock();
    if (mode === "title" || mode === "end") startRun();
    e.preventDefault();
  });
  const up = () => { keys[k] = false; el.classList.remove("on"); };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
});

resize();
requestAnimationFrame(frame);

window.GAME = {
  keys,
  start: startRun,
  snapshot() {
    return {
      mode, index, frozen, cleared, deadReason, runT: +runT.toFixed(2),
      players: players.map(p => ({
        k: p.kind, x: Math.round(p.x), y: Math.round(p.y),
        g: p.onGround, a: p.alive, h: p.home, e: p.entering, bi: p.bi
      })),
      gems: level ? level.gems.filter(g => g.got).length + "/" + level.gems.length : "",
      levers: level ? level.levers.map(l => l.on) : []
    };
  }
};
const START_LEVEL = (() => {
  const m = /(?:\?|&)level=(\d)/.exec(location.search);
  return m ? clamp(+m[1], 0, LEVELS.length - 1) : 0;
})();
if (BOT) setTimeout(() => { mode = "play"; runT = 0; runGems = 0; boot(START_LEVEL); }, 300);
})();
</script>
</body>
