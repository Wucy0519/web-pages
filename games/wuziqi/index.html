<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>五子棋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e4c48c'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%231c1915'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #241f1a;
    --muted: #8a7d70;
    --line: rgba(36, 31, 26, 0.14);
    --paper: #f4efe8;
    --cinnabar: #9d3b2c;
    --serif: "Songti SC", "STSongti-SC-Regular", "Noto Serif SC", Palatino, "Palatino Linotype", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(900px 480px at 50% -10%, rgba(255, 252, 247, 0.95), transparent 60%);
  }

  button, input { font-family: inherit; }

  ::selection { background: #ead7b6; }

  .wrap {
    width: min(640px, calc(100% - 48px), calc(100vh - 188px));
    width: min(640px, calc(100% - 48px), calc(100dvh - 188px));
    margin: auto;
    padding: 28px 0 32px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 0.18em;
    line-height: 1;
  }

  .sub {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.08em;
  }

  .meter {
    text-align: right;
    padding-bottom: 2px;
  }

  .meter b {
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    line-height: 1;
  }

  .meter span {
    display: inline-block;
    margin-left: 4px;
    color: var(--muted);
    font-size: 12px;
    font-style: normal;
    letter-spacing: 0.16em;
  }

  .board-wrap {
    margin-top: 28px;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 16px;
    cursor: pointer;
    touch-action: none;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.65) inset,
      0 18px 40px rgba(92, 58, 22, 0.12),
      0 2px 6px rgba(92, 58, 22, 0.06);
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px 28px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

  .turn {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 28px;
  }

  .pip {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex: none;
    box-shadow: 0 1px 2px rgba(40, 24, 8, 0.25);
  }

  .pip.black {
    background: radial-gradient(circle at 35% 32%, #5e584f, #161412 62%);
  }

  .pip.white {
    background: radial-gradient(circle at 35% 32%, #fff, #ddd4c6 70%);
    box-shadow: inset 0 0 0 1px rgba(80, 60, 30, 0.38), 0 1px 2px rgba(40, 24, 8, 0.12);
  }

  .pip.think { animation: breathe 1.1s ease-in-out infinite; }

  @keyframes breathe {
    50% { opacity: 0.35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pip.think { animation: none; }
  }

  #status {
    margin: 0;
    font-family: var(--serif);
    font-size: 18px;
    letter-spacing: 0.08em;
  }

  #status.win { color: var(--cinnabar); }

  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }

  button {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }

  .seg button {
    border: 0;
    border-radius: 0;
    padding: 8px 16px;
  }

  button:hover { background: rgba(36, 31, 26, 0.05); }

  button.on,
  button.primary {
    background: var(--ink);
    color: #f7f3ec;
    border-color: var(--ink);
  }

  button.on:hover,
  button.primary:hover { background: #3a342c; }

  button:disabled {
    opacity: 0.32;
    cursor: default;
    background: transparent;
    color: var(--ink);
  }

  button:focus-visible {
    outline: 2px solid var(--cinnabar);
    outline-offset: 3px;
  }

  @media (max-width: 560px) {
    .wrap { width: min(640px, calc(100% - 32px), calc(100dvh - 176px)); padding: 22px 0 28px; }
    h1 { font-size: 34px; letter-spacing: 0.14em; }
    .bar { align-items: stretch; flex-direction: column; gap: 14px; }
    .actions { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body><style>
a.catalog-back{position:fixed;top:12px;left:12px;z-index:9999;display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(255,250,243,.94);color:#241c14;border:1px solid #e3d3be;text-decoration:none;font:14px/1.4 "PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;box-shadow:0 6px 16px rgba(60,40,20,.08)}
a.catalog-back:hover{border-color:#9d2c1a;color:#9d2c1a}
</style>
<a class="catalog-back" href="../../index.html">返回目录</a>

  <main class="wrap">
    <header>
      <div>
        <h1>五子棋</h1>
        <p class="sub" id="sub">黑先 · 五子连珠</p>
      </div>
      <div class="meter" aria-label="手数"><b id="moves">0</b><span>手</span></div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="640" height="640" aria-label="五子棋棋盘，十五路"></canvas>
    </div>

    <div class="bar">
      <div class="turn">
        <i class="pip black" id="pip" aria-hidden="true"></i>
        <p id="status">黑方落子</p>
      </div>
      <div class="actions">
        <div class="seg" role="group" aria-label="对局方式">
          <button type="button" id="mode-pvp" class="on" aria-pressed="true">对弈</button>
          <button type="button" id="mode-ai" aria-pressed="false">人机</button>
        </div>
        <button type="button" id="undo" disabled>悔棋</button>
        <button type="button" id="restart" class="primary">重开</button>
      </div>
    </div>
  </main>

<script>
(function () {
  const N = 15;
  const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
  const PATTERNS = [
    ["mmmmm", 1000000],
    ["emmmme", 120000],
    ["bmmmme", 20000],
    ["emmmmb", 20000],
    ["mmemm", 20000],
    ["memmm", 20000],
    ["mmmem", 20000],
    ["emmmm", 20000],
    ["mmmme", 20000],
    ["emmme", 8000],
    ["emmmee", 7000],
    ["eemmme", 7000],
    ["ememme", 4500],
    ["emmeme", 4500],
    ["bmmme", 600],
    ["emmmb", 600],
    ["eemmee", 500],
    ["eemme", 280],
    ["emmee", 280],
    ["emme", 80],
    ["bmme", 40],
    ["emmb", 40]
  ];

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const subEl = document.getElementById("sub");
  const movesEl = document.getElementById("moves");
  const pipEl = document.getElementById("pip");
  const undoBtn = document.getElementById("undo");
  const restartBtn = document.getElementById("restart");
  const pvpBtn = document.getElementById("mode-pvp");
  const aiBtn = document.getElementById("mode-ai");

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let board, history, current, winner, winInfo, hover, mode, thinking, timer, placeAnim;

  function emptyBoard() {
    return Array.from({ length: N }, () => Array(N).fill(0));
  }

  function reset() {
    clearTimeout(timer);
    board = emptyBoard();
    history = [];
    current = 1;
    winner = null;
    winInfo = null;
    hover = null;
    thinking = false;
    placeAnim = null;
    paint();
    sync();
  }

  function inb(x, y) {
    return x >= 0 && y >= 0 && x < N && y < N;
  }

  function findWin(x, y, player) {
    for (const [dx, dy] of DIRS) {
      const cells = [[x, y]];
      for (const s of [1, -1]) {
        let i = 1;
        while (true) {
          const nx = x + dx * s * i;
          const ny = y + dy * s * i;
          if (!inb(nx, ny) || board[ny][nx] !== player) break;
          cells.push([nx, ny]);
          i++;
        }
      }
      if (cells.length >= 5) {
        let lo = cells[0], hi = cells[0];
        let loT = lo[0] * dx + lo[1] * dy;
        let hiT = loT;
        for (const c of cells) {
          const t = c[0] * dx + c[1] * dy;
          if (t < loT) { loT = t; lo = c; }
          if (t > hiT) { hiT = t; hi = c; }
        }
        return { cells, from: lo, to: hi };
      }
    }
    return null;
  }

  function wouldWin(x, y, player) {
    if (board[y][x]) return false;
    board[y][x] = player;
    const win = findWin(x, y, player);
    board[y][x] = 0;
    return !!win;
  }

  function hasNeighbor(x, y, dist) {
    for (let dy = -dist; dy <= dist; dy++) {
      for (let dx = -dist; dx <= dist; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (inb(nx, ny) && board[ny][nx]) return true;
      }
    }
    return false;
  }

  function candidates() {
    const list = [];
    let any = false;
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        if (board[y][x]) { any = true; continue; }
        if (hasNeighbor(x, y, 2)) list.push([x, y]);
      }
    }
    if (!any) return [[7, 7]];
    return list;
  }

  function lineOf(x, y, dx, dy, player) {
    const opp = 3 - player;
    let s = "";
    for (let k = -5; k <= 5; k++) {
      const nx = x + dx * k, ny = y + dy * k;
      if (!inb(nx, ny)) s += "b";
      else if (board[ny][nx] === player) s += "m";
      else if (board[ny][nx] === opp) s += "b";
      else s += "e";
    }
    return s;
  }

  function bestPattern(line) {
    for (const [source, score] of PATTERNS) {
      const re = new RegExp(source, "g");
      let m;
      while ((m = re.exec(line))) {
        const a = m.index;
        const b = a + m[0].length - 1;
        if (a <= 5 && b >= 5) return score;
      }
    }
    return 0;
  }

  function scoreAt(x, y, player) {
    let total = 0;
    for (const [dx, dy] of DIRS) total += bestPattern(lineOf(x, y, dx, dy, player));
    return total;
  }

  function winningCells(player) {
    const found = [];
    for (const [x, y] of candidates()) {
      if (!board[y][x] && wouldWin(x, y, player)) found.push([x, y]);
    }
    return found;
  }

  function maxOpportunity(player) {
    let best = 0;
    for (const [x, y] of candidates()) {
      if (board[y][x]) continue;
      board[y][x] = player;
      if (findWin(x, y, player)) {
        board[y][x] = 0;
        return 1000000;
      }
      best = Math.max(best, scoreAt(x, y, player));
      board[y][x] = 0;
    }
    return best;
  }

  function chooseMove(player) {
    const opp = 3 - player;
    const cands = candidates();
    for (const c of cands) if (wouldWin(c[0], c[1], player)) return c;

    const blocks = cands.filter((c) => wouldWin(c[0], c[1], opp));
    if (blocks.length === 1) return blocks[0];
    if (blocks.length > 1) {
      let pick = blocks[0], pickScore = -1;
      for (const [x, y] of blocks) {
        board[y][x] = player;
        const s = scoreAt(x, y, player);
        board[y][x] = 0;
        if (s > pickScore) { pickScore = s; pick = [x, y]; }
      }
      return pick;
    }

    let best = null;
    let bestScore = -Infinity;
    for (const [x, y] of cands) {
      board[y][x] = player;
      const threats = winningCells(player);
      let score;
      if (threats.length >= 2) {
        score = 900000;
      } else if (threats.length === 1) {
        const [tx, ty] = threats[0];
        board[ty][tx] = opp;
        const still = winningCells(player).length > 0;
        const danger = still ? 220000 : maxOpportunity(opp);
        score = 70000 + scoreAt(x, y, player) * 0.15 - danger * 0.9;
        board[ty][tx] = 0;
      } else {
        score = scoreAt(x, y, player) * 1.08 - maxOpportunity(opp) * 0.96;
      }
      board[y][x] = 0;
      score += (8 - Math.max(Math.abs(x - 7), Math.abs(y - 7))) * 3;
      score += Math.random();
      if (score > bestScore) { bestScore = score; best = [x, y]; }
    }
    return best;
  }

  function place(x, y, player) {
    board[y][x] = player;
    history.push({ x, y, player });
    winInfo = findWin(x, y, player);
    winner = winInfo ? player : (history.length === N * N ? 0 : null);
    current = winner === null ? 3 - player : player;
    placeAnim = { x, y, player, t0: performance.now() };
    hover = null;
    paint();
    sync();
    if (!reduceMotion) requestAnimationFrame(tick);
    if (winner === null && mode === "ai" && current === 2) scheduleAi();
  }

  function tick(now) {
    if (!placeAnim) return;
    if (now - placeAnim.t0 < 170) {
      paint();
      requestAnimationFrame(tick);
    } else {
      placeAnim = null;
      paint();
    }
  }

  function scheduleAi() {
    thinking = true;
    sync();
    timer = setTimeout(() => {
      thinking = false;
      if (mode !== "ai" || winner !== null || current !== 2) { sync(); return; }
      const move = chooseMove(2);
      if (move) place(move[0], move[1], 2);
      else sync();
    }, 280);
  }

  function undo() {
    if (thinking || history.length === 0) return;
    clearTimeout(timer);
    const pops = [];
    if (mode === "ai") {
      if (history[history.length - 1].player === 2) pops.push(history.pop());
      if (history.length && history[history.length - 1].player === 1) pops.push(history.pop());
    } else {
      pops.push(history.pop());
    }
    for (const m of pops) board[m.y][m.x] = 0;
    winner = null;
    winInfo = null;
    placeAnim = null;
    hover = null;
    current = history.length ? 3 - history[history.length - 1].player : 1;
    paint();
    sync();
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    pvpBtn.classList.toggle("on", mode === "pvp");
    aiBtn.classList.toggle("on", mode === "ai");
    pvpBtn.setAttribute("aria-pressed", mode === "pvp" ? "true" : "false");
    aiBtn.setAttribute("aria-pressed", mode === "ai" ? "true" : "false");
    reset();
  }

  function sync() {
    const names = { 1: "黑方", 2: "白方" };
    statusEl.classList.toggle("win", winner !== null && winner !== 0);
    if (winner === 1 || winner === 2) statusEl.textContent = names[winner] + "胜";
    else if (winner === 0) statusEl.textContent = "和棋";
    else if (thinking) statusEl.textContent = "电脑落子";
    else statusEl.textContent = names[current] + "落子";

    if (winner === 1 || winner === 2) subEl.textContent = names[winner] + "五子连珠";
    else if (winner === 0) subEl.textContent = "棋盘已满";
    else if (mode === "ai") subEl.textContent = "你执黑 · 电脑执白";
    else subEl.textContent = "黑先 · 五子连珠";

    const show = winner === 1 || winner === 2 ? winner : (thinking ? 2 : current);
    pipEl.className = "pip " + (show === 1 ? "black" : "white") + (thinking ? " think" : "");
    movesEl.textContent = String(history.length);
    undoBtn.disabled = thinking || history.length === 0;
    restartBtn.textContent = winner !== null ? "再来" : "重开";
  }

  let view = { size: 640, pad: 40, cell: 40 };

  function metric() {
    const size = canvas.clientWidth || 640;
    const pad = size * 0.065;
    view = { size, pad, cell: (size - pad * 2) / (N - 1) };
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function wood(size) {
    const g = ctx.createRadialGradient(size * 0.5, size * 0.42, size * 0.08, size * 0.5, size * 0.5, size * 0.74);
    g.addColorStop(0, "#f3d7a8");
    g.addColorStop(0.62, "#e6c08a");
    g.addColorStop(1, "#d4aa6c");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);

    const shade = ctx.createLinearGradient(0, 0, 0, size);
    shade.addColorStop(0, "rgba(255,255,255,0.2)");
    shade.addColorStop(0.42, "rgba(255,255,255,0)");
    shade.addColorStop(1, "rgba(110, 64, 18, 0.07)");
    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, size, size);
  }

  function drawStone(x, y, player, alpha, scale) {
    const cx = view.pad + x * view.cell;
    const cy = view.pad + y * view.cell;
    const r = view.cell * 0.416 * scale;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (alpha > 0.8) {
      ctx.beginPath();
      ctx.ellipse(cx + r * 0.12, cy + r * 0.34, r * 0.72, r * 0.34, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(70, 40, 12, 0.20)";
      ctx.fill();
    }
    const g = ctx.createRadialGradient(cx - r * 0.36, cy - r * 0.4, r * 0.12, cx + r * 0.05, cy + r * 0.08, r);
    if (player === 1) {
      g.addColorStop(0, "#6d675e");
      g.addColorStop(0.48, "#2c2824");
      g.addColorStop(1, "#100e0c");
    } else {
      g.addColorStop(0, "#ffffff");
      g.addColorStop(0.5, "#f6f1e8");
      g.addColorStop(1, "#d4cbbd");
    }
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    if (player === 2) {
      ctx.strokeStyle = "rgba(90, 68, 36, 0.16)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.32, cy - r * 0.36, r * 0.2, r * 0.12, -0.7, 0, Math.PI * 2);
    ctx.fillStyle = player === 1 ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.9)";
    ctx.fill();
    ctx.restore();
    return { cx, cy, r };
  }

  function paint() {
    metric();
    const { size, pad, cell } = view;
    wood(size);

    const inset = pad * 0.42;
    ctx.strokeStyle = "rgba(110, 68, 24, 0.28)";
    ctx.lineWidth = 1;
    ctx.strokeRect(inset, inset, size - inset * 2, size - inset * 2);

    ctx.strokeStyle = "rgba(86, 50, 20, 0.78)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const p = Math.round(pad + i * cell) + 0.5;
      const a = Math.round(pad) + 0.5;
      const b = Math.round(pad + (N - 1) * cell) + 0.5;
      ctx.moveTo(a, p); ctx.lineTo(b, p);
      ctx.moveTo(p, a); ctx.lineTo(p, b);
    }
    ctx.stroke();

    ctx.fillStyle = "#5a3816";
    for (const s of [3, 7, 11]) {
      for (const t of [3, 7, 11]) {
        ctx.beginPath();
        ctx.arc(pad + s * cell, pad + t * cell, Math.max(2.2, cell * 0.075), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    if (winInfo) {
      const ax = pad + winInfo.from[0] * cell;
      const ay = pad + winInfo.from[1] * cell;
      const bx = pad + winInfo.to[0] * cell;
      const by = pad + winInfo.to[1] * cell;
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.strokeStyle = "rgba(190, 74, 58, 0.95)";
      ctx.lineWidth = Math.max(2.4, cell * 0.07);
      ctx.lineCap = "round";
      ctx.stroke();
    }

    const winSet = new Set(winInfo ? winInfo.cells.map((c) => c[0] + "," + c[1]) : []);
    const last = history[history.length - 1];

    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const v = board[y][x];
        if (!v) continue;
        let scale = 1;
        if (placeAnim && placeAnim.x === x && placeAnim.y === y && !reduceMotion) {
          const k = Math.min(1, (performance.now() - placeAnim.t0) / 160);
          scale = 0.72 + 0.28 * (1 - Math.pow(1 - k, 3));
        }
        const stone = drawStone(x, y, v, 1, scale);
        if (winSet.has(x + "," + y)) {
          ctx.beginPath();
          ctx.arc(stone.cx, stone.cy, Math.max(2.2, cell * 0.07), 0, Math.PI * 2);
          ctx.fillStyle = "#e4634f";
          ctx.fill();
        }
      }
    }

    if (last && !winner) {
      const cx = pad + last.x * cell;
      const cy = pad + last.y * cell;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(2.1, cell * 0.075), 0, Math.PI * 2);
      ctx.fillStyle = last.player === 1 ? "rgba(255,250,244,0.88)" : "rgba(48, 36, 24, 0.72)";
      ctx.fill();
    }

    if (hover && !board[hover[1]][hover[0]] && winner === null && !thinking && (mode === "pvp" || current === 1)) {
      const cx = pad + hover[0] * cell;
      const cy = pad + hover[1] * cell;
      const r = cell * 0.416;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      if (current === 1) {
        ctx.lineWidth = 1.75;
        ctx.strokeStyle = "rgba(28, 22, 16, 0.72)";
        ctx.stroke();
      } else {
        ctx.fillStyle = "rgba(255, 252, 246, 0.88)";
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(110, 78, 40, 0.38)";
        ctx.stroke();
      }
    }
  }

  function cellAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const gx = Math.round((x - view.pad) / view.cell);
    const gy = Math.round((y - view.pad) / view.cell);
    if (!inb(gx, gy)) return null;
    return [gx, gy];
  }

  canvas.addEventListener("pointermove", (e) => {
    const next = cellAt(e.clientX, e.clientY);
    const same = !!next === !!hover && (!next || (next[0] === hover[0] && next[1] === hover[1]));
    if (same) return;
    hover = next;
    paint();
  });

  canvas.addEventListener("pointerleave", () => {
    if (!hover) return;
    hover = null;
    paint();
  });

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    const cell = cellAt(e.clientX, e.clientY);
    if (!cell || winner !== null || thinking) return;
    if (mode === "ai" && current !== 1) return;
    const [x, y] = cell;
    if (board[y][x]) return;
    place(x, y, current);
  });

  undoBtn.addEventListener("click", undo);
  restartBtn.addEventListener("click", reset);
  pvpBtn.addEventListener("click", () => setMode("pvp"));
  aiBtn.addEventListener("click", () => setMode("ai"));

  window.addEventListener("keydown", (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "z" || e.key === "Z") undo();
    if (e.key === "r" || e.key === "R") reset();
  });

  const ro = new ResizeObserver(() => paint());
  ro.observe(canvas.parentElement);

  mode = "pvp";
  reset();
})();
</script>
</body>
</html>
