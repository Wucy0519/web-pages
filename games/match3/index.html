<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8fab">
<title>开心消消乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='24' cy='36' r='14' fill='%23ff4d6d'/%3E%3Ccircle cx='42' cy='34' r='14' fill='%23e0314b'/%3E%3Cellipse cx='20' cy='30' rx='5' ry='3' fill='white' opacity='.7'/%3E%3C/svg%3E">
<style>
  :root {
    --s: clamp(36px, calc((min(100vw, 520px) - 76px) / 8), 56px);
    --g: 4px;
    --ink: #7a2048;
    --pink: #e64980;
    --gold: #ffd43b;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(circle at 12% 18%, #fff 0 8%, transparent 9%),
      radial-gradient(circle at 88% 8%, #ffe066 0 10%, transparent 11%),
      radial-gradient(circle at 80% 88%, #b2f2bb 0 14%, transparent 15%),
      linear-gradient(165deg, #ffd0e4 0%, #fff1cc 42%, #d8f8e8 100%);
  }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  .sky { min-height: 100%; position: relative; overflow: hidden; }
  .blob {
    position: fixed; border-radius: 50%; filter: blur(2px); opacity: .45;
    pointer-events: none; z-index: 0;
  }
  .b1 { width: 180px; height: 180px; background: #ffc9de; top: -40px; left: -50px; }
  .b2 { width: 220px; height: 220px; background: #ffe8a3; top: 120px; right: -80px; }
  .b3 { width: 160px; height: 160px; background: #b2f2bb; bottom: -30px; left: 20%; }
  .app {
    position: relative; z-index: 1;
    width: min(520px, 100%);
    margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
  }
  .top {
    display: grid; grid-template-columns: 72px 1fr 72px;
    align-items: center; margin-bottom: 8px;
  }
  .brand {
    text-align: center; font-weight: 900; font-size: 22px; color: #fff;
    text-shadow: 0 2px 0 #f06595, 0 4px 0 #c2255c;
    letter-spacing: .06em;
  }
  .ghost {
    height: 36px; border: none; border-radius: 999px;
    background: rgba(255,255,255,.78); color: var(--pink);
    font-weight: 800; padding: 0 10px;
    box-shadow: 0 3px 0 rgba(230, 73, 128, .25);
  }
  .ghost:active { transform: translateY(2px); box-shadow: none; }
  .sound { justify-self: end; width: 42px; padding: 0; display: grid; place-items: center; }
  .hero { text-align: center; padding: 6px 0 8px; }
  .hero h1 {
    margin: 4px 0 0; font-size: 40px; font-weight: 900; color: #fff;
    text-shadow: 0 3px 0 #f06595, 0 6px 0 #c2255c, 0 12px 18px rgba(190, 40, 90, .2);
  }
  .hero p { margin: 6px 0 12px; font-weight: 700; color: #9c3668; }
  .hero-candies { display: flex; justify-content: center; gap: 4px; height: 62px; }
  .hero-candy { width: 52px; height: 52px; animation: floaty 1.5s ease-in-out infinite; }
  .hero-candy:nth-child(2) { animation-delay: .12s; }
  .hero-candy:nth-child(3) { animation-delay: .24s; }
  .hero-candy:nth-child(4) { animation-delay: .36s; }
  .hero-candy:nth-child(5) { animation-delay: .48s; }
  .btn-primary {
    appearance: none; border: none; cursor: pointer;
    background: linear-gradient(#ffe066, #ff922b);
    color: #7c2d12; font-weight: 900; font-size: 18px;
    border-radius: 999px; padding: 12px 32px;
    box-shadow: 0 5px 0 #e8590c;
  }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #e8590c; }
  .progress, .fine { text-align: center; font-weight: 800; color: #b84d78; }
  .fine { font-size: 12px; font-weight: 650; opacity: .8; margin-top: 8px; }
  .path-scroll { margin-top: 14px; }
  .path {
    position: relative; display: flex; flex-direction: column; gap: 18px;
    padding: 8px 6% 24px;
  }
  .path::before {
    content: ""; position: absolute; left: 50%; top: 8px; bottom: 12px;
    border-left: 3px dashed rgba(255,255,255,.85);
  }
  .node-wrap { display: flex; width: 100%; position: relative; z-index: 1; }
  .node-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .node {
    width: 64px; height: 64px; border: none; border-radius: 50%;
    color: #fff; font-weight: 900; font-size: 22px;
    box-shadow: 0 6px 0 rgba(80, 0, 40, .18);
    text-shadow: 0 2px 0 rgba(0,0,0,.15);
    position: relative;
  }
  .node.c0 { background: radial-gradient(circle at 35% 30%, #ffb3c2, #e03154); }
  .node.c1 { background: radial-gradient(circle at 35% 30%, #ffd8a8, #f76707); }
  .node.c2 { background: radial-gradient(circle at 35% 30%, #fff3bf, #f59f00); color: #8a5a00; text-shadow: none; }
  .node.c3 { background: radial-gradient(circle at 35% 30%, #b2f2bb, #2f9e44); }
  .node.c4 { background: radial-gradient(circle at 35% 30%, #bac8ff, #4263eb); }
  .node.c5 { background: radial-gradient(circle at 35% 30%, #eebefa, #9c36b5); }
  .node.locked { background: #dee2e6; color: #868e96; box-shadow: none; text-shadow: none; }
  .node.current { box-shadow: 0 0 0 4px #fff, 0 6px 0 rgba(80,0,40,.18); animation: pulse 1.15s ease-in-out infinite; }
  .node .lock { position: absolute; right: -2px; bottom: -2px; font-style: normal; font-size: 14px; filter: none; }
  .node-stars { display: flex; gap: 1px; height: 16px; }
  .node-stars svg { width: 14px; height: 14px; }
  .hud-line {
    width: fit-content; margin: 2px auto 8px; padding: 4px 14px;
    text-align: center; font-weight: 900; color: #c2255c; letter-spacing: .04em;
    background: rgba(255,255,255,.82); border-radius: 999px;
    box-shadow: 0 3px 0 rgba(255,255,255,.45);
  }
  .hud-row { display: flex; gap: 8px; align-items: stretch; }
  .goal-card {
    flex: 1; min-height: 74px;
    background: rgba(255,255,255,.82);
    border-radius: 18px; padding: 8px 12px;
    box-shadow: 0 6px 0 rgba(255,255,255,.35);
  }
  .goal-kicker { font-size: 13px; font-weight: 800; color: #c2255c; }
  .goal-score { font-weight: 800; color: #7a2048; margin-top: 2px; }
  .goal-score b { font-size: 26px; line-height: 1.1; }
  .moves-card {
    width: 78px; flex: none; border-radius: 18px;
    background: linear-gradient(#fff, #fff0f6);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 #f3c1d6;
  }
  .moves-card b { font-size: 30px; line-height: 1; color: var(--pink); }
  .moves-card span { font-size: 12px; font-weight: 800; color: #c2255c; }
  .moves-card.low { background: linear-gradient(#fff5f5, #ffe3e3); }
  .moves-card.low b { color: #e03131; }
  .moves-card.bump { animation: bump .25s ease; }
  .bar {
    height: 12px; border-radius: 999px; margin-top: 8px;
    background: rgba(194, 37, 92, .16); overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(120, 20, 60, .12);
  }
  .bar > div {
    height: 100%; width: 0; border-radius: inherit;
    background: linear-gradient(90deg, #ffe066, #ff6b6b);
    transition: width .25s ease;
  }
  .bar.full > div { background: linear-gradient(90deg, #8ce99a, #2f9e44); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: flex; align-items: center; gap: 2px;
    background: rgba(255,255,255,.7); border-radius: 999px;
    padding: 1px 8px 1px 2px; font-weight: 900; font-size: 13px;
  }
  .chip svg { width: 26px; height: 26px; }
  .chip.done { background: #d3f9d8; color: #2b8a3e; }
  .board {
    margin-top: 12px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.4), transparent 26%),
      linear-gradient(180deg, #9b6dff, #6d28d9 42%, #5b21b6);
    border-radius: 28px;
    border: 3px solid rgba(255, 214, 102, .95);
    padding: 12px;
    box-shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 10px 0 #4c1d95, 0 18px 28px rgba(76, 29, 149, .28);
    touch-action: none;
  }
  .board.shake { animation: shake .28s linear; }
  .board-inner { position: relative; border-radius: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(8, var(--s));
    grid-template-rows: repeat(8, var(--s));
    gap: var(--g);
    position: relative; z-index: 1;
  }
  .cell { position: relative; width: var(--s); height: var(--s); border-radius: 12px; background: rgba(255,255,255,.14); }
  .cell.alt { background: rgba(255,255,255,.24); }
  .jelly {
    display: none; position: absolute; inset: 3px; border-radius: 10px;
    background: radial-gradient(circle at 32% 28%, #f1fbff, #74c0fc 46%, #1c7ed6);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.7), 0 3px 0 #1864ab;
  }
  .cell[data-j="1"] .jelly, .cell[data-j="2"] .jelly { display: block; }
  .cell[data-j="2"] .jelly {
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.9), inset 0 0 0 8px rgba(165, 216, 255, .95), 0 3px 0 #1864ab;
  }
  .pieces {
    position: absolute; inset: 0; z-index: 2; overflow: hidden; border-radius: 16px;
    pointer-events: none;
  }
  .fx { position: absolute; inset: 0; z-index: 4; pointer-events: none; overflow: visible; }
  .piece {
    position: absolute; left: 0; top: 0;
    width: var(--s); height: var(--s);
    transform: translate3d(calc(var(--x) + var(--dx, 0px)), calc(var(--y) + var(--dy, 0px)), 0);
    transition: transform var(--dur, 0ms) var(--ease, cubic-bezier(.18,.8,.2,1)) var(--delay, 0ms);
    pointer-events: none;
  }
  .candy { width: 100%; height: 100%; padding: 6%; box-sizing: border-box; filter: drop-shadow(0 3px 1px rgba(60,0,40,.28)); }
  .piece.on { z-index: 3; }
  .piece.on .candy { animation: floaty .5s ease-in-out infinite; }
  .piece.hint .candy { animation: hint 0.7s ease-in-out infinite; }
  .piece.press .candy { filter: drop-shadow(0 2px 0 rgba(60,0,40,.25)) brightness(1.08); }
  .piece.pop { z-index: 5; }
  .piece.pop .candy { animation: pop .2s ease forwards; }
  .piece.born .candy { animation: born .28s cubic-bezier(.2,1.5,.3,1); }
  .piece.deny .candy { animation: deny .22s ease; }
  .tip { text-align: center; font-size: 13px; font-weight: 700; color: #9c3668; min-height: 1.2em; margin: 10px 0 0; }
  .tools { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .tools button, .modal-actions button {
    appearance: none; border: none; background: #fff; color: #9c3668;
    font-weight: 800; border-radius: 999px; padding: 10px 16px;
    box-shadow: 0 4px 0 #f3c1d6;
  }
  .tools button:active, .modal-actions button:active { transform: translateY(2px); box-shadow: 0 1px 0 #f3c1d6; }
  .spark {
    position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%;
    animation: spark .46s ease-out forwards;
  }
  .floater {
    position: absolute; transform: translate(-50%, -30%);
    font-weight: 900; font-size: 18px; color: #fff;
    text-shadow: 0 2px 0 #e8590c;
    animation: floatUp .72s ease forwards; white-space: nowrap;
  }
  .combo-banner {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.7);
    background: linear-gradient(#fff, #ffe066); color: #d9480f;
    font-weight: 900; font-size: 18px; padding: 8px 14px; border-radius: 999px;
    box-shadow: 0 5px 0 #f08c00; animation: banner .78s ease forwards; white-space: nowrap;
  }
  .toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%);
    background: rgba(64, 16, 40, .9); color: #fff; font-weight: 800;
    padding: 10px 16px; border-radius: 999px; z-index: 70;
    max-width: calc(100% - 28px); text-align: center;
  }
  .modal {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 18px;
  }
  .modal-back { position: absolute; inset: 0; background: rgba(48, 16, 40, .46); }
  .modal-card {
    position: relative; width: min(360px, 100%);
    background: linear-gradient(#fff, #fff7fb);
    border-radius: 26px; padding: 22px 16px 16px; text-align: center;
    box-shadow: 0 22px 50px rgba(80, 0, 40, .28);
  }
  .modal-card h2 { margin: 6px 0 4px; font-size: 28px; color: #c2255c; }
  .modal-card p { margin: 6px 0; font-weight: 700; color: #7a2048; }
  .star-row { display: flex; justify-content: center; gap: 6px; margin: 8px 0; }
  .star-row svg { width: 42px; height: 42px; }
  .star-row svg.on { animation: popstar .45s cubic-bezier(.2,1.4,.3,1) both; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .help { text-align: left; font-weight: 650; color: #5c2144; font-size: 14px; line-height: 1.55; }
  .help b { color: #c2255c; }
  .help-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .help-row .mini { width: 42px; height: 42px; flex: none; }
  .confetti {
    position: fixed; top: -12px; width: 9px; height: 14px; z-index: 80; border-radius: 2px;
    animation: fall 1.15s ease-in forwards;
  }
  @keyframes bump { 40% { transform: scale(1.08); } }
  @keyframes floaty { 50% { transform: translateY(-5px) scale(1.05); } }
  @keyframes pulse { 50% { transform: translateY(-3px) scale(1.04); } }
  @keyframes hint {
    50% { filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 3px #ffd43b) brightness(1.08); }
  }
  @keyframes pop { 40% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(.15); opacity: 0; } }
  @keyframes born { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  @keyframes deny { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  @keyframes floatUp { to { transform: translate(-50%, -130%); opacity: 0; } }
  @keyframes banner {
    0% { transform: translate(-50%, -50%) scale(.5); opacity: 0; }
    18% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -70%) scale(.96); opacity: 0; }
  }
  @keyframes shake {
    20% { transform: translateX(-3px); } 40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); } 80% { transform: translateX(2px); }
  }
  @keyframes popstar { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes fall { to { transform: translateY(105vh) rotate(var(--rot)); opacity: .15; } }
  @media (max-width: 380px) { :root { --g: 3px; } .hero h1 { font-size: 34px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>

<script>
'use strict';
/* LOGIC_START */
const ROWS = 8;
const COLS = 8;
const TYPE_N = 6;
const NAMES = ['樱桃', '橙子', '柠檬', '苹果', '蓝莓', '葡萄'];
const COLORS = ['#ff4d6d', '#ff922b', '#ffd43b', '#40c057', '#4c6ef5', '#be4bdb'];
const LEVELS = [
  { name: '甜蜜起步', moves: 20, types: 4, goal: { kind: 'score', score: 12000 }, stars: [12000, 22000, 28000] },
  { name: '水果派对', moves: 22, types: 4, goal: { kind: 'score', score: 20000 }, stars: [20000, 34000, 42000] },
  { name: '连消热身', moves: 22, types: 5, goal: { kind: 'score', score: 10000 }, stars: [10000, 14000, 16500] },
  { name: '樱桃订单', moves: 22, types: 5, goal: { kind: 'collect', items: [{ t: 0, n: 24 }] }, stars: [4000, 12500, 15500] },
  { name: '橙蓝拼盘', moves: 24, types: 5, goal: { kind: 'collect', items: [{ t: 1, n: 16 }, { t: 4, n: 16 }] }, stars: [5000, 13000, 18000] },
  { name: '果冻布丁', moves: 24, types: 4, goal: { kind: 'jelly' }, stars: [6000, 22000, 40000], jelly: [
    '00000000', '00000000', '00000000', '00000000', '00000000', '00000000', '11111111', '11111111'
  ] },
  { name: '高分时刻', moves: 24, types: 6, goal: { kind: 'score', score: 7000 }, stars: [7000, 9500, 11500] },
  { name: '三色订单', moves: 26, types: 6, goal: { kind: 'collect', items: [{ t: 2, n: 14 }, { t: 3, n: 14 }, { t: 5, n: 14 }] }, stars: [4000, 10000, 15000] },
  { name: '果冻相框', moves: 28, types: 5, goal: { kind: 'jelly' }, stars: [5000, 14000, 26000], jelly: [
    '00000000', '01111110', '01000010', '01000010', '01000010', '01000010', '01111110', '00000000'
  ] },
  { name: '甜蜜风暴', moves: 24, types: 6, goal: { kind: 'score', score: 8000 }, stars: [8000, 10000, 13000] },
  { name: '双层果冻', moves: 28, types: 4, goal: { kind: 'jelly' }, stars: [6000, 26000, 42000], jelly: [
    '00000000', '00000000', '00000000', '00000000', '00000000', '00000000', '11111111', '22222222'
  ] },
  { name: '终章订单', moves: 26, types: 6, goal: { kind: 'collect', items: [{ t: 0, n: 18 }, { t: 5, n: 18 }] }, stars: [5000, 11000, 14000] }
];

let UID = 1;
function randInt(n) { return Math.floor(Math.random() * n); }
function make(type, special) { return { id: UID++, type: type, special: special || null }; }
function inside(r, c) { return r >= 0 && c >= 0 && r < ROWS && c < COLS; }
function makeGrid() {
  const board = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) row.push(null);
    board.push(row);
  }
  return board;
}
function swapCells(board, r1, c1, r2, c2) {
  const t = board[r1][c1];
  board[r1][c1] = board[r2][c2];
  board[r2][c2] = t;
}
function wouldMatch(board, r, c, type) {
  let n = 1;
  let i = c - 1;
  while (i >= 0 && board[r][i] && board[r][i].type === type) { n++; i--; }
  i = c + 1;
  while (i < COLS && board[r][i] && board[r][i].type === type) { n++; i++; }
  if (n >= 3) return true;

    const noisy = fast && wave.banner.indexOf('奖励') === 0 && (wave.combo || 1) < 3;
    if (wave.banner && !noisy) showBanner(wave.banner);
    if (wave.cleared.length >= 18 || (wave.banner && wave.banner.indexOf('彩虹') >= 0)) shake();
    view.score += wave.scoreGain || 0;
    for (let i = 0; i < wave.cleared.length; i++) {
      const t = wave.cleared[i].type;
      if (t >= 0) view.got[t] = (view.got[t] || 0) + 1;
    }
    for (let i = 0; i < wave.jellyHits.length; i++) {
      const hit = wave.jellyHits[i];
      setJelly(hit.r, hit.c, hit.left);
      if (hit.left === 0) view.jellyLeft = Math.max(0, view.jellyLeft - 1);
    }
    renderHUD();
    if (wave.cleared.length) await wait(T(fast ? 90 : 180));
    for (let i = 0; i < wave.cleared.length; i++) {
      const el = pieceEls.get(wave.cleared[i].id);
      if (el) { el.remove(); pieceEls.delete(wave.cleared[i].id); }
    }
    let maxDist = 0;
    for (let i = 0; i < wave.layout.length; i++) {
      const item = wave.layout[i];
      maxDist = Math.max(maxDist, Math.abs(item.r - item.fromR));
      if (!pieceEls.get(item.id)) {
        const el = spawn(item, item.fromR, item.fromC);
        if (item.isNew && item.fromR === item.r && item.fromC === item.c) el.classList.add('born');
      }
    }
    const alive = new Set(wave.layout.map(function (item) { return item.id; }));
    pieceEls.forEach(function (el, id) {
      if (!alive.has(id)) { el.remove(); pieceEls.delete(id); }
    });
    void pieceLayer.offsetWidth;
    for (let i = 0; i < wave.layout.length; i++) {
      const item = wave.layout[i];
      const moved = item.fromR !== item.r || item.fromC !== item.c;
      const per = fast ? 18 : 36;
      const base = fast ? 80 : 140;
      moveEl(pieceEls.get(item.id), item.r, item.c, moved, item.r - item.fromR, 0, moved ? Math.min(480, T(base + Math.abs(item.r - item.fromR) * per)) : 0);
    }
    if (maxDist) await wait(Math.min(520, T((fast ? 80 : 140) + maxDist * (fast ? 18 : 36))) + T(30));
  }
}
function syncToState() {
  const alive = new Set();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = state.board[r][c];
      if (!p) continue;
      alive.add(p.id);
      if (!pieceEls.get(p.id)) spawn(p, r, c);
      else moveEl(pieceEls.get(p.id), r, c, false, 0);
    }
  }
  pieceEls.forEach(function (el, id) {
    if (!alive.has(id)) { el.remove(); pieceEls.delete(id); }
  });
  view.score = state.score;
  view.moves = state.moves;
  view.got = state.got.slice();
  view.jellyLeft = state.jellyLeft;
  updateAllJelly();
  renderedMoves = -1;
  renderHUD();
}
function rebuildDrop() {
  pieceLayer.innerHTML = '';
  pieceEls = new Map();
  fx.innerHTML = '';
  measure();
  const items = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const p = state.board[r][c];
      if (!p) continue;
      const fromR = r - 10;
      const el = spawn(p, fromR, c);
      items.push({ el: el, r: r, c: c, fromR: fromR, delay: (r + c) * 18 });
    }
  }
  return frame().then(function () { return frame(); }).then(function () {
    let maxWait = 0;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const dist = it.r - it.fromR;
      const ms = T(160 + dist * 26);
      moveEl(it.el, it.r, it.c, true, dist, T(it.delay), ms);
      maxWait = Math.max(maxWait, ms + T(it.delay));
    }
    return wait(maxWait + 30);
  });
}
function commitDragOffsets() {
  pieceEls.forEach(function (el) {
    const dx = parseFloat(el.style.getPropertyValue('--dx')) || 0;
    const dy = parseFloat(el.style.getPropertyValue('--dy')) || 0;
    if (!dx && !dy) return;
    const x = (parseFloat(el.style.getPropertyValue('--x')) || 0) + dx;
    const y = (parseFloat(el.style.getPropertyValue('--y')) || 0) + dy;
    el.style.setProperty('--dur', '0ms');
    el.style.setProperty('--dx', '0px');
    el.style.setProperty('--dy', '0px');
    el.style.setProperty('--x', x + 'px');
    el.style.setProperty('--y', y + 'px');
    el.style.zIndex = '';
    el.classList.remove('press');
  });
}
function springBack() {
  pieceEls.forEach(function (el) {
    el.style.setProperty('--dur', T(140) + 'ms');
    el.style.setProperty('--dx', '0px');
    el.style.setProperty('--dy', '0px');
    el.style.zIndex = '';
    el.classList.remove('press');
  });
}
async function animSwap(res, revert) {
  commitDragOffsets();
  await frame();
  const e1 = pieceEls.get(res.id1);
  const e2 = pieceEls.get(res.id2);
  moveEl(e1, res.r2, res.c2, true, 1, 0, T(160));
  moveEl(e2, res.r1, res.c1, true, 1, 0, T(160));
  await wait(T(170));
  if (!revert) return;
  moveEl(e1, res.r1, res.c1, true, 1, 0, T(150));
  moveEl(e2, res.r2, res.c2, true, 1, 0, T(150));
  if (e1) e1.classList.add('deny');
  if (e2) e2.classList.add('deny');
  await wait(T(180));
  if (e1) e1.classList.remove('deny');
  if (e2) e2.classList.remove('deny');
}
function saveProgress(stars) {
  if (stars > (save.stars[levelIndex] || 0)) save.stars[levelIndex] = stars;
  if (state.score > (save.best[levelIndex] || 0)) save.best[levelIndex] = state.score;
  save.unlocked = Math.min(LEVELS.length, Math.max(save.unlocked, levelIndex + 2));
  save.coach = true;
  persist();
}
function remainText() {
  const g = state.goal;
  if (g.kind === 'score') return '还差 ' + Math.max(0, g.score - state.score) + ' 分';
  if (g.kind === 'jelly') return '还剩 ' + state.jellyLeft + ' 块果冻';
  const parts = [];
  for (let i = 0; i < g.items.length; i++) {
    const left = g.items[i].n - (state.got[g.items[i].t] || 0);
    if (left > 0) parts.push(NAMES[g.items[i].t] + '还差 ' + left);
  }
  return parts.join('，');
}
function closeModal() {
  modal.hidden = true;
  modalOpen = false;
  modalKind = '';
}
function openHelp() {
  modalKind = 'help';
  modalOpen = true;
  modal.hidden = false;
  modalCard.innerHTML =
    '<h2>怎么玩</h2>' +
    '<div class="help">' +
    '<div class="help-row"><div class="mini">' + svgCandy(0, null) + '</div><div>点一下选中，再点相邻的水果；也可以直接拖过去。<b>对不齐就弹回来，不扣步数。</b></div></div>' +
    '<div class="help-row"><div class="mini">' + svgCandy(3, null) + '</div><div>三个及以上相同水果横竖连成一线，就会消除并下落。</div></div>' +
    '<div class="help-row"><div class="mini">' + svgCandy(1, 'h') + '</div><div><b>四个</b>连成一线变成条纹糖。横着的消除整行，竖着的消除整列。</div></div>' +
    '<div class="help-row"><div class="mini">' + svgCandy(2, 'wrap') + '</div><div><b>L 形或 T 形</b>变成包装糖，炸开周围一圈。</div></div>' +
    '<div class="help-row"><div class="mini">' + svgCandy(-1, 'bomb') + '</div><div><b>五个</b>连成一线变成彩虹糖，和任意水果交换，消除那种颜色。</div></div>' +
    '<div>两个特殊水果互换会触发更强的组合。步数用完前达成目标即可过关，剩下的步数会变成奖励。</div>' +
    '</div>' +
    '<div class="modal-actions"><button type="button" data-act="close">知道了</button></div>';
}
function confetti() {
  for (let i = 0; i < 42; i++) {
    const el = document.createElement('i');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + '%';
    el.style.background = COLORS[i % COLORS.length];
    el.style.animationDelay = (Math.random() * 0.25) + 's';
    el.style.setProperty('--rot', (Math.random() * 200 - 40) + 'deg');
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 1500);
  }
}
function showWin(stars) {
  modalKind = 'win';
  modalOpen = true;
  modal.hidden = false;
  const title = stars >= 3 ? '完美消除！' : stars === 2 ? '真甜！' : '过关啦';
  const next = levelIndex < LEVELS.length - 1;
  modalCard.innerHTML =
    '<h2>' + title + '</h2>' +
    '<div class="star-row">' + [0, 1, 2].map(function (i) {
      return starSVG(i < stars).replace('<svg ', '<svg style="animation-delay:' + (i * 0.12) + 's" ');
    }).join('') + '</div>' +
    '<p>得分 <b>' + state.score + '</b></p>' +
    '<p>最佳 ' + (save.best[levelIndex] || state.score) + ' · ' + goalLabel(LEVELS[levelIndex]) + '</p>' +
    '<p>二星 ' + LEVELS[levelIndex].stars[1] + ' 分 · 三星 ' + LEVELS[levelIndex].stars[2] + ' 分</p>' +
    '<div class="modal-actions">' +
    (next ? '<button type="button" class="btn-primary" data-act="next" style="box-shadow:0 4px 0 #e8590c">下一关</button>' : '') +
    '<button type="button" data-act="retry">再来一局</button>' +
    '<button type="button" data-act="map">选关</button></div>';
  confetti();
  soundWin();
}
function showLose() {
  modalKind = 'lose';
  modalOpen = true;
  modal.hidden = false;
  modalCard.innerHTML =
    '<h2>差一点点</h2>' +
    '<p>' + remainText() + '</p>' +
    '<p>本次得分 ' + state.score + '</p>' +
    '<div class="modal-actions"><button type="button" class="btn-primary" data-act="retry" style="box-shadow:0 4px 0 #e8590c">再试一次</button><button type="button" data-act="map">选关</button></div>';
  soundLose();
}
async function startLevel(index) {
  if (busy) return;
  if (index < 0 || index >= LEVELS.length || index >= save.unlocked) return;
  busy = true;
  closeModal();
  try {
    levelIndex = index;
    state = newGame(LEVELS[index]);
    view = takeView();
    renderedMoves = -1;
    clearSel();
    showGameScreen();
    buildGrid();
    measure();
    renderHUD();
    await rebuildDrop();
    if (findGroups(state.board).length) {
      const waves = collapseAll(state, 1, []);
      await playWaves(waves);
    }
    if (!goalMet(state) && state.moves > 0 && !findAllHints(state.board).length) {
      doShuffle(state);
      await rebuildDrop();
    }
    syncToState();
    toast('第 ' + (index + 1) + ' 关 · ' + goalLabel(LEVELS[index]));
    if (index === 0 && !save.coach) flashHint();
  } finally {
    busy = false;
  }
}
async function userSwap(r1, c1, r2, c2) {
  if (busy || modalOpen) return;
  if (!inside(r2, c2)) { springBack(); return; }
  busy = true;
  clearHint();
  clearSel();
  try {
    const result = tryMove(state, r1, c1, r2, c2);
    if (!result.ok) {
      springBack();
      if (result.revert) {
        soundBad();
        await animSwap(result, true);
      }
      return;
    }
    if (levelIndex === 0 && !save.coach) { save.coach = true; persist(); }
    blip(540, 0.06, 'sine', 0.035);
    view.moves = result.movesLeft;
    renderHUD();
    await animSwap(result, false);
    await playWaves(result.waves);
    if (result.needShuffle) {
      doShuffle(state);
      toast('没有可消除的组合，已重新洗牌');
      await rebuildDrop();
    }
    syncToState();
    if (result.won) {
      if (state.moves > 0) {
        toast('目标达成！剩下的步数变成奖励');
        await wait(T(650));
        const bonus = simBonus(state);
        await playWaves(bonus, { fast: true });
        syncToState();
      } else toast('目标达成！');
      const stars = calcStars(state);
      saveProgress(stars);
      showWin(stars);
    } else if (result.lost) {
      showLose();
    }
  } finally {
    busy = false;
  }
}
function cellAt(clientX, clientY) {
  const rect = gridEl.getBoundingClientRect();
  const x = clientX - rect.left;
  const y = clientY - rect.top;
  const step = S + G;
  if (step <= 0) return null;
  const c = Math.floor(x / step);
  const r = Math.floor(y / step);
  if (!inside(r, c)) return null;
  return { r: r, c: c };
}
function onDown(e) {
  if (busy || modalOpen || viewGame.hidden) return;
  if (e.button != null && e.button !== 0) return;
  unlockAudio();
  const cell = cellAt(e.clientX, e.clientY);
  if (!cell || !state.board[cell.r][cell.c]) return;
  try { boardInner.setPointerCapture(e.pointerId); } catch (err) {}
  drag = { pid: e.pointerId, r: cell.r, c: cell.c, x: e.clientX, y: e.clientY, moved: false, nel: null };
  const el = elAt(cell.r, cell.c);
  if (el) el.classList.add('press');
}
function onMove(e) {
  if (!drag || e.pointerId !== drag.pid || busy) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 8) return;
  drag.moved = true;
  let mx = 0;
  let my = 0;
  if (Math.abs(dx) > Math.abs(dy)) mx = Math.max(-S, Math.min(S, dx));
  else my = Math.max(-S, Math.min(S, dy));
  const el = elAt(drag.r, drag.c);
  if (!el) return;
  el.style.setProperty('--dur', '0ms');
  el.style.setProperty('--dx', mx + 'px');
  el.style.setProperty('--dy', my + 'px');
  el.style.zIndex = '6';
  const nr = drag.r + (my > 10 ? 1 : my < -10 ? -1 : 0);
  const nc = drag.c + (mx > 10 ? 1 : mx < -10 ? -1 : 0);
  const nel = (nr !== drag.r || nc !== drag.c) ? elAt(nr, nc) : null;
  if (drag.nel && drag.nel !== nel) {
    drag.nel.style.setProperty('--dx', '0px');
    drag.nel.style.setProperty('--dy', '0px');
  }
  drag.nel = nel;
  if (nel) {
    nel.style.setProperty('--dur', '0ms');
    nel.style.setProperty('--dx', (-mx * 0.22) + 'px');
    nel.style.setProperty('--dy', (-my * 0.22) + 'px');
  }
}
function onUp(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  drag = null;
  const el = elAt(d.r, d.c);
  if (el) el.classList.remove('press');
  const dx = e.clientX - d.x;
  const dy = e.clientY - d.y;
  let tr = d.r;
  let tc = d.c;
  const dragged = d.moved && (Math.abs(dx) > S * 0.34 || Math.abs(dy) > S * 0.34);
  if (dragged) {
    if (Math.abs(dx) > Math.abs(dy)) tc += dx > 0 ? 1 : -1;
    else tr += dy > 0 ? 1 : -1;
    userSwap(d.r, d.c, tr, tc);
    return;
  }
  springBack();
  if (d.moved) return;
  if (!state.board[d.r][d.c]) return;
  if (selected && selected.r === d.r && selected.c === d.c) { clearSel(); return; }
  if (selected && Math.abs(selected.r - d.r) + Math.abs(selected.c - d.c) === 1) {
    const s = selected;
    clearSel();
    userSwap(s.r, s.c, d.r, d.c);
    return;
  }
  select(d.r, d.c);
}
function bind() {
  boardInner.addEventListener('pointerdown', onDown);
  boardInner.addEventListener('pointermove', onMove);
  boardInner.addEventListener('pointerup', onUp);
  boardInner.addEventListener('pointercancel', function (e) {
    if (!drag || e.pointerId !== drag.pid) return;
    drag = null;
    springBack();
  });
  boardInner.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  backBtn.addEventListener('click', function () {
    if (busy) return;
    if (backBtn.dataset.mode === 'help') openHelp();
    else { closeModal(); showMap(); }
  });
  soundBtn.addEventListener('click', function () {
    unlockAudio();
    save.sound = !save.sound;
    persist();
    renderSound();
    if (save.sound) blip(660, 0.08, 'sine', 0.04);
  });
  continueBtn.addEventListener('click', function () { startLevel(continueIndex()); });
  document.getElementById('btn-hint').addEventListener('click', function () {
    if (busy || modalOpen) return;
    unlockAudio();
    flashHint();
  });
  document.getElementById('btn-restart').addEventListener('click', function () {
    if (busy || modalOpen) return;
    startLevel(levelIndex);
  });
  document.getElementById('btn-help').addEventListener('click', function () {
    if (busy) return;
    openHelp();
  });
  modal.addEventListener('click', function (e) {
    const node = e.target.closest('[data-act]');
    if (!node) return;
    const act = node.dataset.act;
    if (act === 'back') {
      if (modalKind === 'help') closeModal();
      return;
    }
    if (act === 'close') { closeModal(); return; }
    if (act === 'map') { closeModal(); showMap(); return; }
    if (act === 'retry') { closeModal(); startLevel(levelIndex); return; }
    if (act === 'next') { closeModal(); startLevel(levelIndex + 1); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalOpen && modalKind === 'help') { closeModal(); return; }
    if (modalOpen || busy || viewGame.hidden || !selected) return;
    const dir = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
    if (!dir) return;
    const r = selected.r + dir[0];
    const c = selected.c + dir[1];
    if (!inside(r, c)) return;
    e.preventDefault();
    const s = selected;
    clearSel();
    userSwap(s.r, s.c, r, c);
  });
  window.addEventListener('resize', function () {
    if (viewGame.hidden || !state) return;
    measure();
    if (busy) return;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = state.board[r][c];
        if (p) moveEl(pieceEls.get(p.id), r, c, false, 0);
      }
    }
  });
}

renderSound();
renderHero();
bind();
showMap();
</script>
