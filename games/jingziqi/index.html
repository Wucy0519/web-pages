<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>井字棋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4efe8'/%3E%3Cpath d='M8 8l6 6M14 8l-6 6M18 18l6 6M24 18l-6 6' stroke='%23241f1a' stroke-width='1.7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #241f1a;
    --muted: #8a7d70;
    --line: rgba(36, 31, 26, 0.14);
    --paper: #f4efe8;
    --cinnabar: #9d3b2c;
    --serif: "Songti SC", "STSongti-SC-Regular", "Noto Serif SC", Palatino, "Palatino Linotype", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(900px 480px at 50% -10%, rgba(255, 252, 247, 0.95), transparent 60%);
  }

  button { font-family: inherit; }
  ::selection { background: #ead7b6; }

  .wrap {
    width: min(calc(100% - 36px), calc(100vh - 196px));
    width: min(calc(100% - 36px), calc(100dvh - 196px));
    margin: auto;
    padding: 16px 0 18px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 42px;
    font-weight: 600;
    letter-spacing: 0.2em;
    line-height: 1;
  }

  .sub {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.08em;
  }

  .score {
    display: flex;
    gap: 22px;
    align-items: baseline;
    padding-bottom: 2px;
  }

  .score b {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    line-height: 1;
  }

  .score em {
    font-style: normal;
    margin-left: 4px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.16em;
  }

  .score b.lead { color: var(--cinnabar); }

  .board-wrap { margin-top: 16px; }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 18px;
    touch-action: none;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.7) inset,
      0 18px 40px rgba(80, 48, 16, 0.1),
      0 2px 6px rgba(80, 48, 16, 0.05);
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px 28px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .turn {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 28px;
  }

  .glyph {
    width: 16px;
    height: 16px;
    position: relative;
    flex: none;
  }

  .glyph.x::before,
  .glyph.x::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 0;
    width: 2px;
    height: 16px;
    border-radius: 1px;
    background: var(--ink);
  }

  .glyph.x::before { transform: rotate(45deg); }
  .glyph.x::after { transform: rotate(-45deg); }

  .glyph.o {
    border: 2px solid var(--cinnabar);
    border-radius: 50%;
  }

  .glyph.think { animation: breathe 1.1s ease-in-out infinite; }

  @keyframes breathe { 50% { opacity: 0.35; } }

  @media (prefers-reduced-motion: reduce) {
    .glyph.think { animation: none; }
  }

  #status {
    margin: 0;
    font-family: var(--serif);
    font-size: 18px;
    letter-spacing: 0.08em;
  }

  #status.win { color: var(--cinnabar); }

  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }

  button {
    appearance: none;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    letter-spacing: 0.14em;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }

  .seg button { border: 0; border-radius: 0; }

  button:hover { background: rgba(36, 31, 26, 0.05); }

  button.on,
  button.primary {
    background: var(--ink);
    color: #f7f3ec;
    border-color: var(--ink);
  }

  button.on:hover,
  button.primary:hover { background: #3a342c; }

  button:disabled {
    opacity: 0.32;
    cursor: default;
    background: transparent;
    color: var(--ink);
  }

  button:focus-visible {
    outline: 2px solid var(--cinnabar);
    outline-offset: 3px;
  }

  @media (max-width: 560px) {
    .wrap { width: min(calc(100% - 28px), calc(100dvh - 168px)); padding: 16px 0 18px; }
    h1 { font-size: 34px; letter-spacing: 0.14em; }
    .bar { align-items: stretch; flex-direction: column; gap: 14px; }
    .actions { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body><style>
a.catalog-back{position:fixed;top:12px;left:12px;z-index:9999;display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(255,250,243,.94);color:#241c14;border:1px solid #e3d3be;text-decoration:none;font:14px/1.4 "PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;box-shadow:0 6px 16px rgba(60,40,20,.08)}
a.catalog-back:hover{border-color:#9d2c1a;color:#9d2c1a}
</style>
<a class="catalog-back" href="../../index.html">返回目录</a>

  <main class="wrap">
    <header>
      <div>
        <h1>井字棋</h1>
        <p class="sub" id="sub">先手为叉 · 三子一线</p>
      </div>
      <div class="score" aria-label="胜局">
        <span><b id="score-x">0</b><em>叉</em></span>
        <span><b id="score-o">0</b><em>圈</em></span>
      </div>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="720" height="720" aria-label="井字棋棋盘"></canvas>
    </div>

    <div class="bar">
      <div class="turn">
        <i class="glyph x" id="glyph" aria-hidden="true"></i>
        <p id="status">叉方落子</p>
      </div>
      <div class="actions">
        <div class="seg" role="group" aria-label="对局方式">
          <button type="button" id="mode-pvp" class="on" aria-pressed="true">对弈</button>
          <button type="button" id="mode-ai" aria-pressed="false">人机</button>
        </div>
        <button type="button" id="undo" disabled>悔棋</button>
        <button type="button" id="restart" class="primary">重开</button>
      </div>
    </div>
  </main>

<script>
(function () {
  const LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const subEl = document.getElementById("sub");
  const glyphEl = document.getElementById("glyph");
  const undoBtn = document.getElementById("undo");
  const restartBtn = document.getElementById("restart");
  const pvpBtn = document.getElementById("mode-pvp");
  const aiBtn = document.getElementById("mode-ai");
  const scoreXEl = document.getElementById("score-x");
  const scoreOEl = document.getElementById("score-o");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let board, history, current, winner, winLine, hover, mode, thinking, timer, anim, tally;
  let view = { size: 720, pad: 72, cell: 192 };

  function reset() {
    clearTimeout(timer);
    board = Array(9).fill(0);
    history = [];
    current = 1;
    winner = null;
    winLine = null;
    hover = null;
    thinking = false;
    anim = null;
    paint();
    sync();
  }

  function fresh() {
    tally = { 1: 0, 2: 0 };
    reset();
  }

  function findWin(player) {
    for (const line of LINES) {
      if (line.every((i) => board[i] === player)) return line;
    }
    return null;
  }

  function full() {
    return board.every((v) => v !== 0);
  }

  function empties() {
    const list = [];
    for (let i = 0; i < 9; i++) if (!board[i]) list.push(i);
    return list;
  }

  function place(i, player) {
    if (board[i] || winner !== null) return false;
    board[i] = player;
    history.push({ i: i, player: player });
    winLine = findWin(player);
    if (winLine) {
      winner = player;
      tally[player] += 1;
    } else if (full()) {
      winner = 0;
    } else {
      current = 3 - player;
    }
    hover = null;
    anim = reduceMotion ? null : { i: i, t0: performance.now() };
    paint();
    if (anim) requestAnimationFrame(tick);
    sync();
    if (winner === null && mode === "ai" && current === 2) scheduleAi();
    return true;
  }

  function tick() {
    if (!anim) return;
    paint();
    if (performance.now() - anim.t0 < 180) requestAnimationFrame(tick);
    else { anim = null; paint(); }
  }

  function undo() {
    if (!history.length) return;
    clearTimeout(timer);
    thinking = false;
    anim = null;
    const undone = [];
    if (mode === "ai" && history[history.length - 1].player === 2) undone.push(history.pop());
    if (history.length) undone.push(history.pop());
    for (const move of undone) {
      if (winner === move.player) tally[move.player] = Math.max(0, tally[move.player] - 1);
      board[move.i] = 0;
    }
    winner = null;
    winLine = null;
    current = history.length ? 3 - history[history.length - 1].player : 1;
    hover = null;
    paint();
    sync();
  }

  function minimax(player, depth) {
    if (findWin(1)) return 10 - depth;
    if (findWin(2)) return depth - 10;
    const open = empties();
    if (!open.length) return 0;
    let best = player === 1 ? -Infinity : Infinity;
    for (const i of open) {
      board[i] = player;
      const score = minimax(3 - player, depth + 1);
      board[i] = 0;
      if (player === 1) best = Math.max(best, score);
      else best = Math.min(best, score);
    }
    return best;
  }

  function chooseMove() {
    const open = empties();
    let bestScore = Infinity;
    let best = [];
    for (const i of open) {
      board[i] = 2;
      const score = minimax(1, 1);
      board[i] = 0;
      if (score < bestScore - 1e-9) {
        bestScore = score;
        best = [i];
      } else if (Math.abs(score - bestScore) <= 1e-9) {
        best.push(i);
      }
    }
    const weight = (i) => (i === 4 ? 0 : (i % 2 === 0 ? 1 : 2));
    best.sort((a, b) => weight(a) - weight(b) || Math.random() - 0.5);
    return best[0];
  }

  function scheduleAi() {
    thinking = true;
    sync();
    timer = setTimeout(() => {
      if (mode !== "ai" || winner !== null || current !== 2) {
        thinking = false;
        sync();
        return;
      }
      const move = chooseMove();
      thinking = false;
      if (move !== undefined) place(move, 2);
      else sync();
    }, 280);
  }

  function setMode(next) {
    if (mode === next) return;
    mode = next;
    pvpBtn.classList.toggle("on", mode === "pvp");
    aiBtn.classList.toggle("on", mode === "ai");
    pvpBtn.setAttribute("aria-pressed", mode === "pvp" ? "true" : "false");
    aiBtn.setAttribute("aria-pressed", mode === "ai" ? "true" : "false");
    fresh();
  }

  function sync() {
    const names = { 1: "叉方", 2: "圈方" };
    scoreXEl.textContent = String(tally[1]);
    scoreOEl.textContent = String(tally[2]);
    scoreXEl.classList.toggle("lead", winner === 1);
    scoreOEl.classList.toggle("lead", winner === 2);
    statusEl.classList.toggle("win", winner === 1 || winner === 2);
    if (winner === 1 || winner === 2) statusEl.textContent = names[winner] + "胜";
    else if (winner === 0) statusEl.textContent = "和棋";
    else if (thinking) statusEl.textContent = "电脑落子";
    else statusEl.textContent = names[current] + "落子";

    if (mode === "ai") subEl.textContent = "你执叉 · 电脑执圈";
    else subEl.textContent = "先手为叉 · 三子一线";

    const show = (winner === 1 || winner === 2) ? winner : (thinking ? 2 : current);
    glyphEl.className = "glyph " + (show === 2 ? "o" : "x") + (thinking ? " think" : "");
    undoBtn.disabled = history.length === 0;
    restartBtn.textContent = winner !== null ? "再来" : "重开";
    const legalHover = hover !== null && !board[hover] && winner === null && !thinking && (mode === "pvp" || current === 1);
    canvas.style.cursor = legalHover ? "pointer" : "default";
  }

  function metric() {
    const size = canvas.clientWidth || 720;
    const pad = size * 0.11;
    view = { size: size, pad: pad, cell: (size - pad * 2) / 3 };
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function cellCenter(i) {
    const x = i % 3;
    const y = (i / 3) | 0;
    return [
      view.pad + (x + 0.5) * view.cell,
      view.pad + (y + 0.5) * view.cell
    ];
  }

  function drawMark(i, player, alpha, scale) {
    const [cx, cy] = cellCenter(i);
    const m = view.cell * 0.26 * (scale || 1);
    const weight = Math.max(6, view.cell * 0.055);
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.lineWidth = weight;
    ctx.lineCap = "round";
    if (player === 1) {
      ctx.strokeStyle = "#241f1a";
      ctx.beginPath();
      ctx.moveTo(cx - m, cy - m);
      ctx.lineTo(cx + m, cy + m);
      ctx.moveTo(cx + m, cy - m);
      ctx.lineTo(cx - m, cy + m);
      ctx.stroke();
    } else {
      ctx.strokeStyle = "#9d3b2c";
      ctx.beginPath();
      ctx.arc(cx, cy, m * 0.92, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function paint() {
    metric();
    const { size, pad, cell } = view;
    ctx.fillStyle = "#f7f1e6";
    ctx.fillRect(0, 0, size, size);

    ctx.strokeStyle = "rgba(36, 31, 26, 0.82)";
    ctx.lineWidth = Math.max(2.5, size * 0.008);
    ctx.lineCap = "round";
    const inset = pad * 0.42;
    ctx.beginPath();
    for (const k of [1, 2]) {
      const p = pad + k * cell;
      ctx.moveTo(inset, p);
      ctx.lineTo(size - inset, p);
      ctx.moveTo(p, inset);
      ctx.lineTo(p, size - inset);
    }
    ctx.stroke();

    if (winLine) {
      const a = cellCenter(winLine[0]);
      const b = cellCenter(winLine[2]);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.strokeStyle = "rgba(157, 59, 44, 0.9)";
      ctx.lineWidth = Math.max(4, view.cell * 0.035);
      ctx.stroke();
    }

    for (let i = 0; i < 9; i++) {
      if (!board[i]) continue;
      let scale = 1;
      if (anim && anim.i === i && !reduceMotion) {
        const k = Math.min(1, (performance.now() - anim.t0) / 170);
        scale = 0.72 + 0.28 * (1 - Math.pow(1 - k, 3));
      }
      drawMark(i, board[i], 1, scale);
    }

    if (hover !== null && !board[hover] && winner === null && !thinking && (mode === "pvp" || current === 1)) {
      drawMark(hover, current, current === 1 ? 0.28 : 0.4, 1);
    }
  }

  function cellAt(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const gx = Math.floor((x - view.pad) / view.cell);
    const gy = Math.floor((y - view.pad) / view.cell);
    if (gx < 0 || gy < 0 || gx > 2 || gy > 2) return null;
    return gy * 3 + gx;
  }

  canvas.addEventListener("pointermove", (e) => {
    const next = cellAt(e.clientX, e.clientY);
    if (next === hover) return;
    hover = next;
    paint();
    sync();
  });

  canvas.addEventListener("pointerleave", () => {
    if (hover === null) return;
    hover = null;
    paint();
    sync();
  });

  canvas.addEventListener("pointerdown", (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    if (winner !== null || thinking) return;
    if (mode === "ai" && current !== 1) return;
    const i = cellAt(e.clientX, e.clientY);
    if (i === null || board[i]) return;
    place(i, current);
  });

  undoBtn.addEventListener("click", undo);
  restartBtn.addEventListener("click", reset);
  pvpBtn.addEventListener("click", () => setMode("pvp"));
  aiBtn.addEventListener("click", () => setMode("ai"));

  window.addEventListener("keydown", (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "z" || e.key === "Z") undo();
    if (e.key === "r" || e.key === "R") reset();
  });

  new ResizeObserver(() => paint()).observe(canvas.parentElement);
  mode = "pvp";
  fresh();
})();
</script>
</body>
</html>
