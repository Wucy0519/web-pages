<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>网页目录</title>
<style>
  :root {
    --ink: #241c14;
    --muted: #6d5c4d;
    --paper: #fffaf3;
    --bg: #e7dccb;
    --line: #e3d3be;
    --hot: #9d2c1a;
    --gold: #a68445;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 0% -10%, #f8f1e4 0%, transparent 55%),
      radial-gradient(700px 380px at 100% 0%, #f3e4cf 0%, transparent 50%),
      var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 36px 20px 64px; }
  header {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 22px;
  }
  .seal {
    width: 74px;
    height: 74px;
    border: 3px solid var(--hot);
    color: var(--hot);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-size: 30px;
    letter-spacing: 0.12em;
    transform: rotate(-8deg);
    background: #fff7f2;
    flex: 0 0 auto;
  }
  h1 {
    margin: 0;
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-size: 36px;
    letter-spacing: 0.08em;
  }
  .sub { margin: 6px 0 0; color: var(--muted); max-width: 640px; }
  .search {
    width: 100%;
    margin: 0 0 16px;
    border: 1px solid var(--line);
    background: #fffaf3;
    border-radius: 999px;
    padding: 12px 18px;
    outline: none;
    font: inherit;
  }
  .search:focus { border-color: #b08968; }
  mark { background: #f3d48a; color: inherit; border-radius: 4px; padding: 0 2px; }
  .board {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 16px;
    align-items: start;
  }
  .panel {
    background: rgba(255, 250, 243, 0.94);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 14px;
  }
  .label {
    margin: 2px 6px 10px;
    color: var(--gold);
    letter-spacing: 0.16em;
    font-size: 13px;
  }
  .level1 { display: flex; flex-direction: column; gap: 8px; }
  .folder, .page {
    text-align: left;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 16px;
    padding: 12px 14px;
  }
  .folder.on {
    background: var(--ink);
    color: #f6efe4;
    border-color: var(--ink);
  }
  .folder small, .page small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .folder.on small { color: #e7d7c4; }
  .pages { display: flex; flex-direction: column; gap: 10px; }
  a.page {
    display: block;
    text-decoration: none;
  }
  a.page:hover { border-color: var(--hot); transform: translateY(-1px); }
  a.page strong {
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-size: 22px;
    letter-spacing: 0.06em;
  }
  a.page span.enter {
    float: right;
    color: var(--hot);
    letter-spacing: 0.08em;
    font-size: 14px;
    margin-top: 4px;
  }
  .empty { color: var(--muted); padding: 28px 8px; text-align: center; }
  footer { margin-top: 22px; color: var(--muted); font-size: 13px; }
  @media (max-width: 720px) {
    .board { grid-template-columns: 1fr; }
    h1 { font-size: 30px; }
    .seal { width: 58px; height: 58px; font-size: 24px; }
    .level1 { flex-direction: row; overflow: auto; }
    .folder { min-width: 140px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">目</div>
    <div>
      <h1>网页目录</h1>
      <p class="sub">先点左边的一级目录，再点右边的页面进入。也可以直接搜索页面名字。</p>
    </div>
  </header>
  <input id="q" class="search" type="search" placeholder="搜索页面，例如五子棋、冷笑话" autocomplete="off" />
  <div class="board">
    <section class="panel">
      <p class="label">一级目录</p>
      <div class="level1" id="level1"></div>
    </section>
    <section class="panel">
      <p class="label" id="level2-label">二级目录</p>
      <div class="pages" id="level2"></div>
    </section>
  </div>
  <footer>
    <p>要再放一个网页，把文件放进对应文件夹，再在本页脚本的目录数据里加一条。</p>
  </footer>
</div>
<script>
const CATALOG = [
  {
    name: "娱乐",
    note: "拿来消遣的页面",
    pages: [
      {
        title: "冷笑话大全",
        href: "lengxiaohua/index.html",
        summary: "珍藏的放在最前。可以标好笑或不好笑，再把好笑的导出成 txt。"
      },
      {
        title: "弱智吧发言",
        href: "ruozhiba/index.html",
        summary: "公开转载的经典发言。可以标好笑或不好笑，再把好笑的导出成 txt。"
      }
    ]
  },
  {
    name: "游戏",
    note: "能直接打开玩的页面",
    pages: [
      { title: "黑白棋", href: "games/heibaiqi/index.html", summary: "双方轮流落子，把对方棋子夹在中间就会翻面。" },
      { title: "角度感知", href: "games/jiaodu/index.html", summary: "看两条线张开的角度，判断自己估得准不准。" },
      { title: "井字棋", href: "games/jingziqi/index.html", summary: "在九宫格里抢先连成三个。" },
      { title: "跳棋", href: "games/tiaoqi/index.html", summary: "棋子可以连跳，先把己方走到对面。" },
      { title: "五子棋", href: "games/wuziqi/index.html", summary: "轮流落子，先连成五子的一方获胜。" },
      { title: "2048", href: "games/2048/index.html", summary: "滑动合并相同数字，凑出 2048。" },
      { title: "俄罗斯方块", href: "games/tetris/index.html", summary: "方块不断下落，凑满一行就消除。" },
      { title: "绝对色感", href: "games/color/index.html", summary: "分辨非常接近的颜色。" },
      { title: "枪战小游戏", href: "games/shooter/index.html", summary: "第一人称射击小游戏。" },
      { title: "开心消消乐", href: "games/match3/index.html", summary: "交换相邻方块，三个一样就消除。" },
      { title: "拼豆画板", href: "games/beadboard/index.html", summary: "在格子上点出一幅拼豆图。" },
      { title: "贪吃蛇", href: "games/snake/index.html", summary: "控制蛇吃掉食物，不要撞到自己。" }
    ]
  },
  {
    name: "工具",
    note: "拿来算、画、认的页面",
    pages: [
      { title: "计算器", href: "tools/calculator/index.html", summary: "做加减乘除。" },
      { title: "拼豆分析", href: "games/pindou/index.html", summary: "把图片拆成可以照着拼的拼豆图纸。" },
      { title: "答案之书", href: "tools/answers/index.html", summary: "心里想好一个问题，翻开书页看一句答案。" },
      { title: "手写数字识别", href: "tools/digits/index.html", summary: "写一个数字，让页面认出来。" }
    ]
  }
];

const level1 = document.getElementById("level1");
const level2 = document.getElementById("level2");
const level2Label = document.getElementById("level2-label");
const search = document.getElementById("q");
let current = 0;

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}
function highlight(value, query) {
  const safe = esc(value);
  if (!query) return safe;
  const pattern = esc(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(pattern, "gi"), (hit) => `<mark>${hit}</mark>`);
}
function query() {
  return search.value.trim();
}
function pageMatches(group, page, q) {
  if (!q) return true;
  return (group.name + " " + page.title + " " + page.summary).toLowerCase().includes(q.toLowerCase());
}
function visibleGroups() {
  const q = query();
  return CATALOG.map((group, index) => ({
    group,
    index,
    pages: group.pages.filter((page) => pageMatches(group, page, q))
  })).filter((item) => item.pages.length);
}

function render() {
  const q = query();
  const groups = visibleGroups();
  if (!groups.some((item) => item.index === current)) {
    current = groups.length ? groups[0].index : 0;
  }
  level1.innerHTML = groups.length
    ? groups.map((item) => `
      <button class="folder${item.index === current ? " on" : ""}" type="button" data-index="${item.index}">
        ${highlight(item.group.name, q)}
        <small>${item.pages.length} 个页面 · ${highlight(item.group.note, q)}</small>
      </button>
    `).join("")
    : `<div class="empty">没有符合的目录。</div>`;
  const shown = groups.find((item) => item.index === current);
  level2Label.textContent = q
    ? "搜索结果" + (shown ? " · " + shown.group.name : "")
    : "二级目录" + (shown ? " · " + shown.group.name : "");
  if (!shown) {
    level2.innerHTML = `<div class="empty">没有找到「${esc(q)}」。</div>`;
    return;
  }
  level2.innerHTML = shown.pages.map((page) => `
    <a class="page" href="${esc(page.href)}">
      <span class="enter">进入</span>
      <strong>${highlight(page.title, q)}</strong>
      <small>${highlight(page.summary, q)}</small>
    </a>
  `).join("");
}

level1.addEventListener("click", (event) => {
  const button = event.target.closest("[data-index]");
  if (!button) return;
  current = Number(button.dataset.index);
  render();
});
search.addEventListener("input", render);

render();
</script>
</body>
</html>
