      var(--bg);
  }

    gap: 28px;
    align-items: end;
    flex: none;

    margin: 0 0 4px;
    color: var(--gold);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.22em;
  }
  h1 { margin: 0; font-size: 34px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.1; }
  .lede {
    margin: 0 0 6px;
    max-width: 36em;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
  }
  .live {
    margin: 0 0 4px;
    min-width: 9em;
    text-align: right;
    color: var(--muted);
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .live.hot { color: var(--gold); }

    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 292px minmax(0, 1fr);
    gap: 22px;
  }

    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

    aspect-ratio: 1;
    border-radius: 26px;
    overflow: hidden;
    background: var(--paper);
    box-shadow:

      inset 0 0 0 1px rgba(255, 255, 255, 0.45);

  }

    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }

    height: 100%;
    display: block;
    touch-action: none;

  .btn {

    height: 44px;
    border-radius: 22px;
    border: 0;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;

  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .btn.solid:hover { background: var(--hover); }
  .btn.solid:active { background: var(--pressed); }

    background: transparent;
    color: var(--paper);
    border: 1.5px solid var(--faint);

  .btn:disabled { opacity: 0.4; cursor: default; }

    margin: 0;
    color: var(--faint);
    font-size: 12px;
    line-height: 1.5;

  .sample-row button {
    height: 28px;
    border-radius: 14px;
    border: 1px solid var(--faint);
    background: transparent;
    color: var(--paper);
    font-size: 13px;
    font-weight: 600;

    align-items: center;
    justify-content: center;

    gap: 12px;
    align-items: center;

    height: 2px;
    border-radius: 2px;

    border-radius: 50%;
    background: var(--gold);
    border: 0;
  }

    pointer-events: none;

    padding: 8px 10px;
    border-radius: 10px;
    background: rgb(14 15 18);
    color: var(--paper);

    line-height: 1.45;

  }
  @media (prefers-reduced-motion: reduce) {
    .paper, .btn { transition: none; }
    .paper.shake { animation: none; }
  }

const HEAT = Array.from({ length: 256 }, (_, i) => {
  const stops = [[0, [32, 36, 44]], [0.2, [55, 82, 76]], [0.48, [106, 142, 133]], [0.74, [236, 232, 223]], [1, [227, 177, 90]]];
  const v = i / 255;
  let k = 0;
  while (k < stops.length - 2 && v > stops[k + 1][0]) k++;
  const a = stops[k], b = stops[k + 1];
  const u = (v - a[0]) / (b[0] - a[0] || 1);
  const c = a[1].map((n, j) => Math.round(n + (b[1][j] - n) * u));
  return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
});

function catmull(points, n) {

    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2];
    for (let s = 0; s < steps; s++) {

      out.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),

    }

}

    const x = p * 7.999;
    const i = Math.floor(x);
    return { a: { layer: 1, index: i }, b: { layer: 1, index: Math.min(7, i + 1) }, u: 1 - (x - i) };
  }
  const i = state.result.bestK;
  return { a: { layer: 1, index: i }, b: { layer: 1, index: i }, u: 1 };
}

function drawKernelCard(spec, alpha) {
  if (alpha <= 0.01) return;
  const A = kernelWeights(spec.a);
  const B = kernelWeights(spec.b);
  let maxAbs = 1e-6;
  for (let i = 0; i < 25; i++) maxAbs = Math.max(maxAbs, Math.abs(A.w[i]), Math.abs(B.w[i]));
  ctx.save();
  ctx.globalAlpha = alpha;
  label(spec.u > 0.5 ? A.title : B.title, KERNEL.x, KERNEL.y - 16, COL.muted, 12);
  const cell = KERNEL.cell;
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const i = r * 5 + c;
    const wa = A.w[i], wb = B.w[i];
    const w = wa * spec.u + wb * (1 - spec.u);
    const mag = Math.min(1, Math.abs(w) / maxAbs);
    const tint = w >= 0 ? [227, 177, 90] : [225, 90, 69];
    const z = [37, 38, 45];
    const col = z.map((n, k) => Math.round(n + (tint[k] - n) * mag));
    ctx.fillStyle = `rgb(${col[0]}, ${col[1]}, ${col[2]})`;
    roundRect(KERNEL.x + c * (cell + 3), KERNEL.y + r * (cell + 3), cell, cell, 3);
    ctx.fill();
  }
  pushHit("kernel", 0, KERNEL.x, KERNEL.y - 24, 5 * (cell + 3), 5 * (cell + 3) + 28);
  ctx.restore();
}

function drawInput(t) {
  const res = state.result;
  const pose = inputPose(t);
  const show = res ? 1 : 0;
  for (let r = 0; r < 28; r++) for (let c = 0; c < 28; c++) {
    const box = cellBox(pose, c, r);
    let v = 0, rev = 1;
    if (res) {
      const dist = Math.hypot(c - res.com.x, r - res.com.y);
      const delay = dist * 22;
      rev = span(t, TIME.ripple0 + delay, TIME.ripple0 + delay + 380);
      const raw = res.pixels[r * 28 + c];
      const flash = Math.sin(rev * Math.PI);
      v = raw * rev * (1 + 0.55 * flash * (1 - rev));
    } else rev = 1;
    if (rev <= 0) continue;
    ctx.fillStyle = v < 0.025 ? `rgba(255,255,255,${0.07 * rev})` : heat(v);
    if (box.s >= 5) {
      roundRect(box.x, box.y, box.s, box.s, Math.min(3.5, box.s * 0.22));
      ctx.fill();
    } else ctx.fillRect(box.x, box.y, box.s, box.s);
  }
  if (res && pose.k > 0.4) {
    const u = clamp((t - TIME.scan0) / (TIME.scan1 - TIME.scan0), 0, 1);
    if (u > 0 && u < 1) {
      const size = gridSpan(28, pose.pitch, pose.gap);
      const y = pose.y + size * easeInOut(u);
      ctx.save();
      ctx.beginPath();
      ctx.rect(pose.x, pose.y, size, size);
      ctx.clip();
      const g = ctx.createLinearGradient(0, y - 16, 0, y + 16);
      g.addColorStop(0, "rgba(227,177,90,0)");
      g.addColorStop(0.5, "rgba(227,177,90,0.32)");
      g.addColorStop(1, "rgba(227,177,90,0)");
      ctx.fillStyle = g;
      ctx.fillRect(pose.x, y - 16, size, 32);
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = pose.k;
    ctx.fillStyle = COL.gold;
    ctx.font = `600 13px ${SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    const size = gridSpan(28, pose.pitch, pose.gap);
    ctx.fillText("28 × 28", pose.x + size / 2, pose.y - 12);
    ctx.restore();
  }
  if (pose.k < 0.85) {
    ctx.save();
    ctx.globalAlpha = 1 - pose.k;
    label("输入 · 28×28", INPUT.x, INPUT.y - 16, COL.muted, 12);
    ctx.restore();
  }
  if (res && pose.k < 0.2 && t >= 0) drawSweep(t, pose, res);
  const size = gridSpan(28, pose.pitch, pose.gap);
  pushHit("input", 0, pose.x, pose.y, size, size);
}

function drawSweep(t, pose, res) {
  const p = span(t, TIME.sweep0, TIME.sweep1);
  if (p <= 0 || p >= 1) return;
  const bb = res.bbox;
  const rows = [0.18, 0.5, 0.82];
  const pts = [];
  rows.forEach((fy, i) => {
    const y = lerp(bb.yT, bb.yB, fy);
    const xs = i % 2 ? [bb.xR, (bb.xL + bb.xR) / 2, bb.xL] : [bb.xL, (bb.xL + bb.xR) / 2, bb.xR];
    xs.forEach((x) => pts.push({ x, y }));
  });
  const travel = easeInOut(p) * (pts.length - 1);
  const i = Math.min(pts.length - 2, Math.floor(travel));
  const u = travel - i;
  const c = lerp(pts[i].x, pts[i + 1].x, u);
  const r = lerp(pts[i].y, pts[i + 1].y, u);
  const mid = cellMid(pose, c, r);
  const side = 5 * pose.pitch - pose.gap;
  ctx.save();
  ctx.strokeStyle = COL.gold;
  ctx.lineWidth = 1.6;
  ctx.globalAlpha = 0.9;
  roundRect(mid.x - side / 2, mid.y - side / 2, side, side, 4);
  ctx.stroke();
  ctx.restore();
}

function drawMaps(t) {
  const res = state.result;
  const revealT = res ? 1 : 0;
  const poolP = res ? span(t, TIME.pool0, TIME.pool1) : 0;
  const mSize = mapSpan();
  ctx.save();
  ctx.globalAlpha = 1 - (res ? enlargeK(t) : 0);
  label("卷积 · 8 张特征图", MAP.x, MAP.y + 4, COL.muted, 12);
  for (let i = 0; i < 8; i++) {
    const o = mapOrigin(i);
    const appear = res ? span(t, TIME.map0 + i * 55, TIME.map0 + i * 55 + (TIME.map1 - TIME.map0 - 400)) : 0;
    ctx.strokeStyle = "rgba(244,241,234,0.16)";
    ctx.lineWidth = 1;
    roundRect(o.x - 4, o.y - 4, mSize + 8, mSize + 8, 6);
    ctx.stroke();
    pushHit("map", i, o.x - 4, o.y - 4, mSize + 8, mSize + 8);
    if (!res || appear <= 0) continue;
    const max = res.c1max[i];
    const cell = MAP.pitch - MAP.gap;
    for (let r = 0; r < 28; r++) {
      const rowU = clamp((appear - (r / 28) * 0.62) / 0.38, 0, 1);
      if (rowU <= 0) continue;
      for (let c = 0; c < 28; c++) {
        const fine = res.c1[i * 784 + r * 28 + c] / max;
        const coarse = res.p1[i * 196 + ((r >> 1) * 14) + (c >> 1)] / max;
        const v = (fine * (1 - poolP) + coarse * poolP) * rowU;
        ctx.fillStyle = v < 0.03 ? `rgba(255,255,255,${0.04 * rowU})` : heat(v);
        ctx.fillRect(o.x + c * MAP.pitch, o.y + r * MAP.pitch, cell, cell);
      }
    }
    const emax = Math.max(...res.c1e);
    const ew = (res.c1e[i] / emax) * mSize * appear;
    ctx.fillStyle = COL.gold;
    roundRect(o.x, o.y + mSize + 5, Math.max(2, ew), 3, 1.5);
    ctx.fill();
  }
  if (res && poolP > 0 && poolP < 1) {
    ctx.fillStyle = COL.gold;
    ctx.globalAlpha *= Math.sin(poolP * Math.PI) * 0.8;
    ctx.font = `600 12px ${SANS}`;
    ctx.textAlign = "left";
    ctx.fillText("2×2 最大池化", MAP.x + 150, MAP.y + 4);
  }
  ctx.restore();
}

function drawDeep(t) {
  const res = state.result;
  const poolP = res ? span(t, TIME.pool2a, TIME.pool2b) : 0;
  const size = c2Span();
  ctx.save();
  ctx.globalAlpha = 1 - (res ? enlargeK(t) : 0);
  label("深层 · 16 张", C2.x, C2.y + 2, COL.muted, 12);
  for (let i = 0; i < 16; i++) {
    const o = c2Origin(i);
    const appear = res ? span(t, TIME.deep0 + i * 28, TIME.deep0 + i * 28 + (TIME.deep1 - TIME.deep0 - 450)) : 0;
    ctx.strokeStyle = "rgba(244,241,234,0.14)";
    ctx.lineWidth = 1;
    roundRect(o.x - 3, o.y - 3, size + 6, size + 6, 4);
    ctx.stroke();
    pushHit("deep", i, o.x - 3, o.y - 3, size + 6, size + 6);
    if (!res || appear <= 0) continue;
    const max = res.c2max[i];
    const cell = C2.pitch - C2.gap;
    for (let r = 0; r < 14; r++) for (let c = 0; c < 14; c++) {
      const fine = res.c2[i * 196 + r * 14 + c] / max;
      const coarse = res.p2[i * 49 + ((r >> 1) * 7) + (c >> 1)] / max;
      const v = (fine * (1 - poolP) + coarse * poolP) * appear;
      ctx.fillStyle = v < 0.03 ? `rgba(255,255,255,${0.035 * appear})` : heat(v);
      ctx.fillRect(o.x + c * C2.pitch, o.y + r * C2.pitch, Math.max(1, cell), Math.max(1, cell));
    }
  }
  ctx.restore();
}

function drawNeurons(t) {
  const res = state.result;
  ctx.save();
  ctx.globalAlpha = 1 - (res ? enlargeK(t) : 0);
  label("全连接 · 64", NEU.x - NEU.r, NEU.y - NEU.r - 16, COL.muted, 12);
  for (let i = 0; i < 64; i++) {
    const p = neuronCenter(i);
    let lit = 0, norm = 0;
    if (res) {
      const delay = res.rank[i] * 16;
      lit = span(t, TIME.neu0 + delay, TIME.neu0 + delay + 360);
      const u = lit;
      const pop = u <= 0 ? 0 : easeOutBack(clamp(u, 0, 1));
      norm = res.hidden[i] / res.hmax;
      const rad = NEU.r * (0.72 + 0.38 * norm) * (0.35 + 0.65 * Math.min(pop, 1.08));
      if (norm > 0.55 && lit > 0.2) {
        const s = 18 + 20 * norm;
        ctx.drawImage(glow, p.x - s, p.y - s, s * 2, s * 2);
      }
      ctx.fillStyle = lit > 0 ? heat(norm * Math.min(pop, 1)) : "rgba(255,255,255,0.08)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1.5, rad), 0, Math.PI * 2);
      ctx.fill();
      if (norm > 0.72 && lit > 0.6) {
        ctx.fillStyle = "rgba(244,241,234,0.85)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad * 0.38, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.strokeStyle = "rgba(244,241,234,0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, NEU.r * 0.72, 0, Math.PI * 2);
      ctx.stroke();
    }
    pushHit("neuron", i, p.x - 10, p.y - 10, 20, 20);
  }
  if (res) {
    const voteU = span(t, TIME.bar0 + 80, TIME.bar0 + 620);
    if (voteU > 0.02) {
      const voters = res.voters;
      let maxV = 1e-6;
      voters.forEach((i) => { if (res.votes[i] > maxV) maxV = res.votes[i]; });
      voters.forEach((i) => {
        const a = neuronCenter(i);
        const by = BARS.y + res.pred * BARS.row + BARS.row / 2;
        const bx = BARS.x + 28;
        const c = { x: (a.x + bx) / 2, y: Math.min(a.y, by) - 26 };
        ctx.strokeStyle = COL.gold;
        ctx.globalAlpha = (1 - enlargeK(t)) * voteU * (0.45 + 0.55 * res.votes[i] / maxV);
        ctx.lineWidth = 1.2 + 2.2 * (res.votes[i] / maxV);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.quadraticCurveTo(c.x, c.y, bx, by);
        ctx.stroke();
        if (voteU < 1) {
          const q = quad(a, c, { x: bx, y: by }, easeInOut(voteU));
          ctx.fillStyle = COL.paper;
          ctx.beginPath();
          ctx.arc(q.x, q.y, 2.4, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }
  }
  ctx.restore();
}

function drawBars(t) {
  const res = state.result;
  const chrome = 1 - (res ? enlargeK(t) : 0);
  ctx.save();
  ctx.globalAlpha = chrome;
  for (let d = 0; d < 10; d++) {
    const y = BARS.y + d * BARS.row;
    const cy = y + BARS.row / 2;
    const win = res && d === res.pred;
    let grow = 0;
    if (res) {
      const u = clamp((t - (TIME.bar0 + d * 36)) / 620, 0, 1);
      grow = u <= 0 ? 0 : Math.min(1.05, easeOutBack(u));
    }
    ctx.fillStyle = win && grow > 0.2 ? COL.gold : "rgba(244,241,234,0.14)";
    ctx.beginPath();
    ctx.arc(BARS.x + 10, cy, 9, 0, Math.PI * 2);
    ctx.fill();
    if (!(win && grow > 0.2)) {
      ctx.strokeStyle = "rgba(244,241,234,0.28)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.fillStyle = win && grow > 0.2 ? COL.ink : COL.paper;
    ctx.font = `600 12px ${SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(d), BARS.x + 10, cy + 0.5);
    const trackX = BARS.x + 26;
    const trackW = BARS.w - 92;
    ctx.fillStyle = "rgba(255,255,255,0.09)";
    roundRect(trackX, cy - 3.5, trackW, 7, 3.5);
    ctx.fill();
    if (res && grow > 0) {
      const shown = res.prob[d] * Math.min(grow, 1);
      const pw = Math.max(shown > 0.004 ? 3 : 0, trackW * shown);
      if (pw > 0) {
        ctx.fillStyle = win ? COL.gold : "rgba(244,241,234,0.78)";
        roundRect(trackX, cy - 3.5, pw, 7, 3.5);
        ctx.fill();
      }
      ctx.fillStyle = win ? COL.gold : "rgba(244,241,234,0.72)";
      ctx.font = `600 12px ${SANS}`;
      ctx.textAlign = "right";
      ctx.fillText(`${Math.min(100, shown * 100).toFixed(1)}%`, BARS.x + BARS.w, cy);
    }
    pushHit("bar", d, BARS.x, y, BARS.w, BARS.row);
  }
  ctx.restore();
}

function drawRing(t, now) {
  const res = state.result;
  const k = res ? enlargeK(t) : 0;
  const alpha = 1 - k;
  if (alpha <= 0.02) return;
  const hero = res ? span(t, TIME.hero0, TIME.hero1) : 0;
  const sure = res && res.prob[res.pred] >= 0.55;
  ctx.save();
  ctx.globalAlpha = alpha;
  label("判决", RING.cx - RING.r, RING.cy - RING.r - 18, COL.muted, 12);
  ctx.beginPath();
  ctx.arc(RING.cx, RING.cy, RING.r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.035)";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(RING.cx, RING.cy, RING.r, 0, Math.PI * 2);
  ctx.strokeStyle = hero > 0.4 && sure ? COL.gold : "rgba(244,241,234,0.34)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  pushHit("ring", 0, RING.cx - RING.r, RING.cy - RING.r, RING.r * 2, RING.r * 2);
  if (!res || hero <= 0) {
    ctx.fillStyle = "rgba(244,241,234,0.35)";
    ctx.font = `600 54px ${SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("?", RING.cx, RING.cy + 2);
  } else {
    const pop = easeOutBack(clamp(hero, 0, 1));
    const scale = 0.84 + 0.16 * Math.min(pop, 1.12);
    ctx.save();
    ctx.translate(RING.cx, RING.cy);
    ctx.scale(scale, scale);
    ctx.fillStyle = sure ? COL.gold : COL.paper;
    ctx.font = `600 104px ${SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (sure) {
      ctx.shadowColor = "rgba(227,177,90,0.45)";
      ctx.shadowBlur = 26;
    }
    ctx.globalAlpha = alpha * Math.min(1, hero * 1.4);
    ctx.fillText(String(res.pred), 0, 4);
    ctx.restore();
    if (sure && hero > 0.15 && hero < 1) {
      const u = clamp((hero - 0.15) / 0.85, 0, 1);
      ctx.beginPath();
      ctx.arc(RING.cx, RING.cy, RING.r + 8 + u * 46, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(227,177,90,${(1 - u) * 0.55})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.globalAlpha = alpha * hero;
    ctx.fillStyle = sure ? COL.gold : COL.muted;
    ctx.font = `600 16px ${SANS}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(`${(res.prob[res.pred] * Math.min(1, hero) * 100).toFixed(1)}%`, RING.cx, RING.cy + RING.r + 10);
  }
  ctx.restore();
}

function anchorAt(t) {
  const c = groupCenters();
  const pose = inputPose(t);
  const size = gridSpan(28, pose.pitch, pose.gap);
  const here = { x: pose.x + size / 2, y: pose.y + size / 2 };
  const keys = [
    { t: 0, p: here },
    { t: TIME.path0, p: c.input },
    { t: 2100, p: c.maps },
    { t: 3100, p: c.deep },
    { t: 4300, p: c.neurons },
    { t: 5400, p: c.ring },
  ];
  if (t <= keys[0].t) return keys[0].p;
  for (let i = 0; i < keys.length - 1; i++) {
    if (t <= keys[i + 1].t) {
      const u = easeInOut((t - keys[i].t) / (keys[i + 1].t - keys[i].t));
      return { x: lerp(keys[i].p.x, keys[i + 1].p.x, u), y: lerp(keys[i].p.y, keys[i + 1].p.y, u) };
    }
  }
  return c.ring;
}
function drawPlayhead(t, now) {
  const c = groupCenters();
  let p;
  let alpha = 0.9;
  if (t < 0) {
    const route = [c.input, c.maps, c.deep, c.ring];
    const u = (now % 9000) / 9000;
    const x = u * route.length;
    const i = Math.min(route.length - 1, Math.floor(x));
    const e = easeInOut(x - i);
    const a = route[i];
    const b = route[(i + 1) % route.length];
    p = { x: lerp(a.x, b.x, e), y: lerp(a.y, b.y, e) };
    const span = Math.hypot(b.x - a.x, b.y - a.y);
    if (span > 360) alpha = 0.25 + 0.65 * Math.sin(Math.PI * e);
  } else {
    p = anchorAt(t);
    if (enlargeK(t) > 0.85) alpha = 0.35;
  }
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(glow, p.x - 18, p.y - 18, 36, 36);
  ctx.fillStyle = COL.paper;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawParticles(t) {
  const res = state.result;
  if (!res || !state.effects) return;
  const poseNow = inputPose(t);
  for (const sp of state.effects.sparks) {
    const u = clamp((t - sp.t0) / sp.life, 0, 1);
    if (u <= 0 || u >= 1) continue;
    const e = easeInOut(u);
    const a = cellMid(inputPose(sp.t0), sp.c, sp.r);
    const o = mapOrigin(sp.map);
    const ms = mapSpan();
    const b = { x: o.x + ms / 2, y: o.y + ms / 2 };
    const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) + sp.arch };
    const p = quad(a, c, b, e);
    ctx.globalAlpha = Math.sin(Math.PI * u) * (1 - enlargeK(t));
    ctx.fillStyle = COL.gold;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.1, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const sp of state.effects.flow) {
    const u = clamp((t - sp.t0) / sp.life, 0, 1);
    if (u <= 0 || u >= 1) continue;
    const e = easeInOut(u);
    const oc = (sp.from / 49) | 0;
    const rem = sp.from % 49;
    const y7 = (rem / 7) | 0, x7 = rem % 7;
    const o = c2Origin(oc);
    const spanW = 2 * C2.pitch - C2.gap;
    const a = { x: o.x + x7 * 2 * C2.pitch + spanW / 2, y: o.y + y7 * 2 * C2.pitch + spanW / 2 };
    const b = neuronCenter(sp.to);
    const c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 + sp.arch };
    const p = quad(a, c, b, e);
    ctx.globalAlpha = Math.sin(Math.PI * u);
    ctx.fillStyle = COL.paper;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawViz(now) {
  hits = [];
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.fillStyle = COL.plate;
  ctx.fillRect(0, 0, VW, VH);
  const t = state.t;
  const spec = shownKernel(now, t);
  const k = t < 0 ? 0 : enlargeK(t);
  drawKernelCard(spec, (t < 0 ? 1 : 1) * (1 - k));
  drawMaps(t);
  drawDeep(t);
  drawNeurons(t);
  drawBars(t);
  drawRing(t, now);
  drawInput(t);
  drawParticles(t);
  drawPlayhead(t, now);
}

function captionFor(t) {
  if (state.note) return state.note;
  if (!state.result || t < 0) return "在纸上写一个 0 到 9。写完后识别，看这一笔怎样被读懂。";
  if (state.changed) return "纸上的笔迹已经变了。再识别一次，网络会重新看。";
  if (t >= 5400) return resultLine(state.result);
  if (t >= 4580) return "神经元向 0 到 9 投票。条越长，越确信是这个数字。";
  if (t >= 3520) return "64 个神经元接过这些形状。越亮，越是这一笔真正用到的。";
  if (t >= 2480) return "第二层卷积把局部笔画拼成更大的形状。";
  if (t >= 2240) return "每四个相邻格子只留下最亮的一个。图缩小了，形状还在。";
  if (t >= 1380) return "8 个 5×5 的卷积核同时滑过画面，各自对一种局部笔画有反应。";
  if (t >= 860) return "格子回到输入层，信号要往右走了。";
  return "这一笔被收成 28×28 个格子。墨越深，格子越亮。";
}
function setCaption(text) {
  if (text === lastCaption) return;
  lastCaption = text;
  caption.textContent = text;
}
function syncChrome() {
  const t = state.t;
  setCaption(captionFor(t));
  const has = !!state.result && t >= 0;
  let active = -1;
  stepButtons.forEach((b, i) => { if (has && t >= Number(b.dataset.t)) active = i; });
  stepButtons.forEach((b, i) => {
    b.classList.toggle("ready", !!state.result);
    b.classList.toggle("on", i === active);
    b.classList.toggle("done", has && i < active);
  });
  if (state.playing) scrub.value = String(Math.min(TIME.duration, Math.round(state.t)));
  if (state.result && state.t >= 5400) announce();
}

function frame(now) {
  raf = requestAnimationFrame(frame);
  if (state.sample) {
    const done = applySample(state.sample);
    if (done) {
      const d = state.sample.d;
      state.sample = null;
      recognize();
      const btn = sampleRow.children[d];
      if (btn) btn.classList.add("on");
    }
  }
  if (state.playing) {
    state.t = Math.max(0, now - state.t0);
    if (state.t >= TIME.duration) {
      state.t = TIME.duration;
      state.playing = false;
    }
  }
  const moving = state.playing || state.sample || state.drawing || state.t < 0;
  paintPad();
  drawViz(now);
  syncChrome();
  if (!moving && !state.playing) {
    cancelAnimationFrame(raf);
    raf = 0;
  }
}

function fit() {
  const box = chamber.getBoundingClientRect();
  const aspect = VW / VH;
  let w = box.width, h = w / aspect;
  if (h > box.height) { h = box.height; w = h * aspect; }
  w = Math.max(2, w); h = Math.max(2, h);
  viz.style.width = `${w}px`;
  viz.style.height = `${h}px`;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  viz.width = Math.round(w * dpr);
  viz.height = Math.round(h * dpr);
  viewScale = viz.width / VW;
  wake();
}
new ResizeObserver(fit).observe(chamber);

viz.addEventListener("pointermove", (e) => {
  if (state.playing) { tip.hidden = true; return; }
  const r = viz.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * VW;
  const y = (e.clientY - r.top) / r.height * VH;
  let found = null;
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (x >= h.x && y >= h.y && x <= h.x + h.w && y <= h.y + h.h) { found = h; break; }
  }
  const key = found ? `${found.type}:${found.id}` : "";
  if (key !== state.hoverKey) {
    state.hoverKey = key;
    if (found && found.type === "map" && state.result) state.pin = { layer: 1, index: found.id };
    else if (found && found.type === "deep" && state.result) state.pin = { layer: 2, index: found.id };
    else state.pin = null;
    if (!state.playing && state.t >= 0) { paintPad(); drawViz(performance.now()); }
  }
  if (!found) { tip.hidden = true; return; }
  tip.hidden = false;
  tip.textContent = tipText(found);
  const left = Math.min(e.clientX + 14, window.innerWidth - 250);
  const top = Math.min(e.clientY + 16, window.innerHeight - 72);
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
});
viz.addEventListener("pointerleave", () => {
  tip.hidden = true;
  state.hoverKey = null;
  if (state.pin) {
    state.pin = null;
    if (!state.playing) drawViz(performance.now());
  }
});
function tipText(h) {
  const res = state.result;
  if (!res) {
    const idle = {
      input: "输入层。笔迹会收成 28×28，和 MNIST 一样大。",
      map: "这里会点亮一张卷积特征图。",
      deep: "第二层卷积的特征图会出现在这里。",
      neuron: "64 个神经元，用来把形状合成投票。",
      bar: `数字 ${h.id} 的得票会显示在这里。`,
      ring: "最后的判决会出现在这个圆里。",
      kernel: "5×5 卷积核。金色是它喜欢的，珊瑚色是它抑制的。",
    };
    return idle[h.type] || "";
  }
  if (h.type === "input") return "网络实际看到的 28×28。亮度是墨的深浅。";
  if (h.type === "map") return `特征图 ${h.id + 1} · 平均响应 ${res.c1e[h.id].toFixed(2)}。卷积核在卡片里。`;
  if (h.type === "deep") return `深层特征 ${h.id + 1} · 平均响应 ${res.c2e[h.id].toFixed(2)}。`;
  if (h.type === "neuron") {
    const vote = res.votes[h.id];
    const sign = vote >= 0 ? "+" : "−";
    return `神经元 ${h.id + 1} · 激活 ${res.hidden[h.id].toFixed(2)} · 对 ${res.pred} 的投票 ${sign}${Math.abs(vote).toFixed(2)}`;
  }
  if (h.type === "bar") return `数字 ${h.id} · 概率 ${(res.prob[h.id] * 100).toFixed(1)}%`;
  if (h.type === "ring") return resultLine(res);
  if (h.type === "kernel") return "金色权重会增强这种小笔画，珊瑚色会压掉它。";
  return "";
}

clearAll();
fit();
</script>
</body>
</html>
