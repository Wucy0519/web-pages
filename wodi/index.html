<script>
const ITEMS = JSON.parse(document.getElementById("data").textContent);
const cats = ["全部", ...new Set(ITEMS.map(x => x.cat))];
const diffs = ["全部", "简单", "中等", "困难"];
let cat = "全部", diff = "全部", current = null, lastId = "";
const reveal = document.getElementById("reveal");
const hint = document.getElementById("hint");
function pool() {
  return ITEMS.filter(x => (cat === "全部" || x.cat === cat) && (diff === "全部" || x.diff === diff));
}
function paintChips(id, values, current) {
  document.getElementById(id).innerHTML = values.map(v => `<button class="chip${v===current?" on":""}" type="button" data-kind="${id}" data-value="${v}">${v}</button>`).join("");
}
function renderFilters() {
  paintChips("cats", cats, cat);
  paintChips("diffs", diffs, diff);
  document.getElementById("meta").textContent = "当前可抽 " + pool().length + " 组" + (current ? " · " + current.cat + " · " + current.diff : "");
}
function hideWord() {
  reveal.classList.remove("open");
  reveal.hidden = true;
  reveal.textContent = "";
}
function show(kind) {
  if (!current) draw();
  if (!current) return;
  reveal.textContent = kind === "spy" ? current.spy : current.civ;
  reveal.hidden = false;
  reveal.classList.add("open");
}
function draw() {
  hideWord();
  const list = pool();
  if (!list.length) { current = null; hint.textContent = "这个范围里没有词，换一个分类或难度。"; renderFilters(); return; }
  let next = list[Math.floor(Math.random() * list.length)];
  if (list.length > 1) {
    let guard = 0;
    while (next.id === lastId && guard < 8) { next = list[Math.floor(Math.random() * list.length)]; guard++; }
  }
  current = next; lastId = next.id;
  hint.textContent = "这一组已经抽好。把手机递出去之前，只点玩家该看的那个按钮。";
  renderFilters();
}
document.body.addEventListener("click", e => {
  const chip = e.target.closest("[data-kind]");
  if (!chip) return;
  if (chip.dataset.kind === "cats") cat = chip.dataset.value;
  if (chip.dataset.kind === "diffs") diff = chip.dataset.value;
  current = null; lastId = ""; draw();
});
document.getElementById("next").onclick = draw;
document.getElementById("show-civ").onclick = () => show("civ");
document.getElementById("show-spy").onclick = () => show("spy");
reveal.onclick = hideWord;
renderFilters();
draw();
</script>
