<style>
  :root { --ink:#241c14; --muted:#6d5c4d; --paper:#fffaf3; --bg:#e7dccb; --line:#e3d3be; --hot:#9d2c1a; --cool:#2f5852; --gold:#a68445; }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:radial-gradient(900px 420px at 0% -10%, #f8f1e4 0%, transparent 55%), radial-gradient(700px 380px at 100% 0%, #f3e4cf 0%, transparent 50%), var(--bg); font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif; line-height:1.6; }
  button, input { font:inherit; color:inherit; } button { cursor:pointer; }
  .wrap { max-width:1080px; margin:0 auto; padding:28px 20px 72px; }
  header.top { background:rgba(255,250,243,.92); border:1px solid var(--line); border-radius:24px; padding:22px 22px 16px; box-shadow:0 16px 40px rgba(70,45,20,.06); position:sticky; top:12px; z-index:5; }
  .brand { display:flex; gap:16px; align-items:center; }
  .seal { width:74px; height:74px; border:3px solid var(--hot); color:var(--hot); border-radius:50%; display:grid; place-items:center; font-family:"Songti SC","Noto Serif SC",serif; font-size:30px; transform:rotate(-8deg); background:#fff7f2; flex:0 0 auto; }
  h1 { margin:0; font-family:"Songti SC","Noto Serif SC",serif; font-size:34px; letter-spacing:.08em; }
  .sub { margin:6px 0 0; color:var(--muted); font-size:14.5px; max-width:700px; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 12px; }
  .stat { background:#f6efe4; border-radius:999px; padding:4px 10px; font-size:13px; color:var(--muted); }
  .stat b { color:var(--ink); } .stat.hot b { color:var(--hot); } .stat.cool b { color:var(--cool); }
  .bar { height:6px; background:#efe4d4; border-radius:99px; overflow:hidden; margin-bottom:12px; }
  .bar > span { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--hot),var(--gold)); }
  .toolbar, .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .toolbar { margin-bottom:10px; } .filters { margin-top:8px; }
  input[type="search"] { flex:1 1 180px; min-width:160px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:9px 14px; outline:none; }
  button.chip, button.ghost, button.primary, .actions button, .nav button { border-radius:999px; border:1px solid var(--line); background:#fff; padding:8px 14px; }
  button.chip.on { background:var(--ink); color:#f6efe4; border-color:var(--ink); }
  button.primary { background:var(--hot); color:#fffaf3; border-color:var(--hot); }
  button.ghost { background:transparent; }
  main { margin-top:18px; }
  .one, .card { background:var(--paper); border:1px solid var(--line); }
  .one { border-radius:28px; padding:28px 26px 22px; min-height:280px; }
  .card { border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .card.play { box-shadow:inset 4px 0 0 var(--hot); } .card.skip { box-shadow:inset 4px 0 0 var(--cool); }
  .meta { color:var(--gold); letter-spacing:.12em; font-size:13px; margin:0 0 8px; }
  .title { font-family:"Songti SC","Noto Serif SC",serif; font-size:22px; margin:0 0 10px; }
  .label { font-size:13px; letter-spacing:.14em; color:var(--gold); margin:12px 0 4px; }
  .face, .bottom, .hint { font-family:"Songti SC","Noto Serif SC",serif; font-size:22px; line-height:1.7; margin:0; }
  .card .face, .card .bottom, .card .hint, .card .title { font-size:16.5px; }
  .bottom { background:#f6efe4; border-radius:14px; padding:12px 14px; }
  .actions, .nav { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .actions button.on[data-act="play"] { background:var(--hot); color:#fff; border-color:var(--hot); }
  .actions button.on[data-act="skip"] { background:var(--cool); color:#fff; border-color:var(--cool); }
  .hintline { color:var(--muted); font-size:13px; margin:12px 0 0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .empty { padding:48px 16px; text-align:center; color:var(--muted); background:var(--paper); border-radius:20px; }
  mark { background:#f3d48a; border-radius:4px; }
  footer { margin-top:28px; color:var(--muted); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(12px); background:var(--ink); color:#f6efe4; padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none; transition:.2s; z-index:9; }
  #toast.show { opacity:1; transform:translateX(-50%); }
  @media (max-width:720px) { header.top { position:static; } h1 { font-size:28px; } .face { font-size:20px; } .seal { width:58px; height:58px; font-size:24px; } }
</style>

<script id="data" type="application/json">[{"title": "沙漠里死去的男人，手里攥着半根火柴", "cat": "悬疑", "face": "一名男子死在沙漠里，身边没有任何食物和水。他的手里紧紧攥着半根火柴，脸上却带着一丝解脱的表情。", "hint": "", "bottom": "他和同伴乘热气球飞行时出了故障，气球不断下坠。两人扔掉了所有能扔的东西，还是不够轻。最后他们决定抽签——抽到短签的人跳下去，换另一个人生存的机会。那半根火柴，就是他抽到的短签。他跳下去之前，把半根火柴攥在手里，作为自己兑现承诺的证明。", "id": "t001"}, {"title": "姐姐喝了两杯没事，妹妹喝了一杯却死了", "cat": "悬疑", "face": "姐妹俩去酒吧，姐姐点了两杯加冰威士忌，妹妹点了一杯。当晚，妹妹死了，姐姐却安然无恙。酒里没有毒。", "hint": "", "bottom": "毒下在冰块里。姐姐喝得很快，冰块还没来得及融化，毒还没溶进酒里。妹妹喝得很慢，冰块化了，毒溶进了酒里。姐姐喝得多却没事，妹妹喝得少却中了毒，关键不在酒，而在冰块融化的时间。", "id": "t002"}, {"title": "晴天只能到7楼，雨天却能直达10楼", "cat": "轻松", "face": "一名男子住在10楼。晴天他乘电梯到7楼，再走楼梯回家；雨天他却直达10楼。电梯没有故障。", "hint": "", "bottom": "他个子太矮，够不着10楼的按钮，只能按到7楼。雨天他带了伞，可以用伞柄去按10楼的按钮。晴天没带伞，他就只能按到7楼，再爬三层楼梯回家。", "id": "t003"}, {"title": "他要点一杯水，酒保却掏出了猎枪", "cat": "轻松", "face": "一名男子走进酒吧，对酒保说'请给我一杯水'。酒保二话不说，掏出一把猎枪对准他。男子说了声'谢谢'，转身走了。", "hint": "", "bottom": "男子打嗝不止，想喝水压一压。酒保一眼看出他是在打嗝，掏出枪来吓他一跳。这一吓，嗝果然止住了。男子道谢后离开，连水都不用喝了。", "id": "t004"}, {"title": "葬礼上对他一见钟情，一周后她杀了自己的姐姐", "cat": "悬疑", "face": "一位年轻女子在葬礼上对一名男子一见钟情，可惜没来得及要联系方式。一周后，她杀了自己的亲姐姐。", "hint": "", "bottom": "她并不是出于嫉妒或仇恨杀人。她想再次见到那个男子，而她唯一能想到的办法，就是再办一场葬礼——只有葬礼，才能让那个男子再次出现。她杀害姐姐，就是为了制造下一场葬礼。", "id": "t005"}, {"title": "草地上的胡萝卜、煤炭和围巾，没有脚印", "cat": "轻松", "face": "草地上有一堆煤炭、一根胡萝卜和一条围巾，周围却没有任何脚印。没有人来过这里。", "hint": "", "bottom": "昨天这里下过雪，有人堆了一个雪人：煤炭是眼睛，胡萝卜是鼻子，围巾是装饰。今天雪化了，雪人'消失'了，只剩下这些东西。没有脚印，是因为堆雪人的人早就走了，雪化后脚印也被冲掉了。", "id": "t006"}, {"title": "他喝了一碗海龟汤，回家后自杀了", "cat": "悬疑", "face": "一名男子走进餐厅，点了一碗海龟汤。他喝了一口，脸色大变，结账后回到家，便自杀了。汤没有问题。", "hint": "", "bottom": "他曾经在海难中漂流多日，获救时喝过一碗'海龟汤'。这次他喝到了真正的海龟汤，味道完全不同。他这才明白，当年在海上喝的那碗'汤'，根本不是海龟做的——那是遇难同伴的肉。这个真相让他无法承受，选择了自杀。", "id": "t007"}, {"title": "火车刚进隧道，他突然跳车自杀", "cat": "悬疑", "face": "一名男子乘坐火车，列车驶入一条漆黑的隧道。几秒钟后，他突然拉开车门跳了下去，当场身亡。", "hint": "", "bottom": "他不久前刚做完复明手术，重新获得了光明。火车进入隧道后，车厢里一片漆黑，他以为手术失败了，自己再次失明。在巨大的绝望中，他选择了跳车。事实上，只要等几秒钟，火车出隧道后就会重见光明。", "id": "t008"}, {"title": "密室里的录音带，为什么停在开头？", "cat": "悬疑", "face": "一名男子死在反锁的密室里，桌上放着一台录音机。警察播放录音带，听到死者亲口说'我要自杀'。可警察听完却说：'这是他杀，不是自杀。'", "hint": "", "bottom": "录音带的磁带停在开头。如果死者真是录完遗言后自杀，磁带应该停在末尾。磁带停在开头，说明有人在他死后把带子倒了回去，伪造了这段'自杀遗言'。真正的凶手，正是那个倒带的人。", "id": "t009"}, {"title": "山顶上看到灯灭了，他立刻开枪自杀", "cat": "悬疑", "face": "一名男子站在山顶，看到远处的一盏灯熄灭了。他脸色煞白，掏出手枪，对准自己的太阳穴扣下了扳机。", "hint": "", "bottom": "他是一名灯塔看守。那天夜里他值班时睡着了，灯灭了也没有及时点亮。一艘满载乘客的船因为看不到灯塔而触礁沉没。当他意识到自己的一次疏忽害死了整船的人，内疚让他选择了自杀。", "id": "t010"}, {"title": "空房间里吊死的人，脚下只有一滩水", "cat": "悬疑", "face": "一名男子被发现吊死在空房间里，脚下有一滩水。房间里没有任何桌椅，也没有任何可以垫脚的东西。门窗都从里面反锁着。", "hint": "", "bottom": "他站在一个大冰块上上吊。冰块融化后，他就悬空了。脚下的那滩水，就是冰块化成的。房间里不需要桌椅，冰块就是他的'垫脚石'，只不过这块垫脚石会自己消失。", "id": "t011"}, {"title": "搬进新公寓当晚，她砸碎了所有的镜子", "cat": "悬疑", "face": "一位女子搬进新公寓的当晚，把屋里所有的镜子都砸碎了，第二天立刻退租。房东检查后发现，镜子本身没有任何问题。", "hint": "", "bottom": "她用指尖测试发现，那些镜子全都是双面镜。从另一面可以清楚地看到屋里的一切。有人在镜子的另一面偷窥她。意识到自己的一举一动都在别人的监视之下，她连夜砸碎镜子逃离了这间公寓。", "id": "t012"}, {"title": "出门倒个垃圾回来，门虚掩着，他立刻报警", "cat": "悬疑", "face": "独居男子出门倒垃圾，没带钥匙。几分钟后回来，他发现门虚掩着。屋里一切正常，什么都没丢，他却立刻报了警。", "hint": "", "bottom": "他出门时确实用力带上了门，门是锁好的。回来时门却虚掩着，说明在他倒垃圾的短短几分钟里，有人进过他家。屋里东西没丢，不代表没人来过——那个人可能还在屋里，或者已经离开。他报警，是因为他知道家里进过陌生人。", "id": "t013"}, {"title": "聋人点外卖，备注'敲三下就走'，她却投诉了", "cat": "悬疑", "face": "一位聋人女子点外卖，备注写着'放门口，敲三下就走'。外卖员照做后，她却投诉了这家店。外卖员什么都没做错。", "hint": "", "bottom": "她是聋人，根本听不见敲门声。这条备注不可能是她写的。有人登录了她的外卖账号，冒充她下单，还特意写了'敲三下就走'——那个人在试探她家门口的情况，想确认她是不是一个人住、听不听得见声音。她投诉，是为了让平台去查这个异常订单。", "id": "t014"}, {"title": "闹钟显示6点半，他又睡了过去，结果迟到了", "cat": "生活", "face": "男子把闹钟定在早上7点。某天他6点半自然醒，看了一眼闹钟又睡了，结果上班迟到了。", "hint": "", "bottom": "闹钟昨晚就没电了，停在6点半。他6点半被生物钟叫醒，看到闹钟显示'6点半'，以为时间还早，就又睡了过去。其实那只是闹钟死去的时间，真正的时间早就过了7点。", "id": "t015"}, {"title": "每晚床头的半杯水，早上总是不翼而飞", "cat": "悬疑", "face": "独居男子每晚睡前在床头放半杯水。某天早上醒来，杯子空了，门窗却都完好无损，也没有被撬过的痕迹。他立刻搬了家。", "hint": "", "bottom": "他独居，门从里面反锁，窗户也都关得好好的。半杯水不翼而飞，说明这个'只有他一个人'的房子里，还有第二个人。那个人趁他睡着时喝了那半杯水。意识到家里藏着一个陌生人，他当即决定搬家。", "id": "t016"}, {"title": "他在山谷里大喊，听到了两声回音", "cat": "悬疑", "face": "一名男子在雪山山谷里大喊，听到了两声回音。他脸色大变，转身就跑，可惜已经来不及了。", "hint": "", "bottom": "这个山谷的地形只能产生一声回音。第二声'回音'根本不是回音，而是雪崩的声音。他那一声大喊震松了山顶的积雪，引发了雪崩。等他反应过来时，雪崩已经到了眼前。", "id": "t017"}, {"title": "她按错了楼层，电梯却救了她一命", "cat": "悬疑", "face": "女子走进电梯，想按1楼，手一抖按成了3楼。电梯却直接下到了1楼，她长舒了一口气。", "hint": "", "bottom": "3楼最近刚发生过命案，整层楼都被封锁了，她害怕去3楼。电梯出了故障，直接下到了1楼。按错楼层反而救了她——她不用面对那个让她害怕的楼层了。", "id": "t018"}, {"title": "停电夜里，他点起蜡烛又迅速吹灭", "cat": "生活", "face": "停电的夜里，男子点起一根蜡烛，几秒后又迅速吹灭，然后摸黑逃出了家门。", "hint": "", "bottom": "他闻到了煤气味——家里煤气泄漏了。点燃的蜡烛随时可能引发爆炸，他吹灭蜡烛，摸黑逃了出去。蜡烛点亮的那几秒，他闻到的不是烛光的味道，而是煤气的味道。", "id": "t019"}, {"title": "绿灯亮了她不动，红灯亮了她才过马路", "cat": "悬疑", "face": "女子过马路，绿灯亮了她一动不动。等红灯亮起，她才快步通过马路。她没有闯红灯，信号灯也没有故障。", "hint": "", "bottom": "她发现这个路口的信号灯被人恶作剧调换了方向——'绿灯'亮起时，横向的车流根本没有停下。她等的不是灯的颜色，而是车流真正停下的时机。红灯亮起时，横向车流停了，她才能安全通过。", "id": "t020"}, {"title": "中了五百万，他哭着去自首", "cat": "悬疑", "face": "男子刮开一张彩票，中了头奖。他把号码核对了三遍，然后哭着拨打了110。", "hint": "", "bottom": "他是网上通缉的逃犯，躲了三年。兑奖必须本人持身份证实名登记，还要联网核验身份——领奖那天就是被抓那天。他哭着报警，是决定先自首：自首可以减刑，奖金也能留给家人。", "id": "t021"}, {"title": "她每天准时下班，从没离开公司", "cat": "生活", "face": "女白领每天18点准时打卡下班，同事却说，她一次也没离开过公司。", "hint": "", "bottom": "公司大楼顶层就是员工宿舍。她下班后直接乘电梯上楼回宿舍——人是下班了，但一步也没走出过这栋楼。", "id": "t022"}, {"title": "他每晚给妻子发晚安，却从没结过婚", "cat": "生活", "face": "男子每晚11点准时给妻子发“晚安”，朋友却说他单身一辈子，从没结过婚。", "hint": "", "bottom": "妻子三年前就去世了，那个手机号早已注销。他每晚仍给那个号码发晚安，短信根本发不出去——他只是在和回忆说话。", "id": "t023"}, {"title": "他的手机每天凌晨三点准时亮屏", "cat": "生活", "face": "男子的手机放在床头，每天凌晨三点准时亮一下屏，他却从没设过闹钟。", "hint": "", "bottom": "他家路由器每天凌晨三点自动重启。手机断网重连，屏幕亮起显示“已连接 Wi-Fi”——吵醒他的不是手机，是路由器。", "id": "t024"}, {"title": "她把戒指扔进海里，第二天又戴上了", "cat": "生活", "face": "女子和男友吵架，一气之下把戒指扔进了海里。第二天早上，戒指又戴在了她手上。", "hint": "", "bottom": "男友整夜没睡，在海边找了一夜。退潮时，戒指被海浪冲回了沙滩——他天没亮就找到了，趁她睡着又给她戴上了。", "id": "t025"}, {"title": "空电梯里，他对着空气说了你好", "cat": "轻松", "face": "男子走进空无一人的电梯，按下楼层，轻声说了句“你好”。", "hint": "", "bottom": "他戴着蓝牙耳机，正在和电话那头的客户打招呼——“你好”是对着电话说的，不是跟电梯说的。", "id": "t026"}, {"title": "他十年从不迟到，今天却迟到三小时", "cat": "生活", "face": "男子工作十年从不迟到，今天却迟到了整整三个小时，老板却没扣他工资。", "hint": "", "bottom": "公司周末搬了新址，他按老地址去了旧楼，扑空后才赶过来。老板没扣钱，是因为全公司一半人都走错了地方。", "id": "t027"}, {"title": "全班都交了作业，只有他被表扬", "cat": "生活", "face": "老师布置作业，全班都按时交了，只有他一个人被表扬。", "hint": "", "bottom": "全班其他人的作业都是 AI 代写的，只有他是手写的——有错别字，有涂改，但是真的。老师一眼就看出来了。", "id": "t028"}, {"title": "她每天给花浇水，花却越长越小", "cat": "生活", "face": "女子每天给阳台的花浇水，花却一天比一天小。", "hint": "", "bottom": "她每天用刚烧开的水浇花——她以为“热水能杀菌”，其实是把花活活烫死了，越浇缩得越小。", "id": "t029"}, {"title": "他买了最贵的保险，却一分钱都赔不到", "cat": "生活", "face": "男子买了最贵的一档重疾险，生病住院后，保险公司一分钱都不赔。", "hint": "", "bottom": "投保时他隐瞒了三年的高血压病史。理赔时保险公司调出他的体检记录，以“未如实告知”为由拒赔，合同直接作废。", "id": "t030"}, {"title": "她赢了比赛，奖金却发给了第二名", "cat": "生活", "face": "女子在比赛中得了第一名，奖金却发给了第二名。", "hint": "", "bottom": "她是比赛赞助商的员工，按规则内部人员不能领奖。第一名的奖金顺延，第二名白捡了一个冠军奖。", "id": "t031"}, {"title": "他每天准时到健身房，却一次也没练过", "cat": "生活", "face": "男子办了年卡，每天准时到健身房打卡，却一次器械也没碰过。", "hint": "", "bottom": "他家热水器坏了三个月，健身房年卡比修热水器便宜。他每天去健身房，只为洗个热水澡。", "id": "t032"}, {"title": "雨下得越大，他越往外跑", "cat": "轻松", "face": "下雨天，所有人都往屋里躲，只有一个男子越下越大越往外跑。", "hint": "", "bottom": "他是卖雨伞的小贩。雨越大，伞越好卖——他跑出去不是躲雨，是抢生意。", "id": "t033"}, {"title": "她把密码告诉了所有人，账户却更安全了", "cat": "生活", "face": "女子把自己的银行卡密码告诉了所有同事，账户反而比以前更安全了。", "hint": "", "bottom": "她告诉大家密码的当天就改了新密码。同事们记住的，全是已经作废的旧密码——等于什么都没告诉。", "id": "t034"}, {"title": "他每天第一个到公司，最后一个离开，却被开除了", "cat": "生活", "face": "男子每天第一个到公司、最后一个离开，考勤全满，试用期结束时却被开除了。", "hint": "", "bottom": "他根本不是这家公司的员工。他是楼下公司的，前公司倒闭了，他每天来这栋楼蹭工位、蹭 Wi-Fi、蹭免费咖啡——保安一直以为他是员工。", "id": "t035"}, {"title": "她从没出过国，却会说八国语言", "cat": "轻松", "face": "女子从没出过国，却能流利地说八种语言。", "hint": "", "bottom": "她是一名游戏本地化翻译，每天的工作就是和八个国家的玩家打交道——八种语言全是在网上跟网友学会的。", "id": "t036"}, {"title": "她每天给陌生人发红包，对方却从不领", "cat": "生活", "face": "女子每天给一个陌生人发微信红包，对方从来不领，红包每天都原路退回。", "hint": "", "bottom": "那个“陌生人”是她去世父亲的微信号，账号早已注销。红包发过去没人领，24 小时后自动退回——她只是想每天跟爸爸说句话。", "id": "t037"}, {"title": "他住在顶楼，却从没见过阳光", "cat": "生活", "face": "男子住在顶楼大平层，落地窗朝南，却说自己从没见过阳光。", "hint": "", "bottom": "他上夜班。白天他拉着遮光窗帘睡觉，晚上出门时天已经黑了——住在顶楼也没用，他的生活里根本没有白天。", "id": "t038"}, {"title": "他的闹钟每天响八次，他却从没起床", "cat": "生活", "face": "男子手机里设了八个闹钟，每天都响，他却一次也没被吵醒过。", "hint": "", "bottom": "他是早餐摊主，每天凌晨四点就起床去菜市场进货。八个闹钟是留给妻子的——闹钟响的时候，他早就出门了。", "id": "t039"}, {"title": "她考了全校第一，却哭着退了学", "cat": "生活", "face": "女子考了全校第一名，站在领奖台上，却哭着宣布退学。", "hint": "", "bottom": "奶奶病重需要人照顾，第一名的出国留学名额她用不上。她退学去打工，要留在国内守着奶奶。", "id": "t040"}, {"title": "他每天给公司省一万块，公司却亏了一百万", "cat": "生活", "face": "男子每天想方设法给公司省钱，一年省了三百多万，公司年底却亏了一百万。", "hint": "", "bottom": "他为了省电费，每天晚上把公司服务器全部关机。结果第二天网站打不开，丢了一个百万大单——省下的电费还不够赔零头。", "id": "t041"}, {"title": "她把家里的灯全换了，电费却涨了一倍", "cat": "生活", "face": "女子把家里所有灯泡换成节能灯，电费不降反升，涨了一倍。", "hint": "", "bottom": "换了节能灯后她觉得“开灯不花钱”，改掉了随手关灯的习惯，开始整夜开着所有灯——电费反而翻倍了。", "id": "t042"}, {"title": "她每天跑步五公里，却越来越胖", "cat": "生活", "face": "女子每天跑步五公里，饮食也没变，三个月胖了十斤。", "hint": "", "bottom": "她跑完步每天奖励自己一杯奶茶。奶茶的热量比跑步消耗的还多——跑得越多，喝得越多。", "id": "t043"}, {"title": "她把钥匙藏在门口的地垫下，小偷却找不到", "cat": "悬疑", "face": "女子把备用钥匙藏在门口地垫下，家里进贼那天，小偷翻遍了全屋也没找到钥匙。", "hint": "", "bottom": "她把钥匙藏在了楼下邻居家的地垫下——她记错了门。小偷翻的是她家，当然找不到。", "id": "t044"}, {"title": "他每天准时打卡，却从没上过班", "cat": "生活", "face": "男子每天准时在公司打卡，却一次也没上过班。", "hint": "", "bottom": "他是公司的夜班保安。白天来打卡是下班打卡——他上的班都在夜里，白天来公司的人一次也没见过他上班。", "id": "t045"}, {"title": "她从没谈过恋爱，却写了十本言情小说", "cat": "生活", "face": "女子从没谈过恋爱，却出版了十本畅销言情小说。", "hint": "", "bottom": "十本书的素材全是闺蜜和读者的真实恋爱投稿。她自己是母胎单身，专门替别人写爱情。", "id": "t046"}, {"title": "她每天给狗喂三顿饭，狗却越来越瘦", "cat": "生活", "face": "女子每天给狗喂三顿饭，狗却越来越瘦。", "hint": "", "bottom": "她每天喂的“三顿饭”全被家里的猫抢走了。狗一口都没吃到——瘦的不是狗，是猫的胃口太好了。", "id": "t047"}, {"title": "他赢了马拉松，却没跑完全程", "cat": "轻松", "face": "男子在马拉松比赛中得了第一名，却没有跑完全程。", "hint": "", "bottom": "当天突降暴雨，组委会临时把路线缩短了一半。所有选手都没跑完全程——他依然是第一名。", "id": "t048"}, {"title": "她把所有的衣服都洗了，却一件也没干净", "cat": "生活", "face": "女子把所有衣服放进洗衣机洗了一遍，拿出来却一件也没洗干净。", "hint": "", "bottom": "她把衣服放进洗衣机，却忘了按启动键。衣服只是在洗衣机里泡了一晚上——水都没换过。", "id": "t049"}, {"title": "她每天准时睡觉，却每天都做噩梦", "cat": "生活", "face": "女子每天十点准时睡觉，却每天晚上都做噩梦。", "hint": "", "bottom": "她每晚睡前都要看一集恐怖片当“助眠”。噩梦全是片里的剧情——她是自己吓自己。", "id": "t050"}, {"title": "他从不看新闻，却比谁都知道得多", "cat": "生活", "face": "男子从不看新闻，公司的八卦、行业的动态，他却比谁都知道得早。", "hint": "", "bottom": "他是公司楼下的保安，每天听进进出出的人聊天。全公司的消息都在他这儿汇总——他不是看新闻，他就是新闻的源头。", "id": "t051"}, {"title": "她把手机调成静音，却总被吵醒", "cat": "生活", "face": "女子把手机调成静音放在床头，却每天半夜都被吵醒。", "hint": "", "bottom": "她把手机放在床头柜的玻璃杯上。静音的振动让玻璃杯整夜嗡嗡响——吵醒她的不是铃声，是振动。", "id": "t052"}, {"title": "他每天喝八杯水，却总是口渴", "cat": "生活", "face": "男子每天喝八杯水，还是总觉得口渴。", "hint": "", "bottom": "他喝的八杯全是咖啡和奶茶。咖啡因利尿，越喝越渴——他喝的根本不是水。", "id": "t053"}, {"title": "她把所有的照片都删了，却一张也没少", "cat": "生活", "face": "女子把手机里的照片全删了，打开相册却发现一张也没少。", "hint": "", "bottom": "她删的是手机本地的照片，云端相册自动同步，又把它们全下载回来了——删了个寂寞。", "id": "t054"}, {"title": "他每天准时下班，却每天都加班", "cat": "生活", "face": "男子每天18点准时离开公司，却每天都加班到半夜。", "hint": "", "bottom": "他把工作带回家做，在家加班到半夜——准时下班和天天加班，都是真的。", "id": "t055"}, {"title": "她从没去过健身房，却有一身肌肉", "cat": "轻松", "face": "女子从没去过健身房，却练出了一身肌肉。", "hint": "", "bottom": "她是快递员，每天搬上百件包裹。健身房练的肌肉，她搬快递练出来了。", "id": "t056"}, {"title": "他每天给妻子打电话，妻子却从没接过", "cat": "生活", "face": "男子每天给妻子打电话，妻子一次也没接过，他却从不生气。", "hint": "", "bottom": "妻子在远洋科考船上，没有信号。他每天打电话是给她留语音，让她靠岸后一次听完——接不接不重要，重要的是她回来能听到。", "id": "t057"}, {"title": "她把试卷藏起来，成绩却提高了", "cat": "生活", "face": "女子把每次考试的试卷都藏起来不给父母看，成绩却一次比一次好。", "hint": "", "bottom": "她藏试卷不是怕挨骂，是为了留着反复做错题。错题本越做越厚，成绩自然越来越好。", "id": "t058"}, {"title": "他每天第一个到教室，却从没听过课", "cat": "生活", "face": "男子每天第一个到教室，却一节课也没听过。", "hint": "", "bottom": "他是班长，每天第一个到教室是来给全班占座的。占完座他就去图书馆自习——课从来不在教室上。", "id": "t059"}, {"title": "他从不吃辣，却开了一家火锅店", "cat": "轻松", "face": "男子一点辣都吃不了，却在市中心开了一家火锅店，生意还特别好。", "hint": "", "bottom": "他的店主打清汤锅和番茄锅，辣锅是给客人准备的——他自己只吃清汤那一半。", "id": "t060"}, {"title": "星期五", "cat": "轻松", "face": "牛仔阿明骑着星期五进城，在城里住了三天，又骑着星期五离开。这怎么可能？", "hint": "“星期五”在这题不是日期；他是“骑着”星期五来的", "bottom": "“星期五”是他那匹马的名字。他是骑着那匹马进城、也骑着它离开的。", "id": "t061"}, {"title": "过河的小狗", "cat": "轻松", "face": "一条河上没有桥、没有船，小狗也不会游泳，却干干净净地走到了对岸。为什么？", "hint": "跟季节有关；小狗脚底下踩的是硬的", "bottom": "河面结冰了，小狗是直接踩着冰走过去的。", "id": "t062"}, {"title": "两家理发店", "cat": "轻松", "face": "小镇只有两家理发店。A 店老板的头发又短又丑，B 店老板的头发又帅又整齐。外地来的阿德想剪头发，想了一下，走进了 A 店。为什么？", "hint": "理发师没办法自己帮自己剪头发；看老板的头发，其实是在看“另一个人”的技术", "bottom": "镇上只有这两个理发师，他们的头发一定是互相剪的。A 老板头上那个丑发型是 B 剪的，B 老板的帅发型才是 A 的手艺。", "id": "t063"}, {"title": "关着的校门", "cat": "轻松", "face": "阿杰七点半准时到学校，校门却是关着的，一个同学都没有。他看了看手机，开心地回家了。为什么？", "hint": "今天不是普通的上学日；前一天晚上有一则新闻", "bottom": "前一晚宣布放台风假，他太早睡没看到新闻，到了学校滑手机才知道今天不用上课。", "id": "t064"}, {"title": "半夜的冰箱", "cat": "轻松", "face": "台风夜，妈妈半夜起床打开冰箱，什么都没拿，看了一眼就关上，安心地回去睡觉。为什么？", "hint": "她不是要拿东西吃；冰箱打开的时候，会有一个东西亮起来", "bottom": "傍晚停电了，她想知道电来了没有。冰箱一打开灯有亮，就代表已经复电，里面的菜不会坏。", "id": "t065"}, {"title": "空手进、满手出", "cat": "轻松", "face": "阿凯走进便利商店，什么都没买，却抱着一大叠东西走出去，店员还跟他说“辛苦了，谢谢”。为什么？", "hint": "阿凯是在工作；他抱走的东西，店里已经用不到了", "bottom": "他是物流司机，刚把货搬进店里，抱出去的是店里清空的物流篮。", "id": "t066"}, {"title": "不用付钱的大胃王", "cat": "轻松", "face": "阿龙在一家餐厅连吃了十盘，一毛钱都没付就走了，老板还一直跟他鞠躬道谢。为什么？", "hint": "老板很希望他来吃；他吃的时候，旁边有一台摄影机", "bottom": "阿龙是美食 YouTuber，店家请他来拍影片介绍，餐点是店家招待的。", "id": "t067"}, {"title": "不肯坐的空位", "cat": "轻松", "face": "捷运车厢空空的，到处都是位子，小林却一路站到下车。他脚不酸，也不是下一站就要下车。为什么？", "hint": "他不是不想坐，是觉得不该坐；跟他身上的状态有关", "bottom": "他刚刚在外面淋了一身雨，全身湿透，不想把座位弄湿。", "id": "t068"}, {"title": "大晴天的伞", "cat": "轻松", "face": "气象预报说今天整天大太阳，小凯出门还是带了一把伞，晚上回家时说：“还好有带。”为什么？", "hint": "那天真的一滴雨都没下；伞不一定是挡雨用的", "bottom": "他去看露天的棒球比赛，座位在没有遮蔽的外野，伞是拿来遮太阳的。", "id": "t069"}, {"title": "停电的晚上", "cat": "轻松", "face": "晚上家里停电，大家摸黑找不到手电筒，乱成一团。只有阿嬷不慌不忙，在黑暗中把每个人都带到客厅坐好。为什么？", "hint": "对阿嬷来说，今晚跟平常没什么不一样；阿嬷平常认路的方法不是用眼睛", "bottom": "阿嬷的眼睛看不见，她平常就靠听声音、摸家具在家里走动，有没有灯对她来说都一样。", "id": "t070"}, {"title": "油漆未干", "cat": "轻松", "face": "公园的长椅上挂着“油漆未干”的牌子，阿伯照样坐上去休息，站起来时裤子干干净净。为什么？", "hint": "阿伯每天都来这个公园；牌子上写的不一定是现在的状况", "bottom": "那张长椅好几个礼拜前就漆好了，油漆早就干了，只是工人忘了把牌子收走。阿伯每天来，知道这件事。", "id": "t071"}, {"title": "三米深的水底", "cat": "轻松", "face": "阿翔不会游泳，却在三米深的水底下待了一整个下午，身上一滴水都没沾到。为什么？", "hint": "他跟水之间隔着一层东西；很多游客也跟他一起在那里", "bottom": "他在水族馆的海底隧道里看鱼。人走在玻璃隧道里，头上和两旁都是水。", "id": "t072"}, {"title": "一年两次生日", "cat": "轻松", "face": "阿凯今年过了两次生日，两次都有蛋糕、都是真的生日，他也没有说谎。为什么？", "hint": "两次生日的日期不一样；台湾人常用两种日历", "bottom": "他过国历生日，也过农历生日。台湾很多家庭两个都会庆祝。", "id": "t073"}, {"title": "敲墙", "cat": "轻松", "face": "半夜，小杰听到隔壁“咚、咚、咚”地敲墙。他不但没生气，还笑着回敲了两下。为什么？", "hint": "小杰认识隔壁的人；敲几下是有意思的", "bottom": "隔壁房间住的是他的室友兼好朋友，两人约好用敲墙当暗号：敲三下是“睡了没？”，回两下是“还没”。", "id": "t074"}, {"title": "寒流开冷气", "cat": "轻松", "face": "寒流来袭，外面只有 10 度，阿哲回家第一件事就是把冷气打开，还开到最强。为什么？", "hint": "他其实很怕冷；那台机器不只会吹冷风", "bottom": "他家的冷气是冷暖气机，他开的是暖气。", "id": "t075"}, {"title": "一只鞋", "cat": "轻松", "face": "阿明只穿一只鞋走在大街上，另一只脚没穿鞋。他一点都不觉得丢脸，路人也没人笑他。为什么？", "hint": "他不是忘了穿；那只脚不是光着的，只是套著的不是鞋", "bottom": "他另一只脚骨折打了石膏，套不进鞋子。", "id": "t076"}, {"title": "两根蜡烛", "cat": "轻松", "face": "阿公的生日蛋糕上只插了两根蜡烛，大家唱完生日快乐歌，阿公满意地说：“刚刚好。”为什么？", "hint": "蜡烛的数量其实对得上年纪；那两根蜡烛不是细细长长的", "bottom": "两根是数字蜡烛“8”和“0”——阿公今天 80 岁。", "id": "t077"}, {"title": "接电话的阿伯", "cat": "轻松", "face": "小志打电话给女朋友，接起来的却是一个声音很凶的阿伯。小志挂掉电话后高兴得跳起来。为什么？", "hint": "小志知道那个阿伯是谁；那个阿伯以前不太喜欢小志", "bottom": "那是女朋友的爸爸。以前他从来不接小志的电话，这次愿意接、还说了几句话，代表开始接受他们交往了。", "id": "t078"}, {"title": "每一层都停", "cat": "轻松", "face": "晚上电梯里只有小凯一个人，他按了 12 楼，电梯却每一层都停、都开门，门外都没有人。他一点都不害怕。为什么？", "hint": "电梯没有坏；小凯一进电梯就看到一件事", "bottom": "前一个搭电梯的小朋友恶作剧，把每一层的按钮都按了。小凯进电梯时就看到按钮全亮着。", "id": "t079"}, {"title": "拍西瓜", "cat": "轻松", "face": "阿婆在菜市场拿起西瓜拍了又拍，一口气拍了十几颗，一颗都没买，老板也没生气。为什么？", "hint": "阿婆不是客人；拍西瓜是在听声音", "bottom": "阿婆就是卖西瓜的老板，她在帮客人挑最甜的那一颗。", "id": "t080"}, {"title": "电梯", "cat": "轻松", "face": "小志住在 12 楼，每天放学搭电梯只到 6 楼，再走楼梯爬到 12 楼。可是下雨天，他会直接搭到 12 楼。为什么？", "hint": "他其实很想直接搭到 12 楼；下雨天他手上多了一样东西", "bottom": "小志个子太矮，只按得到 6 楼以下的按钮。下雨天他有带伞，可以用伞尖去按 12 楼。", "id": "t081"}, {"title": "没打开的包裹", "cat": "悬疑", "face": "一片空旷的田中央躺着一个男人，他已经死了，身旁有一个没打开的包裹。附近没有任何脚印。发生了什么事？", "hint": "他是从上面来的；那个包裹本来应该要打开", "bottom": "他从飞机上跳伞，降落伞没有打开——那个“没打开的包裹”就是降落伞包。", "id": "t082"}, {"title": "罗密欧与茱丽叶", "cat": "悬疑", "face": "客厅地上有一滩水和一地碎玻璃，罗密欧和茱丽叶一动也不动地躺在旁边，已经死了。家里的猫蹲在窗台上舔爪子。发生了什么事？", "hint": "罗密欧和茱丽叶不是人；那滩水原本装在一个玻璃容器里", "bottom": "罗密欧和茱丽叶是两条金鱼。猫把鱼缸撞下来摔破，金鱼离开水就死了。", "id": "t083"}, {"title": "太太做的事", "cat": "轻松", "face": "太太把先生“拍”了下来，再把他泡进水里，接着把他挂起来晾。几个小时后，两个人开开心心地出门吃晚餐。发生了什么事？", "hint": "先生从头到尾都好好的；这是还没有数码相机时的做法", "bottom": "太太是摄影师。她帮先生拍了照片，在暗房把相纸泡进药水冲洗，再把照片夹起来晾干。", "id": "t084"}, {"title": "半根火柴", "cat": "悬疑", "face": "一望无际的沙漠里，一个男人死了，手里紧紧握著半根火柴。附近没有脚印，也没有车子。发生了什么事？", "hint": "他不是走路来的；那半根火柴是在做选择", "bottom": "他和几个朋友搭热气球飞越沙漠，热气球漏气一直往下掉，丢光行李还是太重，只好用火柴抽签，抽到短的那根要跳下去。他抽到了半根。", "id": "t085"}, {"title": "灯塔", "cat": "悬疑", "face": "一个男人睡前随手把灯关掉。隔天一早看到新闻，他才知道自己害很多人出事了。为什么？", "hint": "他关的不是家里的灯；他的工作地点在海边", "bottom": "他是灯塔管理员，晚上把灯塔的灯关了。一艘船在黑暗中看不到海岸，撞上了礁石。", "id": "t086"}, {"title": "冰块", "cat": "轻松", "face": "两个人在派对上喝了同一壶饮料。阿明喝得很快，一口气喝完就先回家了；阿华慢慢喝，聊了一整晚。结果阿华中毒送医，阿明一点事都没有。为什么？", "hint": "毒一开始不在饮料本身；时间是关键", "bottom": "毒是冻在冰块里的。阿明喝得快，冰块还没融化就喝完了；阿华喝得慢，冰块融化，毒就混进饮料里。", "id": "t087"}, {"title": "新买的高跟鞋", "cat": "悬疑", "face": "小美买了一双新的高跟鞋，穿着去上班，结果当天就出了意外。为什么？", "hint": "她的工作需要站得一动也不动；身高差几公分，在她的工作里很要命", "bottom": "小美是马戏团飞刀秀的助手，工作是站在靶前一动也不动。新高跟鞋让她高了几公分，飞刀就射中了她。", "id": "t088"}, {"title": "森林里的潜水夫", "cat": "悬疑", "face": "森林大火扑灭后，消防员在一片焦黑的树林里，发现一个穿着全套潜水装、戴着蛙镜的男人，已经死了。附近几公里都没有河。发生了什么事？", "hint": "他原本是在水里；灭火用的水是从别的地方运来的", "bottom": "救火飞机到附近的湖里吸水，再飞来洒水灭火。正在湖里潜水的他被一起吸了上来，跟着水被洒进火场。", "id": "t089"}, {"title": "想回家", "cat": "轻松", "face": "阿杰很想回家，可是家门口站着一个戴面罩的人在等他，他只好停在半路不敢动。发生了什么事？", "hint": "这是一场比赛；“家”不是他住的地方", "bottom": "阿杰在打棒球，人在三垒。“家”是本垒，戴面罩的是捕手，正拿着球等他冲回来触杀。", "id": "t090"}, {"title": "山上的小屋", "cat": "悬疑", "face": "雪山上有一间小屋，屋里坐着好几个人，全都死了。门窗都好好的，没有人闯进去过。发生了什么事？", "hint": "那间小屋原本不在山上；小屋本来是会动的", "bottom": "那间“小屋”是一架飞机的机舱，飞机坠毁在雪山上。", "id": "t091"}, {"title": "公元前的古钱", "cat": "轻松", "face": "古董商拿出一枚古钱，上面清清楚楚刻着“公元前 50 年”，开价一百万。买家只看了一眼就报警了。为什么？", "hint": "问题出在刻的那几个字；那个年代的人怎么记年份？", "bottom": "“公元前”是后人用耶稣出生的那一年往回算的。公元前 50 年的人不可能知道“再过 50 年耶稣会出生”，钱币一定是假的。", "id": "t092"}, {"title": "夜班警卫的梦", "cat": "轻松", "face": "老板出差前，警卫跑来说：“我昨晚梦到你今天搭的飞机会出事，千万别去。”老板半信半疑改了班机，那班飞机真的出事了。老板向他道谢，然后把他开除了。为什么？", "hint": "老板很感谢他，但也发现了一件事；注意他是哪个时段上班", "bottom": "他是夜班警卫，晚上本来应该在值班。他能做梦，就代表他上班时在睡觉。", "id": "t093"}, {"title": "草地上的东西", "cat": "轻松", "face": "院子的草地上丢著五颗煤炭、一根红萝卜和一条围巾，没有任何人把它们丢在那里。为什么它们会在那？", "hint": "这些东西原本在比较高的地方；跟天气有关", "bottom": "前几天下雪，小朋友在院子里堆了一个雪人。天气回暖，雪人融化了，就剩下当眼睛和扣子的煤炭、当鼻子的红萝卜和那条围巾。", "id": "t094"}, {"title": "单线铁轨", "cat": "轻松", "face": "一条只有一条铁轨的铁路，一列火车从北往南开，一列从南往北开，两列都全速前进、都没有停下来，却没有撞上。为什么？", "hint": "题目没有说它们同时出发；想想时间", "bottom": "它们不是同一个时间经过的——一列早上开过，另一列下午才开。", "id": "t095"}, {"title": "被叫美女", "cat": "轻松", "face": "早餐店阿姨看到男客人都喊“帅哥”。今天阿明一进门，阿姨却喊他“美女”，阿明开心了一整天。为什么？", "hint": "阿姨以前一直叫错；阿明的名字听不出是男是女", "bottom": "阿明是留短头发的女生，名字又很中性，以前每次都被叫“帅哥”，今天阿姨终于叫对了。", "id": "t096"}, {"title": "从来没喝过的珍奶", "cat": "轻松", "face": "阿杰每天都去同一家手摇饮料店点同一杯珍奶，连续三个月，却一口都没喝过。为什么？", "hint": "他去那家店的目的不是饮料；店里有一个人他很在意", "bottom": "他喜欢柜台的店员，点饮料只是想跟她说说话，饮料都带回公司请同事喝。", "id": "t097"}, {"title": "两百块小费", "cat": "轻松", "face": "外送员把便当送到，客人一开门愣了一下，就塞给他两百块小费，还叫他“赶快进来吃饭”。为什么？", "hint": "他们认识；客人很在意这个外送员吃饱了没", "bottom": "外送员是客人的儿子。妈妈点了外送，平台刚好把单派给在附近跑外送的儿子。", "id": "t098"}, {"title": "健身房年费", "cat": "轻松", "face": "小胖办了健身房的年费会员，一整年几乎每天都去，体重却一公斤都没少。为什么？", "hint": "他每天去，但没在运动；健身房里除了器材还有别的设备", "bottom": "他家的热水器坏了一年都没修，他每天去健身房只是为了洗热水澡。", "id": "t099"}, {"title": "十个闹钟", "cat": "轻松", "face": "小李设了十个闹钟，结果全部响完他还是睡过头，迟到了两个小时，却没有任何人骂他。为什么？", "hint": "公司里没有人有资格骂他；他在公司的位置很高", "bottom": "小李就是公司的老板。", "id": "t100"}, {"title": "电梯里的尖叫", "cat": "轻松", "face": "电梯门一打开，里面的人看到阿华，全部尖叫着往外冲。阿华一点都不生气，还很有成就感。为什么？", "hint": "阿华今天的样子跟平常不一样；跟某个节日有关", "bottom": "那天是万圣节，阿华化了超逼真的僵尸妆，要去参加公司的万圣节派对。", "id": "t101"}, {"title": "零分的庆功宴", "cat": "轻松", "face": "小明拿回一张写着大大“0”的考卷，妈妈看完却很高兴，带他去吃大餐。为什么？", "hint": "那个 0 不是分数；老师用另一种方式记成绩", "bottom": "老师在考卷上写的是“错误题数”——小明错 0 题，考了一百分。", "id": "t102"}, {"title": "退回来的红包", "cat": "轻松", "face": "阿光参加完朋友的婚宴，隔天新郎特地开车来找他，把红包原封不动地还给他。新郎没有生气，还笑到不行。为什么？", "hint": "红包袋里有东西，但不是钱；阿光出门前很匆忙", "bottom": "阿光包错了，红包袋里装的是他的机车行照和一叠发票。", "id": "t103"}, {"title": "路上小心", "cat": "轻松", "face": "小英出门前喊了一声“我出门啰”，客厅传来“好～路上小心”。家里明明没有人，她一点都不害怕。为什么？", "hint": "家里不是完全没有“活的东西”；那句话是学来的", "bottom": "家里养的鹦鹉学会了妈妈每天说的这句话。", "id": "t104"}, {"title": "不用喂的鱼", "cat": "轻松", "face": "阿龙家客厅有一缸热带鱼，他从来不喂、也从来不换水，鱼却好几年都游得好好的。为什么？", "hint": "鱼是会动的，但不是真的；那个“鱼缸”要插电", "bottom": "那是电视上播著的水族箱影片，不是真的鱼缸。", "id": "t105"}, {"title": "盖起来的镜子", "cat": "轻松", "face": "小凯剪完头发回到家，第一件事就是把家里所有的镜子用布盖起来。为什么？", "hint": "跟刚刚剪的头发有关；他对结果很不满意", "bottom": "头发剪坏了，他接下来一个月都不想看到自己。", "id": "t106"}, {"title": "只吃一餐", "cat": "轻松", "face": "阿美说她今天只吃了“一餐”，结果晚上量体重还是胖了两公斤。她没有说谎。为什么？", "hint": "她吃东西的时间很长；“一餐”从什么时候开始、什么时候结束？", "bottom": "她从早上十点一路吃到晚上十点，中间没停过，所以只算“一餐”。", "id": "t107"}, {"title": "数了半小时的硬币", "cat": "轻松", "face": "阿伯提着一大袋硬币到银行，请行员用机器数了半小时。数完之后他一毛钱都没存，又全部提回家了。为什么？", "hint": "阿伯本来就没打算存；他很好奇一个数字", "bottom": "那是他扑满存了十年的零钱，他只是想知道总共存了多少，数完就心满意足地带回去继续存。", "id": "t108"}, {"title": "连输二十场", "cat": "轻松", "face": "小志玩手机游戏连输了二十场，却越玩越开心。为什么？", "hint": "他的对手是谁很重要；他是故意的", "bottom": "他在陪五岁的儿子对战，每一场都故意输给儿子。", "id": "t109"}, {"title": "背对舞台", "cat": "轻松", "face": "小芳在天团演唱会的摇滚区第一排待了整整三个小时，却一眼都没看舞台。为什么？", "hint": "她在工作；她要看的是另一个方向的人", "bottom": "她是现场的保全，工作就是面向观众，注意有没有人冲上台。", "id": "t110"}, {"title": "全班都在睡", "cat": "轻松", "face": "老师上课时全班都在睡觉，老师却讲得很起劲，下课前还说“今天大家都很认真”。为什么？", "hint": "老师看不到学生；课不是在教室上的", "bottom": "那是线上课程，学生都把镜头和麦克风关掉了，老师根本看不到大家在睡觉。", "id": "t111"}, {"title": "不用沐浴乳", "cat": "轻松", "face": "小胖洗澡从来不用肥皂、也不用沐浴乳，身上却一点都不臭。为什么？", "hint": "他还是有用清洁用品；那瓶东西本来是洗别的地方的", "bottom": "他直接用洗发精从头洗到脚。", "id": "t112"}, {"title": "连闯红灯", "cat": "轻松", "face": "小张骑着脚踏车一连闯了好几个红灯，路口的警察看到了，不但没拦他，还跟着大喊“加油！”。为什么？", "hint": "那条路那天不太一样；警察在那里的工作是维持秩序", "bottom": "他在参加自行车公路赛，比赛路段已经封路交管，红绿灯不算数。", "id": "t113"}, {"title": "冰箱里的遥控器", "cat": "轻松", "face": "全家人翻遍客厅找电视遥控器，最后在冰箱里找到了。没有人是故意的。发生了什么事？", "hint": "最后一个拿遥控器的人去过厨房；那个人当时两手都拿着东西", "bottom": "阿嬷一手拿着遥控器去冰箱拿饮料，拿完饮料，顺手把手上的“另一样东西”放进了冰箱。", "id": "t114"}, {"title": "最后一名", "cat": "轻松", "face": "马拉松比赛，阿杰跑了最后一名，抵达终点时，工作人员却给了他全场最大的掌声。为什么？", "hint": "他是故意跑最后的；他也是工作人员之一", "bottom": "他是大会安排的收尾人员，任务就是跟在所有跑者最后面，确认每个人都平安。他到终点，代表比赛圆满结束。", "id": "t115"}, {"title": "同一张脸", "cat": "轻松", "face": "银行抢案现场留下的 DNA 跟阿杰完全吻合，监视器也清楚拍到他的脸，法官最后却没办法判他有罪。为什么？", "hint": "证据全部是真的；世界上有另一个人跟他一样", "bottom": "阿杰有一个同卵双胞胎兄弟，两人 DNA 一样、长得一模一样，又互相说对方才是抢匪，没有证据能确定是哪一个。", "id": "t116"}, {"title": "录音机", "cat": "悬疑", "face": "警察进到书房，桌上有一台录音机。按下播放键，传来屋主的声音：“我撑不下去了……”接着“砰”的一声，录音结束。警察听完立刻说：“这是谋杀。”为什么？", "hint": "问题不在录到的声音；按下播放后，屋主的声音马上就出现了", "bottom": "录音带是从头开始播的。如果屋主录完就出事了，是谁把录音带倒回开头的？现场一定还有另一个人。", "id": "t117"}, {"title": "闪烁的灯", "cat": "轻松", "face": "深夜，阿明看到对面大楼有一户的灯一直闪：三下短、三下长、三下短。他看了一会儿就打 119，救了一条命。为什么？", "hint": "闪的方式有规律；那是一种全世界通用的求救讯号", "bottom": "那是摩斯密码的 SOS。屋主跌倒骨折动不了，只构得到床边的电灯开关，用开灯、关灯求救。", "id": "t118"}, {"title": "放门口就好", "cat": "轻松", "face": "外送员按了门铃，屋里传来一个男人的声音：“放门口就好。”外送员放下餐点，走到楼下马上报警。为什么？", "hint": "外送员看过订单上的一段文字；订餐的人没办法用说的回应", "bottom": "订单备注写着：“我是听障人士，请不要按门铃，到了传讯息给我。”订餐的人没办法说话，屋里回应的是别人。", "id": "t119"}, {"title": "搬走的监视器", "cat": "轻松", "face": "小偷闯进便利商店，把监视器主机整台搬走，警察还是不到三小时就抓到他。为什么？", "hint": "他在店里做了一件很平常的事；台湾人结账时很常拿出手机", "bottom": "他动手前先在店里买了一瓶饮料，结账时习惯性地刷了手机条码载具。警察从那张电子发票的载具查到了他。", "id": "t120"}, {"title": "东海岸的夕阳", "cat": "轻松", "face": "嫌犯说案发当天傍晚他在花莲的海边看夕阳，还拿出手机照片当证据：照片里，太阳正慢慢沉进海平面。警察一看就说他在说谎。为什么？", "hint": "问题出在地理；太阳从哪边升起、往哪边落下？", "bottom": "花莲在台湾东岸，海在东边，只看得到太阳从海面升起；夕阳是往西边的中央山脉落下的。照片不可能是在花莲海边拍的夕阳。", "id": "t121"}, {"title": "干的外套", "cat": "轻松", "face": "嫌犯说他整个下午都在外面跑业务，刚刚才回到家。警察看了看他挂在门口的外套和鞋子，就知道他在说谎。为什么？", "hint": "那天的天气很特别；看的是东西的状态，不是东西本身", "bottom": "那天下午下了好几个小时的大雨，他的外套和鞋子却是干的——他根本没出门。", "id": "t122"}, {"title": "没叫的狗", "cat": "轻松", "face": "半夜家里遭小偷，值钱的东西全被搬走，养在客厅的看门狗却一声都没叫。警察听完，马上把怀疑对象缩小到几个人。为什么？", "hint": "线索是一件“没有发生”的事；狗对谁不会叫？", "bottom": "狗看到陌生人一定会叫，它没叫，代表小偷是它很熟的人——家人、常来的亲戚或朋友。", "id": "t123"}, {"title": "反锁的房间", "cat": "悬疑", "face": "房门的门闩是从里面扣上的，窗户也锁死了，屋主却是被别人害死的，地上只有一小滩水。凶手是怎么离开的？", "hint": "那滩水原本不是水；门闩是“后来”才扣上的", "bottom": "凶手离开前用一块冰撑住门闩，再把门关上。冰慢慢融化，门闩就自己落下扣好，只留下一滩水。", "id": "t124"}, {"title": "单程机票", "cat": "悬疑", "face": "夫妻一起出国旅游，只有先生一个人回来，他说太太在国外出了意外。警察查了订票纪录，就把他带回去问话。为什么？", "hint": "证据在出发之前就留下了；两个人的机票不一样", "bottom": "先生帮自己买的是来回票，帮太太买的却是单程票——他出发前就知道太太不会回来。", "id": "t125"}, {"title": "那通电话", "cat": "轻松", "face": "警察打电话给一位太太：“你先生出事了，请你马上到医院。”太太脱口问：“他是在哪条路上被车撞的？”警察当下就起疑了。为什么？", "hint": "注意警察说了什么、没说什么；她回答得太快了", "bottom": "警察只说“出事了”，从头到尾没提到车祸。她会知道是被车撞，代表她早就知道发生了什么。", "id": "t126"}, {"title": "没来买鲜奶的阿伯", "cat": "轻松", "face": "每天晚上八点都会来买一瓶鲜奶的阿伯，今天没有出现。便利商店店员下班后，马上请警察去阿伯家看看。为什么？", "hint": "阿伯一直非常准时；阿伯是一个人生活", "bottom": "阿伯一个人住，好几年来每天准时来买鲜奶从没缺过。店员觉得不对劲；警察赶到时，阿伯在家跌倒爬不起来，幸好及时送医。", "id": "t127"}, {"title": "握笔的右手", "cat": "悬疑", "face": "男人倒在书房的书桌前，右手还握著钢笔，桌上的纸写了一半。他太太一进门就说：“有人动过现场。”为什么？", "hint": "太太很了解先生的习惯；注意是哪一只手", "bottom": "先生是左撇子，从来不用右手写字。笔是有人事后塞进他右手的。", "id": "t128"}, {"title": "包裹简讯", "cat": "轻松", "face": "小敏收到一封简讯：“您的包裹地址有误，无法配送，请点连结更新资料。”她明明正在等网购的包裹，却一眼就看出是诈骗。为什么？", "hint": "她记得自己是怎么下单的；她的包裹本来就不会送到家", "bottom": "她网购时选的是超商取货，根本没有填地址，不可能有“地址有误”这回事。", "id": "t129"}, {"title": "只有水声的电话", "cat": "轻松", "face": "半夜，小凯接到隔壁奶奶打来的电话，接起来没有人说话，只听到一直有水声。小凯没有挂掉，直接冲去按奶奶家的门铃。为什么？", "hint": "奶奶平常不会这么晚打来；水声是从哪个房间传来的？", "bottom": "奶奶一个人住，手机的快速拨号第一个就是小凯。她在浴室跌倒爬不起来、也喊不出声，只按得到快速拨号。", "id": "t130"}, {"title": "对面的男人", "cat": "轻松", "face": "半夜睡不着，小芳走到窗边，看到对面大楼有个男人也站在窗前看着她，伸出一根手指，一下、一下地往下点。她吓得赶快拉上窗帘。为什么？", "hint": "她看到了不该看的事；他的手指在数东西", "bottom": "小芳刚刚不小心看到那个男人在屋里伤人。男人发现被看见了，正在用手指数她住在几楼。", "id": "t131"}, {"title": "床底下", "cat": "轻松", "face": "小琪睡前习惯把手垂到床边，让床底下的小狗舔一舔才安心睡着。隔天早上，她在浴室的镜子上看到一行字。写的是什么？", "hint": "昨晚床底下的不是小狗；镜子上的字，在回答她心里的疑问", "bottom": "“人也会舔。”——小狗那晚其实被关在阳台，整晚舔她手的，是躲在床底下的陌生人。", "id": "t132"}, {"title": "告别式上的男生", "cat": "悬疑", "face": "一个女生在妈妈的告别式上，对一位来致意的男生一见钟情，却忘了跟他要联络方式。一个月后，她做了一件让所有人都想不到的事。是什么事？", "hint": "她只想再见那个男生一面；她需要“同样的场合”再发生一次", "bottom": "她害死了自己的姐姐。她心里想的是：再办一场告别式，那个男生也许就会再出现。", "id": "t133"}, {"title": "白衣乘客清汤・变格", "cat": "轻松", "face": "深夜，计程车司机在殡仪馆附近载到一位穿白衣服的小姐。到站后她付了一张千元钞就下车了。隔天早上司机打开钱包，那张千元钞不见了。发生了什么事？", "hint": "钱包里不是空的，多了别的东西；上车的地点很重要", "bottom": "钱包里那张千元钞变成了一张冥纸——他昨晚载的不是人。这是台湾计程车司机之间流传很久的鬼故事。", "id": "t134"}, {"title": "天花板上的脚步声", "cat": "轻松", "face": "住顶楼的小芸，每天半夜都听到天花板上有人走来走去。房东说楼上是屋顶，门锁了很多年，钥匙只有他有。发生了什么事？", "hint": "脚步声是真的人；屋顶不一定只能从那扇门上去", "bottom": "有个陌生人一直偷偷住在屋顶水塔旁的铁皮小间里，从隔壁大楼的屋顶翻过来，每天半夜才出来活动。", "id": "t135"}, {"title": "团体照", "cat": "轻松", "face": "毕业旅行最后一晚，全班在饭店门口拍团体照。回家后大家看照片，发现最后一排多了一个人，全班都以为是别班的，其实没有人认识他。他是谁？", "hint": "他是真的人，不是鬼；那几天饭店里发生过一些怪事", "bottom": "他是混进饭店的陌生人。前一晚好几个房间掉了钱包和手机，就是他趁大家玩的时候偷的；拍照时他故意站进去，假装是学生。", "id": "t136"}, {"title": "一片黑的猫眼", "cat": "轻松", "face": "深夜有人按门铃，门外的人说：“我是管理员，来检查瓦斯。”小凯凑到猫眼一看，一片漆黑，什么都看不到。他没开门，直接报警。为什么？", "hint": "猫眼看出去本来应该看得到东西；门外的人不想被看到", "bottom": "走廊的灯明明是亮的，猫眼却一片黑——门外的人用手指按住了猫眼。真的管理员不会半夜来，也不需要遮住自己。", "id": "t137"}, {"title": "一直打来的电话", "cat": "轻松", "face": "二十年前，一位保母晚上在别人家顾小孩，一直接到陌生男人打来问：“小孩还好吗？”她报警，警察查完叫她：“立刻带小孩离开那间房子！”为什么？", "hint": "以前的家用电话，一间房子可以装好几支；打电话的人离她很近", "bottom": "警察查到电话是从那间房子的另一支分机打的——打电话的人就在楼上。", "id": "t138"}, {"title": "一直闪大灯的车", "cat": "轻松", "face": "小玉深夜开车回家，后面一台车一路跟着她，还一直闪大灯。她吓得一路狂飙到家，对方停好车走过来，却是来救她的。为什么？", "hint": "危险不在后面那台车；闪大灯是为了照亮某个地方", "bottom": "后面的驾驶看到她的后座躲著一个人。每次那个人起身要动手，他就闪大灯照亮车内，对方只好又趴下去。", "id": "t139"}, {"title": "多一副餐具", "cat": "轻松", "face": "一个人住的小雅点了一人分外送。外送员把餐交给她时问：“要不要帮你们多拿一副餐具？”小雅听完全身发冷。为什么？", "hint": "外送员看到了小雅没看到的东西；注意“你们”这两个字", "bottom": "外送员从门缝看到她身后的走廊站着另一个人。小雅家里应该只有她一个。", "id": "t140"}, {"title": "冰箱上的便利贴", "cat": "轻松", "face": "独居的阿哲，每天早上都会在冰箱门上看到一张便利贴：“记得吃早餐”。他一直以为是女朋友留的，直到女朋友说：“我这礼拜都在国外出差啊。”", "hint": "阿哲从来没问过是谁写的；进得了他家的人不只一个", "bottom": "便利贴不是女朋友写的——有个陌生人有他家的钥匙，每天半夜进来，留下纸条再离开。", "id": "t141"}, {"title": "我们在看电影", "cat": "轻松", "face": "半夜听到隔壁传来女生大喊“救命”，小王去敲门。一个男人开门说：“不好意思，我们在看恐怖片，音量开太大了。”小王点点头回家，马上报警。为什么？", "hint": "小王有往屋里看；看电影需要什么东西开着？", "bottom": "男人开门的时候，小王看到客厅的电视是关着的、整间屋子都暗暗的，根本没有人在看电影。", "id": "t142"}, {"title": "二手衣柜", "cat": "轻松", "face": "阿美买了一个二手衣柜，搬回家后发现，衣柜里面比外面看起来浅了快三十公分。", "hint": "空间没有消失，是被隔起来了；夹层的门扣在哪一侧很重要", "bottom": "衣柜背后有一个暗门夹层，大小刚好躲得进一个人——而夹层的门，是从里面扣上的。", "id": "t143"}, {"title": "末班公车", "cat": "轻松", "face": "深夜的末班公车上，一位老先生坐到小玉旁边，小声说：“下一站跟我一起下车，什么都不要问。”她照做了。下车后，她才知道老先生救了她。为什么？", "hint": "危险就在公车上；老先生看到了她背后的东西", "bottom": "老先生看到后排有个男人一直盯着小玉，手里藏着刀，等她下车要跟过去。老先生陪她提早下车，再陪她去警察局。", "id": "t144"}, {"title": "掀起来的马桶座", "cat": "轻松", "face": "小妍搬进新套房，房东说：“门锁是新换的，钥匙只有你这一把。”第三天晚上下班回家，她发现厕所的马桶座是掀起来的。", "hint": "她一个人住；什么人上厕所会掀马桶座？", "bottom": "小妍一个人住，从来不会把马桶座掀起来——代表有男人进过她家，还用了她的厕所。房东手上其实留了一把钥匙。", "id": "t145"}, {"title": "生日快乐", "cat": "轻松", "face": "凌晨十二点整，小如收到陌生号码传来的讯息：“生日快乐”，附了一张照片。她看到照片就报警了。", "hint": "照片拍的是小如自己；照片是什么时候拍的？", "bottom": "照片拍的是她躺在床上睡觉的样子，而且就是今天晚上拍的——传讯息的人刚刚就在她房间里。", "id": "t146"}, {"title": "山屋的第五个人清汤・变格", "cat": "轻松", "face": "四个登山客在暴风雪中躲进一间漆黑的山屋。为了不睡着，他们各站一个角落，第一个人沿着墙走到下一个角落拍下一个人的肩膀，被拍的人再往前走……就这样轮了一整晚。天亮后，其中一人脸色发白。为什么？", "hint": "自己用四个角落推一次；每走一步，都要有人在下一个角落等", "bottom": "四个人这样轮，第四个人走到第一个角落时，那里应该已经没有人可以拍了——能一直轮到天亮，代表屋子里有第五个“人”。", "id": "t147"}, {"title": "隔壁床红汤・变格", "cat": "悬疑", "face": "阿伯住院一个月，每天晚上都跟隔壁床的老先生聊天聊到睡着。出院那天，他跟护理师说：“帮我谢谢隔壁床的阿伯，这个月都靠他陪我。”护理师愣住了。为什么？", "hint": "护理师知道隔壁床的事；那张床这个月有没有排病人？", "bottom": "这一个月，隔壁那张床一直是空的。上一位住那张床的老先生，在阿伯住进来的前一天过世了。", "id": "t148"}, {"title": "踢进自家球门", "cat": "轻松", "face": "一场国际足球赛只剩最后几分钟，领先的那一队故意把球踢进自己的球门，让比分变成平手，全队还为这一球欢呼。为什么？", "hint": "这是真实发生过的比赛；他们要的不是“赢”，是“赢多少”", "bottom": "1994 年加勒比海杯的资格赛，巴巴多斯要赢 2 分以上才能晋级，当时 2 比 1 只领先 1 分。这届规定延长赛的黄金进球算 2 分，所以巴巴多斯干脆自进一球扳成 2 比 2 拖进延长赛，再靠黄金进球净胜 2 分晋级。", "id": "t149"}, {"title": "不能坐牢的犯人", "cat": "轻松", "face": "法官宣判：“被告有罪。”接着又说：“可是我没办法让他去坐牢。”被告没有生病、没有特权，法律也没有漏洞。为什么？", "hint": "关他会牵连到另一个人；那个人跟他分不开", "bottom": "被告是连体婴，两兄弟共用身体，另一个是无辜的。把有罪的那个关起来，就等于把无辜的也关起来。", "id": "t150"}, {"title": "不会下棋的人", "cat": "轻松", "face": "一个完全不会下国际象棋的人，同时跟两位国际象棋大师对弈，最后竟然一胜一败。他是怎么做到的？", "hint": "他一步棋都没有自己想；两位大师看不到彼此的棋盘", "bottom": "他对 A 大师拿黑棋、对 B 大师拿白棋。A 先走，他就把 A 的那一步照抄到 B 的棋盘；B 回应后，再把 B 的那一步照抄回 A——其实是两位大师在互相下棋，一边赢、另一边就输。", "id": "t151"}, {"title": "卡在陆桥下的货车", "cat": "轻松", "face": "一台大货车卡在陆桥下面，前进后退都不行，工程师围着讨论了一小时，还在想要不要拆掉桥的一角。一个路过的小学生说了一句话，十分钟就解决了。他说了什么？", "hint": "不用动桥，也不用卸货；车子的高度可以变低一点点", "bottom": "“把轮胎放一点气。”轮胎扁一点，车顶就低了几公分，货车就能慢慢开出来。", "id": "t152"}, {"title": "最慢的马", "cat": "轻松", "face": "富翁说：“你们兄弟俩骑马比赛，谁的马‘最后’到终点，财产就给谁。”两人慢吞吞地走了一整天，谁都不肯往前。一位路人说了一句话，两人立刻跳上马拼命冲向终点。路人说了什么？", "hint": "比的是“谁的马”，不是“谁骑的”；两人都想让对方的马先到", "bottom": "“你们交换马骑。”骑着对方的马冲第一，自己的马就会是最后到的那一匹。", "id": "t153"}, {"title": "跨两次年", "cat": "轻松", "face": "阿凯说，他今年 12 月 31 日晚上跟大家倒数跨年，数完之后，又在另一个地方再倒数跨年一次，两次都是真的。为什么？", "hint": "他中间搭了交通工具；地球上不同的地方，新年到的时间不一样", "bottom": "他在台北跨完年，马上搭夜班飞机往东飞过国际换日线，例如飞夏威夷。夏威夷比台湾晚 18 个小时，落地时当地还是 12 月 31 日，晚上可以再跨一次年。", "id": "t154"}, {"title": "第 20 次生日", "cat": "轻松", "face": "阿公 80 岁生日那天，全家帮他庆祝，阿公却说：“这是我这辈子第 20 次过生日。”他没有记错，也不是以前没人帮他过。为什么？", "hint": "他的生日日期很特别；跟闰年有关", "bottom": "阿公是 2 月 29 日出生的，这一天四年才有一次，80 年只遇到 20 次。", "id": "t155"}, {"title": "不讲话的鹦鹉", "cat": "轻松", "face": "宠物店老板保证：“这只鹦鹉听到什么都会跟着说。”阿伯买回家养了一个月，鹦鹉一个字都没说过。阿伯去理论，老板却没有说谎。为什么？", "hint": "老板说的话，每个字都是真的；条件是“听到”", "bottom": "那只鹦鹉是聋的。它“听到什么都会说”，可是它什么都听不到。", "id": "t156"}, {"title": "挂反的国旗", "cat": "轻松", "face": "船长的戒指在甲板上不见了。一位日本籍船员说：“那时候我在船头，忙着把挂反的日本国旗重新挂正。”船长一听就知道他在说谎。为什么？", "hint": "问题出在他说的那面旗；想想那面旗长什么样子", "bottom": "日本国旗是白底中间一个红色圆形，上下左右都一样，根本没有“挂反”这回事。", "id": "t157"}, {"title": "没有 4 楼", "cat": "轻松", "face": "小英家住在大楼的第四层，可是电梯里根本没有“4”这个按钮，她每天还是搭电梯回家。为什么？", "hint": "按钮上的数字不一定等于第几层；台湾人对某些数字有忌讳", "bottom": "有些大楼避讳数字“4”（音近“死”），第四层直接标成 5 楼或 3A。她按的是“5”，其实就是第四层。", "id": "t158"}, {"title": "丢下另一只鞋", "cat": "轻松", "face": "火车刚开动，一个男人的一只鞋掉到月台上，捡不回来了。他想了一下，把脚上另一只鞋也脱下来丢出去。为什么？", "hint": "他不是在生气；他在替别人着想", "bottom": "一只鞋对他已经没用了；把另一只也丢下去，捡到的人就能凑成一双穿。这个故事一般流传是甘地的轶事。", "id": "t159"}, {"title": "教堂里的梦", "cat": "悬疑", "face": "一个男人在教堂听讲道时睡着了，梦到自己被押上断头台。刀落下的那一瞬间，太太用扇子拍了他的脖子叫醒他，他当场被吓死了。这个故事哪里不对？", "hint": "故事本身有个漏洞；谁能告诉别人他做了什么梦？", "bottom": "他当场就死了，来不及跟任何人说——那是谁知道他梦到了什么？这个故事不可能是真的。", "id": "t160"}]</script>
<script>
const ITEMS = JSON.parse(document.getElementById("data").textContent);
const PICK_KEY = "haigui-picks-v1", MODE_KEY = "haigui-mode-v1";
const CATS = ["全部", ...new Set(ITEMS.map(j => j.cat))];
const STATUSES = ["全部", "未选", "想玩", "不想玩"];
const state = { mode: localStorage.getItem(MODE_KEY) || "one", cat: "全部", status: "全部", q: "", index: 0, page: 0 };
let picks = {};
try { picks = JSON.parse(localStorage.getItem(PICK_KEY) || "{}") || {}; } catch (e) { picks = {}; }
const open = new Set();
const main = document.getElementById("main");
const qInput = document.getElementById("q");
const elOf = t => !t ? null : (t.nodeType === 1 ? t : t.parentElement);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
function hi(text, q) {
  const safe = esc(text); if (!q.trim()) return safe;
  const p = esc(q.trim()).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(p, "gi"), m => `<mark>${m}</mark>`);
}
function filtered() {
  const q = state.q.trim();
  return ITEMS.filter(j => {
    if (state.cat !== "全部" && j.cat !== state.cat) return false;
    const mark = picks[j.id] || "";
    if (state.status === "未选" && mark) return false;
    if (state.status === "想玩" && mark !== "play") return false;
    if (state.status === "不想玩" && mark !== "skip") return false;
    if (q && ![j.title, j.face, j.cat].some(v => v.includes(q))) return false;
    return true;
  });
}
function counts() {
  let play = 0, skip = 0;
  ITEMS.forEach(j => { if (picks[j.id] === "play") play++; else if (picks[j.id] === "skip") skip++; });
  return { total: ITEMS.length, play, skip, left: ITEMS.length - play - skip };
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
function save() { localStorage.setItem(PICK_KEY, JSON.stringify(picks)); }
function bodyOf(list) {
  const lines = ["想玩的海龟汤", "共 " + list.length + " 题", ""];
  list.forEach((j, i) => {
    lines.push((i + 1) + ". 【" + j.cat + "】" + j.title, "汤面：" + j.face);
    if (j.hint) lines.push("提示：" + j.hint);
    lines.push("汤底：" + j.bottom, "");
  });
  if (!list.length) lines.push("还没有标成想玩的题目。");
  return lines.join("\n");
}
function chosen() { return ITEMS.filter(j => picks[j.id] === "play"); }
function download(text) {
  const blob = new Blob(["\ufeff" + text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  const now = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = "想玩的海龟汤-" + now.getFullYear() + String(now.getMonth()+1).padStart(2,"0") + String(now.getDate()).padStart(2,"0") + ".txt";
  document.body.appendChild(a); a.click(); a.remove();
  return a.download;
}
function story(j) {
  const shown = open.has(j.id);
  return `<p class="label">汤面</p><p class="face">${hi(j.face, state.q)}</p>
    ${j.hint ? `<p class="label">提示</p><p class="hint">${shown ? hi(j.hint, state.q) : "提示也盖着，和汤底一起打开。"}</p>` : ""}
    <p class="label">汤底</p>
    ${shown ? `<p class="bottom">${esc(j.bottom)}</p>` : `<p class="bottom">汤底还盖着。</p>`}
    <div class="actions"><button type="button" data-reveal="${j.id}">${shown ? "盖上汤底" : "看汤底"}</button></div>`;
}
function render() {
  const c = counts();
  document.getElementById("stats").innerHTML = [["共", c.total+" 题",""],["想玩", c.play,"hot"],["不想玩", c.skip,"cool"],["未选", c.left,""]].map(([k,v,cls]) => `<span class="stat ${cls}">${k} <b>${v}</b></span>`).join("");
  document.getElementById("bar").style.width = (c.total ? ((c.play+c.skip)/c.total)*100 : 0) + "%";
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === state.mode));
  document.querySelectorAll("#cats [data-cat]").forEach(b => b.classList.toggle("on", b.dataset.cat === state.cat));
  document.querySelectorAll("#statuses [data-status]").forEach(b => b.classList.toggle("on", b.dataset.status === state.status));
  const list = filtered();
  if (state.index >= list.length) state.index = Math.max(list.length - 1, 0);
  if (!list.length) { main.innerHTML = `<div class="empty">这个筛选下面没有题目。</div>`; return; }
  if (state.mode === "one") {
    const j = list[state.index];
    const name = picks[j.id] === "play" ? "想玩" : picks[j.id] === "skip" ? "不想玩" : "未选";
    main.innerHTML = `<article class="one"><p class="meta">${state.index+1} / ${list.length}　${esc(j.cat)}　${name}</p><h2 class="title">${hi(j.title, state.q)}</h2>${story(j)}
      <div class="actions">
        <button type="button" data-act="play" data-id="${j.id}" class="${picks[j.id]==="play"?"on":""}">想玩</button>
        <button type="button" data-act="skip" data-id="${j.id}" class="${picks[j.id]==="skip"?"on":""}">不想玩</button>
      </div>
      <div class="nav"><button type="button" data-nav="prev">上一条</button><button type="button" data-nav="next">下一条</button><button type="button" data-nav="unmarked">下一条未选</button></div>
      <p class="hintline">再点一次已选按钮可以取消。选完会跳到下一条。汤底打开与否不影响导出。</p></article>`;
    return;
  }
  const size = 20, pages = Math.max(1, Math.ceil(list.length / size));
  if (state.page >= pages) state.page = pages - 1;
  const slice = list.slice(state.page * size, state.page * size + size);
  main.innerHTML = `<div class="nav" style="margin:0 0 12px"><button type="button" data-nav="page-prev">上一页</button><button type="button" data-nav="page-next">下一页</button><span class="hintline" style="margin:0">第 ${state.page+1} / ${pages} 页</span></div>
    <div class="grid">${slice.map(j => `<article class="card ${picks[j.id]||""}" data-id="${j.id}"><p class="meta">${esc(j.cat)}</p><h2 class="title">${hi(j.title, state.q)}</h2>${story(j)}
      <div class="actions"><button type="button" data-act="play" class="${picks[j.id]==="play"?"on":""}">想玩</button><button type="button" data-act="skip" class="${picks[j.id]==="skip"?"on":""}">不想玩</button></div></article>`).join("")}</div>`;
}
function mark(id, value) {
  const before = filtered(), pos = before.findIndex(j => j.id === id), clearing = picks[id] === value;
  if (clearing) delete picks[id]; else picks[id] = value;
  save();
  if (state.mode === "one" && !clearing && pos >= 0) {
    const after = filtered();
    state.index = after.some(j => j.id === id) ? Math.min(after.findIndex(j => j.id === id) + 1, Math.max(after.length - 1, 0)) : Math.min(pos, Math.max(after.length - 1, 0));
  }
  render();
}
document.getElementById("cats").innerHTML = CATS.map(cat => `<button class="chip" type="button" data-cat="${esc(cat)}">${esc(cat)} ${cat==="全部"?ITEMS.length:ITEMS.filter(j=>j.cat===cat).length}</button>`).join("");
document.getElementById("statuses").innerHTML = STATUSES.map(s => `<button class="chip" type="button" data-status="${s}">${s}</button>`).join("");
document.body.addEventListener("click", e => {
  const el = elOf(e.target); if (!el || !el.closest) return;
  const mode = el.closest("[data-mode]");
  if (mode) { state.mode = mode.dataset.mode; localStorage.setItem(MODE_KEY, state.mode); state.index = 0; state.page = 0; render(); return; }
  const cat = el.closest("[data-cat]");
  if (cat) { state.cat = cat.dataset.cat; state.index = 0; state.page = 0; render(); return; }
  const status = el.closest("[data-status]");
  if (status) { state.status = status.dataset.status; state.index = 0; state.page = 0; render(); return; }
  const reveal = el.closest("[data-reveal]");
  if (reveal) { open.has(reveal.dataset.reveal) ? open.delete(reveal.dataset.reveal) : open.add(reveal.dataset.reveal); render(); return; }
  const nav = el.closest("[data-nav]");
  if (nav) {
    const list = filtered();
    if (nav.dataset.nav === "page-prev") state.page = Math.max(0, state.page - 1);
    if (nav.dataset.nav === "page-next") state.page += 1;
    if (nav.dataset.nav === "prev") state.index = Math.max(0, state.index - 1);
    if (nav.dataset.nav === "next") state.index = Math.min(list.length - 1, state.index + 1);
    if (nav.dataset.nav === "unmarked") {
      let found = list.findIndex((j, i) => i > state.index && !picks[j.id]);
      if (found < 0) found = list.findIndex(j => !picks[j.id]);
      if (found >= 0) state.index = found; else toast("这一筛里都选过了");
    }
    render(); return;
  }
  const act = el.closest("[data-act]");
  if (act) {
    const card = el.closest("[data-id]");
    const id = (card && card.dataset.id) || act.dataset.id;
    if (id) mark(id, act.dataset.act);
  }
});
qInput.addEventListener("input", () => { state.q = qInput.value; state.index = 0; state.page = 0; render(); });
document.getElementById("export").onclick = () => { const list = chosen(); if (!list.length) return toast("还没有标成想玩的题目"); toast("已导出 " + list.length + " 题：" + download(bodyOf(list))); };
document.getElementById("copy").onclick = async () => {
  const list = chosen(); if (!list.length) return toast("还没有标成想玩的题目");
  try { await navigator.clipboard.writeText(bodyOf(list)); toast("已复制 " + list.length + " 题"); }
  catch (e) { download(bodyOf(list)); toast("复制被拦住了，已改为下载"); }
};
document.getElementById("clear").onclick = () => {
  if (!counts().play && !counts().skip) return toast("现在还没有选择");
  if (!confirm("清空全部想玩和不想玩的标记？")) return;
  picks = {}; save(); render(); toast("已清空选择");
};
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea") || state.mode !== "one") return;
  const list = filtered(); if (!list.length) return;
  const j = list[state.index]; if (!j) return;
  if (e.key === "ArrowRight") { e.preventDefault(); mark(j.id, "play"); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); mark(j.id, "skip"); }
  else if (e.key === "ArrowDown") { e.preventDefault(); state.index = Math.min(list.length - 1, state.index + 1); render(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); state.index = Math.max(0, state.index - 1); render(); }
});
render();
</script>
</body>
</html>
