<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>弱智吧发言</title>
<style>
  :root {
    --ink: #241c14;
    --muted: #6d5c4d;
    --paper: #fffaf3;
    --bg: #e7dccb;
    --line: #e3d3be;
    --hot: #9d2c1a;
    --cool: #2f5852;
    --gold: #a68445;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 0% -10%, #f8f1e4 0%, transparent 55%),
      radial-gradient(700px 380px at 100% 0%, #f3e4cf 0%, transparent 50%),
      var(--bg);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 72px; }
  header.top {
    background: rgba(255, 250, 243, 0.92);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 22px 22px 16px;
    box-shadow: 0 16px 40px rgba(70, 45, 20, 0.06);
    position: sticky;
    top: 12px;
    z-index: 5;
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; gap: 16px; align-items: center; }
  .seal {
    flex: 0 0 auto;
    width: 74px; height: 74px;
    border: 3px solid var(--hot);
    color: var(--hot);
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-size: 32px;
    letter-spacing: 0.12em;
    transform: rotate(-8deg);
    background: #fff7f2;
  }
  h1 {
    margin: 0;
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; max-width: 680px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 12px; }
  .stat { background: #f6efe4; border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
  .stat b { color: var(--ink); font-weight: 650; }
  .stat.hot b { color: var(--hot); }
  .stat.cool b { color: var(--cool); }
  .bar { height: 6px; background: #efe4d4; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--hot), var(--gold)); width: 0; }
  .toolbar, .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar { margin-bottom: 10px; }
  .filters { margin-top: 8px; }
  input[type="search"] {
    flex: 1 1 180px;
    min-width: 160px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 9px 14px;
    outline: none;
  }
  input[type="search"]:focus { border-color: #b08968; }
  button.chip, button.ghost, button.primary, .actions button, .nav button {
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 8px 14px;
  }
  button.chip.on { background: var(--ink); color: #f6efe4; border-color: var(--ink); }
  button.primary { background: var(--hot); color: #fffaf3; border-color: var(--hot); }
  button.ghost { background: transparent; }
  button:hover { transform: translateY(-1px); }
  main { margin-top: 18px; }
  .one {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 28px 26px 22px;
    min-height: 280px;
    box-shadow: 0 18px 40px rgba(70, 45, 20, 0.05);
  }
  .meta { color: var(--gold); letter-spacing: 0.12em; font-size: 13px; margin: 0 0 14px; }
  .joke {
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-size: 26px;
    line-height: 1.75;
    margin: 0;
  }
  .actions, .nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .actions button { font-size: 16px; padding: 10px 18px; }
  .actions button[data-act="funny"].on { background: var(--hot); color: white; border-color: var(--hot); }
  .actions button[data-act="meh"].on { background: var(--cool); color: white; border-color: var(--cool); }
  .hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card.funny { box-shadow: inset 4px 0 0 var(--hot); }
  .card.meh { box-shadow: inset 4px 0 0 var(--cool); }
  .card-top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .cat-tag { background: #f4eadc; border-radius: 999px; padding: 2px 8px; }
  .stamp { margin-left: auto; letter-spacing: 0.14em; }
  .card.funny .stamp { color: var(--hot); }
  .card.meh .stamp { color: var(--cool); }
  .card .joke { font-size: 16.5px; line-height: 1.7; }
  .card .actions { margin-top: auto; }
  .card .actions button { padding: 7px 12px; font-size: 14px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); background: var(--paper); border-radius: 20px; }
  mark { background: #f3d48a; color: inherit; padding: 0 2px; border-radius: 4px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  footer p { margin: 6px 0; }
  #toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: #f6efe4;
    padding: 10px 16px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: 0.2s ease; z-index: 9;
  }

  a.back {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 8px 14px;
    color: var(--ink);
  }
  a.back:hover { transform: translateY(-1px); }

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 720px) {
    header.top { position: static; }
    h1 { font-size: 28px; }
    .joke { font-size: 22px; }
    .seal { width: 58px; height: 58px; font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal">弱</div>
      <div>
        <h1>弱智吧发言</h1>
        <p class="sub">从公开转载的弱智吧经典发言里收了一份。逐条选「好笑」或「不好笑」，挑完后把好笑的导出成 txt。</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <div class="toolbar">
      <a class="back" href="../index.html">返回目录</a>
      <button class="chip" data-mode="one" type="button">逐条筛选</button>
      <button class="chip" data-mode="list" type="button">列表浏览</button>
      <input id="q" type="search" placeholder="搜索发言" autocomplete="off" />
      <button class="primary" id="export" type="button">导出好笑的 TXT</button>
      <button class="ghost" id="copy" type="button">复制好笑的</button>
      <button class="ghost" id="clear" type="button">清空选择</button>
    </div>
    <div class="filters" id="cats"></div>
    <div class="filters" id="statuses"></div>
  </header>
  <main id="main"></main>
  <footer>
    <p>条目来自公开转载的弱智吧发言，主要包括二十一周年百条合辑，以及二零二三、二零二四年的年度精选摘录。同一句话只留一次。</p>
    <p>选择保存在当前浏览器里。导出的 txt 才是要留下的那一份。</p>
    <p>逐条筛选时，左方向是不好笑，右方向是好笑，上方向是上一条，下方向是下一条。</p>
  </footer>
</div>
<div id="toast" role="status"></div>

"id": "r0030"}, {"cat": "奇怪提问", "text": "白骨精头疼，是看骨科还是脑科？", "id": "r0031"}, {"cat": "奇怪提问", "text": "地球上有百分之七十的海洋和百分之三十的陆地，那么剩下的百分之三十海洋和百分之七十的陆地去哪了？", "id": "r0032"}, {"cat": "奇怪提问", "text": "喝奶茶，用吸管喝的是下面的水，为什么少的是上面的水？", "id": "r0033"}, {"cat": "奇怪提问", "text": "过年福字要倒着贴，为什么不生产倒过来的福字呢？", "id": "r0034"}, {"cat": "奇怪提问", "text": "既然快递要三天才到，为什么不把所有的快递都提前三天发？", "id": "r0035"}, {"cat": "奇怪提问", "text": "为什么每条隧道上面都压着一座山？", "id": "r0036"}, {"cat": "奇怪提问", "text": "根据记载，荆轲刺秦王未成，使得秦王大怒。那么如果成功了的话，秦王会大喜吗？", "id": "r0037"}, {"cat": "奇怪提问", "text": "为啥长寿的碰巧都是老年人？", "id": "r0038"}, {"cat": "奇怪提问", "text": "变形金刚寂寞了，会上网约车吗？", "id": "r0039"}, {"cat": "奇怪提问", "text": "《出师表》第一句就提到了先帝，为什么刘禅不重用先帝？", "id": "r0040"}, {"cat": "奇怪提问", "text": "不知道你们发现没，夏天真的比冬天热好多。", "id": "r0041"}, {"cat": "奇怪提问", "text": "睡觉是谁发明的？也太舒服了吧。", "id": "r0042"}, {"cat": "奇怪提问", "text": "既然大学生都喜欢坐后排，为什么老师不在教室后面讲？", "id": "r0043"}, {"cat": "奇怪提问", "text": "梵高死后他的画那么值钱，那他活着的时候为什么不装死呢？", "id": "r0044"}, {"cat": "奇怪提问", "text": "既然七百分能上四年清华，那我考三百五是不是只能上两年？", "id": "r0045"}, {"cat": "奇怪提问", "text": "一年最后一天是十二月三十日，所以上半年应该是到六月十五日。", "id": "r0046"}, {"cat": "奇怪提问", "text": "是药三分毒，那毒药是十三分毒，还是三分毒？", "id": "r0047"}, {"cat": "奇怪提问", "text": "飞机上黑匣子这么牢固，干吗不给每个乘客一个？", "id": "r0048"}, {"cat": "奇怪提问", "text": "学校翻墙出去是扣分，那我翻进来是不是得加分？", "id": "r0049"}, {"cat": "奇怪提问", "text": "空调能开热点吗？空调不能开热点。", "id": "r0050"}, {"cat": "弱智科学", "text": "我们可以把氧化还原反应叫做电子竞技。", "id": "r0051"}, {"cat": "弱智科学", "text": "这世上真的有龙。我在某地就被一条龙服务过。", "id": "r0052"}, {"cat": "弱智科学", "text": "我家老鼠生病了，我给它喂了老鼠药，希望它早日康复。", "id": "r0053"}, {"cat": "弱智科学", "text": "弱酸的本质是酸，弱碱的本质是碱，由此可推弱智的本质是智。弱智吧日常就是智慧日常，在座各位都是智人。", "id": "r0054"}, {"cat": "弱智科学", "text": "通过标记重捕法，诸葛亮发现巴蜀地区盛产孟获。", "id": "r0055"}, {"cat": "弱智科学", "text": "为什么我的银行卡在高压锅里煮了一晚上，还是冻结状态？", "id": "r0056"}, {"cat": "弱智科学", "text": "生活小妙招：在野外迷路如何使用手表辨别方向。手握手表，松手使其自然落体，手表坠落的方向就是下方。", "id": "r0057"}, {"cat": "弱智科学", "text": "三个半小时等于一个半小时，等于三十分钟。", "id": "r0058"}, {"cat": "弱智科学", "text": "觉得 iPhone 不值这个价格怎么办？取绝对值。", "id": "r0059"}, {"cat": "弱智科学", "text": "年轻人体质真的越来越差了，没有一个九零后活过三十岁。这条发布于二零一零年。", "id": "r0060"}, {"cat": "弱智科学", "text": "非牛顿流体吃进肚子里，是不是一用力就便秘，一放松就窜稀？", "id": "r0061"}, {"cat": "弱智科学", "text": "虎毒不食子，专家建议野外遇到老虎可跪下认爹。", "id": "r0062"}, {"cat": "弱智科学", "text": "我觉得白雪公主之所以命运坎坷，主要是因为身边的小人太多。", "id": "r0063"}, {"cat": "弱智科学", "text": "厉等于一百。", "id": "r0064"}, {"cat": "弱智科学", "text": "奶牛的英文是 cow，所以牛奶的英文是 woc。", "id": "r0065"}, {"cat": "弱智科学", "text": "氧气约占空气体积的五分之一，所以每次呼吸都有五分之四的概率憋死。", "id": "r0066"}, {"cat": "弱智科学", "text": "百岁老人揭秘长寿秘诀：把年龄改成二进制。", "id": "r0067"}, {"cat": "弱智科学", "text": "由古代靠脚印破案、现代靠指纹破案可知，罪犯过去用脚作案，现在用手作案。", "id": "r0068"}, {"cat": "弱智科学", "text": "苍蝇不叮无缝的蛋，说明苍蝇可以检查气密性。", "id": "r0069"}, {"cat": "弱智科学", "text": "地球智慧生物研究报告：此行星的智慧生物通过裂开头部皮肤、展示两排白骨来表达喜悦。", "id": "r0070"}, {"cat": "弱智科学", "text": "如果油罐车清洗不到位，为什么不在两次运输之间运一次洗洁精呢？", "id": "r0071"}, {"cat": "弱智科学", "text": "放坏的香蕉比正常香蕉更通便。", "id": "r0072"}, {"cat": "人生态度", "text": "在发现我没有道德后，对方放弃了道德绑架。", "id": "r0073"}, {"cat": "人生态度", "text": "前几天去医院体检了，好开心，只花了两百块钱就检查出六个病来。", "id": "r0074"}, {"cat": "人生态度", "text": "有目的地的人生才会迷路，我只是来世界散步。", "id": "r0075"}, {"cat": "人生态度", "text": "我的贫穷已经完全突破了我的想象，成为了现实。", "id": "r0076"}, {"cat": "人生态度", "text": "毕业一年，经过我的不懈努力，如今的积蓄已经足够自己下半辈子不吃不喝了。", "id": "r0077"}, {"cat": "人生态度", "text": "生活将我反复捶打，肉质竟变得劲道可口。", "id": "r0078"}, {"cat": "人生态度", "text": "退一万步讲，你听不见。", "id": "r0079"}, {"cat": "人生态度", "text": "很多人说的看不到未来，其实是看到了未来。", "id": "r0080"}, {"cat": "人生态度", "text": "钱一直不在我钱包里，这何尝不是一种财富自由？", "id": "r0081"}, {"cat": "人生态度", "text": "我租下了世界，直到我将死去的那天。", "id": "r0082"}, {"cat": "人生态度", "text": "有没有一种可能，情敌其实不是敌人，而是同好？", "id": "r0083"}, {"cat": "人生态度", "text": "前途似锦，怪不得我一个穷人买不起。", "id": "r0084"}, {"cat": "人生态度", "text": "二十三岁的我，已经是个五岁的大人了。", "id": "r0085"}, {"cat": "人生态度", "text": "当别人夸你品味好，其实是在夸自己品味好。", "id": "r0086"}, {"cat": "人生态度", "text": "恋爱脑，是两种我没有的东西。", "id": "r0087"}, {"cat": "人生态度", "text": "人往高处走，水往低处流。人的百分之八十是水，所以大部分人就算到了高处，也还是下流的。", "id": "r0088"}, {"cat": "人生态度", "text": "手机每天都在我身上，我会不会其实是手机支架。", "id": "r0089"}, {"cat": "人生态度", "text": "悲观者往往正确，但乐观者哈哈哈哈哈。", "id": "r0090"}, {"cat": "人生态度", "text": "现在已经凌晨三点多了，说什么都晚了。", "id": "r0091"}, {"cat": "人生态度", "text": "我把简历印在空心钢管上，希望这次投出去有回响。", "id": "r0092"}, {"cat": "人生态度", "text": "高中的饭堂不够我吃，我决定进入大学深造。", "id": "r0093"}, {"cat": "人生态度", "text": "长期慢性自杀，表示你比较有耐心。", "id": "r0094"}, {"cat": "人生态度", "text": "我们公司非常人性化。员工加班违反了劳动法，公司从来不会惩罚员工。", "id": "r0095"}, {"cat": "人生态度", "text": "只有上一届毕业生把知识都还给老师，老师才能接着教下一届学生。", "id": "r0096"}, {"cat": "人生态度", "text": "学校不给上课睡觉，却说这里是梦想开始的地方。", "id": "r0097"}, {"cat": "人生态度", "text": "你不要再天天打游戏了，要多参与现实的活动。这个就是限时活动啊。", "id": "r0098"}, {"cat": "人生态度", "text": "为什么每次进弱智吧都笑得那么开心？一定是有人从中作梗。", "id": "r0099"}, {"cat": "人生态度", "text": "我知道吧主的真名了，真名叫做张原创。大家都说：弱智吧主张原创。", "id": "r0100"}, {"cat": "人生态度", "text": "墙上贴着很多奇怪的规定，每一个奇怪的规定后面都有着双面胶。", "id": "r0101"}, {"cat": "人生态度", "text": "你们和我说瞎子是看不见的，但是我能看见瞎子。", "id": "r0102"}, {"cat": "人生态度", "text": "学校禁止早恋，爱自己也一样被禁止。", "id": "r0103"}, {"cat": "人生态度", "text": "生活就是在米缸里种玫瑰。", "id": "r0104"}, {"cat": "人生态度", "text": "熬夜，是对昨天做辅助延长线。", "id": "r0105"}, {"cat": "人生态度", "text": "钱都流向不缺钱的人，爱都流向不缺爱的人，为什么苦都流向了我。", "id": "r0106"}, {"cat": "人生态度", "text": "我是孤独大赛的第一名，也是最后一名。", "id": "r0107"}, {"cat": "人生态度", "text": "会不会我已经死了，而大家都瞒着我呢？", "id": "r0108"}, {"cat": "人生态度", "text": "苦难，是生命的防沉迷系统。", "id": "r0109"}, {"cat": "人生态度", "text": "这台手术很成功，我失败的人生结束了。", "id": "r0110"}, {"cat": "人生态度", "text": "每个人都在赚钱，那么谁在亏钱？", "id": "r0111"}, {"cat": "人生态度", "text": "为什么要伤心，难道你的生活还不够可笑吗？", "id": "r0112"}, {"cat": "人生态度", "text": "停车的这个人是瞎子吧？不然为什么停在盲道上。", "id": "r0113"}, {"cat": "人生态度", "text": "在禁欲的寺庙里求姻缘，向不出门的方丈问人生该往何处。", "id": "r0114"}, {"cat": "人生态度", "text": "道德绑架的人为什么要绑架道德，自己没有吗？", "id": "r0115"}, {"cat": "人生态度", "text": "鉴于我们没有活多久，死亡只是一种思乡。", "id": "r0116"}, {"cat": "人生态度", "text": "敬老院的新人都是老人，这世界的大人都是小人。", "id": "r0117"}, {"cat": "文字游戏", "text": "燕子叽叽喳喳叫个不停。“咏春？”叶问。", "id": "r0118"}, {"cat": "文字游戏", "text": "工人罢工后，就成为了人。", "id": "r0119"}, {"cat": "文字游戏", "text": "要断章取义。节选自《不要断章取义》。", "id": "r0120"}, {"cat": "文字游戏", "text": "明知山有虎，不去明知山。", "id": "r0121"}, {"cat": "文字游戏", "text": "只有小孩子才说喝茶，成人用品。", "id": "r0122"}, {"cat": "文字游戏", "text": "“丢死人了！”王老汉一边喊着，一边把尸体扔下了楼。", "id": "r0123"}, {"cat": "文字游戏", "text": "哪吒闹海，讲了一个来龙去脉的故事。", "id": "r0124"}, {"cat": "文字游戏", "text": "动物园里的大象被气死了，矛头直指气象局。", "id": "r0125"}, {"cat": "文字游戏", "text": "小明嫌自己的丁丁短，于是苦练拉丁舞。", "id": "r0126"}, {"cat": "文字游戏", "text": "小兰和新一结婚后，侦探事务所毛利率大幅下降。", "id": "r0127"}, {"cat": "文字游戏", "text": "古代，中国人病了有中医治，法国人只有法医，好可怜啊。", "id": "r0128"}, {"cat": "文字游戏", "text": "生鱼片是死鱼片。", "id": "r0129"}, {"cat": "文字游戏", "text": "等红灯，也是等绿灯。", "id": "r0130"}, {"cat": "文字游戏", "text": "咖啡因来自咖啡果。", "id": "r0131"}, {"cat": "文字游戏", "text": "坐电梯是站电梯。", "id": "r0132"}, {"cat": "文字游戏", "text": "救火就是灭火。", "id": "r0133"}, {"cat": "文字游戏", "text": "红萝卜说白了就是白萝卜。", "id": "r0134"}, {"cat": "文字游戏", "text": "蜂蜜也是一种花生酱。", "id": "r0135"}, {"cat": "文字游戏", "text": "太极就是巧克力。", "id": "r0136"}, {"cat": "文字游戏", "text": "老头哭了，是因为老头乐坏了。", "id": "r0137"}, {"cat": "文字游戏", "text": "凶我的反义词是吉他。", "id": "r0138"}, {"cat": "文字游戏", "text": "大学生活要大学生死。", "id": "r0139"}, {"cat": "文字游戏", "text": "饮水机是吐水机，人才是真正的饮水机。", "id": "r0140"}, {"cat": "文字游戏", "text": "“爷是真的服了。”医院里，王爷爷面对医生对按时服药的质疑如是说道。", "id": "r0141"}, {"cat": "文字游戏", "text": "你一旦多活了一天，你就少活了一天。", "id": "r0142"}, {"cat": "文字游戏", "text": "问号是碎了一半的电灯泡。", "id": "r0143"}, {"cat": "文字游戏", "text": "古代人上交粮食来抵徭役，也是一种麦当劳。", "id": "r0144"}, {"cat": "文字游戏", "text": "答题卡这个名字太不吉利了，建议改成答题顺。", "id": "r0145"}, {"cat": "文字游戏", "text": "河南人给中评，相当于给好评。", "id": "r0146"}, {"cat": "文字游戏", "text": "姓名：林正英。性别：男。职务：大战僵尸。", "id": "r0147"}, {"cat": "文字游戏", "text": "职业杀手通过谋杀谋生。", "id": "r0148"}, {"cat": "文字游戏", "text": "饭后百步走，作诗十四首。", "id": "r0149"}, {"cat": "文字游戏", "text": "今日割十城，明日割五城，日取其半，万世不竭。", "id": "r0150"}, {"cat": "文字游戏", "text": "善用短句可以凑字数，比如说比如说，还有就是还有就是，以及以及。", "id": "r0151"}, {"cat": "文字游戏", "text": "博士是某一领域的专家，但是并不博学。因此博士不该叫博士，应该叫大专。", "id": "r0152"}, {"cat": "文字游戏", "text": "蜘蛛问神为什么给它八条腿，神说你九足疑似有点太多了。", "id": "r0153"}, {"cat": "文字游戏", "text": "王老汉在下定决心不与弱智交谈后，终于改掉了自言自语的毛病。", "id": "r0154"}, {"cat": "文字游戏", "text": "满地都是六便士，他却抬头看见了监控。", "id": "r0155"}, {"cat": "文字游戏", "text": "打开厕所的门，一股恶臭扑鼻而来。我男友正坐在餐厅吃螺蛳粉。", "id": "r0156"}, {"cat": "文字游戏", "text": "关羽死后，刘备悲痛欲绝，苦心钻研复活关羽的办法，最终发明了 Live2D。", "id": "r0157"}, {"cat": "文字游戏", "text": "一切事物都具有两面性。所以并非一切事物都具有两面性。", "id": "r0158"}, {"cat": "文字游戏", "text": "我们家含羞草受了重伤，已经变成植物植物了。", "id": "r0159"}, {"cat": "文字游戏", "text": "小明做事没轻没重，本来想重生，结果不小心轻生了。", "id": "r0160"}, {"cat": "文字游戏", "text": "出一款道教主题的格斗游戏，名字就叫真人快打吧。", "id": "r0161"}, {"cat": "文字游戏", "text": "人就是一把屎枪，吃饭就是在上膛。", "id": "r0162"}, {"cat": "文字游戏", "text": "恰恰相反，还是恰恰。", "id": "r0163"}, {"cat": "文字游戏", "text": "吃啥补啥。食人族酋长的儿子今年高考，本来想吃几个大学生，最后还是吃了没文化的亏。", "id": "r0164"}, {"cat": "文字游戏", "text": "双人成行，人成列。", "id": "r0165"}, {"cat": "文字游戏", "text": "有人问：你是唯物主义者吗？我回答：我觉得我是。", "id": "r0166"}, {"cat": "文字游戏", "text": "婚姻是爱的坟墓，良禽择墓而栖。", "id": "r0167"}, {"cat": "文字游戏", "text": "Tom 住院后只有 Jerry 来探望，因为 Jerry 是他的家鼠。", "id": "r0168"}, {"cat": "文字游戏", "text": "咖啡是一种让人兽性大发的饮料。人喝咖啡，往往是为了更好地当牛马。", "id": "r0169"}, {"cat": "文字游戏", "text": "你说你有点难追，我不准你骂自己驷马。", "id": "r0170"}, {"cat": "文字游戏", "text": "抖音员工以字节为单位。", "id": "r0171"}, {"cat": "文字游戏", "text": "“你最近说话怎么支支吾吾的。”“心里有鬼。”宁采臣答。", "id": "r0172"}, {"cat": "文字游戏", "text": "语文老师说我文化沙漠，数学老师说我脑子有水，所以我是绿洲。", "id": "r0173"}, {"cat": "文字游戏", "text": "新年到了我就来，鞭炮响完我就走，好像我才是那年兽。", "id": "r0174"}, {"cat": "文字游戏", "text": "用四个字形容刺猬：如鼠加针。", "id": "r0175"}, {"cat": "文字游戏", "text": "仙人掌管仙界，仙人掌不管仙界。", "id": "r0176"}, {"cat": "文字游戏", "text": "台上三分钟，台下十年功。所以半小时长的话剧，只能由百岁以上的老人演。", "id": "r0177"}, {"cat": "文字游戏", "text": "如果你觉得百事可乐很好喝，那么它其实是可口可乐。", "id": "r0178"}, {"cat": "文字游戏", "text": "我不喜欢自驾游，因为自游是无驾的。", "id": "r0179"}, {"cat": "文字游戏", "text": "经过长时间尸检，王警官终于确定死者不是自己。", "id": "r0180"}, {"cat": "文字游戏", "text": "为防止小朋友接触社会丑恶的一面，部门规定动画片中不准出现人类。", "id": "r0181"}, {"cat": "文字游戏", "text": "你好，看了你的病危通知书，觉得蛮适合的，可以聊一 <script>
const JOKES = JSON.parse(document.getElementById("data").textContent);
const PICK_KEY = "ruozhiba-picks-v1";
const MODE_KEY = "ruozhiba-mode-v1";
const CATS = ["全部", ...new Set(JOKES.map(j => j.cat))];
const STATUSES = ["全部", "未选", "好笑", "不好笑"];
const state = {
  mode: localStorage.getItem(MODE_KEY) || "one",
  cat: "全部",
  status: "全部",
  q: "",
  index: 0,
  page: 0
};
let picks = {};
try { picks = JSON.parse(localStorage.getItem(PICK_KEY) || "{}") || {}; }
catch (e) { picks = {}; }
const main = document.getElementById("main");
const qInput = document.getElementById("q");

function savePicks() { localStorage.setItem(PICK_KEY, JSON.stringify(picks)); }
function nodeEl(target) {
  if (!target) return null;
  return target.nodeType === 1 ? target : target.parentElement;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function highlight(text, q) {
  const safe = esc(text);
  const query = q.trim();
  if (!query) return safe;
  const pattern = esc(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(pattern, "gi"), m => `<mark>${m}</mark>`);
}
function filtered() {
  const query = state.q.trim();
  return JOKES.filter(j => {
    if (state.cat !== "全部" && j.cat !== state.cat) return false;
    const mark = picks[j.id] || "";
    if (state.status === "未选" && mark) return false;
    if (state.status === "好笑" && mark !== "funny") return false;
    if (state.status === "不好笑" && mark !== "meh") return false;
    if (query && !j.text.includes(query) && !j.cat.includes(query)) return false;
    return true;
  });
}
function counts() {
  let funny = 0, meh = 0;
  for (const j of JOKES) {
    if (picks[j.id] === "funny") funny += 1;
    else if (picks[j.id] === "meh") meh += 1;
  }
  return { total: JOKES.length, funny, meh, left: JOKES.length - funny - meh };
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
function buildExport() {
  const list = JOKES.filter(j => picks[j.id] === "funny");
  const now = new Date();
  const stamp = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日 "
    + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const lines = ["好笑的弱智吧发言", "导出时间：" + stamp, "共 " + list.length + " 条", ""];
  let last = "";
  list.forEach((j, i) => {
    if (j.cat !== last) { lines.push("【" + j.cat + "】", ""); last = j.cat; }
    lines.push((i + 1) + ". " + j.text, "");
  });
  if (!list.length) lines.push("还没有标成好笑的发言。");
  return { text: lines.join("\n"), count: list.length };
}
function downloadText(text) {
  const blob = new Blob(["\ufeff" + text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  const now = new Date();
  a.href = URL.createObjectURL(blob);
  a.download = "好笑的弱智吧发言-" + now.getFullYear()
    + String(now.getMonth() + 1).padStart(2, "0")
    + String(now.getDate()).padStart(2, "0") + ".txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  return a.download;
}
async function exportFunny() {
  const { text, count } = buildExport();
  if (!count) { toast("还没有标成好笑的发言"); return; }
  const name = downloadText(text);
  toast("已导出 " + count + " 条：" + name);
}
async function copyFunny() {
  const { text, count } = buildExport();
  if (!count) { toast("还没有标成好笑的发言"); return; }
  try {
    await navigator.clipboard.writeText(text);
    toast("已复制 " + count + " 条");
  } catch (e) {
    downloadText(text);
    toast("复制被拦住了，已改为下载");
  }
}
function mark(id, value) {
  const before = filtered();
  const pos = before.findIndex(j => j.id === id);
  const clearing = picks[id] === value;
  if (clearing) delete picks[id];
  else picks[id] = value;
  savePicks();
  if (state.mode === "one" && !clearing && pos >= 0) {
    const after = filtered();
    if (after.some(j => j.id === id)) {
      const still = after.findIndex(j => j.id === id);
      state.index = Math.min(still + 1, Math.max(after.length - 1, 0));
    } else {
      state.index = Math.min(pos, Math.max(after.length - 1, 0));
    }
  }
  render();
}
function renderChrome() {
  const c = counts();
  document.getElementById("stats").innerHTML = [
    ["共", c.total + " 条", ""],
    ["好笑", c.funny, "hot"],
    ["不好笑", c.meh, "cool"],
    ["未选", c.left, ""]
  ].map(([k, v, cls]) => `<span class="stat ${cls}">${k} <b>${v}</b></span>`).join("");
  document.getElementById("bar").style.width = (c.total ? ((c.funny + c.meh) / c.total) * 100 : 0) + "%";
  document.querySelectorAll("[data-mode]").forEach(btn => btn.classList.toggle("on", btn.dataset.mode === state.mode));
  document.querySelectorAll("#cats [data-cat]").forEach(btn => btn.classList.toggle("on", btn.dataset.cat === state.cat));
  document.querySelectorAll("#statuses [data-status]").forEach(btn => btn.classList.toggle("on", btn.dataset.status === state.status));
}
function render() {
  renderChrome();
  const list = filtered();
  if (state.index >= list.length) state.index = Math.max(list.length - 1, 0);
  if (!list.length) {
    main.innerHTML = `<div class="empty">这个筛选下面没有发言。换个分类，或者把状态改成「全部」。</div>`;
    return;
  }
  if (state.mode === "one") {
    const j = list[state.index];
    const markName = picks[j.id] === "funny" ? "好笑" : picks[j.id] === "meh" ? "不好笑" : "未选";
    main.innerHTML = `
      <article class="one ${picks[j.id] || ""}">
        <p class="meta">${state.index + 1} / ${list.length}　${esc(j.cat)}　${markName}</p>
        <p class="joke">${highlight(j.text, state.q)}</p>
        <div class="actions">
          <button type="button" data-act="funny" data-id="${j.id}" class="${picks[j.id] === "funny" ? "on" : ""}">好笑</button>
          <button type="button" data-act="meh" data-id="${j.id}" class="${picks[j.id] === "meh" ? "on" : ""}">不好笑</button>
        </div>
        <div class="nav">
          <button type="button" data-nav="prev">上一条</button>
          <button type="button" data-nav="next">下一条</button>
          <button type="button" data-nav="unmarked">下一条未选</button>
        </div>
        <p class="hint">再点一次已选的按钮，可以取消。选完会自动跳到下一条。</p>
      </article>`;
    return;
  }
  const pageSize = 40;
  const pages = Math.max(1, Math.ceil(list.length / pageSize));
  if (state.page >= pages) state.page = pages - 1;
  const slice = list.slice(state.page * pageSize, (state.page + 1) * pageSize);
  main.innerHTML = `<div class="nav" style="margin:0 0 12px">
      <button type="button" data-nav="page-prev">上一页</button>
      <button type="button" data-nav="page-next">下一页</button>
      <span class="hint" style="margin:0">列表第 ${state.page + 1} / ${pages} 页，本筛 ${list.length} 条</span>
    </div><div class="grid">${slice.map(j => {
      const stamp = picks[j.id] === "funny" ? "好笑" : picks[j.id] === "meh" ? "不好笑" : "";
      return `<article class="card ${picks[j.id] || ""}" data-id="${j.id}">
        <div class="card-top"><span>${j.id.slice(1)}</span><span class="cat-tag">${esc(j.cat)}</span><span class="stamp">${stamp}</span></div>
        <p class="joke">${highlight(j.text, state.q)}</p>
        <div class="actions">
          <button type="button" data-act="funny" class="${picks[j.id] === "funny" ? "on" : ""}">好笑</button>
          <button type="button" data-act="meh" class="${picks[j.id] === "meh" ? "on" : ""}">不好笑</button>
        </div>
      </article>`;
    }).join("")}</div>`;
}

document.getElementById("cats").innerHTML = CATS.map(cat => {
  const n = cat === "全部" ? JOKES.length : JOKES.filter(j => j.cat === cat).length;
  return `<button class="chip" type="button" data-cat="${esc(cat)}">${esc(cat)} ${n}</button>`;
}).join("");
document.getElementById("statuses").innerHTML = STATUSES.map(s =>
  `<button class="chip" type="button" data-status="${s}">${s}</button>`
).join("");

document.body.addEventListener("click", e => {
  const el = nodeEl(e.target);
  if (!el || !el.closest) return;
  const modeBtn = el.closest("[data-mode]");
  if (modeBtn) {
    state.mode = modeBtn.dataset.mode;
    localStorage.setItem(MODE_KEY, state.mode);
    state.index = 0;
    state.page = 0;
    render();
    return;
  }
  const catBtn = el.closest("[data-cat]");
  if (catBtn) { state.cat = catBtn.dataset.cat; state.index = 0; state.page = 0; render(); return; }
  const statusBtn = el.closest("[data-status]");
  if (statusBtn) { state.status = statusBtn.dataset.status; state.index = 0; state.page = 0; render(); return; }
  const nav = el.closest("[data-nav]");
  if (nav) {
    const list = filtered();
    if (nav.dataset.nav === "page-prev") state.page = Math.max(0, state.page - 1);
    if (nav.dataset.nav === "page-next") state.page += 1;
    if (nav.dataset.nav === "prev") state.index = Math.max(0, state.index - 1);
    if (nav.dataset.nav === "next") state.index = Math.min(list.length - 1, state.index + 1);
    if (nav.dataset.nav === "unmarked") {
      const start = state.index + 1;
      let found = list.findIndex((j, i) => i >= start && !picks[j.id]);
      if (found < 0) found = list.findIndex(j => !picks[j.id]);
      if (found >= 0) state.index = found;
      else toast("这一筛里都选过了");
    }
    render();
    return;
  }
  const act = el.closest("[data-act]");
  if (act) {
    const card = el.closest("[data-id]");
    const id = (card && card.dataset.id) || act.dataset.id;
    if (id) mark(id, act.dataset.act);
  }
});
qInput.addEventListener("input", () => { state.q = qInput.value; state.index = 0; state.page = 0; render(); });
document.getElementById("export").addEventListener("click", exportFunny);
document.getElementById("copy").addEventListener("click", copyFunny);
document.getElementById("clear").addEventListener("click", () => {
  const c = counts();
  if (!c.funny && !c.meh) { toast("现在还没有选择"); return; }
  if (!confirm("清空全部好笑和不好笑的标记？导出过的 txt 不会被删。")) return;
  picks = {};
  savePicks();
  render();
  toast("已清空选择");
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea") || state.mode !== "one") return;
  const list = filtered();
  if (!list.length) return;
  const j = list[state.index];
  if (!j) return;
  if (e.key === "ArrowRight") { e.preventDefault(); mark(j.id, "funny"); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); mark(j.id, "meh"); }
  else if (e.key === "ArrowUp") { e.preventDefault(); state.index = Math.max(0, state.index - 1); render(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); state.index = Math.min(list.length - 1, state.index + 1); render(); }
});
render();
</script>
</body>
</html>
